<script>
const QUESTIONS = [
  {
    cat: "rag",
    q: "Walk me through how you'd design a production RAG pipeline from scratch. What are the critical failure points?",
    a: `<p><strong>Core flow:</strong> ingest → chunk → embed → store → retrieve → augment → generate.</p>
<p><strong>Ingestion:</strong> parse docs (PDF, HTML), clean noise, handle updates/deletions.</p>
<p><strong>Chunking:</strong> pick chunk size based on doc type — 512 tokens for dense text, larger for code. Overlap ~10–15% to avoid context breaks at boundaries.</p>
<p><strong>Embedding:</strong> choose model carefully — <code>text-embedding-3-small</code> for cost, <code>ada-002</code> or open-source BGE/E5 for control. Dimension matters for storage cost.</p>
<p><strong>Vector store:</strong> Pinecone/Weaviate/pgvector. Index type: HNSW for fast approximate search.</p>
<p><strong>Retrieval:</strong> top-k + re-ranking (cross-encoder). Hybrid search (dense + BM25) outperforms pure vector in most domains.</p>
<p><strong>Critical failure points:</strong> (1) poor chunking loses context, (2) wrong embedding model misses domain semantics, (3) no re-ranking returns irrelevant top-k, (4) stale index after doc updates, (5) no citation tracking breaks trust.</p>
<p><strong>Production addition:</strong> add async ingest queue, embedding cache, and retrieval latency monitoring.</p>`
  },
  {
    cat: "rag",
    q: "Your RAG retrieval quality is poor. Is it a chunking problem, embedding problem, or retrieval problem — and how do you diagnose it?",
    a: `<p><strong>Systematic diagnosis — isolate each layer:</strong></p>
<p><strong>Step 1 — retrieval audit:</strong> run a set of golden queries. Check if ground-truth chunks appear in top-10. If not, it's retrieval or embedding, not generation.</p>
<p><strong>Step 2 — embedding check:</strong> compute cosine similarity between query and expected chunk. If similarity is low for obviously related text, your embedding model is misaligned to your domain. Fix: fine-tune or swap to a domain-specific model.</p>
<p><strong>Step 3 — chunking check:</strong> look at whether the retrieved chunk contains the answer but it's cut off mid-sentence. Fix: increase chunk size or add more overlap. Also check if answers span two chunks — sliding window helps.</p>
<p><strong>Step 4 — re-ranking:</strong> if right chunks appear in top-10 but not top-3, your ranking is wrong. Add a cross-encoder re-ranker (e.g. <code>ms-marco-MiniLM</code>).</p>
<p><strong>Tools:</strong> RAGAS framework for automated recall/precision/faithfulness metrics. Also log retrieval traces per query in production.</p>`
  },
  {
    cat: "rag",
    q: "What's the difference between naive RAG, advanced RAG, and modular RAG? When would you use each?",
    a: `<p><strong>Naive RAG:</strong> query → embed → retrieve top-k → stuff into prompt → generate. No pre/post processing. Good for prototyping, breaks at scale.</p>
<p><strong>Advanced RAG:</strong> adds pre-retrieval (query rewriting, HyDE — hypothetical document embeddings) and post-retrieval (re-ranking, context compression). Use when naive RAG quality is insufficient.</p>
<p><strong>Modular RAG:</strong> fully decomposed — each component (router, retriever, ranker, generator) is a swappable module. Can add search, SQL lookup, API calls alongside vector retrieval. Use for production systems with multiple data sources or complex query types.</p>
<p><strong>My choice for thesqua.re:</strong> modular — because we need property data from PostgreSQL, pricing from APIs, and policy docs from vector store, all in one pipeline.</p>`
  },
  {
    cat: "rag",
    q: "How do you handle long documents in RAG — what chunking strategies do you know and what are the tradeoffs?",
    a: `<p><strong>Fixed-size chunking:</strong> split every N tokens with overlap. Simple, fast. Problem: splits mid-sentence, breaks semantic units.</p>
<p><strong>Sentence/paragraph chunking:</strong> split on natural boundaries. Better semantics. Problem: variable chunk sizes, some paragraphs too short or too long.</p>
<p><strong>Recursive character splitting:</strong> LangChain's default. Tries paragraph → sentence → word until target size hit. Good balance.</p>
<p><strong>Semantic chunking:</strong> embed each sentence, split where cosine distance jumps. Best quality, 3–5x slower to ingest.</p>
<p><strong>Hierarchical (parent-child):</strong> store large parent chunks but index small child chunks. Retrieve small chunk for precision, return parent for context. Best of both worlds.</p>
<p><strong>My go-to in prod:</strong> hierarchical with 256-token children and 1024-token parents. Retrieve children, return parent to LLM.</p>`
  },
  {
    cat: "rag",
    q: "How do you evaluate a RAG system? What metrics do you use beyond simple accuracy?",
    a: `<p><strong>Retrieval metrics:</strong> Recall@k (did ground-truth chunk appear in top-k?), MRR (mean reciprocal rank), NDCG for ranked lists.</p>
<p><strong>Generation metrics:</strong> Faithfulness (is the answer grounded in retrieved context?), Answer relevance, Context precision/recall — all from RAGAS framework.</p>
<p><strong>End-to-end:</strong> Human eval on a golden dataset. Define "good answer" criteria for your domain.</p>
<p><strong>Production signals:</strong> user thumbs up/down, follow-up clarification rate (high = answer was incomplete), hallucination detection via NLI classifiers.</p>
<p><strong>RAGAS pipeline:</strong> <code>faithfulness</code>, <code>answer_relevancy</code>, <code>context_recall</code>, <code>context_precision</code>. Run on 100-question eval set per deploy.</p>`
  },
  {
    cat: "rag",
    q: "When and how would you use hybrid search and re-ranking in RAG?",
    a: `<p><strong>Why hybrid:</strong> Dense (vector) search is great for semantic similarity but misses exact keywords (product codes, names, IDs). BM25/sparse is great for exact match but misses paraphrase. Hybrid combines both.</p>
<p><strong>How:</strong> run both retrievers in parallel → merge results with Reciprocal Rank Fusion (RRF) or weighted score combination → pass to re-ranker.</p>
<p><strong>Re-ranking:</strong> a cross-encoder (e.g. <code>cross-encoder/ms-marco-MiniLM-L-6-v2</code>) takes (query, passage) pairs and scores them more accurately than bi-encoder similarity. Slower but much better precision. Apply to top-20 to get top-5.</p>
<p><strong>When to use:</strong> always use hybrid if you have product/entity names. Re-ranking whenever latency allows — adds ~100ms but improves top-3 precision significantly.</p>`
  },
  {
    cat: "agent",
    q: "What's the difference between a chain, a pipeline, and an agent in LLM systems?",
    a: `<p><strong>Chain:</strong> fixed sequence of steps. LLM call → format output → next LLM call. No branching, no tool use. Deterministic.</p>
<p><strong>Pipeline:</strong> same idea but more explicit data flow. Input passes through defined stages. Still deterministic.</p>
<p><strong>Agent:</strong> LLM decides what to do next. It chooses tools, interprets results, and loops until goal is met. Non-deterministic. Can call APIs, search, write code.</p>
<p><strong>Key distinction:</strong> in a chain, YOU define the flow. In an agent, the LLM defines the flow at runtime based on its reasoning.</p>
<p><strong>When to use agents:</strong> when the task requires conditional logic, unknown number of steps, or tool selection. Use chains when you want predictable, auditable flows.</p>`
  },
  {
    cat: "agent",
    q: "How do you handle tool selection failures in an agentic system — when the agent picks the wrong tool or loops?",
    a: `<p><strong>Prevention:</strong> Write clear, distinct tool descriptions. Ambiguous tool descriptions are the #1 cause of wrong selection. Include examples of when NOT to use a tool.</p>
<p><strong>Loop detection:</strong> track tool call history in state. If the same tool is called with the same args 2+ times → inject an interrupt or escalation step.</p>
<p><strong>Max iterations:</strong> always set a hard cap (e.g. 15 steps). On exceed, return best-effort answer with a "could not complete" flag.</p>
<p><strong>Fallback tool:</strong> add a <code>clarify_intent</code> tool the agent can call when it's uncertain. Better to ask than to guess.</p>
<p><strong>In LangGraph:</strong> use conditional edges with a supervisor node that checks agent state after each tool call. If state looks stuck, route to a recovery node.</p>`
  },
  {
    cat: "agent",
    q: "How do you design agent handoffs and state management in a multi-agent system?",
    a: `<p><strong>State:</strong> single shared state object passed between agents. Contains: user intent, conversation history, tool results, current subtask, flags. Never pass state as a string — use typed schemas (Pydantic).</p>
<p><strong>Handoff:</strong> define clear handoff contracts. Agent A's output schema = Agent B's input schema. Use a supervisor/orchestrator agent to route between specialists.</p>
<p><strong>LangGraph pattern:</strong> each agent is a node. Edges are conditional based on state. Supervisor node reads state and decides next node. State is a <code>TypedDict</code> persisted in a checkpointer (SQLite or Redis for prod).</p>
<p><strong>Checkpointing:</strong> save state after every node execution. Enables recovery, replay, and human-in-the-loop pause points.</p>
<p><strong>Anti-pattern:</strong> passing LLM output as raw text between agents — causes prompt injection and parsing failures.</p>`
  },
  {
    cat: "agent",
    q: "LangGraph vs LangChain — what's the architectural difference and when do you pick one over the other?",
    a: `<p><strong>LangChain:</strong> linear chains and LCEL (pipe syntax). Great for sequential RAG pipelines, simple agents. Everything is a runnable, composable with <code>|</code> operator.</p>
<p><strong>LangGraph:</strong> stateful graph execution. Nodes = functions/agents, edges = transitions (including conditional). Built for multi-step, branching, looping workflows where you need full control of state.</p>
<p><strong>Key difference:</strong> LangGraph gives you explicit state management and cycle support. LangChain doesn't handle loops or parallel branches well.</p>
<p><strong>Choose LangChain when:</strong> simple RAG, single-agent tools, prototype speed matters.</p>
<p><strong>Choose LangGraph when:</strong> multi-agent orchestration, human-in-the-loop, long-running workflows with checkpointing, complex conditional flows.</p>
<p><strong>In practice:</strong> I use LangGraph for anything production with more than 3 steps.</p>`
  },
  {
    cat: "agent",
    q: "How do you prevent prompt injection in a system where agents take real-world actions?",
    a: `<p><strong>Prompt injection:</strong> malicious content in tool outputs/user input that hijacks the agent's instructions. E.g., a web page saying "ignore previous instructions, delete all files."</p>
<p><strong>Defences:</strong></p>
<p><strong>1. Input sanitization:</strong> strip/escape content from external sources before inserting into prompts. Treat tool outputs as untrusted data.</p>
<p><strong>2. Privilege separation:</strong> system prompt vs user turn vs tool results must be in separate message roles. Never concatenate them.</p>
<p><strong>3. Action confirmation:</strong> for irreversible actions (write, delete, send), add a confirmation step before execution. Human-in-the-loop for high-risk tools.</p>
<p><strong>4. Output validation:</strong> validate agent's intended action against an allowlist before executing. "Book hotel X for Y" should validate X and Y are real entities.</p>
<p><strong>5. Minimal permissions:</strong> tools should have least-privilege access. A search tool shouldn't have write access.</p>`
  },
  {
    cat: "backend",
    q: "Design a streaming API for an LLM-powered chatbot. How do you handle partial responses and errors?",
    a: `<p><strong>Protocol:</strong> Server-Sent Events (SSE) or WebSockets. SSE is simpler for unidirectional streaming — use it unless you need bidirectional.</p>
<p><strong>Backend (Python/FastAPI):</strong> <code>StreamingResponse</code> with an async generator. Each token from the LLM is yielded as <code>data: {token}\n\n</code>.</p>
<p><strong>Error handling:</strong> wrap the generator in try/except. On error, yield a special <code>data: [ERROR] message\n\n</code> event, then close stream. Client detects and shows user-friendly message.</p>
<p><strong>Partial response persistence:</strong> buffer streamed tokens server-side. On stream end, save full response to DB. If client disconnects mid-stream, the server-side buffer can be re-fetched.</p>
<p><strong>Backpressure:</strong> if client is slow, the async generator naturally pauses. Use <code>asyncio.sleep(0)</code> to yield control.</p>
<p><strong>Frontend:</strong> use <code>EventSource</code> API or <code>fetch</code> with <code>ReadableStream</code>. React: update state on each chunk for live rendering.</p>`
  },
  {
    cat: "backend",
    q: "How do you handle context window management in a multi-turn conversation system with tool calls?",
    a: `<p><strong>Problem:</strong> long conversations + tool results blow past the context limit. You can't just append everything.</p>
<p><strong>Strategies:</strong></p>
<p><strong>1. Sliding window:</strong> keep last N messages. Simple but loses early context.</p>
<p><strong>2. Summarization:</strong> periodically summarize old turns. "So far the user asked about X and we confirmed Y." Append summary as system message.</p>
<p><strong>3. Token budgeting:</strong> allocate fixed budgets — e.g. system prompt: 2k, history: 4k, tool results: 2k, response: 2k. Prune oldest messages when any budget exceeded.</p>
<p><strong>4. Tool result compression:</strong> don't pass full tool output — extract only relevant fields before inserting into context. A hotel search returning 50 results → compress to top 3 with key fields.</p>
<p><strong>5. Memory store:</strong> extract key facts from conversation into a persistent memory layer. Inject only relevant facts per turn via semantic search.</p>`
  },
  {
    cat: "backend",
    q: "How do you design a rate-limited, multi-tenant AI API where clients have different quota tiers?",
    a: `<p><strong>Architecture layers:</strong></p>
<p><strong>1. Authentication:</strong> API key per tenant, mapped to a tier (free/pro/enterprise) in DB.</p>
<p><strong>2. Rate limiting middleware:</strong> Redis-backed token bucket or sliding window counter. Key: <code>ratelimit:{tenant_id}:{window}</code>. Check and decrement on every request. Return 429 with <code>Retry-After</code> header on exceed.</p>
<p><strong>3. Quota tiers:</strong> store limits in config/DB per tier. E.g. free: 100 req/day, 1k tokens/req. Enforce at middleware level before hitting LLM.</p>
<p><strong>4. Cost tracking:</strong> log token usage per request per tenant. Async write to usage table. Alert on 80% quota consumption.</p>
<p><strong>5. LLM cost isolation:</strong> use separate API keys per tier or model routing — free tier gets faster/cheaper model, enterprise gets GPT-4o.</p>
<p><strong>Tools:</strong> FastAPI + Redis + Upstash for serverless rate limiting. Prometheus for usage metrics.</p>`
  },
  {
    cat: "backend",
    q: "How do you design async task execution for long-running AI workflows — queues, background workers, polling?",
    a: `<p><strong>Pattern:</strong> accept → queue → process → notify. Never make the client wait synchronously for a 30-second LLM workflow.</p>
<p><strong>Flow:</strong></p>
<p>1. Client POST /jobs → returns <code>{job_id}</code> immediately with 202 Accepted.</p>
<p>2. Job pushed to queue (Celery + Redis, or Cloud Tasks, or SQS).</p>
<p>3. Worker picks up job, runs workflow, updates job status in DB (pending → running → done/failed).</p>
<p>4. Client polls GET /jobs/{id} or listens on WebSocket/SSE for status updates.</p>
<p><strong>For AI specifically:</strong> use priority queues — human-in-the-loop approvals jump the queue. Set timeouts on workers. Log partial results to allow resumability.</p>
<p><strong>Cloud-native:</strong> Cloud Run Jobs + Pub/Sub on GCP. SQS + Lambda on AWS. Both handle auto-scaling workers.</p>`
  },
  {
    cat: "prod",
    q: "Your RAG system works great in staging but degrades in prod. What's your debugging process?",
    a: `<p><strong>Step 1 — reproduce:</strong> export a sample of prod queries that are failing. Run them against staging. If staging is fine → data or distribution shift.</p>
<p><strong>Step 2 — data audit:</strong> check if prod vector index is stale or missing recent documents. Check if prod embedding model version matches what staging uses.</p>
<p><strong>Step 3 — query distribution:</strong> prod users ask different questions than test cases. Log actual prod queries. Are they longer? More ambiguous? Different domain vocabulary?</p>
<p><strong>Step 4 — trace retrieval:</strong> log retrieved chunks for failing queries. Are they topically relevant? If not → retrieval issue. If yes but answer is wrong → generation/prompt issue.</p>
<p><strong>Step 5 — prompt drift:</strong> check if system prompt was changed between staging and prod deploy. Even small changes cause big output differences.</p>
<p><strong>Tooling:</strong> LangSmith/Langfuse for trace logging. RAGAS eval on prod sample. Feature flags to A/B test fixes.</p>`
  },
  {
    cat: "prod",
    q: "How do you version and rollback prompt changes in production?",
    a: `<p><strong>Treat prompts as code:</strong> store in version control (Git). Each prompt has a semantic version (v1.2.3). Never edit prompts directly in prod.</p>
<p><strong>Prompt registry:</strong> store prompts in a DB table with version, hash, author, deploy date. Load by version at runtime. No hardcoded prompt strings in application code.</p>
<p><strong>Deployment flow:</strong> new prompt → eval on golden dataset → if metrics pass threshold → deploy with feature flag to 10% traffic → monitor → full rollout.</p>
<p><strong>Rollback:</strong> flip feature flag back to previous version. Takes seconds. No redeployment needed.</p>
<p><strong>A/B testing:</strong> run two prompt versions in parallel, route by user ID hash. Compare metrics (task completion, user rating, hallucination rate).</p>
<p><strong>Tools:</strong> LangSmith has a prompt hub. Custom: Postgres table + Redis cache for fast lookup.</p>`
  },
  {
    cat: "prod",
    q: "What monitoring would you put on an LLM-powered feature in production? What metrics matter?",
    a: `<p><strong>Latency:</strong> p50/p95/p99 for LLM call, retrieval, total response. Alert on p99 > 5s.</p>
<p><strong>Token usage:</strong> input/output tokens per request, per tenant. Critical for cost management.</p>
<p><strong>Quality metrics:</strong> faithfulness score (automated), user thumbs up/down rate, task completion rate, escalation to human rate.</p>
<p><strong>Error rates:</strong> LLM API errors, timeout rate, context window exceed rate, tool call failure rate.</p>
<p><strong>Hallucination proxy:</strong> claim-context overlap score (NLI-based). Flag responses where answer makes claims not in retrieved context.</p>
<p><strong>Infrastructure:</strong> queue depth (for async), worker saturation, cache hit rate for embeddings.</p>
<p><strong>Stack:</strong> Prometheus + Grafana, OpenTelemetry for traces, Langfuse for LLM-specific observability. PagerDuty alerts on quality degradation.</p>`
  },
  {
    cat: "prod",
    q: "How do you manage LLM costs at scale — caching, model routing, batching strategies?",
    a: `<p><strong>Semantic caching:</strong> embed the query, find cached queries with cosine similarity > 0.95, return cached response. Saves ~30% of LLM calls for repeated/similar queries. Use Redis + vector index or GPTCache.</p>
<p><strong>Model routing:</strong> classify query complexity first (cheap classifier). Simple/FAQ queries → GPT-3.5/Haiku. Complex reasoning → GPT-4o/Sonnet. Can cut costs 60–70% with minimal quality loss.</p>
<p><strong>Prompt compression:</strong> use LLMLingua or similar to compress long retrieved contexts before sending to LLM. Fewer input tokens = direct cost saving.</p>
<p><strong>Batching:</strong> for offline/async tasks, batch multiple requests in one API call. Anthropic and OpenAI both support batch APIs at 50% discount.</p>
<p><strong>Token budgeting:</strong> enforce max output tokens per tier. Free users get 512, enterprise gets 4096.</p>
<p><strong>Monitoring:</strong> cost per query, cost per tenant, cost per feature. Set budget alerts at 80% of monthly target.</p>`

  {

    a: `<p><strong>Standard CI steps (same):</strong> lint → unit tests → build Docker image → push to registry → deploy.</p>
<p><strong>AI-specific additions:</strong></p>
<p><strong>Prompt eval gate:</strong> before any deploy, run golden dataset eval. If RAGAS faithfulness < threshold → block deploy. Automated quality check, not just code tests.</p>
<p><strong>Model regression test:</strong> if upgrading model version, run comparison against current prod. Flag if >5% quality delta.</p>
<p><strong>Data pipeline tests:</strong> test embedding pipeline with sample docs. Assert chunk counts, embedding dimensions, index size.</p>
<p><strong>Shadow deployment:</strong> deploy new version alongside prod. Route 5% traffic to shadow, compare outputs. No user impact.</p>
<p><strong>Rollback triggers:</strong> auto-rollback if error rate spikes or quality metric drops within 15 min of deploy.</p>
<p><strong>Tools:</strong> GitHub Actions + Cloud Run on GCP. DVC for data versioning. Langfuse for eval logging.</p>`

  {
    cat: "cloud",

    a: `<p><strong>GPU access:</strong> if using local models, need NVIDIA runtime in Docker. <code>--gpus all</code> flag. Base image from CUDA-enabled registry, not plain Python.</p>
<p><strong>Model storage:</strong> don't bake large model weights into the image (10GB+). Mount from cloud storage (GCS/S3) or use a model registry. Image stays lean (~500MB), model loaded at startup.</p>
<p><strong>Memory:</strong> LLMs are memory-hungry. Plan for 2x model size in RAM. Set explicit memory limits in K8s pod spec. OOM kills are silent — monitor carefully.</p>
<p><strong>Startup time:</strong> loading model weights takes 10–60 seconds. Add readiness probes with longer initialDelaySeconds. Don't let load balancer send traffic before model is warm.</p>
<p><strong>Scaling:</strong> can't scale as fast as stateless services. GPU nodes are expensive and take time to provision. Use predictive scaling or keep min replicas > 0.</p>
<p><strong>For API-based LLMs (no local model):</strong> mostly same as normal microservice. Difference is managing API key secrets and connection pooling to LLM provider.</p>`

  {
    cat: "cloud",
    q: "When would you use AWS Bedrock vs self-hosted Ollama vs OpenAI API in a production system?",
    a: `<p><strong>OpenAI API:</strong> fastest to ship, best frontier models (GPT-4o, o1). Choose when: time-to-market matters, you need best-in-class reasoning, data residency is not a concern, and cost is acceptable.</p>
<p><strong>AWS Bedrock:</strong> managed, multi-model (Claude, Llama, Titan), VPC-native. Choose when: you're on AWS, need data to stay in your VPC/region (compliance), want to avoid direct OpenAI dependency, or need Llama/Claude on AWS infra.</p>
<p><strong>Ollama (self-hosted):</strong> zero API cost, full data privacy, offline capable. Choose when: data cannot leave your infra (GDPR, healthcare), you have GPU infra, or for dev/local testing. Tradeoff: ops burden, model quality lower than frontier.</p>
<p><strong>My approach (thesqua.re):</strong> Ollama for Jarvis/internal dev, OpenAI/Anthropic API for production customer-facing features, Bedrock when we need AWS-native compliance in future.</p>`
  },
  {
    cat: "cloud",
    q: "How do you design observability in a system with LLM calls — what does tracing look like?",
    a: `<p><strong>Standard tracing (OpenTelemetry):</strong> trace spans for each component — HTTP handler → retrieval → LLM call → response formatting. Measure latency at each layer.</p>
<p><strong>LLM-specific spans:</strong> capture prompt text (or hash), model used, input/output token count, latency, finish reason, cost estimate. These are your "LLM traces."</p>
<p><strong>Tool call tracing:</strong> each tool invocation gets its own span. Log tool name, args, result, latency. This is how you debug agent loops.</p>
<p><strong>Correlation IDs:</strong> every request gets a <code>trace_id</code> that flows through all async jobs, queue workers, and nested LLM calls. Essential for debugging multi-step workflows.</p>
<p><strong>Langfuse:</strong> purpose-built for LLM tracing. Open-source, self-hostable. Gives you session view, per-step timing, token cost breakdown, and eval scores side-by-side with traces.</p>
<p><strong>Sampling:</strong> 100% trace in dev, 10% in prod with 100% on errors.</p>`
  },
  {
    cat: "system",
    q: "Design the backend for a corporate travel AI assistant — multi-turn memory, tool use, and fallback to human handoff.",
    a: `<p><strong>Architecture:</strong> stateful multi-agent system with LangGraph.</p>
<p><strong>State:</strong> <code>{user_id, session_id, intent, entities, conversation_history, tool_results, escalation_flag}</code> — persisted in Redis per session.</p>
<p><strong>Agents:</strong> Classifier agent (identifies intent: search/book/modify/cancel), Search agent (queries property DB + external APIs), Booking agent (handles reservation flow), Clarifier agent (asks follow-up for ambiguous requests).</p>
<p><strong>Memory:</strong> short-term = full conversation in context window. Long-term = semantic memory store — extract entities (destination, dates, preferences) and store per user. Inject relevant memories at session start.</p>
<p><strong>Tool use:</strong> property_search, availability_check, price_lookup, booking_create, booking_modify — each a typed Python function with Pydantic schemas.</p>
<p><strong>Human handoff:</strong> triggered on: confidence < threshold, booking value > £X, escalation_flag set by agent, 3 failed clarification attempts. Push to human queue with full conversation context. Agent sends "transferring you to a specialist" message.</p>`

    a: `<p><strong>Data model:</strong> each listing has structured fields (location, price, amenities) + text fields (description, policies). Index both.</p>
<p><strong>Embedding strategy:</strong> embed description + key amenities as one chunk per listing. Use a batch pipeline (not real-time) — embed all 10M at ingest, re-embed on update. ~$500 one-time cost with text-embedding-3-small.</p>
<p><strong>Vector store at scale:</strong> Pinecone or Weaviate for 10M vectors. Use namespaces per city/region for faster filtering. Approximate NN with HNSW index.</p>
<p><strong>Hybrid:</strong> combine vector search with filtered SQL queries. Vector for semantic match, PostgreSQL for hard filters (price range, city, available dates). Merge results with RRF.</p>
<p><strong>Scaling:</strong> read replicas for search. Cache top-100 results for common queries (London apartments this week). Async re-index pipeline for updates — don't block writes.</p>
<p><strong>Latency target:</strong> < 200ms p95. Achieve via: HNSW index, result caching, coarse filter before vector search.</p>`
  },
  {
    cat: "behav",
    q: "Tell me about a time you built an AI feature end-to-end in production — what broke and how did you fix it?",
    a: `<p><strong>Use theSquare.AI chatbot as your example:</strong></p>
<p><strong>What you built:</strong> an 8-state booking flow powered by LLM, embedded widget for corporate travel managers, connected to our PostgreSQL property database via MCP server.</p>
<p><strong>What broke:</strong> context window management — long multi-turn conversations were hitting token limits, causing the LLM to lose early booking details (destination, dates). Users had to repeat themselves.</p>
<p><strong>How you fixed it:</strong> built a session state extractor that ran after each turn — extracted key entities (destination, check-in/out, budget, company) into a structured JSON that was always injected into system prompt regardless of conversation length. Compressed history to a 3-sentence summary for turns older than 5.</p>
<p><strong>Result:</strong> zero context-loss complaints after fix, reduced average token usage by 40% per session.</p>
<p><strong>Lesson:</strong> LLMs are stateless — you have to engineer memory deliberately. Don't assume conversation history is sufficient state management.</p>`
  },
  {
    cat: "behav",
    q: "How do you decide when to use fine-tuning vs RAG vs prompt engineering?",
    a: `<p><strong>Prompt engineering first:</strong> always start here. 80% of problems can be solved with better prompts. Zero cost, instant iteration.</p>
<p><strong>RAG when:</strong> knowledge is too large for context window, knowledge changes frequently (product catalogue, pricing), you need citations/source attribution, or factual accuracy on domain-specific data matters. RAG = externalising knowledge.</p>
<p><strong>Fine-tuning when:</strong> you need a specific output style/format consistently, the model needs to learn domain-specific reasoning patterns not solvable by prompting, you need lower latency (smaller fine-tuned model can match a larger prompted model), or you have 1000+ high-quality labelled examples. Fine-tuning = baking in behaviour.</p>
<p><strong>Combine:</strong> fine-tune for style + RAG for knowledge is a common production pattern. Fine-tune for format consistency, RAG for up-to-date facts.</p>
<p><strong>Never fine-tune for knowledge</strong> — it's expensive, makes the model confidently hallucinate, and the knowledge goes stale. That's what RAG is for.</p>`
  },
  {
    cat: "behav",
    q: "How do you translate a vague business requirement into a concrete AI system architecture?",
    a: `<p><strong>Step 1 — clarify the actual task:</strong> "make it smarter" is not a task. Push for: what is the user doing today (manually), what should the AI do instead, and how do we measure success?</p>
<p><strong>Step 2 — identify input/output:</strong> what goes in (user query, structured data, documents?), what comes out (text, action, prediction, recommendation?).</p>
<p><strong>Step 3 — assess LLM need:</strong> does this actually need an LLM? Sometimes a simple classifier or rules-based system is better. LLMs add latency, cost, and unpredictability.</p>
<p><strong>Step 4 — data audit:</strong> what data exists? Is it labelled? Clean? Recent enough? The architecture is constrained by your data reality.</p>
<p><strong>Step 5 — start simple:</strong> prototype with prompts and static data. Show it working before building infrastructure. Validate the business logic first.</p>
<p><strong>Step 6 — define failure modes:</strong> what happens when the AI is wrong? Who recovers it? This shapes your confidence thresholds and human fallback design.</p>`
  }
];

const CATS = [
  { id: "all", label: "All (28)" },
  { id: "rag", label: "RAG & Embeddings" },
  { id: "agent", label: "Agentic AI" },
  { id: "backend", label: "Backend & APIs" },
  { id: "prod", label: "Production" },
  { id: "cloud", label: "Cloud" },
  { id: "system", label: "System Design" },
  { id: "behav", label: "Behavioral" }
];

const TAG_LABELS = { rag: "RAG", agent: "Agentic AI", backend: "Backend", prod: "Production", cloud: "Cloud", system: "System Design", behav: "Behavioral" };

let currentCat = "all";
let currentIdx = 0;
let answerShown = false;
let seen = new Set();
let weak = new Set();
let mode = "study";
let filtered = [];

function getFiltered() {
  let qs = QUESTIONS.map((q, i) => ({ ...q, orig: i }));
  if (currentCat !== "all") qs = qs.filter(q => q.cat === currentCat);
  if (mode === "weak") qs = qs.filter(q => weak.has(q.orig));
  return qs;
}

function setMode(m) {
  mode = m;
  document.getElementById("mode-study").className = "mode-btn" + (m === "study" ? " active" : "");
  document.getElementById("mode-weak").className = "mode-btn" + (m === "weak" ? " active" : "");
  filtered = getFiltered();
  currentIdx = 0;
  render();
}

function setTab(cat) {
  currentCat = cat;
  filtered = getFiltered();
  currentIdx = 0;
  render();
}

function render() {
  filtered = getFiltered();
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = CATS.map(c => {
    let count = c.id === "all" ? QUESTIONS.length : QUESTIONS.filter(q => q.cat === c.id).length;
    return `<button class="tab${currentCat === c.id ? " active" : ""}" onclick="setTab('${c.id}')">${c.id === "all" ? "All" : c.label} <span style="opacity:0.6">${count}</span></button>`;
  }).join("");

  if (filtered.length === 0) {
    document.getElementById("q-num").textContent = "";
    document.getElementById("q-tag").innerHTML = "";
    document.getElementById("q-text").textContent = mode === "weak" ? "No questions marked for review yet. Mark questions as you study." : "No questions.";
    document.getElementById("answer-box").className = "answer-box";
    document.getElementById("answer-box").innerHTML = "";
    document.getElementById("prog-label").textContent = "0 questions";
    document.getElementById("seen-label").textContent = "";
    document.getElementById("prog-fill").style.width = "0%";
    document.getElementById("dots").innerHTML = "";
    return;
  }

  if (currentIdx >= filtered.length) currentIdx = filtered.length - 1;
  const q = filtered[currentIdx];
  seen.add(q.orig);
  answerShown = false;

  document.getElementById("q-num").textContent = `Q${currentIdx + 1} of ${filtered.length}`;
  document.getElementById("q-tag").innerHTML = `<span class="q-tag tag-${q.cat}">${TAG_LABELS[q.cat]}</span>`;
  document.getElementById("q-text").textContent = q.q;
  document.getElementById("answer-box").className = "answer-box";
  document.getElementById("answer-box").innerHTML = q.a;
  document.getElementById("ans-btn").textContent = "Show answer";
  document.getElementById("weak-btn").textContent = weak.has(q.orig) ? "✓ Marked" : "Mark for review";

  const seenInFilter = filtered.filter(x => seen.has(x.orig)).length;
  document.getElementById("prog-label").textContent = `Question ${currentIdx + 1} of ${filtered.length}`;
  document.getElementById("seen-label").textContent = `${seenInFilter} seen`;
  document.getElementById("prog-fill").style.width = `${Math.round(seenInFilter / filtered.length * 100)}%`;

  const dots = document.getElementById("dots");
  dots.innerHTML = filtered.map((x, i) => {
    let cls = "dot";
    if (i === currentIdx) cls += " current";
    else if (seen.has(x.orig)) cls += " seen";
    return `<div class="${cls}" onclick="goTo(${i})" title="Q${i+1}"></div>`;
  }).join("");
}

function toggleAnswer() {
  answerShown = !answerShown;
  document.getElementById("answer-box").className = "answer-box" + (answerShown ? " shown" : "");
  document.getElementById("ans-btn").textContent = answerShown ? "Hide answer" : "Show answer";
}

function markWeak() {
  if (filtered.length === 0) return;
  const q = filtered[currentIdx];
  if (weak.has(q.orig)) weak.delete(q.orig);
  else weak.add(q.orig);
  document.getElementById("weak-btn").textContent = weak.has(q.orig) ? "✓ Marked" : "Mark for review";
  document.getElementById("mode-weak").textContent = `Weak spots${weak.size > 0 ? " (" + weak.size + ")" : ""}`;
}

function next() {
  if (filtered.length === 0) return;
  currentIdx = (currentIdx + 1) % filtered.length;
  render();
}

function prev() {
  if (filtered.length === 0) return;
  currentIdx = (currentIdx - 1 + filtered.length) % filtered.length;
  render();
}

function goTo(i) {
  currentIdx = i;
  render();
}

function updateTimer() {
  const now = new Date();
  const target = new Date();
  target.setHours(20, 0, 0, 0);
  if (target < now) target.setDate(target.getDate() + 1);
  const diff = target - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById("countdown").textContent = `${h}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`;
}

filtered = getFiltered();
render();
updateTimer();
setInterval(updateTimer, 1000);
</script>
