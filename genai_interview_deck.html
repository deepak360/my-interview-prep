ntent\n                        if token:\n                            yield f'data: {json.dumps({\"type\":\"token\",\"text\":token})}\\n\\n'\n                    elif event['event'] == 'on_tool_start':\n                        yield f'data: {json.dumps({\"type\":\"tool\",\"name\":event[\"name\"]})}\\n\\n'\n                yield 'data: {\"type\":\"done\"}\\n\\n'\n            except Exception as e:\n                yield f'data: {json.dumps({\"type\":\"error\",\"msg\":str(e)})}\\n\\n'\n\n        return StreamingResponse(generate(), media_type='text/event-stream',\n                                headers={'Cache-Control': 'no-cache',\n                                         'X-Accel-Buffering': 'no'})\n\nNode-level streaming (chunk per node):\n    # Simpler: stream after each node completes\n    async for chunk in app.astream(inputs, config):\n        for node_name, output in chunk.items():\n            print(f'{node_name} completed: {output}')", "cross": ["What is the difference between astream and astream_events in LangGraph?", "How do you handle streaming backpressure when the client is slow?", "How do you filter out internal node events so users only see final output tokens?"]}, {"q": "TRICKY: LangGraph agent loops forever. Diagnose and fix.", "a": "Infinite loop root causes and fixes:\n\nDiagnosis:\n    # Step 1: Check LangGraph's recursion limit\n    try:\n        result = app.invoke(state, config, recursion_limit=25)  # default=25\n    except GraphRecursionError as e:\n        print(f'Hit limit at iteration: {len(state[\"messages\"])}')\n\n    # Step 2: Add routing debug logging\n    def route_debug(state) -> str:\n        decision = original_route(state)\n        print(f'Step {len(state[\"messages\"])}: routing → {decision}')\n        last = state['messages'][-1]\n        if hasattr(last, 'tool_calls'):\n            print(f'  Tool calls: {[tc[\"name\"] for tc in last.tool_calls]}')\n        return decision\n\n    # Step 3: Inspect state history (with checkpointer)\n    history = list(app.get_state_history(config))\n    for h in history[-5:]:\n        print(f'Step {h.step}: next={h.next}')\n        # If next always = ['agent'] or ['tools'] → stuck!\n\nRoot causes and fixes:\n\n    # Cause 1: Route never returns END\n    def bad_route(state):  # BUG\n        if state['messages'][-1].tool_calls:\n            return 'tools'\n        # Missing: else return END ← forgot this!\n\n    def good_route(state):\n        if state['messages'][-1].tool_calls:\n            return 'tools'\n        return END  # ← must always have a terminal path\n\n    # Cause 2: Tool always errors → agent always retries\n    def route_with_error_check(state):\n        msgs = state['messages']\n        # Count consecutive tool errors\n        errors = sum(1 for m in msgs[-4:]\n                     if hasattr(m, 'content') and 'error' in str(m.content).lower())\n        if errors >= 3:\n            return END  # too many errors, give up\n        if msgs[-1].tool_calls:\n            return 'tools'\n        return END\n\n    # Cause 3: Same tool called with same args repeatedly\n    def detect_loop(state):\n        recent = state['messages'][-6:]\n        tool_calls = [str(getattr(m, 'tool_calls', '')) for m in recent]\n        # If last 3 tool calls are identical → loop\n        if len(tool_calls) >= 6 and tool_calls[-2] == tool_calls[-4] == tool_calls[-6]:\n            return 'stuck_handler'\n        return original_route(state)\n\n    # Cause 4: Hard iteration cap (always add this)\n    class State(TypedDict):\n        messages: list\n        step: Annotated[int, lambda a, b: a + b]\n\n    def route_with_cap(state):\n        if state['step'] >= 10:\n            return END  # hard stop\n        return original_route(state)", "cross": ["What is the default recursion limit and when should you raise it vs fix the loop?", "How do you alert on infinite loops in production LangGraph agents?", "What is the difference between a logic loop and a data loop in agent systems?"]}, {"q": "SITUATION: Design a LangGraph pipeline for automated code review.", "a": "    from langgraph.graph import StateGraph, END\n    from langgraph.constants import Send\n    from typing import TypedDict, Annotated, List, Optional\n    import operator\n\n    class CodeReviewState(TypedDict):\n        pr_diff: str\n        pr_title: str\n        security_findings: Annotated[list, operator.add]\n        quality_findings: Annotated[list, operator.add]\n        test_findings: Annotated[list, operator.add]\n        perf_findings: Annotated[list, operator.add]\n        verdict: Optional[str]  # APPROVE | REQUEST_CHANGES | COMMENT\n        review_comments: Annotated[list, operator.add]\n        human_approved: Optional[bool]\n\n    # Parallel specialized reviewers\n    def security_reviewer(state) -> dict:\n        issues = llm.invoke(f\"\"\"Review for security issues ONLY:\n        - SQL injection, XSS, CSRF, hardcoded secrets\n        - Insecure deserialization, missing validation\n        Diff: {state['pr_diff']}\n        List each issue as: CRITICAL/HIGH/MEDIUM: description\"\"\").content\n        items = [l for l in issues.split('\\n') if l.strip()]\n        return {'security_findings': items,\n                'review_comments': [f'[Security] {i}' for i in items]}\n\n    def quality_reviewer(state) -> dict:\n        issues = llm.invoke(f'Review code quality, naming, SOLID principles: {state[\"pr_diff\"]}').content\n        items = [l for l in issues.split('\\n') if l.strip()]\n        return {'quality_findings': items}\n\n    def test_reviewer(state) -> dict:\n        analysis = llm.invoke(f'Are edge cases tested? Missing test scenarios: {state[\"pr_diff\"]}').content\n        return {'test_findings': [analysis]}\n\n    def perf_reviewer(state) -> dict:\n        issues = llm.invoke(f'Check N+1 queries, O(n²) loops, missing indexes: {state[\"pr_diff\"]}').content\n        return {'perf_findings': [issues]}\n\n    # Aggregator: synthesize all findings\n    def verdict_node(state) -> dict:\n        all_findings = {\n            'security': state['security_findings'],\n            'quality': state['quality_findings'],\n            'tests': state['test_findings'],\n            'performance': state['perf_findings']\n        }\n        has_critical = any('CRITICAL' in str(f) for f in state['security_findings'])\n\n        if has_critical:\n            verdict = 'REQUEST_CHANGES'\n        else:\n            verdict_response = llm.invoke(\n                f'Given these findings: {all_findings}\\n'\n                f'Reply with exactly: APPROVE, REQUEST_CHANGES, or COMMENT'\n            ).content.strip()\n            verdict = verdict_response if verdict_response in ['APPROVE','REQUEST_CHANGES','COMMENT'] else 'COMMENT'\n\n        summary = llm.invoke(f'Write concise PR review summary: {all_findings}').content\n        return {'verdict': verdict, 'review_comments': [f'Summary: {summary}']}\n\n    # Fan out to all reviewers in parallel\n    def fan_out(state):\n        return [\n            Send('security_reviewer', state),\n            Send('quality_reviewer', state),\n            Send('test_reviewer', state),\n            Send('perf_reviewer', state),\n        ]\n\n    graph = StateGraph(CodeReviewState)\n    for name, fn in [('security_reviewer',security_reviewer),\n                     ('quality_reviewer',quality_reviewer),\n                     ('test_reviewer',test_reviewer),\n                     ('perf_reviewer',perf_reviewer),\n                     ('verdict',verdict_node)]:\n        graph.add_node(name, fn)\n    graph.set_entry_point('__start__')\n    graph.add_conditional_edges('__start__', fan_out)\n    for r in ['security_reviewer','quality_reviewer','test_reviewer','perf_reviewer']:\n        graph.add_edge(r, 'verdict')\n    graph.add_edge('verdict', END)\n\n    app = graph.compile(\n        checkpointer=PostgresSaver.from_conn_string(DB_URL),\n        interrupt_before=['verdict']  # optional HITL before posting\n    )", "cross": ["How do you post the generated review comments back to GitHub PR via API?", "How would you handle a PR diff that is too large for a single LLM context window?", "What metrics would you track to evaluate the quality of this automated reviewer?"]}, {"q": "What is the difference between LangGraph and AutoGen?", "a": "Both are multi-agent frameworks but with fundamentally different paradigms.\n\nLangGraph (graph/state machine):\n    from langgraph.graph import StateGraph, END\n\n    # You define explicit control flow as a graph\n    # Predictable: you know EXACTLY which nodes run in what order\n    # Great for: structured workflows, production systems\n\n    graph = StateGraph(State)\n    graph.add_node('agent', agent_node)\n    graph.add_node('tools', tool_node)\n    graph.add_conditional_edges('agent', route_fn)  # explicit routing\n    # Control flow: YOU define it\n\nAutoGen (conversation-driven):\n    import autogen\n\n    # Agents talk to each other — control emerges from conversation\n    # Less predictable but more flexible\n    assistant = autogen.AssistantAgent(\n        name='Coder',\n        llm_config={'model': 'gpt-4o'},\n        system_message='Write Python code to solve problems.'\n    )\n    executor = autogen.UserProxyAgent(\n        name='Executor',\n        human_input_mode='NEVER',\n        code_execution_config={'work_dir': './code'}\n    )\n    # Two agents converse until TERMINATE\n    executor.initiate_chat(assistant, message='Build a web scraper for news')\n\n    # Group chat (multi-agent)\n    group = autogen.GroupChat(\n        agents=[researcher, analyst, writer],\n        messages=[], max_round=15,\n        speaker_selection_method='auto'  # LLM decides who speaks next\n    )\n\nComparison:\n    Feature          | LangGraph           | AutoGen\n    Paradigm         | Graph/state machine | Conversation\n    Control flow     | Explicit edges      | LLM-decided\n    Predictability   | High                | Lower\n    Debugging        | Easy (graph trace)  | Harder\n    HITL             | Native interrupt    | human_input_mode\n    Code execution   | Custom tool node    | Built-in sandbox\n    Best for         | Production workflows | Open-ended coding\n    State management | Explicit TypedDict  | Message history\n    Checkpointing    | Native              | Limited\n\nWhen to choose:\n    LangGraph: production, compliance, defined workflows, need HITL\n    AutoGen: research, coding tasks, open-ended problem solving\n    CrewAI: quick prototyping, role-based, less control needed", "cross": ["What is AutoGen's nested chat feature?", "How does CrewAI's role-based approach differ from both?", "Can you combine LangGraph and AutoGen in the same system?"]}, {"q": "How do you implement a ReAct agent from scratch in LangGraph?", "a": "ReAct (Reasoning + Acting): cycle of Thought → Action → Observation → Thought...\n\n    from langgraph.graph import StateGraph, END\n    from langchain_openai import ChatOpenAI\n    from langchain_core.messages import HumanMessage, AIMessage, ToolMessage\n    from typing import TypedDict, Annotated\n    import operator, json\n\n    llm = ChatOpenAI(model='gpt-4o', temperature=0)\n    tools = [search_tool, calculator_tool, weather_tool]\n    llm_with_tools = llm.bind_tools(tools)\n\n    class ReActState(TypedDict):\n        messages: Annotated[list, operator.add]\n        step_count: int\n\n    # Node 1: LLM decides what to do\n    def agent(state: ReActState) -> dict:\n        response = llm_with_tools.invoke(state['messages'])\n        return {'messages': [response], 'step_count': 1}\n\n    # Node 2: Execute tool calls\n    def execute_tools(state: ReActState) -> dict:\n        last_msg = state['messages'][-1]\n        tool_messages = []\n        for tool_call in last_msg.tool_calls:\n            tool_name = tool_call['name']\n            tool_args = tool_call['args']\n            # Find and execute tool\n            tool = next(t for t in tools if t.name == tool_name)\n            try:\n                result = tool.invoke(tool_args)\n            except Exception as e:\n                result = f'Tool error: {e}'\n            tool_messages.append(\n                ToolMessage(content=str(result), tool_call_id=tool_call['id'])\n            )\n        return {'messages': tool_messages}\n\n    # Routing: continue loop or finish?\n    def route(state: ReActState) -> str:\n        last = state['messages'][-1]\n        # Safety: max steps\n        if state['step_count'] >= 10:\n            return END\n        # Has tool calls → execute them\n        if hasattr(last, 'tool_calls') and last.tool_calls:\n            return 'tools'\n        # No tool calls → final answer\n        return END\n\n    # Build graph\n    graph = StateGraph(ReActState)\n    graph.add_node('agent', agent)\n    graph.add_node('tools', execute_tools)\n    graph.set_entry_point('agent')\n    graph.add_conditional_edges('agent', route)\n    graph.add_edge('tools', 'agent')  # ← THE LOOP\n\n    app = graph.compile()\n\n    # Run\n    result = app.invoke({\n        'messages': [HumanMessage('What is 15% of the current GDP of Germany?')],\n        'step_count': 0\n    })\n    # Trace:\n    # agent → calls search('Germany GDP 2024')\n    # tools → returns '$4.2 trillion'\n    # agent → calls calculator('4200000000000 * 0.15')\n    # tools → returns '630000000000'\n    # agent → Final Answer: '15% of Germany GDP is $630 billion'\n    print(result['messages'][-1].content)", "cross": ["How does LangGraph's ReAct compare to LangChain's create_react_agent in terms of flexibility?", "How do you add structured output (JSON) to a ReAct agent?", "What is the 'observation formatting' problem and how do you structure tool outputs for the LLM?"]}, {"q": "How do you implement conditional branching in LangGraph?", "a": "Conditional edges = dynamic routing based on state. The most powerful LangGraph feature.\n\n    from langgraph.graph import StateGraph, END\n    from typing import TypedDict, Optional, Literal\n\n    class State(TypedDict):\n        question: str\n        question_type: str  # 'factual' | 'code' | 'creative' | 'math'\n        answer: Optional[str]\n        confidence: float\n        needs_verification: bool\n\n    # Conditional edge function: returns node name string\n    def route_by_type(state: State) -> str:\n        qtype = state['question_type']\n        if qtype == 'code':\n            return 'code_agent'\n        elif qtype == 'math':\n            return 'math_agent'\n        elif qtype == 'factual' and state['confidence'] < 0.7:\n            return 'rag_agent'   # low confidence factual → retrieve\n        elif state['needs_verification']:\n            return 'verify'\n        else:\n            return 'general_agent'\n\n    # More complex routing with multiple conditions\n    def route_after_answer(state: State) -> str:\n        if not state.get('answer'):\n            return 'retry'\n        if state.get('needs_verification') and state['confidence'] < 0.8:\n            return 'verify'\n        return END\n\n    # Typed return (better for documentation)\n    def typed_route(state: State) -> Literal['a', 'b', 'c']:\n        if condition_a(state): return 'a'\n        if condition_b(state): return 'b'\n        return 'c'\n\n    # Build graph with conditional routing\n    graph = StateGraph(State)\n    graph.add_node('classify', classify_question)\n    graph.add_node('code_agent', code_node)\n    graph.add_node('math_agent', math_node)\n    graph.add_node('rag_agent', rag_node)\n    graph.add_node('general_agent', general_node)\n    graph.add_node('verify', verify_node)\n    graph.add_node('retry', retry_node)\n    graph.set_entry_point('classify')\n\n    # After classify: route based on type\n    graph.add_conditional_edges(\n        'classify',\n        route_by_type,\n        # Optional explicit mapping (for documentation/validation)\n        {\n            'code_agent': 'code_agent',\n            'math_agent': 'math_agent',\n            'rag_agent': 'rag_agent',\n            'general_agent': 'general_agent',\n            'verify': 'verify'\n        }\n    )\n\n    # After each agent: check if done or needs verification\n    for node in ['code_agent', 'math_agent', 'rag_agent', 'general_agent']:\n        graph.add_conditional_edges(node, route_after_answer)\n\n    graph.add_edge('verify', END)\n    graph.add_edge('retry', 'classify')  # retry → re-classify\n\n    app = graph.compile()", "cross": ["How do you test conditional routing logic without running the full graph?", "What happens if a conditional edge function returns a node name that doesn't exist?", "How do you implement probabilistic routing (send 20% of requests to model A, 80% to model B)?"]}, {"q": "TRICKY: What is the difference between LangGraph's interrupt and a simple if-statement?", "a": "A fundamental architectural question — the answer reveals deep LangGraph understanding.\n\nSimple if-statement (NOT HITL):\n    def my_node(state):\n        if condition:\n            return route_a(state)\n        else:\n            return route_b(state)\n    # Problem: this is synchronous. The function MUST return immediately.\n    # You CAN'T pause and wait for an external event (human, API, timer)\n    # The entire Python process would block\n\nLangGraph interrupt (TRUE HITL):\n    # interrupt_before=['my_node'] in graph.compile() does something different:\n    # 1. Graph saves complete state to checkpointer\n    # 2. Graph RAISES NodeInterrupt exception internally\n    # 3. Python call RETURNS to caller with partial state\n    # 4. The LangGraph process/thread is FREED (not blocking!)\n    # 5. Hours/days later: caller invokes app(None, config)\n    # 6. Graph LOADS state from checkpointer\n    # 7. Graph RESUMES from the interrupted node\n    # This is only possible WITH a checkpointer!\n\nWhy this matters in production:\n    # Without interrupt: web request handler blocks for hours waiting\n    # GET /task → starts graph → graph pauses → request times out!\n\n    # With interrupt + async:\n    @app.post('/start')\n    async def start(req):\n        config = {'configurable': {'thread_id': str(uuid4())}}\n        await lg_app.ainvoke(req.data, config)  # returns quickly when interrupted\n        return {'thread_id': config['configurable']['thread_id'],\n                'status': 'pending_approval'}\n\n    @app.post('/approve/{thread_id}')\n    async def approve(thread_id: str):\n        config = {'configurable': {'thread_id': thread_id}}\n        result = await lg_app.ainvoke(None, config)  # resumes\n        return result  # could be hours later!\n\nKey insight:\n    # interrupt = save state + return to caller\n    # resume = load state + continue execution\n    # This REQUIRES persistent checkpointer (not MemorySaver in production!)\n    # MemorySaver only works in same process/thread\n    # Production: PostgresSaver or RedisSaver\n\nIf-statement vs interrupt:\n    if-statement: sync, in-memory, no persistence\n    interrupt: async, persistent, survives process restart", "cross": ["What happens to a pending interrupt if the server restarts? How do you ensure it resumes?", "How does NodeInterrupt work internally — is it an exception?", "Can you trigger a dynamic interrupt at runtime (not just at compile time)?"]}, {"q": "SITUATION: Your LangGraph agent is working but too slow (15s per request). How do you optimize?", "a": "Systematic optimization for LangGraph agent latency:\n\nStep 1: Profile to find the bottleneck\n    import time\n    from langsmith import traceable\n\n    # LangSmith shows per-node latency breakdown automatically\n    # Without LangSmith, add manual timing:\n    def timed_node(name, fn):\n        def wrapper(state):\n            start = time.time()\n            result = fn(state)\n            print(f'{name}: {time.time()-start:.2f}s')\n            return result\n        return wrapper\n\n    graph.add_node('research', timed_node('research', research_fn))\n    # Find: which nodes are slow? LLM? Retrieval? Tools?\n\nStep 2: Parallelize sequential nodes\n    # Before: research (5s) → analyze (5s) → write (5s) = 15s\n    # After: research + analyze in parallel (5s) → write (5s) = 10s\n    from langgraph.constants import Send\n\n    def fan_out(state):\n        return [Send('research', state), Send('analyze', state)]\n    graph.add_conditional_edges('start', fan_out)\n\nStep 3: Downgrade model for cheap subtasks\n    # Before: gpt-4o for everything → expensive + slow\n    # After: gpt-4o-mini for routing/extraction, gpt-4o for synthesis\n    router_llm = ChatOpenAI(model='gpt-4o-mini', temperature=0)  # fast\n    synthesis_llm = ChatOpenAI(model='gpt-4o', temperature=0.3)  # quality\n\nStep 4: Cache repeated LLM calls\n    from langchain.cache import RedisSemanticCache\n    from langchain.globals import set_llm_cache\n    set_llm_cache(RedisSemanticCache(\n        redis_url=REDIS_URL,\n        embedding=OpenAIEmbeddings()\n    ))\n    # Semantically similar prompts reuse cached responses\n\nStep 5: Reduce context size\n    # Trim message history before LLM calls\n    def trim_messages_node(state):\n        msgs = state['messages']\n        if len(msgs) > 20:\n            # Keep system + last 10 messages\n            msgs = msgs[:1] + msgs[-10:]\n        return {'messages': msgs}\n\nStep 6: Async execution\n    # Use ainvoke for async benefit\n    result = await app.ainvoke(state, config)\n    # Multiple requests benefit from asyncio event loop concurrency\n\nStep 7: Streaming to improve perceived latency\n    # Even if total time is 15s, user sees first token in 1s\n    async for event in app.astream_events(state, config, version='v2'):\n        if event['event'] == 'on_chat_model_stream':\n            yield event['data']['chunk'].content\n\nTypical results:\n    Before: 15s sequential, gpt-4o everywhere\n    After: 6s parallel + model tiering + caching\n    Perceived: 1s (streaming first token)", "cross": ["How do you set up distributed LangGraph execution across multiple workers?", "What is prompt caching (Anthropic/OpenAI) and how does it reduce latency for repeated system prompts?", "How do you implement request queuing to handle traffic spikes without dropping requests?"]}, {"q": "How do you test LangGraph applications?", "a": "Testing strategy at multiple levels:\n\n    import pytest\n    from unittest.mock import MagicMock, patch\n    from langgraph.graph import StateGraph, END\n    from langgraph.checkpoint.memory import MemorySaver\n\n    # Level 1: Unit test individual nodes\n    def test_classifier_node():\n        state = {\n            'messages': [HumanMessage('What is the weather in London?')],\n            'question_type': None\n        }\n        result = classifier_node(state)\n        assert result['question_type'] == 'weather'\n        assert result['question_type'] in ['weather', 'factual', 'code', 'math']\n\n    # Level 2: Unit test routing logic\n    def test_route_to_weather_agent():\n        state = {'question_type': 'weather', 'confidence': 0.9}\n        assert route_fn(state) == 'weather_agent'\n\n    def test_route_low_confidence_goes_to_rag():\n        state = {'question_type': 'factual', 'confidence': 0.4}\n        assert route_fn(state) == 'rag_agent'\n\n    # Level 3: Integration test with mocked LLM\n    def test_full_graph_happy_path():\n        mock_llm = MagicMock()\n        mock_llm.invoke.return_value = AIMessage('The weather is sunny, 20°C')\n\n        app = build_app(llm=mock_llm)  # inject mock\n        result = app.invoke({\n            'messages': [HumanMessage('Weather in London?')]\n        })\n        assert 'weather' in result['messages'][-1].content.lower()\n        mock_llm.invoke.assert_called()  # LLM was used\n\n    # Level 4: Test checkpointing\n    def test_resume_after_interrupt():\n        checkpointer = MemorySaver()\n        app = graph.compile(\n            checkpointer=checkpointer,\n            interrupt_before=['approval_node']\n        )\n        config = {'configurable': {'thread_id': 'test-123'}}\n\n        # Run until interrupt\n        state = app.invoke(initial_inputs, config)\n        # Verify paused at right point\n        snapshot = app.get_state(config)\n        assert snapshot.next == ['approval_node']\n\n        # Resume\n        final = app.invoke(None, config)\n        assert final['approved'] is True\n\n    # Level 5: Test error handling\n    def test_agent_handles_tool_failure():\n        failing_tool = MagicMock(side_effect=Exception('Tool down'))\n        app = build_app(tools=[failing_tool])\n        result = app.invoke({'messages': [HumanMessage('Use the tool')],\n                            'max_retries': 3})\n        assert result.get('error') is not None\n        assert 'failed' in result['error'].lower()\n\n    # Level 6: Regression test with LangSmith eval dataset\n    from langsmith.evaluation import evaluate\n    results = evaluate(\n        lambda inputs: app.invoke({'messages': [HumanMessage(inputs['question'])]}),\n        data='langgraph-agent-eval-v1',\n        evaluators=[answer_quality_evaluator]\n    )\n    assert results.stats['score']['mean'] > 0.80", "cross": ["How do you mock external API calls (web search, databases) in LangGraph tests?", "What is property-based testing and how can it find edge cases in routing logic?", "How do you run LangGraph tests in CI/CD without incurring API costs?"]}]}, "LangSmith & Langfuse": {"icon": "🔬", "color": "#0891b2", "questions": [{"q": "What is LangSmith? Core features and setup.", "a": "LangSmith = observability, evaluation, and dataset management platform for LLM apps. Made by LangChain team.\n\nCore features:\n    1. Tracing: full trace of every chain/agent call\n    2. Evaluation: run evals on datasets\n    3. Dataset management: curate test examples\n    4. Prompt management: version and deploy prompts\n    5. Cost tracking: token usage per request\n    6. Regression testing: compare versions\n\nSetup (one-time, then automatic):\n    pip install langsmith\n\n    import os\n    os.environ['LANGCHAIN_TRACING_V2'] = 'true'\n    os.environ['LANGCHAIN_API_KEY'] = 'ls-...'\n    os.environ['LANGCHAIN_PROJECT'] = 'thesquare-rag-prod'\n    # ALL LangChain calls now auto-traced — zero code change!\n\nWhat you see per trace:\n    - Full tree: chain → retrieval → LLM call → output parser\n    - Input/output at each step\n    - Latency breakdown (p50/p95/p99)\n    - Token counts and cost estimate\n    - Error details with stack trace\n    - Tags and metadata you add\n\nNon-LangChain tracing:\n    from langsmith import traceable, Client\n\n    @traceable(run_type='chain', name='my_rag')\n    def my_rag_pipeline(question: str) -> str:\n        docs = retrieve(question)         # auto-traced span\n        answer = generate(docs, question)  # auto-traced span\n        return answer\n\n    @traceable(run_type='retriever')\n    def retrieve(query: str) -> list:\n        return vectorstore.similarity_search(query)\n\n    @traceable(run_type='llm')\n    def generate(docs: list, question: str) -> str:\n        return openai_client.chat.completions.create(...).choices[0].message.content\n\nFeedback collection:\n    from langsmith import Client\n    client = Client()\n\n    def submit_feedback(run_id: str, score: float, comment: str):\n        client.create_feedback(\n            run_id=run_id,\n            key='user_satisfaction',\n            score=score,  # 0-1\n            comment=comment\n        )", "cross": ["How does LangSmith compare to open-source alternatives like Langfuse and Arize?", "What is a LangSmith project and how do you organize multiple environments?", "How do you use LangSmith for prompt regression testing before deployment?"]}, {"q": "How do you run evaluations in LangSmith?", "a": "LangSmith eval pipeline: dataset → evaluators → results comparison.\n\n    from langsmith import Client\n    from langsmith.evaluation import evaluate\n    from langchain.evaluation import load_evaluator\n    from langchain_openai import ChatOpenAI\n\n    client = Client()\n\n    # 1. Create dataset\n    examples = [\n        {\n            'inputs': {'question': 'What is the refund policy?'},\n            'outputs': {'answer': 'Full refund within 30 days of booking'}\n        },\n        {\n            'inputs': {'question': 'How do I cancel?'},\n            'outputs': {'answer': 'Cancel via dashboard under My Bookings'}\n        }\n    ]\n    dataset = client.create_dataset('rag-qa-eval-v1')\n    client.create_examples(\n        inputs=[e['inputs'] for e in examples],\n        outputs=[e['outputs'] for e in examples],\n        dataset_id=dataset.id\n    )\n\n    # 2. Define evaluators\n    judge_llm = ChatOpenAI(model='gpt-4o', temperature=0)\n\n    # Built-in: QA correctness (LLM-as-judge)\n    qa_eval = load_evaluator('qa', llm=judge_llm)\n\n    # Custom evaluator\n    from langchain.evaluation import StringEvaluator\n    class ContainsKeyFact(StringEvaluator):\n        def _evaluate_strings(self, prediction, reference, **kwargs):\n            score = 1.0 if reference.lower() in prediction.lower() else 0.0\n            return {'score': score,\n                    'reasoning': 'Key fact found' if score else 'Missing key fact'}\n\n    # 3. Run evaluation\n    def my_chain_runner(inputs: dict) -> dict:\n        answer = rag_chain.invoke(inputs['question'])\n        return {'answer': answer}\n\n    results = evaluate(\n        my_chain_runner,\n        data='rag-qa-eval-v1',\n        evaluators=[qa_eval, ContainsKeyFact()],\n        experiment_prefix='rag-v2-chunk400',  # name for comparison\n        num_repetitions=3,  # run each example 3 times\n        concurrency_level=5,  # parallel eval runs\n    )\n\n    print(results.to_pandas())  # DataFrame with scores per example\n\n    # 4. Compare experiments in UI\n    # LangSmith shows side-by-side: v1 score=0.72, v2 score=0.81\n\nContinuous eval in CI/CD:\n    # .github/workflows/eval.yml\n    # - Install deps\n    # - Run: python run_evals.py\n    # - Fail if score drops below threshold\n    if results.stats['score']['mean'] < 0.75:\n        raise ValueError(f'Eval score {results.stats[\"score\"][\"mean\"]} below threshold')", "cross": ["What are the biases of LLM-as-judge and how do you compensate for them?", "How do you calculate statistical significance between two eval experiment results?", "What is online evaluation (in production) vs offline evaluation (on dataset)?"]}, {"q": "What is Langfuse? How does it differ from LangSmith?", "a": "Langfuse = open-source LLM observability platform. Self-hostable, framework-agnostic.\n\nKey differences:\n    Feature          | LangSmith           | Langfuse\n    Open source      | No                  | Yes (Apache 2.0)\n    Self-hostable    | No (cloud only)     | Yes (Docker)\n    Framework        | LangChain native    | Any (SDK)\n    Privacy          | Data to Anthropic   | Your servers\n    Cost             | Usage-based         | Free self-hosted\n    Prompt mgmt      | Yes                 | Yes\n    Evaluations      | More mature         | Growing\n    Analytics        | Basic               | Rich dashboards\n\nSetup:\n    pip install langfuse\n\n    from langfuse import Langfuse\n    langfuse = Langfuse(\n        public_key='pk-lf-...',\n        secret_key='sk-lf-...',\n        host='http://localhost:3000'  # self-hosted\n    )\n\n    # LangChain drop-in\n    from langfuse.callback import CallbackHandler\n    handler = CallbackHandler()\n    result = chain.invoke(inputs, config={'callbacks': [handler]})\n\nManual tracing:\n    def handle_request(user_id: str, question: str):\n        trace = langfuse.trace(\n            name='rag-request',\n            user_id=user_id,\n            input={'question': question},\n            session_id=f'session-{user_id}'\n        )\n\n        # Retrieval span\n        span = trace.span(name='retrieval', input={'query': question})\n        docs = retrieve(question)\n        span.end(output={'chunks': len(docs)})\n\n        # LLM generation\n        gen = trace.generation(\n            name='answer-gen',\n            model='claude-3-5-sonnet-20241022',\n            model_parameters={'temperature': 0},\n            input=[{'role': 'user', 'content': question}]\n        )\n        answer = generate(docs, question)\n        gen.end(\n            output=answer,\n            usage={'input': count_tokens(question), 'output': count_tokens(answer)}\n        )\n\n        trace.update(output={'answer': answer})\n        return trace.id, answer\n\n    # Collect feedback later\n    def save_feedback(trace_id: str, score: float):\n        langfuse.score(trace_id=trace_id, name='user_satisfaction', value=score)", "cross": ["How do you self-host Langfuse with Docker Compose for a production environment?", "What is OpenTelemetry and how does Langfuse's support for it improve portability?", "How would you migrate from LangSmith to Langfuse without breaking your existing instrumentation?"]}, {"q": "How do you use Langfuse for prompt management and A/B testing?", "a": "Langfuse prompt management = version, label, and hot-deploy prompts without code releases.\n\n    from langfuse import Langfuse\n    from langfuse.callback import CallbackHandler\n\n    langfuse = Langfuse()\n\n    # 1. Create/update prompt in Langfuse\n    langfuse.create_prompt(\n        name='booking-assistant-system',\n        prompt=\"\"\"You are Aria, booking assistant for thesqua.re.\n    Help with: availability, pricing, check-in/out.\n    Respond in {language}. Keep responses under 100 words.\n    If uncertain, say: 'Let me connect you with our team.'\"\"\",\n        labels=['production'],  # promote to production\n        config={'temperature': 0.3, 'model': 'gpt-4o-mini'}\n    )\n\n    # 2. Fetch at runtime (cached, hot-reloadable)\n    def get_system_prompt(language: str = 'English', label: str = 'production'):\n        prompt = langfuse.get_prompt('booking-assistant-system', label=label)\n        # Compile with template variables\n        return prompt.compile(language=language)\n\n    # 3. A/B test new prompt version\n    def route_to_variant(user_id: str) -> str:\n        bucket = hash(user_id) % 100\n        if bucket < 10: return 'experiment-v2'    # 10% get new prompt\n        return 'production'\n\n    def handle_request(user_id: str, question: str, language: str):\n        variant = route_to_variant(user_id)\n        system_prompt = get_system_prompt(language=language, label=variant)\n\n        # Track which variant for analysis\n        handler = CallbackHandler(\n            session_id=f'user-{user_id}',\n            user_id=user_id,\n            metadata={'prompt_variant': variant}\n        )\n\n        chain = build_chain(system_prompt)\n        result = chain.invoke({'question': question},\n                             config={'callbacks': [handler]})\n        return result\n\n    # 4. Analyze results in Langfuse UI\n    # Dashboard: filter by metadata.prompt_variant\n    # Compare: satisfaction, latency, cost per variant\n    # When v2 wins → promote its label to 'production'\n    # No code deployment needed!\n\n    # 5. Rollback instantly\n    # In UI: change 'production' label to previous version\n    # App automatically uses new 'production' version next request", "cross": ["What are the risks of hot-reloading prompts in production without testing?", "How do you validate that a new prompt version is safe before promoting to production label?", "What sample size do you need for an A/B test to be statistically significant?"]}, {"q": "How do you implement cost tracking and alerting for LLM applications?", "a": "    from langfuse import Langfuse\n    from langsmith import Client\n    import tiktoken\n\n    enc = tiktoken.get_encoding('cl100k_base')\n\n    # Model pricing (per 1M tokens)\n    PRICES = {\n        'gpt-4o': {'input': 5.0, 'output': 15.0},\n        'gpt-4o-mini': {'input': 0.15, 'output': 0.60},\n        'claude-3-5-sonnet-20241022': {'input': 3.0, 'output': 15.0},\n        'claude-haiku-4-5-20251001': {'input': 0.25, 'output': 1.25},\n    }\n\n    def calculate_cost(model: str, input_tokens: int, output_tokens: int) -> float:\n        if model not in PRICES:\n            return 0.0\n        p = PRICES[model]\n        return (input_tokens * p['input'] + output_tokens * p['output']) / 1_000_000\n\n    # Track in Langfuse with cost\n    def tracked_llm_call(model: str, messages: list) -> str:\n        gen = trace.generation(\n            name='llm',\n            model=model,\n            input=messages\n        )\n        response = llm.invoke(messages)\n        input_tokens = sum(len(enc.encode(m['content'])) for m in messages)\n        output_tokens = len(enc.encode(response.content))\n        cost = calculate_cost(model, input_tokens, output_tokens)\n\n        gen.end(\n            output=response.content,\n            usage={\n                'input': input_tokens,\n                'output': output_tokens,\n                'total': input_tokens + output_tokens,\n                'unit': 'TOKENS'\n            },\n            cost=cost  # Langfuse shows cost in dashboard\n        )\n        return response.content\n\n    # Budget alerting with Redis\n    import redis\n    r = redis.Redis()\n\n    def check_cost_budget(user_id: str, cost: float,\n                          daily_limit: float = 1.0) -> bool:\n        key = f'cost:{user_id}:{datetime.now().date()}'\n        current = float(r.get(key) or 0)\n        new_total = current + cost\n        r.setex(key, 86400, new_total)  # expire after 24h\n\n        if new_total > daily_limit:\n            send_alert(f'User {user_id} exceeded ${daily_limit}/day limit')\n            return False  # block further calls\n        if new_total > daily_limit * 0.8:\n            send_alert(f'User {user_id} at 80% of daily budget')\n        return True\n\n    # Organization-level cost dashboard\n    # Langfuse: Metrics → Cost → Group by model / user / session\n    # LangSmith: Monitor → Runs → Filter by date → Token costs column", "cross": ["How do you implement dynamic cost routing (use cheap model unless quality drops)?", "What is the ROI calculation for switching from GPT-4o to GPT-4o-mini?", "How do you build a multi-tenant cost allocation system for an LLM platform?"]}, {"q": "SITUATION: Debug why your RAG system's answer quality dropped after a data update.", "a": "Systematic debugging using observability tools:\n\nStep 1: Detect the regression\n    # LangSmith/Langfuse: filter traces from BEFORE and AFTER the data update\n    # Compare: user satisfaction scores, answer_relevancy, faithfulness metrics\n\n    from langsmith import Client\n    client = Client()\n\n    before_runs = client.list_runs(\n        project_name='rag-prod',\n        start_time=datetime(2024, 12, 1),\n        end_time=datetime(2024, 12, 10)\n    )\n    after_runs = client.list_runs(\n        project_name='rag-prod',\n        start_time=datetime(2024, 12, 11),\n        end_time=datetime(2024, 12, 20)\n    )\n    # Calculate satisfaction score diff\n\nStep 2: Identify which component regressed\n    # A: Retrieval quality?\n    # Test: same queries, compare retrieved docs before vs after\n    queries = ['refund policy', 'cancellation', 'check-in time']\n    for q in queries:\n        before_docs = before_retriever.invoke(q)\n        after_docs = after_retriever.invoke(q)\n        print(f'Query: {q}')\n        print(f'Before: {[d.metadata[\"source\"] for d in before_docs]}')\n        print(f'After: {[d.metadata[\"source\"] for d in after_docs]}')\n        # Difference? → Retrieval regression\n\n    # B: Document quality?\n    # Check: were correct documents removed in the update?\n    # Check: were incorrect/conflicting documents added?\n    old_chunks = get_all_chunks(old_vectorstore)\n    new_chunks = get_all_chunks(new_vectorstore)\n    removed = set(old_chunks) - set(new_chunks)\n    added = set(new_chunks) - set(old_chunks)\n    print(f'Removed {len(removed)} chunks, added {len(added)}')\n\n    # C: Embedding drift?\n    # If embedding model changed, re-embedded content may be incompatible\n    # with existing vectors → mixed quality\n\nStep 3: Reproduce with a test\n    # Build eval dataset from GOOD queries (before update)\n    # Run against NEW vectorstore\n    results_before = evaluate(chain_v_old, data='golden-set')\n    results_after = evaluate(chain_v_new, data='golden-set')\n    print(f'Score before: {results_before.stats[\"score\"][\"mean\"]:.2f}')\n    print(f'Score after: {results_after.stats[\"score\"][\"mean\"]:.2f}')\n\nStep 4: Fix\n    # Scenario A: Document removed → re-add it\n    # Scenario B: Conflicting docs → remove or reconcile\n    # Scenario C: Re-index all documents with consistent embedding model\n    # Scenario D: Chunk size changed → re-tune retrieval k\n\nStep 5: Validate fix + prevent regression\n    # Add failing examples to eval dataset\n    # Run eval in CI on every data update\n    # Gate data pipeline: 'deploy only if eval score >= 0.80'", "cross": ["How do you version your vector store so you can roll back a bad data update?", "What is embedding drift and how does it affect RAG quality after a model update?", "How do you build a data pipeline that validates document quality before indexing?"]}, {"q": "How do you set up LangSmith for a production FastAPI application?", "a": "    # 1. Install\n    pip install langsmith\n\n    # 2. Environment config (set at app startup, not per-request)\n    import os\n    os.environ['LANGCHAIN_TRACING_V2'] = 'true'\n    os.environ['LANGCHAIN_API_KEY'] = 'ls-...'\n    os.environ['LANGCHAIN_PROJECT'] = 'prod-rag-v2'   # organize by env\n    os.environ['LANGCHAIN_ENDPOINT'] = 'https://api.smith.langchain.com'\n\n    # 3. FastAPI app — all LangChain calls auto-traced\n    from fastapi import FastAPI, Request\n    from langsmith import Client\n    from langchain_openai import ChatOpenAI\n\n    app = FastAPI()\n    client = Client()\n    llm = ChatOpenAI(model='gpt-4o', temperature=0)  # auto-traced\n\n    @app.post('/chat')\n    async def chat(req: ChatRequest):\n        # Add request-level metadata to trace\n        from langchain_core.tracers.context import tracing_v2_enabled\n        with tracing_v2_enabled(\n            project_name=f'prod-{req.tenant_id}',  # per-tenant project\n            tags=[req.tenant_id, 'production'],\n            metadata={\n                'user_id': req.user_id,\n                'session_id': req.session_id,\n                'api_version': 'v2'\n            }\n        ):\n            result = await rag_chain.ainvoke(req.question)\n            run_id = get_run_id()  # capture for feedback\n            return {'answer': result, 'run_id': str(run_id)}\n\n    # 4. Collect user feedback (link to trace)\n    @app.post('/feedback')\n    async def submit_feedback(run_id: str, score: float, comment: str = None):\n        client.create_feedback(\n            run_id=run_id,\n            key='user_satisfaction',\n            score=score,      # 0-1\n            comment=comment,\n            source_info={'frontend': 'thumbs_up_down'}\n        )\n\n    # 5. Custom tracing for non-LangChain code\n    from langsmith import traceable\n\n    @traceable(run_type='retriever', name='vector_search')\n    def search_docs(query: str, tenant_id: str) -> list:\n        return vectorstore.similarity_search(\n            query,\n            filter={'tenant_id': tenant_id}\n        )\n\n    @traceable(run_type='llm', name='answer_generation')\n    def generate_answer(context: str, question: str) -> str:\n        return anthropic_client.messages.create(...).content[0].text", "cross": ["How do you organize LangSmith projects across development, staging, and production environments?", "What is LangSmith's data retention policy and how do you export traces for compliance?", "How do you set up LangSmith alerting to notify on quality drops or high error rates?"]}, {"q": "How do you build a continuous evaluation pipeline with LangSmith?", "a": "Continuous eval = run evaluation on every code change to catch regressions.\n\n    # eval_pipeline.py\n    from langsmith import Client\n    from langsmith.evaluation import evaluate\n    from langchain_openai import ChatOpenAI\n    from langchain.evaluation import load_evaluator\n    import sys\n\n    client = Client()\n    judge_llm = ChatOpenAI(model='gpt-4o', temperature=0)\n\n    # 1. Create golden dataset (do this once, update periodically)\n    DATASET_NAME = 'rag-golden-v1'\n    # In practice: build from real production queries + verified answers\n\n    # 2. Define evaluators\n    qa_evaluator = load_evaluator('qa', llm=judge_llm)\n\n    def faithfulness_evaluator(run, example):\n        # Check: does answer only use retrieved context?\n        prompt = f'\"\"\"Is this answer fully supported by the context? Yes/No\\nContext: {run.inputs[\"context\"]}\\nAnswer: {run.outputs[\"answer\"]}'\n        result = judge_llm.invoke(prompt).content.strip().lower()\n        return {'key': 'faithfulness', 'score': 1.0 if result == 'yes' else 0.0}\n\n    def latency_evaluator(run, example):\n        latency_ms = (run.end_time - run.start_time).total_seconds() * 1000\n        score = 1.0 if latency_ms < 3000 else 0.5 if latency_ms < 5000 else 0.0\n        return {'key': 'latency_ok', 'score': score, 'comment': f'{latency_ms:.0f}ms'}\n\n    # 3. Build the chain to evaluate\n    def run_chain(inputs: dict) -> dict:\n        question = inputs['question']\n        docs = retriever.invoke(question)\n        context = '\\n'.join(d.page_content for d in docs)\n        answer = rag_chain.invoke(question)\n        return {'answer': answer, 'context': context}\n\n    # 4. Run evaluation\n    experiment_prefix = f'rag-{os.environ.get(\"GIT_COMMIT\", \"local\")[:8]}'\n    results = evaluate(\n        run_chain,\n        data=DATASET_NAME,\n        evaluators=[qa_evaluator, faithfulness_evaluator, latency_evaluator],\n        experiment_prefix=experiment_prefix,\n        num_repetitions=1,\n        concurrency_level=5,\n    )\n\n    # 5. Gate deployment on score threshold\n    mean_score = results.to_pandas()['score'].mean()\n    THRESHOLD = 0.75\n    print(f'Mean score: {mean_score:.3f} (threshold: {THRESHOLD})')\n    if mean_score < THRESHOLD:\n        print(f'FAIL: score {mean_score:.3f} below threshold {THRESHOLD}')\n        sys.exit(1)  # fail CI/CD pipeline\n    print('PASS: deploying...')\n\n    # GitHub Actions:\n    # - name: Run LLM evals\n    #   run: python eval_pipeline.py\n    #   env:\n    #     LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}\n    #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}", "cross": ["How do you prevent eval costs from making CI/CD too expensive?", "What is the difference between offline evals and online production monitoring in LangSmith?", "How do you handle flaky evals — LLM-as-judge gives different scores for the same input?"]}, {"q": "How do you implement cost tracking and budget controls with LangSmith?", "a": "    from langsmith import Client\n    from langsmith.schemas import Run\n    import tiktoken\n\n    client = Client()\n    enc = tiktoken.get_encoding('cl100k_base')\n\n    # Model pricing per 1M tokens (update regularly)\n    PRICING = {\n        'gpt-4o': {'input': 5.0, 'output': 15.0},\n        'gpt-4o-mini': {'input': 0.15, 'output': 0.60},\n        'gpt-4o-2024-08-06': {'input': 2.5, 'output': 10.0},\n    }\n\n    def calculate_cost(model: str, input_tokens: int, output_tokens: int) -> float:\n        if model not in PRICING:\n            return 0.0\n        p = PRICING[model]\n        return (input_tokens * p['input'] + output_tokens * p['output']) / 1_000_000\n\n    # Get cost for a project via LangSmith API\n    def get_project_cost(project_name: str, days: int = 7) -> dict:\n        from datetime import datetime, timedelta\n        start = datetime.now() - timedelta(days=days)\n        runs = client.list_runs(\n            project_name=project_name,\n            run_type='llm',\n            start_time=start\n        )\n        total_cost = 0.0\n        total_tokens = 0\n        by_model = {}\n        for run in runs:\n            if run.extra and 'token_usage' in run.extra.get('model_inputs', {}):\n                usage = run.extra.get('token_usage', {})\n                model = run.extra.get('model', {}).get('model_name', 'unknown')\n                in_tok = usage.get('prompt_tokens', 0)\n                out_tok = usage.get('completion_tokens', 0)\n                cost = calculate_cost(model, in_tok, out_tok)\n                total_cost += cost\n                total_tokens += in_tok + out_tok\n                by_model[model] = by_model.get(model, 0) + cost\n        return {'total_cost': total_cost, 'total_tokens': total_tokens, 'by_model': by_model}\n\n    # Budget enforcement middleware (FastAPI)\n    from fastapi import Request, HTTPException\n    import redis\n    r = redis.Redis()\n\n    async def check_budget(request: Request, call_next):\n        tenant_id = request.headers.get('X-Tenant-ID')\n        key = f'cost:{tenant_id}:{datetime.now().date()}'\n        daily_cost = float(r.get(key) or 0)\n        daily_limit = get_tenant_limit(tenant_id)  # $/day\n        if daily_cost >= daily_limit:\n            raise HTTPException(429, f'Daily cost limit ${daily_limit} exceeded')\n        response = await call_next(request)\n        estimated_cost = estimate_request_cost(request)\n        r.incrbyfloat(key, estimated_cost)\n        r.expire(key, 86400)\n        return response", "cross": ["How do you implement real-time cost alerting via Slack when usage spikes?", "What is the relationship between LangSmith token tracking and OpenAI usage dashboard?", "How do you optimize prompt templates to reduce token cost while maintaining quality?"]}, {"q": "What is Langfuse prompt management and how does it work?", "a": "Langfuse prompt management = version, label, and hot-deploy prompts without code releases.\n\n    from langfuse import Langfuse\n    langfuse = Langfuse(public_key='pk-...', secret_key='sk-...')\n\n    # 1. Create prompt version in SDK (or use Langfuse UI)\n    langfuse.create_prompt(\n        name='booking-assistant',\n        prompt=\"\"\"You are Aria, assistant for thesqua.re.\n    Task: Help with bookings, availability, pricing.\n    Rules:\n    - Only answer about thesqua.re services\n    - Respond in {language}\n    - Keep answers under {max_words} words\n    - If unsure: 'Let me connect you with our team'\"\"\",\n        labels=['staging'],  # not production yet\n        config={'model': 'gpt-4o-mini', 'temperature': 0.3},\n        tags=['v2', 'multilingual']\n    )\n\n    # 2. Promote to production after testing\n    # (in Langfuse UI: drag 'staging' label to 'production')\n    # OR via SDK:\n    prompt_v = langfuse.get_prompt('booking-assistant', label='staging')\n    langfuse.create_prompt(\n        name='booking-assistant',\n        prompt=prompt_v.prompt,\n        labels=['production']  # now it's live!\n    )\n\n    # 3. Fetch at runtime (cached for 60s by default)\n    def get_system_prompt(language: str = 'English') -> str:\n        prompt = langfuse.get_prompt(\n            'booking-assistant',\n            label='production',  # always gets latest production version\n            cache_ttl_seconds=60  # refresh from Langfuse every 60s\n        )\n        return prompt.compile(language=language, max_words='100')\n        # Compiles template variables into final prompt string\n\n    # 4. Use with LangChain (links trace to prompt version)\n    from langfuse.callback import CallbackHandler\n    langfuse_handler = CallbackHandler()\n\n    chain = ChatPromptTemplate.from_messages([\n        ('system', get_system_prompt()),\n        ('human', '{question}')\n    ]) | ChatOpenAI() | StrOutputParser()\n\n    result = chain.invoke(\n        {'question': 'What properties are in London?'},\n        config={'callbacks': [langfuse_handler]}\n    )\n    # Trace in Langfuse shows: which prompt version was used + performance\n\n    # 5. Rollback: change 'production' label to previous version\n    # Zero downtime: next request gets old version automatically\n    # No code deployment needed!", "cross": ["What happens to in-flight requests when you update a prompt version?", "How do you validate a new prompt version is safe before promoting to production?", "How do you diff two prompt versions to understand what changed?"]}, {"q": "What are Langfuse datasets and how do you use them for testing?", "a": "    from langfuse import Langfuse\n    from langfuse.client import DatasetItemClient\n\n    langfuse = Langfuse()\n\n    # 1. Create dataset\n    dataset = langfuse.create_dataset(\n        name='booking-rag-eval-v1',\n        description='Evaluation set for booking assistant RAG',\n        metadata={'created_by': 'deepak', 'use_case': 'support'}\n    )\n\n    # 2. Add items (input + expected output pairs)\n    items = [\n        {\n            'input': {'question': 'What is the cancellation policy?'},\n            'expected_output': {'answer': 'Cancel within 48 hours for full refund'}\n        },\n        {\n            'input': {'question': 'How do I check in?'},\n            'expected_output': {'answer': 'Check-in is 3pm, digital key sent 2h before'}\n        }\n    ]\n    for item in items:\n        langfuse.create_dataset_item(\n            dataset_name='booking-rag-eval-v1',\n            input=item['input'],\n            expected_output=item['expected_output'],\n            metadata={'source': 'production_query', 'date': '2024-12'}\n        )\n\n    # 3. Run experiment (evaluate chain on dataset)\n    from datetime import datetime\n    run_name = f'rag-v{VERSION}-{datetime.now().strftime(\"%Y%m%d\")}'\n\n    dataset = langfuse.get_dataset('booking-rag-eval-v1')\n    for item in dataset.items:\n        # Run your chain\n        with item.observe(run_name=run_name) as trace:\n            answer = rag_chain.invoke(item.input['question'])\n\n            # Score against expected output\n            expected = item.expected_output['answer']\n            matches = expected.lower() in answer.lower()\n            trace.score(name='factual_match', value=1.0 if matches else 0.0)\n\n            # LLM quality score\n            quality = judge_llm.invoke(\n                f'Rate answer quality 0-1. Expected: {expected}. Got: {answer}'\n            ).content\n            trace.score(name='quality', value=float(quality))\n\n    # 4. Compare experiments in Langfuse UI\n    # Side-by-side: experiment A vs B\n    # See: average quality, factual_match, latency per run\n    # Identify which specific examples regressed\n\n    # 5. Add production failures to dataset continuously\n    def add_failure_to_dataset(question: str, bad_answer: str, correct: str):\n        langfuse.create_dataset_item(\n            dataset_name='booking-rag-eval-v1',\n            input={'question': question},\n            expected_output={'answer': correct},\n            metadata={'source': 'production_failure', 'bad_answer': bad_answer}\n        )", "cross": ["How do you version datasets and manage breaking changes in evaluation datasets?", "What is the minimum dataset size for statistically reliable evaluation results?", "How do you build a dataset from production traffic without human labeling?"]}, {"q": "How do you trace non-LangChain LLM calls in Langfuse?", "a": "Langfuse SDK-level tracing — framework agnostic, works with any LLM.\n\n    from langfuse import Langfuse\n    import anthropic, time\n\n    langfuse = Langfuse()\n    anthropic_client = anthropic.Anthropic()\n\n    def handle_rag_request(user_id: str, session_id: str, question: str) -> tuple[str, str]:\n        # Root trace for entire request\n        trace = langfuse.trace(\n            name='rag-pipeline',\n            user_id=user_id,\n            session_id=session_id,\n            input={'question': question},\n            tags=['production', 'v2'],\n            metadata={'api_version': '2', 'model': 'claude-3-5-sonnet'}\n        )\n\n        # Retrieval span\n        retrieval_span = trace.span(\n            name='vector-retrieval',\n            input={'query': question, 'top_k': 3}\n        )\n        start = time.time()\n        docs = vectorstore.similarity_search(question, k=3)\n        retrieval_span.end(\n            output={'chunks': len(docs), 'sources': [d.metadata['source'] for d in docs]},\n            level='DEFAULT',\n            status_message='OK'\n        )\n\n        # LLM generation\n        context = '\\n'.join(d.page_content for d in docs)\n        messages = [{'role': 'user', 'content': f'Context: {context}\\nQ: {question}'}]\n\n        gen = trace.generation(\n            name='answer-generation',\n            model='claude-3-5-sonnet-20241022',\n            model_parameters={'temperature': 0, 'max_tokens': 500},\n            input=messages,\n            prompt=langfuse.get_prompt('rag-system-v1')  # links to prompt version\n        )\n\n        response = anthropic_client.messages.create(\n            model='claude-3-5-sonnet-20241022',\n            max_tokens=500,\n            messages=messages\n        )\n        answer = response.content[0].text\n\n        gen.end(\n            output=answer,\n            usage={\n                'input': response.usage.input_tokens,\n                'output': response.usage.output_tokens,\n                'unit': 'TOKENS'\n            }\n        )\n\n        trace.update(output={'answer': answer})\n        return answer, trace.id  # return trace_id for feedback\n\n    # Later: add user feedback\n    def save_feedback(trace_id: str, thumbs_up: bool):\n        langfuse.score(\n            trace_id=trace_id,\n            name='user_satisfaction',\n            value=1.0 if thumbs_up else 0.0,\n            data_type='BOOLEAN'\n        )", "cross": ["How do you handle distributed tracing when requests span multiple microservices?", "What is the Langfuse OpenAI integration and how does it auto-instrument without code changes?", "How do you implement trace sampling to reduce Langfuse costs at high traffic volumes?"]}, {"q": "How do you use LangSmith for prompt versioning and management?", "a": "LangSmith Prompt Hub = versioned prompt storage with push/pull workflow.\n\n    from langsmith import Client\n    from langchain import hub\n\n    client = Client()\n\n    # 1. Push prompt to LangSmith Hub\n    from langchain.prompts import ChatPromptTemplate\n\n    my_rag_prompt = ChatPromptTemplate.from_messages([\n        ('system', \"\"\"You are a helpful assistant for {company_name}.\n    Answer ONLY based on the context below. If not in context, say so.\n    Context: {context}\"\"\"),\n        ('human', '{question}')\n    ])\n\n    # Push to hub (creates version)\n    client.push_prompt(\n        'my-org/rag-assistant',\n        object=my_rag_prompt,\n        description='RAG prompt with strict grounding',\n        tags=['production', 'v2']\n    )\n\n    # 2. Pull specific version (by tag or commit hash)\n    # Latest production\n    prompt = hub.pull('my-org/rag-assistant:latest')\n    # Specific commit (immutable, safe for production)\n    prompt = hub.pull('my-org/rag-assistant:3a8f2c1')\n\n    # 3. Use in chain (automatically linked in traces)\n    chain = prompt | ChatOpenAI() | StrOutputParser()\n    result = chain.invoke({\n        'company_name': 'thesqua.re',\n        'context': retrieved_context,\n        'question': user_question\n    })\n    # In LangSmith trace: click 'Prompt' → see exact version used\n\n    # 4. Programmatic promotion workflow\n    def promote_prompt(name: str, commit_hash: str, to_tag: str = 'production'):\n        # Fetch specific commit\n        prompt = hub.pull(f'{name}:{commit_hash}')\n        # Push with new tag\n        client.push_prompt(name, object=prompt, tags=[to_tag])\n        print(f'Promoted {commit_hash[:8]} to {to_tag}')\n\n    # 5. A/B test different prompt versions\n    import random\n    def get_prompt_for_user(user_id: str):\n        # 20% experiment, 80% production\n        if hash(user_id) % 100 < 20:\n            return hub.pull('my-org/rag-assistant:experiment-v3'), 'exp-v3'\n        return hub.pull('my-org/rag-assistant:production'), 'production'\n\n    # Track which version was served\n    prompt, variant = get_prompt_for_user(user_id)\n    chain = prompt | ChatOpenAI()\n    result = chain.invoke(inputs, config={'metadata': {'prompt_variant': variant}})\n    # In LangSmith: filter by metadata.prompt_variant to compare", "cross": ["How do you prevent unauthorized changes to production prompts?", "What is the workflow for a data scientist to propose a prompt change that an engineer deploys?", "How do you track which prompt version caused a production incident?"]}, {"q": "TRICKY: LangSmith traces show high latency but users report slow responses. They don't match. Why?", "a": "Instrumentation gap analysis — a real production debugging scenario.\n\nReasons traces and perceived latency don't match:\n\n    # Reason 1: Network latency not captured\n    # LangSmith traces: time inside your Python code\n    # User experiences: Python code + network round trips\n\n    # Client sends request → network (50ms)\n    # → FastAPI receives → LangSmith span starts\n    # → LangChain runs (3000ms) → LangSmith span ends\n    # → Response → network (50ms) → client receives\n    # LangSmith shows: 3000ms\n    # User sees: 3100ms (+ network)\n    # If CDN/proxy adds 500ms: user sees 3600ms\n\n    # Reason 2: Streaming vs non-streaming measurement\n    # LangSmith: measures when LAST token generated\n    # User UX metric: Time to First Token (TTFT)\n    # LangSmith shows 5s total — but user saw first word at 1s\n    # → Check streaming is enabled end-to-end!\n\n    # Reason 3: Async context — trace not capturing all work\n    from langchain_core.tracers.context import tracing_v2_enabled\n    # If async tasks spawned OUTSIDE the trace context:\n    async def my_endpoint():\n        with tracing_v2_enabled():  # trace context\n            result = await chain.ainvoke(...)  # traced\n        await post_process()  # NOT traced! Adds to user wait time\n\n    # Fix: extend trace context\n    async def my_endpoint():\n        with tracing_v2_enabled():\n            result = await chain.ainvoke(...)\n            await post_process()  # now inside trace context\n\n    # Reason 4: WSGI server overhead not measured\n    # Gunicorn/uWSGI: request queue time when all workers busy\n    # Add APM (Datadog/New Relic) to capture total request lifecycle\n\n    # Reason 5: Database/Redis calls outside LangChain\n    # Memory retrieval, session loading not auto-traced\n    @traceable(run_type='retriever')\n    def load_session(session_id):\n        return redis.get(session_id)  # now tracked!\n\n    # Debugging approach:\n    # 1. Add real_user_latency to LangSmith metadata\n    import time\n    start = time.time()\n    result = chain.invoke(inputs)\n    real_latency = time.time() - start\n    # Compare real_latency vs LangSmith trace duration → find gap\n\n    # 2. Add OpenTelemetry spans for everything outside LangChain\n    # 3. Check Time to First Token metric separately", "cross": ["What is Time to First Token (TTFT) and how do you measure and optimize it?", "How do you correlate LangSmith traces with Datadog/CloudWatch APM traces?", "What instrumentation gaps exist in LangSmith and how do you fill them?"]}, {"q": "SITUATION: Use LangSmith to compare two RAG configurations systematically.", "a": "A/B experimentation methodology:\n\n    from langsmith.evaluation import evaluate\n    from langsmith import Client\n    from langchain.evaluation import load_evaluator\n\n    client = Client()\n    judge_llm = ChatOpenAI(model='gpt-4o', temperature=0)\n\n    # Define evaluation metrics\n    evaluators = [\n        load_evaluator('qa', llm=judge_llm),              # answer correctness\n        load_evaluator('criteria', criteria='conciseness', llm=judge_llm),\n        load_evaluator('criteria', criteria='relevance', llm=judge_llm),\n    ]\n\n    # Configuration A: chunk_size=500, k=3, no reranker\n    def config_a(inputs: dict) -> dict:\n        retriever_a = build_retriever(chunk_size=500, k=3, reranker=False)\n        chain_a = build_rag_chain(retriever_a)\n        return {'answer': chain_a.invoke(inputs['question'])}\n\n    # Configuration B: chunk_size=300, k=5, with Cohere reranker\n    def config_b(inputs: dict) -> dict:\n        retriever_b = build_retriever(chunk_size=300, k=5, reranker=True)\n        chain_b = build_rag_chain(retriever_b)\n        return {'answer': chain_b.invoke(inputs['question'])}\n\n    # Run both experiments on same dataset\n    results_a = evaluate(\n        config_a,\n        data='rag-eval-dataset-v1',\n        evaluators=evaluators,\n        experiment_prefix='chunk500-k3-norerank',\n        num_repetitions=3,  # run 3 times for reliability\n        concurrency_level=3\n    )\n\n    results_b = evaluate(\n        config_b,\n        data='rag-eval-dataset-v1',\n        evaluators=evaluators,\n        experiment_prefix='chunk300-k5-rerank',\n        num_repetitions=3,\n        concurrency_level=3\n    )\n\n    # Statistical comparison\n    import pandas as pd\n    from scipy.stats import ttest_rel\n\n    df_a = results_a.to_pandas()\n    df_b = results_b.to_pandas()\n\n    for metric in ['correctness', 'conciseness', 'relevance']:\n        scores_a = df_a[f'{metric}/score'].dropna()\n        scores_b = df_b[f'{metric}/score'].dropna()\n        t_stat, p_value = ttest_rel(scores_a, scores_b)\n        winner = 'B' if scores_b.mean() > scores_a.mean() else 'A'\n        significant = 'YES' if p_value < 0.05 else 'NO'\n        print(f'{metric}: A={scores_a.mean():.3f} B={scores_b.mean():.3f} '\n              f'Winner={winner} Significant={significant} p={p_value:.3f}')\n\n    # Cost comparison\n    avg_tokens_a = df_a.get('total_tokens', pd.Series()).mean()\n    avg_tokens_b = df_b.get('total_tokens', pd.Series()).mean()\n    print(f'Avg tokens: A={avg_tokens_a:.0f} B={avg_tokens_b:.0f}')", "cross": ["What is the minimum number of test examples needed for statistical significance?", "How do you handle multi-dimensional tradeoffs (B is better on quality but 20% more expensive)?", "How do you roll out configuration B gradually after A/B test confirms it wins?"]}, {"q": "What is the difference between LangSmith online and offline evaluation?", "a": "Two complementary evaluation strategies:\n\nOFFLINE EVALUATION (Before deployment):\n    # Run on curated dataset BEFORE releasing to users\n    # Tools: LangSmith evaluate(), langsmith datasets\n    # Timing: in CI/CD pipeline, before merge/deploy\n    # Data: golden dataset (human-curated or collected from prod)\n\n    from langsmith.evaluation import evaluate\n    results = evaluate(\n        chain.invoke,\n        data='golden-dataset-v1',\n        evaluators=[qa_evaluator, faithfulness_evaluator]\n    )\n    if results.stats['score']['mean'] < THRESHOLD:\n        raise Exception('Eval failed — blocking deployment')\n\n    Pros: catches regressions before users see them\n    Cons: dataset may not cover all real user queries\n\nONLINE EVALUATION (In production):\n    # Evaluate on REAL production traffic\n    # Tools: LangSmith tracing + feedback collection\n    # Timing: continuously in production\n    # Data: real user queries\n\n    # Method A: Explicit user feedback\n    @app.post('/feedback')\n    async def feedback(run_id: str, rating: int):\n        client.create_feedback(run_id=run_id, key='user_rating', score=rating/5)\n\n    # Method B: Implicit signals\n    # Track: did user follow up with 'that's wrong', ask same question again?\n    @app.post('/message')\n    async def message(req):\n        result = chain.invoke(req.question)\n        run_id = get_run_id()\n        # Track: user re-asks same question = implicit negative signal\n        if is_repeat_question(req.user_id, req.question):\n            client.create_feedback(run_id=prev_run_id, key='repeat_question', score=0)\n        return result\n\n    # Method C: LLM-as-judge on production sample\n    import random\n    @app.post('/chat')\n    async def chat(req):\n        result = chain.invoke(req.question)\n        # Sample 5% of production for auto-eval\n        if random.random() < 0.05:\n            asyncio.create_task(auto_eval_async(run_id, req.question, result))\n        return result\n\nBest practice: BOTH\n    - Offline eval: gates deployments (prevent regression)\n    - Online eval: measures real quality (continuous improvement)\n    - Feed online failures back into offline dataset", "cross": ["How do you implement shadow deployment to evaluate a new model version on live traffic?", "What percentage of production traffic should you sample for online evaluation?", "How do you build an evaluation flywheel — continuously improve dataset from production?"]}]}, "Multi-Agent & Orchestration": {"icon": "🤖", "color": "#ea580c", "questions": [{"q": "What are multi-agent systems? Core patterns.", "a": "Multi-agent = multiple AI agents collaborating to complete tasks too complex for one agent.\n\nWhy single agents fail:\n    - Context window limits (can't hold entire codebase)\n    - Too many tools → confused routing decisions\n    - No specialization (generalist < specialist)\n    - Sequential bottleneck (no parallelism)\n\n5 core patterns:\n\n1. ORCHESTRATOR-WORKER:\n    Supervisor LLM → routes to specialist workers\n    Best: complex tasks needing diverse expertise\n    Example: research + analysis + writing for report\n\n2. PIPELINE (Sequential):\n    Agent1 → Agent2 → Agent3 → Output\n    Best: well-defined multi-step processes\n    Example: Extract → Validate → Enrich → Store\n\n3. DEBATE/ADVERSARIAL:\n    Proposer → Critic → Refiner (multiple rounds)\n    Best: accuracy-critical tasks\n    Example: medical diagnosis, legal review, fact checking\n\n4. MAP-REDUCE:\n    Large input → [Agent1, Agent2, ..., AgentN] parallel → Aggregator\n    Best: process large document sets\n    Example: summarize 100 reports simultaneously\n\n5. PLAN-AND-EXECUTE:\n    Planner: creates step-by-step plan\n    Executor: runs each step\n    Observer: monitors, replans if step fails\n    Best: long unpredictable tasks\n    Example: autonomous research agent\n\nChoosing a pattern:\n    Task well-defined → Pipeline\n    Needs multiple skills → Orchestrator-Worker\n    Accuracy-critical → Debate\n    Large data → Map-Reduce\n    Long/unpredictable → Plan-and-Execute", "cross": ["When is a single well-prompted agent better than a multi-agent system?", "How do you handle circular dependencies between agents (A needs B's output, B needs A's)?", "What is the 'telephone effect' in multi-agent systems and how do you prevent information degradation?"]}, {"q": "How do agents communicate? Message passing vs shared memory.", "a": "    # Message Passing (LangGraph native)\n    from typing import TypedDict, Annotated\n    import operator\n\n    class MultiAgentState(TypedDict):\n        messages: Annotated[list, operator.add]  # shared message bus\n        task: str\n        results: dict\n\n    # Agent writes message, others read\n    def researcher(state):\n        result = search_web(state['task'])\n        return {\n            'messages': [AIMessage(content=result, name='researcher')],\n            'results': {'research': result}\n        }\n\n    def analyst(state):\n        # Reads researcher's output from messages\n        research = next(m.content for m in state['messages'] if m.name == 'researcher')\n        analysis = llm.invoke(f'Analyze: {research}').content\n        return {'messages': [AIMessage(content=analysis, name='analyst')]}\n\n    # Shared Memory (Blackboard pattern)\n    class SharedMemory:\n        def __init__(self):\n            self._store = {}\n            self._lock = threading.RLock()\n\n        def write(self, key: str, value, agent_id: str):\n            with self._lock:\n                self._store[key] = {\n                    'value': value,\n                    'written_by': agent_id,\n                    'timestamp': time.time()\n                }\n\n        def read(self, key: str):\n            with self._lock:\n                return self._store.get(key, {}).get('value')\n\n        def get_all(self) -> dict:\n            with self._lock:\n                return {k: v['value'] for k, v in self._store.items()}\n\n    memory = SharedMemory()\n    # Researcher writes\n    memory.write('research_findings', findings, agent_id='researcher')\n    # Analyst reads\n    findings = memory.read('research_findings')\n\n    # HYBRID (recommended for production)\n    class ProductionState(TypedDict):\n        messages: list         # control flow, small data\n        artifact_ids: dict     # pointers to large data in external store\n\n    def researcher(state):\n        large_report = do_research(state['task'])  # 100KB document\n        artifact_id = artifact_store.save(large_report)  # store externally\n        return {\n            'messages': [AIMessage(f'Research complete. Artifact: {artifact_id}')],\n            'artifact_ids': {'research': artifact_id}  # just the ID in state\n        }\n\nPros/Cons:\n    Message passing: traceable, immutable, fits LangGraph\n    Shared memory: efficient for large data, decoupled agents\n    Hybrid: best of both", "cross": ["How do you implement agent-to-agent authentication to prevent rogue agent injection?", "What is the 'noisy neighbor' problem in shared memory multi-agent systems?", "How do you debug communication bugs in a 5-agent system where output is wrong?"]}, {"q": "What is AutoGen? How does it compare to LangGraph?", "a": "AutoGen (Microsoft) = framework where agents are conversable objects that talk to each other to solve tasks.\n\n    import autogen\n\n    # Core: AssistantAgent + UserProxyAgent\n    assistant = autogen.AssistantAgent(\n        name='DataScientist',\n        llm_config={'model': 'gpt-4o', 'temperature': 0},\n        system_message='You are a senior data scientist. Write Python code to solve tasks.'\n    )\n\n    user_proxy = autogen.UserProxyAgent(\n        name='Executor',\n        human_input_mode='NEVER',      # auto-execute code\n        code_execution_config={'work_dir': './coding'},\n        is_termination_msg=lambda x: x.get('content', '').endswith('TERMINATE')\n    )\n\n    # Two-agent conversation\n    user_proxy.initiate_chat(\n        assistant,\n        message='Load iris.csv and train a random forest classifier. Report accuracy.'\n    )\n    # → Assistant writes code\n    # → UserProxy executes it, shares results\n    # → Assistant refines if needed\n    # → Continues until TERMINATE\n\n    # Group Chat (multi-agent)\n    researcher = autogen.AssistantAgent('Researcher', ...)\n    analyst = autogen.AssistantAgent('Analyst', ...)\n    writer = autogen.AssistantAgent('Writer', ...)\n    critic = autogen.AssistantAgent('Critic', ...)\n\n    group_chat = autogen.GroupChat(\n        agents=[researcher, analyst, writer, critic, user_proxy],\n        messages=[],\n        max_round=20,\n        speaker_selection_method='auto'  # LLM decides who speaks next\n    )\n    manager = autogen.GroupChatManager(\n        groupchat=group_chat,\n        llm_config={'model': 'gpt-4o'}\n    )\n    user_proxy.initiate_chat(manager, message='Write a research report on LLMs')\n\nLangGraph vs AutoGen:\n    Feature       | LangGraph             | AutoGen\n    Paradigm      | Graph/state machine   | Conversation-driven\n    Control flow  | Explicit edges        | LLM-determined\n    Predictability| High                  | Lower\n    Debugging     | Easy (trace graph)    | Harder (conversation log)\n    HITL          | Native interrupt      | human_input_mode\n    Best for      | Structured workflows  | Open-ended coding tasks", "cross": ["What is AutoGen's 'nested chat' feature and when would you use it?", "How does AutoGen handle code execution security — can the agent run arbitrary code?", "What is CrewAI and how does its 'role-playing' paradigm differ from AutoGen?"]}, {"q": "How do you manage cost in multi-agent systems?", "a": "    # Strategy 1: Model tiering based on task complexity\n    def get_model_for_task(task_type: str) -> str:\n        tier_map = {\n            # Complex decisions → expensive model\n            'final_synthesis': 'gpt-4o',\n            'supervisor_routing': 'gpt-4o',\n            # Routine operations → cheap model\n            'search_query_gen': 'gpt-4o-mini',\n            'data_extraction': 'gpt-4o-mini',\n            'classification': 'claude-haiku-4-5-20251001',\n            'summarization': 'claude-haiku-4-5-20251001',\n        }\n        return tier_map.get(task_type, 'gpt-4o-mini')\n\n    # Savings: gpt-4o=$5/1M vs gpt-4o-mini=$0.15/1M → 33x cheaper!\n\n    # Strategy 2: Parallelize instead of sequence\n    # BEFORE: sequential = 3 × 5s = 15s, 3 × $0.01 = $0.03\n    result1 = research_agent.invoke(task)\n    result2 = analysis_agent.invoke(task)\n    result3 = writing_agent.invoke(task)\n\n    # AFTER: parallel = max(5s, 5s, 5s) = 5s, same cost\n    from langgraph.constants import Send\n    def fan_out(state):\n        return [Send('researcher', state), Send('analyst', state)]\n\n    # Strategy 3: Caching\n    import hashlib, json\n    from functools import lru_cache\n\n    cache = {}  # or Redis for production\n\n    def cached_llm_call(messages: list, model: str) -> str:\n        key = hashlib.md5(json.dumps(messages + [model]).encode()).hexdigest()\n        if key in cache:\n            return cache[key]\n        result = llm_call(messages, model)\n        cache[key] = result\n        return result\n\n    # Strategy 4: Reduce context between agents\n    def summarize_for_handoff(full_result: str, max_words: int = 100) -> str:\n        return llm.invoke(\n            f'Summarize in {max_words} words:\\n{full_result}',\n            model='gpt-4o-mini'  # cheap model for summarization\n        ).content\n\n    # Strategy 5: Early stopping\n    def supervisor_route(state):\n        if state.get('confidence', 0) > 0.95:\n            return END  # good enough answer, stop spending\n        if state['iterations'] >= 5:\n            return END  # diminishing returns\n        return 'continue'\n\n    # Strategy 6: Prompt compression (LLMLingua)\n    from llmlingua import PromptCompressor\n    compressor = PromptCompressor()\n    compressed = compressor.compress_prompt(long_prompt, rate=0.5)  # 2x compression\n\n    # Real result: often 70-80% cost reduction with <5% quality drop", "cross": ["How do you measure the quality vs cost tradeoff to find the optimal operating point?", "What is prompt caching (Anthropic/OpenAI feature) and how does it reduce multi-agent costs?", "How do you implement per-user cost limits in a multi-tenant multi-agent system?"]}, {"q": "What is the CrewAI framework?", "a": "CrewAI = multi-agent framework where agents have roles, goals, and backstories like a crew of workers.\n\n    from crewai import Agent, Task, Crew, Process\n    from crewai_tools import SerperDevTool, WebsiteSearchTool\n\n    # Define agents with clear roles\n    researcher = Agent(\n        role='Senior Research Analyst',\n        goal='Find comprehensive information on {topic}',\n        backstory='Expert at synthesizing information from diverse sources.',\n        tools=[SerperDevTool(), WebsiteSearchTool()],\n        llm='gpt-4o',\n        verbose=True,\n        max_iter=3  # prevent loops\n    )\n\n    writer = Agent(\n        role='Technical Content Writer',\n        goal='Create clear, engaging technical articles',\n        backstory='Specialized in making complex topics accessible.',\n        llm='claude-3-5-sonnet-20241022',\n        verbose=True\n    )\n\n    reviewer = Agent(\n        role='Quality Assurance Editor',\n        goal='Ensure accuracy and quality of all content',\n
