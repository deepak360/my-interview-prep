backstory='Meticulous editor with 10 years in technical publishing.',\n        llm='gpt-4o'\n    )\n\n    # Define tasks\n    research_task = Task(\n        description='Research {topic} thoroughly. Find recent developments, key concepts, and examples.',\n        agent=researcher,\n        expected_output='Comprehensive research report with key findings'\n    )\n\n    writing_task = Task(\n        description='Write a 1000-word article based on the research.',\n        agent=writer,\n        expected_output='Well-structured article in markdown',\n        context=[research_task]  # can access research_task output\n    )\n\n    review_task = Task(\n        description='Review and improve the article for accuracy and clarity.',\n        agent=reviewer,\n        expected_output='Polished final article',\n        context=[writing_task]\n    )\n\n    # Assemble crew\n    crew = Crew(\n        agents=[researcher, writer, reviewer],\n        tasks=[research_task, writing_task, review_task],\n        process=Process.sequential,  # or Process.hierarchical\n        verbose=True,\n        memory=True,  # enable crew memory\n        embedder={'provider': 'openai'}\n    )\n\n    result = crew.kickoff(inputs={'topic': 'LangGraph for production agents'})\n    print(result.raw)  # final output\n\nCrewAI vs LangGraph vs AutoGen:\n    CrewAI: high-level, role-based, easy to use, less control\n    LangGraph: low-level, graph-based, full control, more complex\n    AutoGen: conversation-driven, great for coding tasks", "cross": ["What are CrewAI's limitations compared to LangGraph for complex production systems?", "How does CrewAI's hierarchical process work and when should you use it?", "How do you add custom tools to CrewAI agents and share them across the crew?"]}, {"q": "How do you implement tool use safety in multi-agent systems?", "a": "    from typing import Callable, Optional\n    import logging\n    from functools import wraps\n\n    class SafeToolWrapper:\n        def __init__(self, tool, risk_level: str = 'low'):\n            self.tool = tool\n            self.risk_level = risk_level\n            self.call_count = {}\n            self.logger = logging.getLogger('tool_safety')\n\n        def __call__(self, *args, **kwargs):\n            # 1. Rate limiting\n            tool_name = self.tool.name\n            count = self.call_count.get(tool_name, 0)\n            if count > 10:\n                raise ValueError(f'Rate limit exceeded for {tool_name}')\n            self.call_count[tool_name] = count + 1\n\n            # 2. Input validation\n            self._validate_input(*args, **kwargs)\n\n            # 3. Require approval for dangerous operations\n            if self.risk_level == 'high':\n                if not self._get_human_approval(*args, **kwargs):\n                    return 'Action cancelled by human reviewer'\n\n            # 4. Execute with audit log\n            self.logger.info(f'Tool call: {tool_name} | args: {args} | kwargs: {kwargs}')\n            try:\n                result = self.tool(*args, **kwargs)\n                self.logger.info(f'Tool result: {result[:100]}')\n                return result\n            except Exception as e:\n                self.logger.error(f'Tool error: {e}')\n                raise\n\n        def _validate_input(self, *args, **kwargs):\n            # Check for injection attempts\n            all_input = str(args) + str(kwargs)\n            dangerous_patterns = ['rm -rf', 'DROP TABLE', 'DELETE FROM',\n                                  '__import__', 'eval(', 'exec(']\n            for pattern in dangerous_patterns:\n                if pattern in all_input:\n                    raise ValueError(f'Dangerous pattern detected: {pattern}')\n\n        def _get_human_approval(self, *args, **kwargs) -> bool:\n            # In production: send to approval queue, wait for response\n            print(f'APPROVAL NEEDED: {self.tool.name}({args}, {kwargs})')\n            return input('Approve? (y/n): ').lower() == 'y'\n\n    # Wrap tools by risk level\n    safe_search = SafeToolWrapper(search_tool, risk_level='low')\n    safe_email = SafeToolWrapper(email_tool, risk_level='high')  # requires approval\n    safe_db_write = SafeToolWrapper(db_write_tool, risk_level='high')\n\n    # Principle of least privilege\n    # Research agent: only read tools\n    # Writer agent: only file write tools\n    # Finance agent: only specific finance APIs, nothing else\n\n    # Separate environments\n    # Test agent in sandbox environment first\n    # Production: network-isolated container, no internet except whitelisted APIs", "cross": ["How do you implement a 'dry run' mode for agents to preview actions without executing them?", "What is the principle of least privilege for agent tool access and how do you enforce it?", "How do you build an audit trail for agent actions that satisfies compliance requirements?"]}, {"q": "TRICKY: Multi-agent system gives different answers to the same question each time. Root cause?", "a": "Non-determinism sources in multi-agent systems:\n\n    # Source 1: LLM temperature > 0\n    # Fix: Set temperature=0 for routing/decision nodes\n    supervisor_llm = ChatOpenAI(model='gpt-4o', temperature=0)  # deterministic routing\n    writer_llm = ChatOpenAI(model='gpt-4o', temperature=0.7)    # creative output\n\n    # Source 2: Parallel agent execution order\n    # Multiple agents running simultaneously → results aggregated in random order\n    # Fix: Sort results by agent_id before aggregation\n    def aggregate(state):\n        results = sorted(state['results'].items(), key=lambda x: x[0])\n        return {'final': synthesize(results)}\n\n    # Source 3: RAG retrieval non-determinism\n    # Vector search with HNSW is approximate → slightly different results each time\n    # Fix: increase ef_search for reproducibility\n    retriever = vectorstore.as_retriever(\n        search_kwargs={'k': 5, 'fetch_k': 100}  # fetch more, take top 5 = more stable\n    )\n\n    # Source 4: Tool result variability (live data)\n    # Web search returns different results each time\n    # Fix: use deterministic tools where possible, or cache tool results\n    tool_cache = {}\n    def cached_search(query: str) -> str:\n        if query not in tool_cache:\n            tool_cache[query] = real_search(query)\n        return tool_cache[query]\n\n    # Source 5: Race conditions in shared state\n    # Two agents writing to same state key simultaneously\n    # Fix: use proper LangGraph state reducers\n    class State(TypedDict):\n        # DON'T: overwrite each other\n        result: str  # agent A and B both write 'result'\n        # DO: collect both results\n        results: Annotated[dict, merge_dicts]  # custom reducer merges\n\n    # Source 6: Agent-to-agent information degradation\n    # Each agent summarizes → information lost → downstream gets different context\n    # Fix: pass full artifacts, not summaries, between agents\n    # Use artifact store with IDs instead of inline content\n\n    # Debugging approach:\n    # Run same inputs 5 times with LangSmith tracing\n    # Compare traces: where does divergence start?\n    # Which node's output changes? → That's your non-determinism source\n\n    # For testing:\n    def test_determinism():\n        results = [app.invoke(inputs) for _ in range(5)]\n        answers = [r['final_answer'] for r in results]\n        # All answers should be semantically equivalent\n        for a in answers[1:]:\n            score = evaluate_similarity(answers[0], a)\n            assert score > 0.9, f'Non-deterministic: {answers[0]} vs {a}'", "cross": ["What is semantic determinism vs exact determinism and which should you target for LLM apps?", "How do you set up reproducible experiments for multi-agent systems?", "What role does seed setting play in LLM determinism and which APIs support it?"]}, {"q": "What is the orchestrator pattern vs the reactive pattern for agent design?", "a": "Two fundamental agent design philosophies:\n\nORCHESTRATOR PATTERN (Top-down, planned):\n    # Central coordinator creates plan, delegates to workers\n    class Orchestrator:\n        def run(self, task: str):\n            # Step 1: Generate explicit plan\n            plan = self.planner.plan(task)\n            # ['Step 1: Research X', 'Step 2: Analyze Y', 'Step 3: Write Z']\n\n            results = {}\n            for step in plan:\n                # Step 2: Execute each step with right worker\n                worker = self.route_to_worker(step)\n                results[step] = worker.execute(step, context=results)\n\n            # Step 3: Synthesize\n            return self.synthesizer.combine(results)\n\n    Pros:\n    + Predictable execution path\n    + Easy to debug (see full plan before execution)\n    + Better for long tasks (plan → multiple sessions)\n    + Checkpointing at each step\n\n    Cons:\n    - Planning can fail on complex/ambiguous tasks\n    - Rigid: can't adapt if plan is wrong\n    - Planning LLM call adds latency\n\nREACTIVE PATTERN (Bottom-up, emergent):\n    # Agent reacts to observations, no upfront plan\n    # ReAct loop: observe → think → act → observe → think → act → ...\n    while True:\n        observation = get_current_state()\n        thought = llm.think(observation, tools_available)\n        if thought.is_final_answer:\n            break\n        action = execute(thought.next_action)\n        # Automatically adapts based on what it observes\n\n    Pros:\n    + Handles unexpected situations gracefully\n    + No planning overhead\n    + More flexible\n\n    Cons:\n    - Less predictable\n    - Can loop or go off track\n    - Harder to debug\n    - May take suboptimal paths\n\nHybrid (best for production):\n    # High-level plan (orchestrator) + reactive execution per step\n    plan = planner.create_plan(task)  # ['research', 'analyze', 'write']\n    for step in plan:\n        result = reactive_agent.run(step)  # ReAct loop within each step\n        if not result.success:\n            plan = planner.replan(task, completed_steps, result.error)  # adapt plan", "cross": ["What is Plan-and-Execute in LangChain and how does it implement the orchestrator pattern?", "How do you combine both patterns to get the benefits of both?", "What is the 'planner hallucination' problem and how does it affect orchestrator agents?"]}, {"q": "SITUATION: Build an autonomous customer support agent with escalation to humans.", "a": "    from langgraph.graph import StateGraph, END\n    from langgraph.checkpoint.postgres import PostgresSaver\n    from typing import TypedDict, Optional\n\n    class SupportState(TypedDict):\n        messages: list\n        customer_id: str\n        issue_type: Optional[str]\n        sentiment_score: float\n        resolution_attempted: bool\n        escalate_to_human: bool\n        resolution: Optional[str]\n        case_id: str\n\n    # Node 1: Classify issue and check sentiment\n    def classify_and_analyze(state: SupportState):\n        last_msg = state['messages'][-1].content\n        classification = llm.invoke(\n            f'Classify issue type and sentiment (0-1) for: {last_msg}\\n'\n            f'Return JSON: {{\"type\": str, \"sentiment\": float}}',\n            model='gpt-4o-mini'  # cheap for classification\n        )\n        data = parse_json(classification.content)\n        return {\n            'issue_type': data['type'],\n            'sentiment_score': data['sentiment']\n        }\n\n    # Node 2: AI attempts resolution\n    def attempt_resolution(state: SupportState):\n        if state['issue_type'] == 'billing' and state.get('resolution_attempted'):\n            # Second attempt failed → escalate\n            return {'escalate_to_human': True}\n\n        # Try to resolve with knowledge base\n        docs = knowledge_base.search(state['messages'][-1].content, k=3)\n        if not docs:\n            return {'escalate_to_human': True}\n\n        response = llm.invoke(\n            f'Answer this support question using ONLY this knowledge base:\\n'\n            f'{format_docs(docs)}\\n\\nQuestion: {state[\"messages\"][-1].content}\\n'\n            f'If you cannot fully answer, say NEEDS_ESCALATION'\n        ).content\n\n        if 'NEEDS_ESCALATION' in response:\n            return {'escalate_to_human': True}\n\n        return {\n            'messages': [AIMessage(response)],\n            'resolution': response,\n            'resolution_attempted': True,\n            'escalate_to_human': False\n        }\n\n    # Node 3: Human escalation\n    def escalate_node(state: SupportState):\n        # Create ticket in support system\n        ticket_id = create_support_ticket(\n            customer_id=state['customer_id'],\n            conversation=state['messages'],\n            issue_type=state['issue_type'],\n            sentiment=state['sentiment_score']\n        )\n        notify_human_agent(ticket_id, priority='HIGH' if state['sentiment_score'] < 0.3 else 'NORMAL')\n        return {\n            'messages': [AIMessage(\n                f'I\\'m connecting you with a specialist now (Case #{ticket_id}). '\n                f'Expected wait: 5-10 minutes.'\n            )]\n        }\n\n    # Routing logic\n    def route_after_classify(state):\n        if state['sentiment_score'] < 0.2:\n            return 'escalate'  # very unhappy → immediate human\n        if state['issue_type'] in ['legal', 'fraud', 'major_complaint']:\n            return 'escalate'  # always human for these\n        return 'attempt_resolution'\n\n    def route_after_attempt(state):\n        if state.get('escalate_to_human'):\n            return 'escalate'\n        return END\n\n    # Build graph\n    graph = StateGraph(SupportState)\n    graph.add_node('classify', classify_and_analyze)\n    graph.add_node('attempt_resolution', attempt_resolution)\n    graph.add_node('escalate', escalate_node)\n    graph.set_entry_point('classify')\n    graph.add_conditional_edges('classify', route_after_classify)\n    graph.add_conditional_edges('attempt_resolution', route_after_attempt)\n    graph.add_edge('escalate', END)\n\n    app = graph.compile(\n        checkpointer=PostgresSaver.from_conn_string(DB_URL),\n        interrupt_before=['escalate']  # optional: human reviews before escalating\n    )", "cross": ["How do you handle multi-turn support conversations where the issue evolves across messages?", "What SLA metrics would you track for this system and how do you ensure they're met?", "How do you prevent the AI from giving incorrect resolution that angers the customer before escalating?"]}, {"q": "What is the difference between centralized and decentralized multi-agent coordination?", "a": "Two fundamental architectures for managing multiple agents:\n\nCENTRALIZED (Orchestrator-Worker):\n    # One LLM/agent makes all decisions, workers just execute\n    #\n    #     Orchestrator\n    #     /    |    \\\n    #  Worker1 W2  W3\n    #\n\n    def orchestrator(task, workers):\n        plan = llm.plan(task)  # central planning\n        for step in plan:\n            worker = select_worker(step, workers)\n            result = worker.execute(step)\n            # Orchestrator sees ALL results, can adapt plan\n        return synthesize(all_results)\n\n    Pros:\n    + Full visibility and control\n    + Consistent decision making\n    + Easy to debug (one decision point)\n    + Prevents conflicting actions\n\n    Cons:\n    - Single point of failure (orchestrator crashes → all stops)\n    - Bottleneck (all decisions through one LLM)\n    - Orchestrator can become overloaded with context\n\nDECENTRALIZED (Peer-to-peer / Emergent):\n    # Agents communicate directly, no central authority\n    #\n    #   Agent1 ←→ Agent2\n    #     ↕              ↕\n    #   Agent3 ←→ Agent4\n    #\n\n    class Agent:\n        def run(self, task, neighbors):\n            partial_result = self.process(task)\n            # Share with neighbors, integrate their results\n            for neighbor in neighbors:\n                their_result = neighbor.get_result()\n                partial_result = self.integrate(partial_result, their_result)\n            return partial_result\n\n    Pros:\n    + No single point of failure\n    + Scales better (no bottleneck)\n    + Agents specialize and self-organize\n\n    Cons:\n    - Harder to debug (emergent behavior)\n    - Risk of conflicting decisions\n    - Complex coordination protocols needed\n    - Unpredictable behavior\n\nHybrid (RECOMMENDED for production):\n    # Hierarchical: orchestrator manages sub-orchestrators\n    # Each sub-orchestrator handles a domain\n    Orchestrator → [ResearchCoordinator, AnalysisCoordinator, OutputCoordinator]\n    ResearchCoordinator → [WebAgent, DBAgent, PaperAgent]", "cross": ["What is the gossip protocol in distributed systems and could it apply to multi-agent coordination?", "How do you handle split-brain scenarios in decentralized agent systems?", "What is emergent behavior in multi-agent systems and when is it desirable?"]}, {"q": "How do you implement tool safety and authorization in multi-agent systems?", "a": "    from typing import Callable, Optional\n    from functools import wraps\n    from pydantic import BaseModel\n    import logging\n\n    # Tool authorization levels\n    TOOL_RISK_LEVELS = {\n        'web_search': 'low',\n        'read_database': 'medium',\n        'write_database': 'high',\n        'send_email': 'high',\n        'execute_code': 'critical',\n        'delete_files': 'critical',\n    }\n\n    AGENT_PERMISSIONS = {\n        'researcher': ['web_search', 'read_database'],\n        'analyst': ['web_search', 'read_database'],\n        'writer': ['web_search'],\n        'admin': list(TOOL_RISK_LEVELS.keys())  # all tools\n    }\n\n    def authorize_tool_call(agent_role: str, tool_name: str) -> bool:\n        allowed = AGENT_PERMISSIONS.get(agent_role, [])\n        return tool_name in allowed\n\n    def safe_tool(require_approval_for: list = [], max_calls: int = 10):\n        def decorator(tool_fn):\n            call_counts = {}\n            @wraps(tool_fn)\n            def wrapper(agent_role: str, *args, **kwargs):\n                tool_name = tool_fn.__name__\n\n                # 1. Authorization check\n                if not authorize_tool_call(agent_role, tool_name):\n                    raise PermissionError(\n                        f'Agent {agent_role} not authorized for {tool_name}'\n                    )\n\n                # 2. Rate limiting\n                calls = call_counts.get((agent_role, tool_name), 0)\n                if calls >= max_calls:\n                    raise ValueError(f'Rate limit: {tool_name} called {calls} times')\n                call_counts[(agent_role, tool_name)] = calls + 1\n\n                # 3. Human approval for high-risk\n                if tool_name in require_approval_for:\n                    action_desc = f'{tool_name}({args}, {kwargs})'\n                    if not request_human_approval(action_desc):\n                        return 'Action cancelled by human reviewer'\n\n                # 4. Input sanitization\n                all_input = str(args) + str(kwargs)\n                dangerous = ['rm -rf', 'DROP TABLE', '__import__', 'eval(']\n                for pattern in dangerous:\n                    if pattern in all_input:\n                        raise ValueError(f'Blocked: {pattern}')\n\n                # 5. Audit log\n                logger.info(f'TOOL_CALL: agent={agent_role} tool={tool_name} args={args}')\n\n                try:\n                    result = tool_fn(*args, **kwargs)\n                    logger.info(f'TOOL_SUCCESS: {tool_name} result_len={len(str(result))}')\n                    return result\n                except Exception as e:\n                    logger.error(f'TOOL_ERROR: {tool_name} error={e}')\n                    raise\n            return wrapper\n        return decorator\n\n    @safe_tool(require_approval_for=['send_email', 'write_database'], max_calls=20)\n    def write_to_database(query: str, params: dict) -> dict:\n        return db.execute(query, params)", "cross": ["What is the confused deputy problem and how does it apply to tool authorization?", "How do you implement tool call replay protection (prevent double-execution on retry)?", "What compliance logging is required for agent tool calls in regulated industries?"]}, {"q": "What is a Mixture of Agents (MoA) architecture?", "a": "MoA = ensemble of LLMs where multiple agents generate responses, an aggregator synthesizes the best answer. Exploits diversity between models.\n\nPaper: 'Mixture-of-Agents Enhances Large Language Model Capabilities' (Together AI, 2024)\n\nArchitecture:\n    from langchain_openai import ChatOpenAI\n    from langchain_anthropic import ChatAnthropic\n    from langchain_google_genai import ChatGoogleGenerativeAI\n    from langchain.prompts import ChatPromptTemplate\n    import asyncio\n\n    # Layer 1: Proposers (diverse models generate initial answers)\n    proposers = [\n        ChatOpenAI(model='gpt-4o-mini', temperature=0.7),\n        ChatAnthropic(model='claude-haiku-4-5-20251001', temperature=0.7),\n        ChatOpenAI(model='gpt-4o-mini', temperature=0.3),  # same model, diff temp\n    ]\n\n    # Generate proposals in parallel\n    async def get_proposals(question: str) -> list[str]:\n        tasks = [\n            model.ainvoke(question)\n            for model in proposers\n        ]\n        responses = await asyncio.gather(*tasks)\n        return [r.content for r in responses]\n\n    # Layer 2: Aggregator (synthesizes best answer)\n    aggregator = ChatOpenAI(model='gpt-4o', temperature=0)\n    agg_prompt = ChatPromptTemplate.from_template(\"\"\"\n    You are given {n} responses to the same question from different AI models.\n    Synthesize the BEST response by:\n    1. Taking the most accurate/complete points from each\n    2. Resolving any contradictions (prefer consensus)\n    3. Producing a coherent, comprehensive answer\n\n    Question: {question}\n\n    Responses:\n    {responses}\n\n    Synthesized answer:\n    \"\"\")\n\n    async def mixture_of_agents(question: str) -> str:\n        proposals = await get_proposals(question)\n        formatted = '\\n\\n'.join(f'Model {i+1}: {p}' for i, p in enumerate(proposals))\n        response = await (agg_prompt | aggregator).ainvoke({\n            'n': len(proposals),\n            'question': question,\n            'responses': formatted\n        })\n        return response.content\n\nWhen MoA wins:\n    - Complex reasoning where models have different strengths\n    - When single model hallucination risk is high\n    - Accuracy-critical tasks (medical, legal, financial)\n    - Research/analysis tasks\n\nCost: 4x LLM calls → 4x cost. Reserve for high-value queries.\n    # Route: cheap model for simple → MoA for complex\n    def smart_route(question: str) -> str:\n        complexity = judge_complexity(question)\n        if complexity > 0.8:\n            return asyncio.run(mixture_of_agents(question))\n        return cheap_model.invoke(question).content", "cross": ["What is the theoretical basis for why diverse models outperform a single model?", "How do you measure the quality improvement from MoA vs cost increase?", "What is model collapse in MoA when all proposers use the same underlying model?"]}, {"q": "How do you implement memory sharing between agents in a multi-agent system?", "a": "    from typing import Any, Optional\n    import redis\n    import json\n    from datetime import datetime\n    import threading\n    from langchain_openai import OpenAIEmbeddings\n    from langchain_community.vectorstores import FAISS\n\n    class SharedAgentMemory:\n        \"\"\"Thread-safe shared memory for multi-agent systems.\"\"\"\n\n        def __init__(self, redis_url: str):\n            self.redis = redis.from_url(redis_url)\n            self.embeddings = OpenAIEmbeddings()\n            self._local_cache = {}  # in-memory cache\n            self._lock = threading.RLock()\n\n        # Key-value store (fast, structured)\n        def store_fact(self, key: str, value: Any, ttl: int = 3600,\n                       written_by: str = 'unknown'):\n            with self._lock:\n                record = {\n                    'value': value,\n                    'written_by': written_by,\n                    'timestamp': datetime.now().isoformat()\n                }\n                self.redis.setex(key, ttl, json.dumps(record))\n\n        def get_fact(self, key: str) -> Optional[Any]:\n            data = self.redis.get(key)\n            if data:\n                return json.loads(data)['value']\n            return None\n\n        # Semantic memory (retrieve relevant past knowledge)\n        def store_knowledge(self, agent_id: str, content: str, metadata: dict = {}):\n            # Embed and store in vector DB\n            self.semantic_db.add_texts(\n                [content],\n                metadatas=[{'agent_id': agent_id, **metadata}]\n            )\n\n        def recall_relevant(self, query: str, k: int = 3) -> list[str]:\n            docs = self.semantic_db.similarity_search(query, k=k)\n            return [d.page_content for d in docs]\n\n        # Message passing (event bus)\n        def publish(self, channel: str, message: dict, sender: str):\n            self.redis.publish(channel, json.dumps({\n                'from': sender,\n                'content': message,\n                'time': datetime.now().isoformat()\n            }))\n\n        def subscribe(self, channel: str):\n            pubsub = self.redis.pubsub()\n            pubsub.subscribe(channel)\n            return pubsub\n\n    # Usage across agents\n    memory = SharedAgentMemory(REDIS_URL)\n\n    def researcher_agent(task: str, memory: SharedAgentMemory) -> str:\n        # Check if already researched\n        cached = memory.get_fact(f'research:{task[:50]}')\n        if cached:\n            return cached\n        # Do research\n        result = do_web_research(task)\n        # Store for other agents\n        memory.store_fact(f'research:{task[:50]}', result, written_by='researcher')\n        memory.store_knowledge('researcher', result, {'task': task})\n        memory.publish('research_complete', {'task': task, 'result': result[:200]}, 'researcher')\n        return result\n\n    def analyst_agent(task: str, memory: SharedAgentMemory) -> str:\n        # Retrieve researcher's findings\n        research = memory.get_fact(f'research:{task[:50]}')\n        relevant = memory.recall_relevant(f'analysis for {task}', k=3)\n        context = research + '\\n\\n' + '\\n'.join(relevant)\n        return analyze(context)", "cross": ["How do you handle memory conflicts when two agents write different values for the same key?", "What is the episodic vs semantic memory distinction and how does it apply to multi-agent systems?", "How do you implement memory access control — some agents shouldn't read other agents' memories?"]}, {"q": "TRICKY: How do you prevent agent 'sycophancy' in multi-agent debate systems?", "a": "Sycophancy = agent abandons correct answer under pressure from another agent. Critical failure mode.\n\nThe problem:\n    # Agent A: 'The answer is 42'\n    # Agent B: 'I think it might be 43?'\n    # Agent A: 'You're right, 43 makes more sense'\n    # (Agent A was correct but capitulated!)\n\nRoot cause:\n    # LLMs trained with RLHF to be agreeable\n    # Agreement was often rewarded during training\n    # Model sees disagreement as conflict to resolve → capitulate\n\nDetection:\n    def detect_capitulation(messages: list) -> list:\n        capitulation_phrases = [\n            'you make a good point', \"you're right\", 'i agree',\n            'on reflection', 'i reconsider', 'actually, you may be correct'\n        ]\n        suspicious = []\n        for i, msg in enumerate(messages[1:], 1):\n            if any(p in msg.content.lower() for p in capitulation_phrases):\n                prev = messages[i-1]\n                suspicious.append(f'Possible capitulation at message {i}')\n        return suspicious\n\nFix 1: Confidence-based routing\n    # Only accept opinion change with supporting evidence\n    debate_system_prompt = \"\"\"\n    CRITICAL RULES FOR DEBATE:\n    1. State your answer with confidence score (0-1)\n    2. NEVER change your answer just because another agent disagrees\n    3. Only update if they provide NEW EVIDENCE you didn't consider\n    4. If they provide evidence: 'I update because: [specific reason]'\n    5. If they just assert: 'I maintain my answer because: [your reasoning]'\n    \"\"\"\n\nFix 2: Secret ballot aggregation\n    # Agents answer independently BEFORE seeing each other's answers\n    async def independent_debate(question: str) -> str:\n        # Phase 1: Independent answers (no visibility into others)\n        answers = await asyncio.gather(*[agent.answer(question) for agent in agents])\n\n        # Phase 2: Each reviews others' answers\n        updated = await asyncio.gather(*[\n            agent.review(question, answers) for agent in agents\n        ])\n\n        # Phase 3: Weighted majority vote\n        return weighted_vote(updated)\n\nFix 3: Critic role\n    # Dedicated critic agent that explicitly challenges both sides\n    critic_prompt = \"\"\"\n    You are an adversarial critic. Your job is to find flaws in BOTH arguments.\n    Be equally harsh to all positions. Do NOT favor consensus.\n    Identify: logical fallacies, missing evidence, unstated assumptions.\n    \"\"\"\n\nFix 4: Confidence calibration\n    # Track when agents change positions and in which direction\n    # High-confidence agents should change less often\n    # Monitor: position change rate per agent\n    # Alert if agent changes > 30% of the time", "cross": ["What is the difference between sycophancy and genuine Bayesian updating in agent debate?", "How do you implement adversarial validation — deliberately try to break the consensus?", "What research has been done on reducing sycophancy in LLMs via fine-tuning?"]}, {"q": "SITUATION: Design a multi-agent document processing pipeline for 10,000 PDFs daily.", "a": "    from langgraph.graph import StateGraph, END\n    from langgraph.constants import Send\n    from typing import TypedDict, Annotated\n    import operator\n    from celery import Celery\n\n    # HIGH-THROUGHPUT DESIGN\n    # 10,000 PDFs/day = ~7 PDFs/minute = need async pipeline\n\n    # Architecture:\n    # Queue (Kafka/Celery) → Intake Agent → [Classifier, Extractor, Validator] parallel\n    # → Quality Check → Storage → Notification\n\n    class ProcessingState(TypedDict):\n        pdf_path: str\n        pdf_id: str\n        tenant_id: str\n        raw_text: str\n        doc_type: str                          # invoice, contract, report, etc.\n        extracted_data: dict\n        quality_issues: Annotated[list, operator.add]\n        processing_status: str\n        chunks: list\n\n    # Step 1: Async intake via Celery queue\n    celery_app = Celery('doc_processor', broker=REDIS_URL)\n\n    @celery_app.task(bind=True, max_retries=3, queue='high_priority')\n    def process_pdf_task(self, pdf_id: str, pdf_path: str, tenant_id: str):\n        try:\n            result = pipeline.invoke({\n                'pdf_id': pdf_id, 'pdf_path': pdf_path, 'tenant_id': tenant_id\n            })\n            return result\n        except Exception as exc:\n            raise self.retry(exc=exc, countdown=2 ** self.request.retries)\n\n    # Step 2: Parallel extraction\n    def fan_out_extractors(state: ProcessingState):\n        return [\n            Send('classify_doc', state),    # what type of document?\n            Send('extract_text', state),    # OCR / text extraction\n            Send('extract_metadata', state)  # author, date, etc.\n        ]\n\n    # Step 3: Parallel analysis (after extraction)\n    def extract_content_node(state):\n        # Use cheap model for bulk extraction\n        if state['doc_type'] == 'invoice':\n            data = extract_invoice_data(state['raw_text'],\n                                        model='gpt-4o-mini')  # cheap!\n        elif state['doc_type'] == 'contract':\n            data = extract_contract_data(state['raw_text'],\n                                         model='gpt-4o')  # quality needed\n        return {'extracted_data': data}\n\n    # Step 4: Quality validator\n    def quality_check(state):\n        issues = []\n        required_fields = REQUIRED_FIELDS.get(state['doc_type'], [])\n        for field in required_fields:\n            if not state['extracted_data'].get(field):\n                issues.append(f'Missing: {field}')\n        return {'quality_issues': issues}\n\n    # Build graph\n    graph = StateGraph(ProcessingState)\n    graph.add_node('extract_text', extract_text_node)\n    graph.add_node('classify_doc', classify_doc_node)\n    graph.add_node('extract_metadata', extract_metadata_node)\n    graph.add_node('extract_content', extract_content_node)\n    graph.add_node('quality_check', quality_check)\n    graph.add_node('store_results', store_to_db)\n\n    graph.set_entry_point('start')\n    graph.add_conditional_edges('start', fan_out_extractors)\n    for n in ['extract_text', 'classify_doc', 'extract_metadata']:\n        graph.add_edge(n, 'extract_content')\n    graph.add_edge('extract_content', 'quality_check')\n    graph.add_edge('quality_check', 'store_results')\n    graph.add_edge('store_results', END)\n\n    # Scale: 50 Celery workers × 2 PDFs each = 100 concurrent\n    # Total throughput: ~6000 PDFs/hour >> 10,000/day target", "cross": ["How do you handle PDFs that fail OCR — what's your fallback strategy?", "What monitoring would you add to track processing throughput and SLA compliance?", "How do you implement priority queuing — VIP customer docs processed faster?"]}]}, "Fine-Tuning": {"icon": "⚙️", "color": "#ca8a04", "questions": [{"q": "What is fine-tuning? Decision framework for when to use it.", "a": "Fine-tuning = continue training a pretrained model on your data to update its weights for specific tasks/behaviors.\n\nDecision framework (in order):\n\nStep 1: Try prompting first (always)\n    # Zero-shot → few-shot → CoT → system prompt engineering\n    # Solves 70% of use cases. Cost: $0. Time: hours.\n    # Move on if: quality still wrong, format inconsistent, too slow\n\nStep 2: Add RAG (if knowledge gap)\n    # Model lacks specific knowledge (your docs, recent data)\n    # Need citations, knowledge changes frequently\n    # Cost: vector DB + embedding. Time: days.\n\nStep 3: Fine-tune (if behavior/style gap)\n    # Fine-tuning IS for:\n    # - Specific OUTPUT FORMAT (always return JSON schema X)\n    # - Specific TONE/PERSONA consistently\n    # - Domain jargon (medical, legal, your company)\n    # - Speed: smaller fine-tuned model >> large base model\n    # - Privacy: can't send data to external API\n    # - Classification tasks\n\n    # Fine-tuning is NOT for:\n    # - Adding factual knowledge (use RAG — fine-tuning doesn't reliably inject facts)\n    # - One-off tasks (too expensive)\n    # - Architecture changes\n\nStep 4: RAG + Fine-tuning combined\n    # RAFT: train model to use retrieved context more reliably\n    # Fine-tune for behavior, RAG for knowledge\n\nCost reality check:\n    Prompt engineering: $0, hours\n    RAG: $10-50/month, days to deploy\n    Fine-tune GPT-4o-mini: ~$100-500, 1-2 days\n    Fine-tune Llama locally: $50-200 GPU hours\n    Full SFT of 7B model: $1000+ GPU hours\n\nMinimum data requirements:\n    Behavioral change: 100-500 examples\n    Style change: 50-200 examples\n    Domain adaptation: 500-1000 examples\n    Reliable performance: 1000+ examples\n    RLHF/DPO: 1000+ preference pairs", "cross": ["What is catastrophic forgetting and how do you prevent it during fine-tuning?", "How do you estimate ROI before committing to a fine-tuning project?", "What is the difference between full fine-tuning, LoRA, and prompt tuning?"]}, {"q": "Explain LoRA and QLoRA — how do they work?", "a": "LoRA (Low-Rank Adaptation) = instead of updating all model weights, add small trainable matrices that approximate weight changes.\n\nThe math:\n    # Original layer: W ∈ R^(d×d) — frozen\n    # LoRA: instead of updating W directly\n    # W_new = W + ΔW\n    # ΔW = B × A  where A ∈ R^(r×d), B ∈ R^(d×r), rank r << d\n\n    # Example: W is 4096×4096 = 16.7M params\n    # LoRA r=16: A is 16×4096=65K, B is 4096×16=65K → 131K total!\n    # That's 99.2% fewer trainable parameters!\n\n    from peft import LoraConfig, get_peft_model, TaskType\n    from transformers import AutoModelForCausalLM\n\n    model = AutoModelForCausalLM.from_pretrained('meta-llama/Llama-3-8B-Instruct')\n\n    config = LoraConfig(\n        task_type=TaskType.CAUSAL_LM,\n        r=16,              # rank — higher = more params, better quality\n        lora_alpha=32,     # scaling = lora_alpha/r. Usually 2×r\n        lora_dropout=0.1,\n        target_modules=['q_proj', 'k_proj', 'v_proj', 'o_proj',\n                        'gate_proj', 'up_proj', 'down_proj']\n    )\n\n    peft_model = get_peft_model(model, config)\n    peft_model.print_trainable_parameters()\n    # trainable: 8,388,608 (0.62%) | all: 1,343,488,000\n    # Only 0.62% of params are updated!\n\nQLoRA (Quantized LoRA) = LoRA on top of 4-bit quantized model:\n    from transformers import BitsAndBytesConfig\n    import torch\n\n    bnb_config = BitsAndBytesConfig(\n        load_in_4bit=True,\n        bnb_4bit_quant_type='nf4',          # NormalFloat4 — optimal for weights\n        bnb_4bit_compute_dtype=torch.bfloat16,  # compute in bf16 for precision\n        bnb_4bit_use_double_quant=True      # quantize the quantization constants too\n    )\n\n    model = AutoModelForCausalLM.from_pretrained(\n        'meta-llama/Llama-3-8B-Instruct',\n        quantization_config=bnb_config,\n        device_map='auto'\n    )\n    # Now apply LoRA on top\n    peft_model = get_peft_model(model, config)\n\nHardware requirements:\n    Full fine-tune Llama-3-8B:  80GB GPU RAM\n    LoRA (r=16):                16GB GPU RAM\n    QLoRA (4-bit + LoRA):       6GB GPU RAM  ← runs on RTX 3090!\n    QLoRA 70B model:            48GB GPU RAM ← 2×RTX 3090\n\nMerging LoRA weights for deployment:\n    from peft import PeftModel\n    base = AutoModelForCausalLM.from_pretrained('meta-llama/Llama-3-8B-Instruct')\n    model = PeftModel.from_pretrained(base, './lora-adapter')\n    merged = model.merge_and_unload()  # bake LoRA into base weights\n    merged.save_pretrained('./merged-model')  # deploy as regular model", "cross": ["How do you choose the optimal rank r for LoRA?", "What is DoRA (Weight-Decomposed LoRA) and how does it improve on LoRA?", "What layers should you apply LoRA to and why are attention layers typically chosen?"]}, {"q": "Walk through a complete QLoRA fine-tuning pipeline.", "a": "    # Install\n    # pip install transformers peft accelerate bitsandbytes trl datasets\n\n    from datasets import Dataset\n    from transformers import (\n        AutoTokenizer, AutoModelForCausalLM,\n        TrainingArguments, BitsAndBytesConfig\n    )\n    from peft import LoraConfig\n    from trl import SFTTrainer\n    import torch\n\n    # 1. Prepare dataset\n    data = [\n        {'instruction': 'Extract property details from email',\n         'input': 'Need 2-bed in London from Jan 15-Feb 1, budget £4000',\n         'output': '{\"city\": \"London\", \"bedrooms\": 2, \"check_in\": \"2025-01-15\", \"check_out\": \"2025-02-01\", \"budget\": 4000}'}\n        # ... 500+ examples\n    ]\n\n    def format_alpaca(example):\n        return f\"\"\"### Instruction: {example['instruction']}\n### Input: {example['input']}\n### Response: {example['output']}\"\"\"\n\n    dataset = Dataset.from_list([{'text': format_alpaca(d)} for d in data])\n    splits = dataset.train_test_split(test_size=0.1, seed=42)\n\n    # 2. Load model in 4-bit\n    MODEL_ID = 'meta-llama/Llama-3-8B-Instruct'\n    tokenizer = AutoTokenizer.from_pretrained(MODEL_ID)\n    tokenizer.pad_token = tokenizer.eos_token\n    tokenizer.padding_side = 'right'\n\n    bnb_config = BitsAndBytesConfig(\n        load_in_4bit=True,\n        bnb_4bit_quant_type='nf4',\n        bnb_4bit_compute_dtype=torch.bfloat16,\n        bnb_4bit_use_double_quant=True\n    )\n    model = AutoModelForCausalLM.from_pretrained(\n        MODEL_ID,\n        quantization_config=bnb_config,\n        device_map='auto'\n    )\n    model.config.use_cache = False  # Required for training\n    model.config.pretraining_tp = 1\n\n    # 3. LoRA config\n    peft_config = LoraConfig(\n        r=64,\n        lora_alpha=128,  # 2×r\n        lora_dropout=0.05,\n        target_modules=['q_proj', 'k_proj', 'v_proj', 'o_proj',\n                        'gate_proj', 'up_proj', 'down_proj'],\n        bias='none',\n        task_type='CAUSAL_LM'\n    )\n\n    # 4. Training args\n    training_args = TrainingArguments(\n        output_dir='./qlora-output',\n        num_train_epochs=3,\n        per_device_train_batch_size=4,\n        gradient_accumulation_steps=4,   # effective batch = 16\n        gradient_checkpointing=True,      # save memory\n        optim='paged_adamw_32bit',        # memory-efficient optimizer\n        learning_rate=2e-4,\n        lr_scheduler_type='cosine',\n        warmup_ratio=0.05,\n        logging_steps=10,\n        save_steps=100,\n        evaluation_strategy='steps',\n        eval_steps=100,\n        fp16=False,\n        bf16=True,\n        max_grad_norm=0.3,\n        group_by_length=True,  # speed: batch similar-length sequences\n    )\n\n    # 5. Train\n    trainer = SFTTrainer(\n        model=model,\n        args=training_args,\n        train_dataset=splits['train'],\n        eval_dataset=splits['test'],\n        peft_config=peft_config,\n        dataset_text_field='text',\n        max_seq_length=512,\n        tokenizer=tokenizer,\n    )\n    trainer.train()\n    trainer.save_model('./final-lora')\n\n    # 6. Monitor: watch for overfitting\n    # train_loss should decrease steadily\n    # eval_loss should decrease then plateau (not increase!)\n    # If eval_loss increases → reduce epochs or add data", "cross": ["What is gradient checkpointing and why is it important for QLoRA training?", "How do you monitor training curves to detect overfitting early?", "What is paged_adamw and how does it reduce GPU memory during fine-tuning?"]}, {"q": "How do you build a high-quality fine-tuning dataset?", "a": "Data quality >> data quantity. 200 perfect examples often beat 5000 mediocre ones.\n\nDataset formats:\n    # Alpaca format (simple, good for instruction following)\n    {\"instruction\": \"...\", \"input\": \"...\", \"output\": \"...\"}\n\n    # ChatML (preferred for conversational models)\n    {\"messages\": [\n        {\"role\": \"system\", \"content\": \"You are...\"},\n        {\"role\": \"user\", \"content\": \"...\"},\n        {\"role\": \"assistant\", \"content\": \"...\"}\n    ]}\n\n    # Multi-turn\n    {\"messages\": [\n        {\"role\": \"user\", \"content\": \"What is RAG?\"},\n        {\"role\": \"assistant\", \"content\": \"RAG is...\"},\n        {\"role\": \"user\", \"content\": \"Give an example\"},\n        {\"role\": \"assistant\", \"content\": \"Sure...\"}\n    ]}\n\nQuality checklist:\n    ✅ Correct: every output is factually accurate\n    ✅ Diverse: covers full input distribution + edge cases\n    ✅ Consistent: same style/format throughout\n    ✅ Complete: no truncated outputs\n    ✅ Balanced: no class imbalance for classification\n    ✅ Clean: no duplicates, bad encoding, empty fields\n\nCommon bad data patterns:\n    ❌ LLM-generated without human review\n    ❌ Inconsistent output format\n    ❌ Very short outputs (<20 tokens) → teaches terseness\n    ❌ Refusals: 'I cannot...', 'As an AI...' → model learns to refuse!\n    ❌ Wrong answers baked in\n    ❌ Too many similar examples (low diversity)\n\nData pipeline:\n    # 1. Seed data: 20-50 human-written gold examples\n    seed_data = human_write_examples(n=50)  # MOST IMPORTANT\n\n    # 2. LLM-generated expansion\n    generated = []\n    for seed in seed_data:\n        variants = gpt4_generate_variants(seed, n=10)\n        generated.extend(variants)\n\n    # 3. Human review and filtering\n    reviewed = []\n    for ex in generated:\n        if human_reviewer.approve(ex):  # filter ~30% bad ones\n            reviewed.append(ex)\n\n    # 4. Automated quality checks\n    def is_quality(ex):\n        if len(ex['output'].split()) < 10: return False\n        if 'sorry' in ex['output'].lower(): return False\n        if ex['output'] == ex['input']: return False\n        return True\n\n    final = [ex for ex in reviewed if is_quality(ex)]\n\n    # 5. Deduplication\n    seen = set()\n    deduped = []\n    for ex in final:\n        key = ex['input'][:100].lower()\n        if key not in seen:\n            seen.add(key)\n            deduped.append(ex)\n\n    # 6. Split\n    random.shuffle(deduped)\n    train = deduped[:int(0.9*len(deduped))]\n    test = deduped[int(0.9*len(deduped)):]", "cross": ["What is the Self-Instruct method and how was it used to create Alpaca's training data?", "How do you handle class imbalance in classification fine-tuning datasets?", "What is synthetic data generation and what are the legal/quality risks?"]}, {"q": "What is DPO? How does it compare to RLHF/PPO?", "a": "DPO (Direct Preference Optimization) = alignment method that directly optimizes on human preference pairs without a separate reward model.\n\nRLHF pipeline (complex, 3 stages):\n    1. SFT: train on demonstrations\n    2. Reward Model: train on preference rankings\n    3. PPO: RL to optimize SFT model via RM\n    → 3 models, complex training, reward hacking risk, unstable\n\nDPO pipeline (simpler, 2 stages):\n    1. SFT: train on demonstrations\n    2. DPO: directly optimize on (prompt, chosen, rejected) pairs\n    → No RM needed, stable, simpler, comparable quality\n\nDPO loss:\n    # For each (prompt x, chosen y_w, rejected y_l):\n    L = -E[log σ(β * (log_ratio(y_w) - log_ratio(y_l)))]\n    # log_ratio = log(π(y|x)/π_ref(y|x))\n    # β = temperature (KL penalty strength, typically 0.1-0.5)\n    # π = model being trained\n    # π_ref = frozen SFT reference model\n\n    from trl import DPOTrainer\n\n    dpo_dataset = [\n        {\n            'prompt': 'How do I handle a bug in production?',\n            'chosen': 'First, assess impact. Then: 1. Hotfix in feature branch 2. Deploy to staging 3. Test 4. Deploy to prod 5. Post-mortem',\n            'rejected': 'Just fix it lol'\n        }\n    ]\n\n    dpo_trainer = DPOTrainer(\n        model=sft_model,\n        ref_model=ref_model,  # frozen SFT model\n        args=TrainingArguments(...),\n        beta=0.1,             # KL penalty\n        train_dataset=dpo_dataset,\n        tokenizer=tokenizer,\n        max_length=512,\n        max_prompt_length=256,\n    )\n    dpo_trainer.train()\n\nDPO variants:\n    - IPO: more theoretically grounded, avoids DPO overfitting\n    - KTO: works with scalar feedback, not pairs\n    - ORPO: combines SFT + DPO in single pass (no separate SFT needed)\n    - SimPO: no reference model needed, simpler\n    - GRPO: group-relative policy optimization (DeepSeek's R1 uses this)\n\nWhen DPO vs RLHF:\n    DPO: offline preference data, limited GPU, team without RL expertise\n    PPO/RLHF: online learning, need real-time reward signal, large scale", "cross": ["What is the DPO overfitting problem and how does it manifest in practice?", "How do you collect preference pairs efficiently — what does the labeling process look like?", "What is GRPO (used by DeepSeek R1) and why did it outperform PPO?"]}, {"q": "How do you evaluate a fine-tuned model?", "a": "Multi-dimensional evaluation for fine-tuned models:\n\n    # 1. Task-specific metrics\n    from sklearn.metrics import accuracy_score, f1_score\n\n    # For classification fine-tune\n    predictions = [model_predict(ex['input']) for ex in test_set]\n    labels = [ex['output'] for ex in test_set]\n    print(f'Accuracy: {accuracy_score(labels, predictions):.3f}')\n    print(f'F1: {f1_score(labels, predictions, average=\"weighted\"):.3f}')\n\n    # 2. Format compliance (critical for structured output)\n    def check_format(output: str) -> bool:\n        try:\n            data = json.loads(output)\n            return all(k in data for k in ['city', 'check_in', 'guests'])\n        except:\n            return False\n\n    format_score = sum(check_format(pred) for pred in predictions) / len(predictions)\n    print(f'Format compliance: {format_score:.1%}')\n\n    # 3. LLM-as-judge (quality)\n    from langchain.evaluation import load_evaluator\n    evaluator = load_evaluator('criteria', criteria='correctness', llm=ChatOpenAI(model='gpt-4o'))\n\n    scores = []\n    for ex, pred in zip(test_set, predictions):\n        result = evaluator.evaluate_strings(\n            prediction=pred,\n            reference=ex['output'],\n            input=ex['input']\n        )\n        scores.append(result['score'])\n    print(f'Quality (LLM judge): {sum(scores)/len(scores):.2f}')\n\n    # 4. Perplexity (how well model predicts test set)\n    # Lower = better, but correlates poorly with task quality\n    # Only use as sanity check, not primary metric\n\n    # 5. Compare vs base model and vs GPT-4o\n    for model_name, model in models.items():\n        preds = [model.predict(ex['input']) for ex in test_set]\n        quality = evaluate_quality(preds, test_set)\n        latency = measure_latency(model, test_set[:10])\n        cost = calculate_cost(model_name, test_set)\n        print(f'{model_name}: quality={quality:.2f}, latency={latency:.0f}ms, cost=${cost:.3f}')\n\n    # 6. Human eval (gold standard)\n    # Randomly sample 50 examples\n    # Human blindly rates: base model vs fine-tuned (which is better?)\n    # Aim: fine-tuned wins 70%+ of comparisons for target task\n\n    # 7. Regression test\n    # CRITICAL: fine-tuning can hurt general capability\n    # Run on general benchmarks (MMLU, HumanEval)\n    # Ensure scores don't drop more than 5% vs base model", "cross": ["What is the 'alignment tax' and how does fine-tuning affect general model capabilities?", "How do you detect if your fine-tuned model is overfitting to the training set?", "What is model merging and how can you combine multiple fine-tunes without retraining?"]}, {"q": "What are continued pretraining and domain-adaptive pretraining?", "a": "Two forms of pretraining to give models deeper domain knowledge before instruction fine-tuning.\n\nContinued Pretraining (CPT):\n    # Continue next-token prediction on domain corpus (no instructions)\n    # Goal: bake domain language + facts into model weights\n    # When: model performs poorly even with great prompts on domain text\n\n    from transformers import Trainer, TrainingArguments, DataCollatorForLanguageModeling\n    from datasets import load_dataset\n\n    # Domain corpus: medical papers, legal contracts, financial filings\n    dataset = load_dataset('text', data_files='./domain_corpus/*.txt')\n\n    # No instruction format — raw text prediction\n    data_collator = DataCollatorForLanguageModeling(\n        tokenizer=tokenizer,\n        mlm=False  # causal LM, not masked\n    )\n\n    training_args = TrainingArguments(\n        output_dir='./cpt-model',\n        num_train_epochs=1,  # less than SFT — just domain adaptation\n        per_device_train_batch_size=8,\n        learning_rate=1e-5,  # lower LR than SFT to preserve base capabilities\n    )\n\n    trainer = Trainer(\n        model=model, args=training_args,\n        train_dataset=dataset, data_collator=data_collator\n    )\n    trainer.train()\n    # Result: model that 'thinks' in your domain language\n\nDomain-Adaptive Pretraining (DAPT):\n    # Subset of CPT: use LoRA to adapt more efficiently\n    # Example: medical domain with PubMed articles\n    # Example: legal with court documents\n    # Example: code with GitHub repos\n\nFull pipeline order:\n    1. Pretrained base (e.g. Llama-3-8B)\n    2. CPT on domain corpus → domain-aware base\n    3. SFT on instruction pairs → instruction following\n    4. DPO/RLHF → aligned\n\nData requirements for CPT:\n    # 1B-10B tokens of domain text for meaningful adaptation\n    # Quality > quantity: use cleaned, deduplicated text\n    # Balance: mix domain text with general text (70/30) to prevent forgetting\n\nExample: Build a medical LLM\n    1. CPT: 2B tokens of PubMed + clinical notes\n    2. SFT: 10K (question, clinical answer) pairs\n    3. DPO: 5K (question, preferred, rejected) pairs\n    Result: Llama outperforms GPT-4 on medical benchmarks", "cross": ["How much domain data do you need for continued pretraining to be effective?", "How do you prevent catastrophic forgetting of general capabilities during continued pretraining?", "What is the MedPaLM approach and how did Google adapt LLMs for healthcare?"]}, {"q": "TRICKY: Your fine-tuned model works great in evaluation but fails in production. Why?", "a": "Train-prod distribution mismatch — the #1 fine-tuning failure in production.\n\nDiagnosis framework:\n\n    # 1. Distribution shift analysis\n    # Compare: training input distribution vs production input distribution\n\n    # Collect production inputs (sample 1000 recent queries)\n    prod_inputs = get_production_inputs(n=1000)\n\n    # Embed both and compare\n    train_vecs = embed([ex['input'] for ex in train_data])\n    prod_vecs = embed(prod_inputs)\n\n    # Measure distribution distance\n    from scipy.stats import wasserstein_distance\n    # If distance is high → your eval doesn't represent prod!\n\n    # 2. Failure case categorization\n    # Manually review 50 production failures\n    # Common categories:\n    failure_types = {\n        'format_errors': 0,     # JSON malformed\n        'wrong_output': 0,      # factually wrong\n        'refusals': 0,          # model says 'I cannot'\n        'length_mismatch': 0,   # too long / too short\n        'language_mismatch': 0, # user writes differently than training\n    }\n\n    # 3. Common root causes:\n    # A. Eval was too easy / hand-picked:\n    #    Training: 'Extract city from: I need a flat in London' → 'London'\n    #    Production: 'Book something in LDN or maybe Manchester???' → fails\n    #    Fix: add noisy, ambiguous, real-user examples to training\n\n    # B. Format hallucination under pressure:\n    #    Training: always clean, full JSON\n    #    Production: sometimes partial info → model outputs partial JSON\n    #    Fix: add training examples with partial info → handle gracefully\n\n    # C. Prompt mismatch:\n    #    Training format: '### Instruction: ...'\n    #    Production code: 'You are a... User: ...'\n    #    Fix: ALWAYS use exact same prompt format in prod as training!\n\n    # D. Temperature/sampling difference:\n    #    Training: deterministic (temp=0)\n    #    Production: temp=0.7 → different output style\n    #    Fix: use same settings\n\n    # E. Context length difference:\n    #    Training: max_seq_len=256\n    #    Production: users send 500 token inputs → truncated incorrectly\n\nFix process:\n    # 1. Collect 200 production failure examples\n    # 2. Add to training data\n    # 3. Retrain (or continue fine-tuning)\n    # 4. Eval on BOTH old test set + new production failures\n    # 5. Shadow deploy: run both versions, compare\n    # 6. Gradual rollout with monitoring", "cross": ["What is 'dataset contamination' and how can it make eval scores misleadingly high?", "How do you implement continuous fine-tuning — retrain model on new production failures automatically?", "What is the 'fine-tuning feedback loop' problem and how do you prevent model degradation over time?"]}, {"q": "How do you serve fine-tuned models in production efficiently?", "a": "    # Option 1: Merge LoRA and serve as regular model\n    from peft import PeftModel\n    from transformers import AutoModelForCausalLM\n\n    base = AutoModelForCausalLM.from_pretrained('meta-llama/Llama-3-8B-Instruct')\n    peft_model = PeftModel.from_pretrained(base, './lora-adapter')\n    merged = peft_model.merge_and_unload()  # bake LoRA into base\n    merged.save_pretrained('./prod-model')\n    # Serve as regular model — no PEFT overhead at inference!\n\n    # Option 2: vLLM for high throughput\n    from vllm import LLM, SamplingParams\n\n    llm = LLM(\n        model='./prod-model',\n        quantization='awq',    # 4-bit inference\n        max_model_len=4096,\n        gpu_memory_utilization=0.85,\n        tensor_parallel_size=1  # increase for multi-GPU\n    )\n\n    params = SamplingParams(temperature=0, max_tokens=256)\n    outputs = llm.generate(['Prompt 1', 'Prompt 2', 'Prompt 3'], params)\n    # vLLM: 20-30x higher throughput than HuggingFace naive serving\n    # Continuous batching: handles variable-length requests efficiently\n    # PagedAttention: 90% less KV cache memory waste\n\n    # Option 3: TGI (Text Generation Inference)\n    # docker run --gpus all ghcr.io/huggingface/text-generation-inference\n    # --model-id ./prod-model\n    # REST API + streaming out of the box\n\n    # Option 4: Ollama (local/edge)\n    # ollama create mymodel -f Modelfile\n    # ollama serve\n\n    # Option 5: Cloud APIs\n    # Together AI, Replicate, Modal, Runpod — managed GPU serving\n    # Fine-tune upload → auto-served\n\nQuantization for serving:\n    # AWQ (Activation-aware Weight Quantization): best quality 4-bit\n    # GPTQ: fast inference, slight quality loss\n    # bitsandbytes int8: easy, ~2x memory reduction\n    # GGUF/llama.cpp: CPU inference on MacBook\n\nLatency optimization:\n    # Speculative decoding: small model drafts, large model verifies\n    # Flash Attention 2: 2-4x faster attention\n    # Torch.compile: 20-30% speedup\n    # FP8 inference (H100 GPU)\n    # Batch requests: increase throughput at cost of latency", "cross": ["What is PagedAttention in vLLM and how does it improve memory efficiency?", "How do you implement a canary deployment when rolling out a new fine-tuned model?", "What is speculative decoding and how does it achieve 3-4x speedup without quality loss?"]}, {"q": "What is catastrophic forgetting and how do you prevent it?", "a": "Catastrophic forgetting = when fine-tuning on new task, model forgets previously learned capabilities.\n\nExample:\n    # Base Llama-3: can do math, code, writing, reasoning\n    # Fine-tune on customer service conversations\n    # Result: great at customer service, forgot how to code!\n\nWhy it happens:\n    # Neural networks: same weights encode multiple skills\n    # Gradient descent for new task moves weights toward new objective\n    # Old task representations overwritten\n    # Especially bad for: full fine-tuning, large learning rate, many epochs\n\nPrevention strategies:\n\n    # 1. LoRA / PEFT (BEST — structural prevention)\n    # Frozen base weights can't catastrophically forget!\n    # LoRA adapters are additive — base preserved\n    from peft import LoraConfig, get_peft_model\n    config = LoraConfig(r=16, lora_alpha=32)  # base model frozen\n\n    # 2. Mixed training (replay)\n    # Include general-purpose examples in fine-tuning data\n    # Rule: 80% domain data + 20% general data\n    import random\n    mixed_data = domain_data + random.sample(general_data,\n                                             len(domain_data) // 4)\n    random.shuffle(mixed_data)  # mix throughout training\n\n    # 3. Lower learning rate\n    # Full fine-tune: use 1e-5 to 3e-5 (very conservative)\n    # LoRA: can use 1e-4 to 3e-4 safely\n    training_args = TrainingArguments(\n        learning_rate=1e-5,  # lower = less forgetting\n        num_train_epochs=2,  # fewer epochs = less forgetting\n    )\n\n    # 4. EWC (Elastic Weight Consolidation)\n    # Penalize changes to important weights from original task\n    # Expensive but principled\n    # Fisher information matrix identifies important parameters\n\n    # 5. Measure forgetting\n    # Before fine-tune: eval on MMLU, HumanEval, general benchmarks\n    # After fine-tune: eval same benchmarks\n    # Alert if drop > 5%\n    def measure_forgetting(base_model, finetuned_model, benchmarks):\n        results = {}\n        for bench_name, bench_data in benchmarks.items():\n            base_score = evaluate(base_model, bench_data)\n            ft_score = evaluate(finetuned_model, bench_data)\n            forgetting = base_score - ft_score\n            results[bench_name] = {'base': base_score, 'ft': ft_score,\n                                   'forgetting': forgetting}\n        return results", "cross": ["What is the plasticity-stability dilemma in continual learning?", "How does replay buffer approach from reinforcement learning apply to preventing forgetting in LLMs?", "What are the current research-frontier approaches to continual learning for LLMs?"]}, {"q": "What is ORPO fine-tuning? How does it differ from SFT + DPO?", "a": "ORPO (Odds Ratio Preference Optimization) = combines SFT and alignment into a single training step.\n\nTraditional pipeline (2 stages):\n    Stage 1: SFT — train on demonstrations\n    Stage 2: DPO — train on preference pairs (chosen > rejected)\n    Problem: 2 training runs, 2 datasets needed, more compute\n\nORPO (1 stage):\n    # Combines cross-entropy (SFT) + odds ratio penalty (DPO) in one loss\n    # L_ORPO = L_SFT + λ * L_OR\n    # L_SFT = standard next-token prediction on chosen responses\n    # L_OR = penalize chosen/rejected odds ratio (prefer chosen)\n\n    from trl import ORPOTrainer, ORPOConfig\n\n    # Dataset format: same as DPO\n    orpo_data = [\n        {\n            'prompt': 'How do I fix a NullPointerException?',\n            'chosen': 'Check if the object is null before accessing: if (obj != null) { obj.method(); }',\n            'rejected': 'Just add a try-catch around everything.'\n        }\n    ]\n\n    config = ORPOConfig(\n        learning_rate=8e-6,\n        beta=0.1,            # odds ratio weight (λ)\n        max_length=1024,\n        max_prompt_length=512,\n        num_train_epochs=3,\n        per_device_train_batch_size=2,\n        gradient_accumulation_steps=4,\n    )\n\n    trainer = ORPOTrainer(\n        model=base_model,  # can start from base model (no SFT needed!)\n        args=config,\n        processing_class=tokenizer,\n        train_dataset=dataset,\n    )\n    trainer.train()\n\nComparison:\n    Method     | Stages | Data needed          | Compute  | Quality\n    SFT only   | 1      | Demonstrations       | Low      | Medium\n    SFT + DPO  | 2      | Demos + preferences  | High     | High\n    ORPO       | 1      | Preferences only     | Medium   | High\n    SimPO      | 1      | Preferences only     | Medium   | High\n\nWhen to use ORPO:\n    - Have preference pairs but limited compute\n    - Want simpler pipeline (no SFT stage)\n    - Starting from strong base model (Llama3-Instruct)\n    - Important: doesn't need a reference model (unlike DPO)", "cross": ["What is SimPO and how does it further simplify the ORPO objective?", "When would you still prefer SFT + DPO over ORPO?", "How do you collect preference pairs efficiently for ORPO training?"]}, {"q": "How do you implement RLHF from scratch with PPO?", "a": "    # RLHF with PPO requires 3 models:\n    # 1. Policy (what we're training) — starts as SFT model\n    # 2. Reference (frozen SFT) — KL divergence target\n    # 3. Reward model (trained on preferences)\n\n    from trl import PPOTrainer, PPOConfig, AutoModelForCausalLMWithValueHead\n    from transformers import pipeline\n\n    # 1. Reward model (trains separately on preference data)\n    # Simple implementation: SFT model + scalar head\n    reward_model = AutoModelForSequenceClassification.from_pretrained(\n        'sft_model/', num_labels=1  # single scalar reward\n    )\n    # Train on: preferred > rejected pairs\n    # Loss: hinge loss or Bradley-Terry model\n\n    # 2. Load policy (SFT model with value head for PPO)\n    policy = AutoModelForCausalLMWithValueHead.from_pretrained('sft_model/')\n    ref_policy = AutoModelForCausalLMWithValueHead.from_pretrained('sft_model/')\n    ref_policy.requires_grad_(False)  # frozen\n\n    # 3. PPO config\n    ppo_config = PPOConfig(\n        model_name='sft_model',\n        learning_rate=1e-5,\n        batch_size=64,\n        mini_batch_size=16,\n        gradient_accumulation_steps=1,\n        ppo_epochs=4,           # PPO inner loop\n        kl_penalty='kl',        # KL divergence penalty type\n        init_kl_coef=0.2,       # β — KL penalty coefficient\n        adap_kl_ctrl=True,      # adaptive KL target\n        target_kl=6.0,          # target KL divergence\n    )\n\n    ppo_trainer = PPOTrainer(ppo_config, policy, ref_policy, tokenizer)\n\n    # 4. Training loop\n    for epoch in range(num_epochs):\n        for batch in dataloader:\n            # Generate responses\n            query_tensors = [tokenizer.encode(q) for q in batch['queries']]\n            response_tensors = ppo_trainer.generate(\n                query_tensors,\n                max_new_tokens=200,\n                temperature=1.0  # sample during RL\n            )\n\n            # Score with reward model\n            rewards = [\n                reward_model(q + r).logits.squeeze()\n                for q, r in zip(query_tensors, response_tensors)\n            ]\n\n            # PPO step: update policy to maximize reward - KL\n            stats = ppo_trainer.step(query_tensors, response_tensors, rewards)\n\n            # Monitor: reward mean, KL divergence, entropy\n            print(f'Mean reward: {torch.stack(rewards).mean():.3f}')\n            print(f'KL: {stats[\"objective/kl\"]:.3f}')  # should stay near target\n\n    # Reward hacking warning:\n    # If KL diverges too much → model exploits reward model\n    # Watch: if reward increases but human quality drops → hacking!", "cross": ["What is reward hacking and how do the KL penalty and clip parameter prevent it?", "What is the difference between on-policy and off-policy PPO and which does TRL use?", "Why is PPO considered harder to implement than DPO, and what are the common failure modes?"]}, {"q": "How do you evaluate fine-tuned models systematically?", "a": "    import json\n    from sklearn.metrics import accuracy_score, f1_score, classification_report\n    from langchain.evaluation import load_evaluator\n    from langchain_openai import ChatOpenAI\n\n    judge = ChatOpenAI(model='gpt-4o', temperature=0)\n\n    def comprehensive_eval(model, test_dataset, task_type: str) -> dict:\n        results = {}\n\n        # 1. Task-specific metrics\n        if task_type == 'classification':\n            preds = [extract_label(model.predict(ex['input'])) for ex in test_dataset]\n            labels = [ex['output'] for ex in test_dataset]\n            results['accuracy'] = accuracy_score(labels, preds)\n            results['f1'] = f1_score(labels, preds, average='weighted')\n            results['report'] = classification_report(labels, preds)\n\n        elif task_type == 'extraction':\n            # Format compliance\n            preds = [model.predict(ex['input']) for ex in test_dataset]\n            valid_json = sum(1 for p in preds if is_valid_json(p)) / len(preds)\n            results['format_compliance'] = valid_json\n            # Field accuracy\n            field_scores = []\n            for pred, ex in zip(preds, test_dataset):\n                try:\n                    p_data = json.loads(pred)\n                    e_data = json.loads(ex['output'])\n                    matches = sum(p_data.get(k) == v for k, v in e_data.items())\n                    field_scores.append(matches / len(e_data))\n                except:\n                    field_scores.append(0)\n            results['field_accuracy'] = sum(field_scores) / len(field_scores)\n\n        # 2. LLM-as-judge quality score\n        quality_evaluator = load_evaluator('criteria',\n            criteria={'correctness': 'Is the answer correct?',\n                      'completeness': 'Is the answer complete?'},\n            llm=judge\n        )\n        scores = []\n        for ex, pred in zip(test_dataset[:50], preds[:50]):  # sample 50\n            score = quality_evaluator.evaluate_strings(\n                prediction=pred, reference=ex['output'], input=ex['input']\n            )\n            scores.append(score['score'])\n        results['llm_judge_quality'] = sum(scores) / len(scores)\n\n        # 3. Latency\n        import time\n        latencies = []\n        for ex in test_dataset[:20]:\n            start = time.time()\n            model.predict(ex['input'])\n            latencies.append(time.time() - start)\n        results['avg_latency_ms'] = (sum(latencies) / len(latencies)) * 1000\n        results['p95_latency_ms'] = sorted(latencies)[int(0.95 * len(latencies))] * 1000\n\n        # 4. Regression vs base model\n        # Run SAME eval on base model, compare\n        # Alert if fine-tuned score < base_score * 0.95\n\n        return results", "cross": ["What is the alignment tax and how does fine-tuning affect general capabilities?", "How do you detect data contamination — where test examples leaked into training?", "What is model merging and how can you combine fine-tunes without retraining?"]}, {"q": "What is RAFT? How does it combine RAG and fine-tuning?", "a": "RAFT (Retrieval-Augmented Fine-Tuning) = train the model to USE retrieved context correctly, distinguishing relevant from distractor documents.\n\nProblem RAFT solves:\n    # Standard RAG: base model wasn't trained to read retrieved docs\n    # Model may: ignore context, hallucinate despite good context\n    # RAFT: fine-tune model to extract answer from retrieved context\n    # Especially useful when domain language is specialized\n\nRAFT training data format:\n    # For each training example:\n    # - Question Q\n    # - Oracle document D* (contains the answer)\n    # - Distractor documents D1, D2, D3 (don't contain answer)\n    # - Answer A with chain-of-thought citing the oracle doc\n\n    raft_example = {\n        'question': 'What is the cancellation fee for bookings under 48 hours?',\n        'documents': [\n            '# Cancellation Policy\\nCancellations within 48 hours incur 50% charge.',  # oracle\n            '# Booking Terms\\nAll bookings require credit card guarantee.',             # distractor\n            '# Pricing\\nPrices include all taxes and service fees.',                     # distractor\n        ],\n        'answer': \"\"\"## Reasoning\n    Looking at document 1, I can see: 'Cancellations within 48 hours incur 50% charge.'\n    Documents 2 and 3 are not relevant to cancellation fees.\n\n    ## Answer\n    Cancellations made within 48 hours of check-in incur a 50% charge of the booking value.\"\"\"\n    }\n\n    # Key: sometimes (20-30%) include examples WITHOUT oracle doc\n    # Teaches model to say 'I don't know' when answer not in context\n    raft_example_no_oracle = {\n        'question': 'What is the CEO's salary?',\n        'documents': ['# Pricing...', '# Policies...'],  # no relevant doc\n        'answer': 'The provided documents do not contain information about executive compensation.'\n    }\n\nImplementation:\n    from trl import SFTTrainer\n\n    def format_raft_example(ex):\n        docs_str = '\\n\\n'.join(f'Document {i+1}:\\n{d}' for i,d in enumerate(ex['documents']))\n        return f\"\"\"Context documents:\n    {docs_str}\n\n    Question: {ex['question']}\n    Answer: {ex['answer']}\"\"\"\n\n    dataset = Dataset.from_list([\n        {'text': format_raft_example(ex)} for ex in raft_examples\n    ])\n    trainer = SFTTrainer(model=model, train_dataset=dataset, ...)\n\nResults: RAFT-trained models significantly outperform base RAG on domain QA.", "cross": ["How do you automatically generate RAFT training data from existing documents?", "What is the optimal ratio of oracle to distractor documents in RAFT training?", "How does RAFT compare to just improving the retrieval system?"]}, {"q": "How do you serve multiple LoRA adapters efficiently in production?", "a": "    # Challenge: different fine-tunes for different use cases\n    # Naive: load a different model per use case (huge memory!)\n    # Solution: one base model + swap LoRA adapters at inference\n\n    # Method 1: HuggingFace PEFT adapter switching\n    from peft import PeftModel\n\n    base_model = AutoModelForCausalLM.from_pretrained(\n        'meta-llama/Llama-3-8B-Instruct',\n        device_map='auto'\n    )\n\n    # Load multiple adapters\n    model = PeftModel.from_pretrained(base_model, './adapter-customer-service')\n    model.load_adapter('./adapter-legal', adapter_name='legal')\n    model.load_adapter('./adapter-medical', adapter_name='medical')\n    model.load_adapter('./adapter-customer-service', adapter_name='cs')\n\n    def route_and_infer(prompt: str, tenant: str) -> str:\n        # Select adapter based on use case\n        adapter_map = {'healthcare': 'medical', 'legal_firm': 'legal'}\n        adapter = adapter_map.get(tenant, 'cs')\n\n        model.set_adapter(adapter)  # instant switch — no reload!\n        return model.generate(tokenizer.encode(prompt))\n\n    # Method 2: vLLM with LoRA adapters (BEST for production)\n    from vllm import LLM, SamplingParams\n    from vllm.lora.request import LoRARequest\n\n    llm = LLM(\n        model='meta-llama/Llama-3-8B-Instruct',\n        enable_lora=True,\n        max_loras=10,           # max adapters loaded simultaneously\n        max_lora_rank=64,       # max LoRA rank across adapters\n        gpu_memory_utilization=0.85\n    )\n\n    params = SamplingParams(temperature=0, max_tokens=256)\n\n    # Request-level adapter selection\n    def serve(prompt: str, use_case: str) -> str:\n        lora_req = LoRARequest(\n            lora_name=use_case,\n            lora_int_id=use_case_to_id[use_case],\n            lora_local_path=f'./adapters/{use_case}'\n        )\n        outputs = llm.generate([prompt], params, lora_request=lora_req)\n        return outputs[0].outputs[0].text\n\n    # Different users get different adapters — same base model!\n    serve('Summarize this contract...', 'legal')\n    serve('Respond to angry customer...', 'customer-service')\n\nCost savings:\n    # Without adapter serving: 10 use cases × 8B model × 16GB = 160GB VRAM\n    # With vLLM LoRA: 1 × 8B model × 16GB + small adapters = 20GB VRAM\n    # 8× memory reduction!", "cross": ["What is adapter merging and when would you merge vs keep adapters separate?", "How do you handle requests that need capabilities from multiple adapters simultaneously?", "What is the latency overhead of LoRA adapter switching vs a merged model?"]}]}};
let at=Object.keys(D)[0];
const T={'TRICKY':['Tricky','#f43f5e'],'SITUATION':['Situational','#f59e0b'],'BUILD':['Build','#06b6d4'],'DESIGN':['Design','#8b5cf6']};
function dt(q){const t=q.toUpperCase();if(t.startsWith('TRICKY'))return'TRICKY';if(t.startsWith('SITUATION'))return'SITUATION';if(/WALK THROUGH|BUILD A|IMPLEMENT.*FROM|COMPLETE.*PIPELINE|FULL.*PIPELINE/.test(t))return'BUILD';if(/DESIGN |ARCHITECT/.test(t))return'DESIGN';return null}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(txt){
  if(!txt)return'';
  const lines=txt.split('\n');let out='',inc=false,cl=[];
  const isC=l=>{
    const t=l.trim();
    if(!t)return false;
    if(/^(def |class |import |from |pip |#!|\/\/|SELECT |WITH |@app\.|@celery|docker|kubectl|aws |gcloud |>>>)/.test(t))return true;
    if(/^    /.test(l)&&t.length>3)return true;
    if(/[{=;()]/.test(l)&&t.length>10&&!/^[\-\*•✅❌✓┌│└├→←⟩]/.test(t)&&!/^[A-Z][a-z]+:/.test(t))return true;
    return false;
  };
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(!inc&&isC(l)){inc=true;cl=[l]}
    else if(inc){
      const nx=lines[i+1]||'';
      if(l.trim()===''&&!isC(nx)){out+=`<pre class="code">${esc(cl.join('\n'))}</pre>`;inc=false;cl=[];out+=esc(l)+'\n'}
      else cl.push(l)
    }else out+=esc(l)+'\n'
  }
  if(inc)out+=`<pre class="code">${esc(cl.join('\n'))}</pre>`;
  return`<div class="ans">${out}</div>`
}
function initChips(){
  const tot=Object.values(D).reduce((s,v)=>s+v.questions.length,0);
  const tricky=Object.values(D).reduce((s,v)=>s+v.questions.filter(q=>q.q.toUpperCase().startsWith('TRICKY')).length,0);
  const sit=Object.values(D).reduce((s,v)=>s+v.questions.filter(q=>q.q.toUpperCase().startsWith('SITUATION')).length,0);
  document.getElementById('chips').innerHTML=`
    <div class="chip">📚 <b>${tot}</b> questions</div>
    <div class="chip">📂 <b>${Object.keys(D).length}</b> topics</div>
    <div class="chip">🧩 <b>${tricky}</b> tricky</div>
    <div class="chip">💼 <b>${sit}</b> situational</div>
    <div class="chip">💬 <b>${tot*3}</b> cross questions</div>
    <div class="chip">✅ <b>100%</b> offline</div>`
}
function initTabs(){
  const w=document.getElementById('tabs');
  Object.entries(D).forEach(([n,v])=>{
    const b=document.createElement('button');
    b.className='tbtn'+(n===at?' on':'');
    b.style.setProperty('--tc',v.color);
    b.innerHTML=`<span class="tdot"></span>${v.icon} ${n}<span class="tcnt">${v.questions.length}</span>`;
    b.onclick=()=>sw(n);
    w.appendChild(b)
  })
}
function sw(n){
  at=n;
  document.querySelectorAll('.tbtn').forEach((b,i)=>{
    b.classList.toggle('on',Object.keys(D)[i]===n)
  });
  render();
  window.scrollTo({top:document.querySelector('.tshell').offsetTop,behavior:'smooth'})
}
function render(){
  const v=D[at];
  document.getElementById('shead').innerHTML=`
    <div class="sleft">
      <div class="sico" style="background:${v.color}10;border-color:${v.color}28">${v.icon}</div>
      <div>
        <div class="sname">${at}</div>
        <div class="sdesc">Basic → Advanced · Tricky · Situational · All questions pre-answered</div>
      </div>
    </div>
    <div class="sqcnt">${v.questions.length} questions</div>`;
  document.getElementById('cards').innerHTML=v.questions.map((q,i)=>card(q,i,v.color)).join('')
}
function card(q,i,color){
  const tp=dt(q.q),ti=tp?T[tp]:null;
  const tag=ti?`<span class="qtag" style="color:${ti[1]};border-color:${ti[1]}30;background:${ti[1]}0c">${ti[0]}</span>`:'';
  const cross=(q.cross||[]).map((c,j)=>`<div class="cqcard" style="--cc:${color}"><span class="cqn">↩${j+1}</span><span class="cqtxt2">${esc(c)}</span></div>`).join('');
  return`<div class="card" id="c${i}" style="--cc:${color}">
<div class="cmeta"><span class="qnum">Q${String(i+1).padStart(2,'0')}</span>${tag}</div>
<div class="cqrow" onclick="tog(${i})">
  <div class="cqtxt">${esc(q.q)}</div>
  <div class="toggle"><span>Answer</span><div class="ticon"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6,9 12,15 18,9"/></svg></div></div>
</div>
<div class="cbody">
  <div class="itabs">
    <button class="itab on" onclick="ip(${i},'a',this)">📖 Answer</button>
    <button class="itab" onclick="ip(${i},'c',this)">💬 Cross Qs <span class="ibadge">${(q.cross||[]).length}</span></button>
  </div>
  <div class="panel on" id="pa${i}">${fmt(q.a)}</div>
  <div class="panel" id="pc${i}"><div class="cqlist">${cross||'<p style="color:var(--m2);font-size:13px">No cross questions.</p>'}</div></div>
</div></div>`
}
function tog(i){document.getElementById('c'+i).classList.toggle('on')}
function ip(i,w,btn){
  event.stopPropagation();
  const c=document.getElementById('c'+i);
  if(!c.classList.contains('on'))c.classList.add('on');
  c.querySelectorAll('.itab').forEach(t=>t.classList.remove('on'));
  c.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('p'+w+i).classList.add('on')
}
initChips();initTabs();render();
</script>
</body>
