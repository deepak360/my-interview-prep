s(x, 'After LLM'))\n        | StrOutputParser()\n    )\n\nLevel 3: LangSmith tracing\n    import os\n    os.environ['LANGCHAIN_TRACING_V2'] = 'true'\n    os.environ['LANGCHAIN_API_KEY'] = 'ls-...'\n    os.environ['LANGCHAIN_PROJECT'] = 'my-app-debug'\n    # Every call automatically traced with full context\n\nUnit testing chains:\n    import pytest\n    from unittest.mock import patch, MagicMock\n\n    def test_rag_chain_returns_relevant_answer():\n        # Mock LLM to avoid API calls in tests\n        mock_llm = MagicMock()\n        mock_llm.invoke.return_value = AIMessage('The refund policy is 30 days.')\n\n        # Mock retriever\n        mock_retriever = MagicMock()\n        mock_retriever.invoke.return_value = [\n            Document(page_content='Refunds are available within 30 days')\n        ]\n\n        chain = build_rag_chain(llm=mock_llm, retriever=mock_retriever)\n        result = chain.invoke('What is the refund policy?')\n        assert '30 days' in result\n\nIntegration testing:\n    def test_retrieval_quality():\n        # Test actual retrieval without LLM\n        docs = retriever.invoke('cancellation policy')\n        assert len(docs) > 0\n        assert any('cancel' in d.page_content.lower() for d in docs)\n\nEval with LangSmith:\n    from langsmith.evaluation import evaluate\n    results = evaluate(\n        lambda inputs: chain.invoke(inputs['question']),\n        data='my-test-dataset',\n        evaluators=[qa_evaluator]\n    )", "cross": ["How do you write effective unit tests for non-deterministic LLM outputs?", "What is the difference between unit testing and eval testing for LLM applications?", "How do you set up CI/CD pipeline that runs LLM eval tests on every PR?"]}, {"q": "What are LangChain callbacks? How do you build custom telemetry?", "a": "Callbacks = hooks that fire at different stages of chain execution. Used for: logging, tracing, metrics, streaming, debugging.\n\nBuilt-in callbacks:\n    from langchain.callbacks import (\n        StdOutCallbackHandler,    # print to stdout\n        FileCallbackHandler,      # write to file\n        StreamingStdOutCallbackHandler,  # stream tokens to stdout\n    )\n\n    chain.invoke({'question': 'hi'}, config={'callbacks': [StdOutCallbackHandler()]})\n\nCustom callback handler:\n    from langchain.callbacks.base import BaseCallbackHandler\n    import time\n\n    class MetricsCallbackHandler(BaseCallbackHandler):\n        def __init__(self, metrics_client):\n            self.metrics = metrics_client\n            self.start_times = {}\n\n        def on_llm_start(self, serialized, prompts, **kwargs):\n            run_id = str(kwargs.get('run_id', ''))\n            self.start_times[run_id] = time.time()\n            self.metrics.increment('llm.calls')\n            self.metrics.gauge('llm.prompt_tokens',\n                sum(len(p.split()) for p in prompts))\n\n        def on_llm_end(self, response, **kwargs):\n            run_id = str(kwargs.get('run_id', ''))\n            duration = time.time() - self.start_times.pop(run_id, time.time())\n            self.metrics.timing('llm.latency', duration)\n            # Track token usage\n            if response.llm_output:\n                usage = response.llm_output.get('token_usage', {})\n                self.metrics.gauge('llm.completion_tokens',\n                    usage.get('completion_tokens', 0))\n\n        def on_llm_error(self, error, **kwargs):\n            self.metrics.increment('llm.errors')\n            logger.error(f'LLM error: {error}')\n\n        def on_chain_start(self, serialized, inputs, **kwargs):\n            pass\n\n        def on_chain_end(self, outputs, **kwargs):\n            pass\n\n        def on_tool_start(self, serialized, input_str, **kwargs):\n            self.metrics.increment(f'tool.{serialized[\"name\"]}.calls')\n\n        def on_tool_end(self, output, **kwargs):\n            pass\n\n    # Use globally (all chains)\n    from langchain.callbacks import set_handler\n    handler = MetricsCallbackHandler(prometheus_client)\n    chain.invoke({'q': 'hi'}, config={'callbacks': [handler]})\n\nCallback events available:\n    on_llm_start/end/error, on_chain_start/end/error,\n    on_tool_start/end/error, on_agent_action, on_agent_finish,\n    on_retriever_start/end/error, on_text", "cross": ["How do you implement distributed tracing across multiple microservices using LangChain callbacks?", "What is the difference between synchronous and asynchronous callbacks and when does it matter?", "How do you use callbacks to implement cost budgeting — stop if token cost exceeds threshold?"]}, {"q": "TRICKY: Why does a LangChain RAG pipeline return correct documents but wrong answers?", "a": "This is the 'faithfulness' problem — retrieval works but LLM ignores/misuses context.\n\nDiagnosis steps:\n\n1. Verify retrieval is correct:\n    docs = retriever.invoke('your question')\n    for d in docs:\n        print(d.page_content[:300])\n    # Is the answer literally in these chunks? If NO → retrieval problem\n\n2. Test LLM with perfect context:\n    # Manually provide the answer in context\n    perfect_prompt = f'Context: {known_answer_text}\\nQ: {question}\\nA:'\n    result = llm.invoke(perfect_prompt)\n    # If STILL wrong → LLM not following instructions\n\n3. Check context length:\n    # Context too long? LLM might focus on irrelevant parts\n    # 'Lost in the middle' — important info buried in middle of long context\n    # Fix: rerank + use top 2-3 chunks, not top 10\n\n4. Check prompt format:\n    # Is 'context' variable being injected correctly?\n    chain_debug = {'context': retriever | format_docs, 'question': RunnablePassthrough()} | prompt\n    full_prompt = chain_debug.invoke('your question')\n    print(full_prompt)  # see exactly what goes to LLM\n\n5. Check for conflicting instructions:\n    # System prompt says 'answer only about Topic A'\n    # Retrieved doc is about Topic B\n    # LLM follows system prompt, ignores context\n\n6. Model capability:\n    # GPT-4o-mini may not reliably follow 'answer only from context'\n    # Upgrade to GPT-4o or Claude 3.5 Sonnet\n\n7. Context quality:\n    # Retrieved chunks may be partial answers\n    # Need parent document retriever to get more context\n\nFixes:\n    # More explicit prompt:\n    prompt = 'You MUST answer using ONLY the text in <context> tags. Do not use prior knowledge.'\n    # Add CoT: 'First quote the relevant sentence from context, then answer'\n    # Reduce k: retrieve fewer, more precise chunks\n    # Use reranker to improve precision\n    # Upgrade model", "cross": ["What is the difference between retrieval precision and faithfulness in RAG evaluation?", "How does HyDE (Hypothetical Document Embeddings) solve retrieval-answer mismatch?", "What is self-RAG and how does it teach models to decide when to use retrieved context?"]}, {"q": "SITUATION: Build a multi-tenant RAG system where each company sees only their documents.", "a": "Multi-tenant RAG architecture:\n\n    from langchain_community.vectorstores import Qdrant\n    from langchain_openai import OpenAIEmbeddings, ChatOpenAI\n    from langchain_core.runnables import RunnablePassthrough\n\n    class MultiTenantRAG:\n        def __init__(self):\n            self.embeddings = OpenAIEmbeddings()\n            # Single collection with tenant_id in metadata\n            self.vectorstore = Qdrant(client, collection_name='all_docs',\n                                     embeddings=self.embeddings)\n\n        def add_documents(self, tenant_id: str, documents: list):\n            # Add tenant_id to every chunk's metadata\n            for doc in documents:\n                doc.metadata['tenant_id'] = tenant_id\n                doc.metadata['doc_hash'] = hash(doc.page_content)  # dedup\n            self.vectorstore.add_documents(documents)\n\n        def get_retriever(self, tenant_id: str, k: int = 5):\n            # CRITICAL: filter by tenant_id at retrieval time\n            return self.vectorstore.as_retriever(\n                search_kwargs={\n                    'k': k,\n                    'filter': {'tenant_id': {'$eq': tenant_id}}  # Qdrant filter\n                    # For Pinecone: filter={'tenant_id': tenant_id}\n                    # For pgvector: WHERE metadata->>'tenant_id' = 'xxx'\n                }\n            )\n\n        def get_chain(self, tenant_id: str, user_id: str):\n            retriever = self.get_retriever(tenant_id)\n\n            # Also implement row-level: some users see subset of company docs\n            # retriever.search_kwargs['filter'] = {\n            #     'tenant_id': tenant_id,\n            #     'department': user.department\n            # }\n\n            prompt = ChatPromptTemplate.from_template(\"\"\"\n            Answer using ONLY context below. Do not use outside knowledge.\n            Context: {context}\\nQuestion: {question}\n            \"\"\")\n\n            return (\n                {'context': retriever | format_docs,\n                 'question': RunnablePassthrough()}\n                | prompt\n                | ChatOpenAI(model='gpt-4o', temperature=0)\n                | StrOutputParser()\n            )\n\n    # Usage\n    rag = MultiTenantRAG()\n    rag.add_documents('company_abc', load_docs('./abc_docs/'))\n    rag.add_documents('company_xyz', load_docs('./xyz_docs/'))\n\n    # Each company gets isolated chain\n    abc_chain = rag.get_chain('company_abc', user_id='user_1')\n    result = abc_chain.invoke('What is our sick leave policy?')\n    # CANNOT access company_xyz documents\n\nSecurity notes:\n    # NEVER trust client-provided tenant_id without authentication\n    # Validate tenant_id from JWT/session, not request body\n    # Log all cross-tenant access attempts\n    # Consider separate collections for highest-security tenants", "cross": ["What are the performance implications of metadata filtering vs separate collections per tenant?", "How do you handle document deduplication when the same document exists for multiple tenants?", "What is the 'tenant bleed' attack and how do you prevent it with metadata filtering?"]}, {"q": "What is the difference between LCEL batch and multiple invoke calls?", "a": "LCEL .batch() runs multiple inputs concurrently using a thread pool, while multiple .invoke() calls are sequential.\n\n    from langchain_openai import ChatOpenAI\n    from langchain.prompts import ChatPromptTemplate\n    from langchain_core.output_parsers import StrOutputParser\n\n    chain = ChatPromptTemplate.from_template('Translate to French: {text}') | ChatOpenAI() | StrOutputParser()\n\n    # Sequential — slow: 3 × 2s = 6s\n    results = []\n    for text in ['Hello', 'World', 'Python']:\n        results.append(chain.invoke({'text': text}))\n\n    # Batch — parallel: max(2s,2s,2s) = ~2s\n    results = chain.batch(\n        [{'text': 'Hello'}, {'text': 'World'}, {'text': 'Python'}],\n        config={'max_concurrency': 5}  # max parallel calls\n    )\n\n    # Async batch (fastest)\n    results = await chain.abatch(\n        [{'text': t} for t in ['Hello', 'World', 'Python']]\n    )\n\n    # Error handling in batch\n    results = chain.batch(\n        inputs,\n        return_exceptions=True  # don't fail all if one fails\n    )\n    # Returns: [result, result, Exception, result, ...]\n    successes = [r for r in results if not isinstance(r, Exception)]\n    failures = [r for r in results if isinstance(r, Exception)]\n\nWhen to use batch:\n    - Processing lists of items (translate 100 items, summarize 50 docs)\n    - Parallel embedding generation\n    - Bulk classification\n    - Any time inputs are independent of each other\n\nmax_concurrency governs parallelism:\n    # Too high → API rate limit errors\n    # Too low → doesn't fully parallelize\n    # Rule of thumb: start at 5, tune based on API limits", "cross": ["How do you handle partial failures in batch processing — retry only failed items?", "What is the difference between threading-based batch and asyncio-based batch?", "How do you implement progress tracking for a batch job processing 10,000 documents?"]}, {"q": "What are LangChain runnables? Explain the Runnable interface.", "a": "Every component in LCEL implements the Runnable interface. This provides a unified API across all components.\n\nRunnable interface methods:\n    # .invoke(input) → output          (sync, single)\n    # .stream(input) → Iterator        (sync, streaming)\n    # .batch(inputs) → list[output]   (sync, parallel)\n    # .ainvoke(input) → Awaitable     (async, single)\n    # .astream(input) → AsyncIterator  (async, streaming)\n    # .abatch(inputs) → Awaitable     (async, parallel)\n\nBuilding custom Runnables:\n    from langchain_core.runnables import RunnableLambda, RunnableParallel\n    from langchain_core.runnables import RunnablePassthrough, RunnableBranch\n\n    # RunnableLambda: wrap any function\n    def double(x: int) -> int:\n        return x * 2\n    doubler = RunnableLambda(double)\n    doubler.invoke(5)  # 10\n    list(doubler.stream(5))  # [10]\n\n    # RunnablePassthrough: pass input unchanged\n    passthrough = RunnablePassthrough()\n    passthrough.invoke({'key': 'value'})  # {'key': 'value'}\n\n    # RunnableParallel: fan out to multiple runnables, collect results\n    parallel = RunnableParallel(\n        translation=translate_chain,\n        summary=summary_chain,\n        original=RunnablePassthrough()\n    )\n    result = parallel.invoke({'text': 'Hello world'})\n    # {'translation': '...', 'summary': '...', 'original': {'text': 'Hello world'}}\n\n    # RunnableBranch: conditional routing\n    from langchain_core.runnables import RunnableBranch\n    branch = RunnableBranch(\n        (lambda x: 'code' in x['question'].lower(), code_chain),\n        (lambda x: 'math' in x['question'].lower(), math_chain),\n        general_chain  # default\n    )\n\n    # Chain them\n    pipeline = (\n        RunnableParallel(question=RunnablePassthrough(), context=retriever)\n        | prompt\n        | llm\n        | StrOutputParser()\n    )\n\n    # Configuration\n    chain_with_config = chain.with_config(\n        run_name='my_chain',\n        tags=['production'],\n        metadata={'version': '2.0'}\n    )\n\n    # Retry\n    robust_chain = chain.with_retry(\n        retry_if_exception_type=(RateLimitError,),\n        stop_after_attempt=3,\n        wait_exponential_jitter=True\n    )", "cross": ["What is the difference between RunnableMap and RunnableParallel?", "How do you compose Runnables that have incompatible input/output schemas?", "What is the with_listeners method and how do you use it for telemetry?"]}, {"q": "How do LangChain document loaders work? Handle different file types.", "a": "Document loaders ingest files/URLs/APIs into LangChain Document objects (page_content + metadata).\n\n    from langchain_community.document_loaders import (\n        PyPDFLoader, TextLoader, CSVLoader,\n        WebBaseLoader, DirectoryLoader, JSONLoader,\n        UnstructuredMarkdownLoader, UnstructuredHTMLLoader,\n        GitLoader, ConfluenceLoader, NotionLoader\n    )\n\n    # PDF — split by page\n    loader = PyPDFLoader('document.pdf')\n    pages = loader.load()  # List[Document], each page = one Document\n    # pages[0].metadata = {'source': 'document.pdf', 'page': 0}\n\n    # Lazy loading (memory-efficient for large files)\n    for page in loader.lazy_load():\n        process(page)\n\n    # CSV with specific columns\n    loader = CSVLoader(\n        'data.csv',\n        csv_args={'delimiter': ','},\n        source_column='url'  # use this column as metadata source\n    )\n\n    # Web scraping\n    loader = WebBaseLoader(\n        web_paths=['https://docs.langchain.com/'],\n        bs_kwargs={'parse_only': SoupStrainer('article')}  # CSS selector\n    )\n\n    # Directory with multiple types\n    loader = DirectoryLoader(\n        './knowledge_base/',\n        glob='**/*.{pdf,txt,md}',\n        loader_cls=UnstructuredFileLoader,\n        show_progress=True,\n        use_multithreading=True,  # parallel loading\n        max_concurrency=4\n    )\n    docs = loader.load()\n\n    # JSON with jq-like selector\n    loader = JSONLoader(\n        'data.json',\n        jq_schema='.records[].content',  # extract specific field\n        text_content=True\n    )\n\n    # Adding custom metadata\n    loader = PyPDFLoader('contract.pdf')\n    docs = loader.load()\n    for doc in docs:\n        doc.metadata['document_type'] = 'contract'\n        doc.metadata['tenant_id'] = current_tenant\n        doc.metadata['indexed_at'] = datetime.now().isoformat()\n\n    # Async loading\n    docs = await loader.aload()\n\nHandling failures:\n    loader = DirectoryLoader('./docs', loader_cls=PyPDFLoader,\n                             silent_errors=True)  # skip bad files\n    docs = loader.load()\n    # Check: print how many loaded vs total files", "cross": ["How do you handle PDFs with embedded images or scanned pages (OCR)?", "What is Unstructured.io and when would you use it over PyPDF?", "How do you implement incremental loading — only load new/changed documents?"]}, {"q": "What is LangChain's text splitting strategy? How do you choose?", "a": "Text splitting = break documents into chunks for vector embedding. Chunk strategy dramatically affects RAG quality.\n\n    from langchain.text_splitter import (\n        RecursiveCharacterTextSplitter,  # BEST for most text\n        CharacterTextSplitter,           # simple, single separator\n        TokenTextSplitter,               # split by LLM tokens\n        MarkdownTextSplitter,            # respects # headers\n        PythonCodeTextSplitter,          # respects functions/classes\n        HTMLHeaderTextSplitter,          # splits on HTML headers\n        SemanticChunker,                 # experimental: semantic boundaries\n    )\n\n    # RecursiveCharacterTextSplitter: tries separators in order\n    # Default separators: ['\\n\\n', '\\n', '. ', ' ', '']\n    splitter = RecursiveCharacterTextSplitter(\n        chunk_size=512,        # target size in chars\n        chunk_overlap=64,      # overlap between chunks (preserve context)\n        length_function=len,   # can use tiktoken for token count\n        add_start_index=True,  # adds char offset to metadata\n        separators=['\\n\\n', '\\n', '. ', ', ', ' ', '']  # customize\n    )\n\n    # Token-based (use when context window matters)\n    from langchain.text_splitter import TokenTextSplitter\n    import tiktoken\n    splitter = TokenTextSplitter(\n        encoding_name='cl100k_base',  # GPT-4 tokenizer\n        chunk_size=256,    # tokens, not chars\n        chunk_overlap=32\n    )\n\n    # Code-aware (respects function boundaries)\n    splitter = PythonCodeTextSplitter(chunk_size=1000, chunk_overlap=100)\n\n    # Semantic chunking (experimental)\n    from langchain_experimental.text_splitter import SemanticChunker\n    splitter = SemanticChunker(\n        OpenAIEmbeddings(),\n        breakpoint_threshold_type='percentile',  # or 'standard_deviation'\n        breakpoint_threshold_amount=95           # 95th percentile similarity drop\n    )\n    # Splits where semantic similarity drops sharply\n\nChunk size guide:\n    Small (100-200): high precision, loses context → good for facts\n    Medium (400-600): balanced → most common choice\n    Large (800-1200): more context, less precision → good for reasoning\n    Overlap (10-20%): prevents losing info at chunk boundaries\n\nParent-child strategy (ADVANCED):\n    # Index small chunks (precision), retrieve large chunks (context)\n    from langchain.retrievers import ParentDocumentRetriever\n    child_splitter = RecursiveCharacterTextSplitter(chunk_size=200)\n    parent_splitter = RecursiveCharacterTextSplitter(chunk_size=2000)\n    retriever = ParentDocumentRetriever(\n        vectorstore=vectorstore,\n        docstore=InMemoryStore(),\n        child_splitter=child_splitter,\n        parent_splitter=parent_splitter\n    )", "cross": ["Why does chunk overlap matter and what are the downsides of large overlap?", "How do you chunk multi-page tables and figures in PDFs?", "What is the 'chunking is dead' argument and what does it advocate for instead?"]}, {"q": "How do you implement multi-query RAG in LangChain?", "a": "Multi-query RAG = rewrite the user's question multiple ways, retrieve for each, merge results. Improves recall.\n\nWhy it helps:\n    # User asks: 'cancellation policy'\n    # Single query misses: 'refund terms', 'booking termination', 'how to cancel'\n    # Multi-query retrieves all of them!\n\n    from langchain.retrievers.multi_query import MultiQueryRetriever\n    from langchain_openai import ChatOpenAI\n\n    # Option 1: Built-in MultiQueryRetriever\n    llm = ChatOpenAI(model='gpt-4o-mini', temperature=0)\n    retriever = MultiQueryRetriever.from_llm(\n        retriever=base_retriever,\n        llm=llm,\n        include_original=True  # include original query too\n    )\n    # Automatically generates 3 alternative phrasings\n    docs = retriever.invoke('cancellation policy')\n\n    # Option 2: Custom multi-query with control\n    from langchain.prompts import ChatPromptTemplate\n    from langchain_core.output_parsers import StrOutputParser\n\n    query_expansion_prompt = ChatPromptTemplate.from_template(\"\"\"\n    Generate 3 different search queries that could answer this question.\n    Think about: synonyms, different angles, related concepts.\n    Return ONLY the queries, one per line.\n    Original question: {question}\n    \"\"\")\n\n    query_expander = query_expansion_prompt | llm | StrOutputParser()\n\n    def multi_query_retrieve(question: str) -> list:\n        # Generate alternative queries\n        raw = query_expander.invoke({'question': question})\n        queries = [q.strip() for q in raw.split('\\n') if q.strip()]\n        queries.append(question)  # always include original\n\n        # Retrieve for each, deduplicate by content hash\n        seen = set()\n        all_docs = []\n        for q in queries:\n            for doc in base_retriever.invoke(q):\n                doc_hash = hash(doc.page_content)\n                if doc_hash not in seen:\n                    seen.add(doc_hash)\n                    all_docs.append(doc)\n\n        return all_docs[:10]  # top 10 unique docs\n\n    # Wrap in LCEL\n    from langchain_core.runnables import RunnableLambda\n\n    rag_chain = (\n        {'context': RunnableLambda(multi_query_retrieve) | format_docs,\n         'question': RunnablePassthrough()}\n        | prompt | llm | StrOutputParser()\n    )\n    answer = rag_chain.invoke('cancellation policy')", "cross": ["What is query decomposition (step-back prompting) and how does it differ from multi-query?", "When does multi-query retrieval hurt performance — what are the failure cases?", "How do you deduplicate semantically similar documents (not just identical) across query results?"]}, {"q": "How do LangChain retrievers work? Advanced retrieval strategies.", "a": "Retrievers = components that find relevant documents given a query. Abstract over any data source.\n\nBuilt-in retriever types:\n    # Vector store retriever (most common)\n    retriever = vectorstore.as_retriever(\n        search_type='similarity',          # default\n        # search_type='mmr',               # max marginal relevance (diverse)\n        # search_type='similarity_score_threshold',  # filter by score\n        search_kwargs={\n            'k': 5,                        # return top 5\n            'fetch_k': 50,                 # MMR: fetch more, pick diverse k\n            'lambda_mult': 0.5,            # MMR: 0=max diversity, 1=max relevance\n            'score_threshold': 0.7,        # min similarity score\n            'filter': {'dept': 'HR'}       # metadata filter\n        }\n    )\n\n    # BM25 (keyword)\n    from langchain_community.retrievers import BM25Retriever\n    bm25 = BM25Retriever.from_documents(docs, k=5)\n\n    # Ensemble (hybrid)\n    from langchain.retrievers import EnsembleRetriever\n    hybrid = EnsembleRetriever(\n        retrievers=[bm25, vector_retriever],\n        weights=[0.4, 0.6]  # tune: BM25 weight vs semantic weight\n    )\n\n    # Contextual compression (reranking + extraction)\n    from langchain.retrievers import ContextualCompressionRetriever\n    from langchain.retrievers.document_compressors import LLMChainExtractor\n\n    compressor = LLMChainExtractor.from_llm(llm)  # extract relevant parts\n    compression_retriever = ContextualCompressionRetriever(\n        base_compressor=compressor,\n        base_retriever=base_retriever\n    )\n\n    # With Cohere reranker (BEST production setup)\n    from langchain_cohere import CohereRerank\n    reranker = CohereRerank(model='rerank-english-v3.0', top_n=3)\n    reranking_retriever = ContextualCompressionRetriever(\n        base_compressor=reranker,\n        base_retriever=hybrid\n    )\n\n    # MultiQueryRetriever\n    from langchain.retrievers.multi_query import MultiQueryRetriever\n    multi_query = MultiQueryRetriever.from_llm(retriever=base_retriever, llm=llm)\n\n    # Self-querying (generates structured filters from natural language)\n    from langchain.retrievers.self_query.base import SelfQueryRetriever\n    from langchain.chains.query_constructor.base import AttributeInfo\n    metadata_field_info = [\n        AttributeInfo(name='year', description='Publication year', type='integer'),\n        AttributeInfo(name='dept', description='Department', type='string'),\n    ]\n    self_query_retriever = SelfQueryRetriever.from_llm(\n        llm, vectorstore, 'Company documents', metadata_field_info\n    )\n    # 'Find HR documents from 2023' → filter: {dept: HR, year: 2023}", "cross": ["What is MMR (Maximum Marginal Relevance) and when should you use it?", "How does self-querying retriever generate metadata filters and what are its limitations?", "What is two-stage retrieval and how does it combine recall and precision optimally?"]}, {"q": "TRICKY: What is the difference between LangChain's Agent and a manual LLM loop?", "a": "A common interview question that tests deep understanding.\n\nManual LLM loop:\n    # You control EVERYTHING\n    while True:\n        response = llm.invoke(messages)\n        if response.content.startswith('Final:'):\n            break\n        tool_name, args = parse_tool_call(response.content)  # fragile!\n        result = tools[tool_name](**args)\n        messages.append(AIMessage(response.content))\n        messages.append(HumanMessage(f'Tool result: {result}'))\n\n    # Problems:\n    # 1. Fragile parsing (LLM doesn't always format perfectly)\n    # 2. No error handling (parse fails → crash)\n    # 3. No iteration limits (infinite loop possible)\n    # 4. No streaming support\n    # 5. Reinventing every wheel\n\nLangChain Agent:\n    from langchain.agents import create_openai_tools_agent, AgentExecutor\n\n    # Uses OpenAI function calling → structured JSON (not text parsing!)\n    agent = create_openai_tools_agent(llm, tools, prompt)\n    executor = AgentExecutor(\n        agent=agent,\n        tools=tools,\n        max_iterations=10,           # prevents infinite loops\n        handle_parsing_errors=True,  # LLM formats wrong → retry\n        early_stopping_method='generate',  # vs 'force'\n        return_intermediate_steps=True,    # see all reasoning steps\n        verbose=True\n    )\n\nKey advantages of AgentExecutor:\n    1. Structured tool calling (JSON schema, not text parsing)\n    2. handle_parsing_errors: auto-retry when LLM output malformed\n    3. max_iterations: guaranteed termination\n    4. Callbacks: built-in observability\n    5. Streaming via executor.astream()\n    6. Return intermediate steps for debugging\n    7. Async support built in\n\nWhen manual loop IS better:\n    - Extremely custom logic that AgentExecutor can't express\n    - Need fine-grained control over message history\n    - LangGraph for complex stateful agents (use LangGraph, not manual loop)\n\nRule of thumb:\n    Simple single-tool loop → LangChain Agent\n    Complex multi-step stateful → LangGraph\n    One-off custom → manual loop (prototype only)", "cross": ["What does handle_parsing_errors actually do under the hood when triggered?", "What is early_stopping_method='force' vs 'generate' and when does it matter?", "How does return_intermediate_steps help you debug agent failures in production?"]}, {"q": "SITUATION: Production LangChain app has memory leaks causing OOM crashes. Debug it.", "a": "Memory leak debugging in LangChain production:\n\nCommon LangChain memory leak sources:\n\n    # Source 1: LangSmith callbacks accumulate in memory\n    # Every chain call creates a new callback handler — not garbage collected\n    # Fix: use the global env var approach, not per-call handler\n\n    # BAD: creates new handler every request\n    @app.post('/chat')\n    def chat(req):\n        handler = LangSmithCallbackHandler()  # leaks!\n        result = chain.invoke(req.question, config={'callbacks': [handler]})\n\n    # GOOD: global env var — LangChain reuses connection pool\n    import os\n    os.environ['LANGCHAIN_TRACING_V2'] = 'true'  # set at startup\n    # chain.invoke(...) — no per-call handler needed\n\n    # Source 2: VectorStore kept in memory per request\n    # BAD: creates new vectorstore per user request\n    @app.post('/query')\n    def query(req):\n        vs = FAISS.from_documents(docs, embeddings)  # loads all docs into RAM!\n        return vs.similarity_search(req.question)\n\n    # GOOD: singleton, loaded once at startup\n    vectorstore = FAISS.load_local('./index', embeddings)  # at startup\n    @app.post('/query')\n    def query(req):\n        return vectorstore.similarity_search(req.question)\n\n    # Source 3: Conversation memory growing unbounded\n    # Each user session keeps ALL messages in RAM\n    # If 1000 users × 500 messages × 200 bytes = 100MB minimum\n\n    # GOOD: external storage + window memory\n    from langchain.memory import RedisChatMessageHistory\n    memory = ConversationBufferWindowMemory(\n        chat_memory=RedisChatMessageHistory(session_id=user_id, url=REDIS_URL),\n        k=10  # only last 10 messages in RAM\n    )\n\n    # Source 4: LangChain global state with callbacks\n    from langchain.globals import get_callback_manager\n    # Clear between requests if needed\n\n    # Profiling with tracemalloc\n    import tracemalloc\n    tracemalloc.start()\n    # ... run requests ...\n    snapshot = tracemalloc.take_snapshot()\n    top_stats = snapshot.statistics('lineno')\n    for stat in top_stats[:10]:\n        print(stat)\n\n    # Docker/K8s: set memory limits + restart policy\n    # resources: limits: memory: '512Mi'\n    # restartPolicy: Always  # auto-restart on OOM", "cross": ["How do you profile Python memory usage for an async FastAPI application?", "What is the difference between memory leak and memory growth in long-running LLM apps?", "How do you implement connection pooling for LLM API clients to avoid resource exhaustion?"]}]}, "LangGraph": {"icon": "🕸️", "color": "#dc2626", "questions": [{"q": "What is LangGraph and why was it created?", "a": "LangGraph is a library for building stateful, cyclical, multi-actor applications with LLMs. Built on top of LangChain but addresses its key limitation: chains are DAGs (no cycles), but agents need loops.\n\nWhy it exists:\n- Agents need cycles: think → act → observe → think → act\n- Complex workflows need branching, parallel execution, state\n- Production agents need persistence, human-in-the-loop, resumption\n- LangChain chains couldn't handle all of this\n\nCore concepts:\n    from langgraph.graph import StateGraph, END\n    from typing import TypedDict, Annotated\n    import operator\n\n    # State = shared data structure across all nodes\n    class AgentState(TypedDict):\n        messages: Annotated[list, operator.add]  # append-only\n        next: str\n        error_count: int\n\n    # Nodes = Python functions that transform state\n    def agent_node(state: AgentState) -> dict:\n        response = llm.invoke(state['messages'])\n        return {'messages': [response]}\n\n    def tool_node(state: AgentState) -> dict:\n        last_msg = state['messages'][-1]\n        results = execute_tools(last_msg.tool_calls)\n        return {'messages': results}\n\n    # Build graph\n    graph = StateGraph(AgentState)\n    graph.add_node('agent', agent_node)\n    graph.add_node('tools', tool_node)\n    graph.set_entry_point('agent')\n\n    # Conditional edge (branching)\n    def route(state):\n        if state['messages'][-1].tool_calls: return 'tools'\n        return END\n\n    graph.add_conditional_edges('agent', route)\n    graph.add_edge('tools', 'agent')  # cycle!\n\n    app = graph.compile()\n    result = app.invoke({'messages': [HumanMessage('Search for Python news')]})\n\nLangChain vs LangGraph:\n    LangChain LCEL: linear/branching, no cycles, no state persistence\n    LangGraph: cyclic, stateful, persistent, human-in-the-loop native", "cross": ["When would you use LangChain LCEL instead of LangGraph for an agent?", "What is the StateGraph vs MessageGraph distinction?", "How does LangGraph handle concurrent node execution?"]}, {"q": "How does LangGraph state management work?", "a": "State = TypedDict passed between all nodes. Each node returns partial updates, LangGraph merges them.\n\nState schemas:\n    from typing import TypedDict, Annotated, Optional\n    import operator\n\n    # operator.add = append lists (don't overwrite)\n    # No annotation = last-write-wins\n    class MyState(TypedDict):\n        messages: Annotated[list, operator.add]  # append: [a] + [b] = [a, b]\n        question: str                             # overwrite: last write wins\n        answer: Optional[str]                     # overwrite, can be None\n        attempt_count: Annotated[int, lambda a,b: a+b]  # custom reducer: add\n        errors: Annotated[list, lambda a,b: a+b]  # custom append\n\n    # Node returns PARTIAL state update\n    def research_node(state: MyState) -> dict:\n        # Only return what changed\n        result = do_research(state['question'])\n        return {\n            'messages': [AIMessage(result)],  # appended to existing messages\n            'answer': result,                  # overwrites previous answer\n            'attempt_count': 1                 # adds to existing count\n        }\n        # DON'T return: question (unchanged), errors (unchanged)\n\nDefault state merging:\n    # LangGraph merges: current_state + node_output = new_state\n    # Lists with operator.add: extend\n    # Scalars: overwrite\n    # Dicts: merge (shallow)\n\nUpdating state externally:\n    app = graph.compile(checkpointer=checkpointer)\n    config = {'configurable': {'thread_id': 'thread-1'}}\n\n    # Get current state\n    current = app.get_state(config)\n    print(current.values)  # {'messages': [...], 'answer': '...'}\n\n    # Manually update state (for HITL modifications)\n    app.update_state(\n        config,\n        {'answer': 'Corrected answer by human reviewer'},\n        as_node='human_review'  # attribute update to this node\n    )\n\n    # Resume\n    result = app.invoke(None, config)\n\nState schema tips:\n    # Keep state flat (not deeply nested)\n    # Use Pydantic for validation:\n    from pydantic import BaseModel\n    class ValidatedState(BaseModel):\n        messages: list = []\n        confidence: float = 0.0\n        max_retries: int = 3", "cross": ["What happens when two parallel nodes try to update the same state field?", "How do you implement state versioning for audit trail in LangGraph?", "What is the performance overhead of state serialization in LangGraph checkpointing?"]}, {"q": "How do you implement human-in-the-loop with LangGraph?", "a": "HITL = pause graph execution, wait for human decision, resume with their input.\n\n    from langgraph.graph import StateGraph, END\n    from langgraph.checkpoint.postgres import PostgresSaver\n    from langchain_core.messages import HumanMessage\n\n    # 1. Checkpointer (required for HITL)\n    checkpointer = PostgresSaver.from_conn_string(DATABASE_URL)\n\n    # 2. Compile with interrupt points\n    app = graph.compile(\n        checkpointer=checkpointer,\n        interrupt_before=['execute_action'],  # pause BEFORE this node\n        # interrupt_after=['generate_plan'],  # pause AFTER this node\n    )\n\n    # 3. Run until interrupt\n    config = {'configurable': {'thread_id': f'task-{task_id}'}}\n    state = app.invoke(\n        {'messages': [HumanMessage('Send marketing email to all customers')]},\n        config=config\n    )\n    # Graph pauses at 'execute_action' node\n    # state contains pending action details\n\n    # 4. Show pending action to human\n    pending_action = state['messages'][-1]\n    print(f'Pending: {pending_action.content}')\n\n    # 5a. Approve — resume unchanged\n    if human_approves:\n        final = app.invoke(None, config)  # continue from checkpoint\n\n    # 5b. Modify — update state then resume\n    elif human_modifies:\n        app.update_state(\n            config,\n            {'messages': [AIMessage('Send to VIP customers only, not all customers')]}\n        )\n        final = app.invoke(None, config)\n\n    # 5c. Reject — add rejection to state\n    else:\n        app.update_state(config, {'approved': False, 'rejection_reason': 'Too risky'})\n        # Could route to END or alternative path\n\n    # Async HITL with web UI\n    @app.post('/approve')\n    async def approve_task(task_id: str, approved: bool, modification: str = None):\n        config = {'configurable': {'thread_id': f'task-{task_id}'}}\n        if modification:\n            await app.aupdate_state(config, {'human_feedback': modification})\n        result = await app.ainvoke(None, config)\n        return {'result': result}\n\nCommon HITL patterns:\n    - Email before send\n    - Database write before execute\n    - API call before fire\n    - Generated report before publish\n    - Code before run in production", "cross": ["How do you implement timeouts for HITL — what if no human approves for 24 hours?", "Can you have multiple interrupt points in a single graph run? How do they work?", "How do you build a web dashboard that shows all pending HITL approvals across users?"]}, {"q": "How does LangGraph checkpointing work for fault tolerance?", "a": "Checkpointing = persist complete graph state after every node execution. Enables resume on failure, HITL pauses, time-travel debugging.\n\n    # Checkpoint backends\n    from langgraph.checkpoint.memory import MemorySaver    # dev/testing\n    from langgraph.checkpoint.sqlite import SqliteSaver     # single machine\n    from langgraph.checkpoint.postgres import PostgresSaver  # production\n    from langgraph.checkpoint.redis import RedisSaver       # high throughput\n\n    # Production setup\n    checkpointer = PostgresSaver.from_conn_string(\n        'postgresql://user:pass@localhost/langgraph'\n    )\n    checkpointer.setup()  # creates tables\n\n    app = graph.compile(checkpointer=checkpointer)\n\n    # thread_id = unique identifier for workflow instance\n    config = {'configurable': {'thread_id': 'order-processing-abc-123'}}\n\n    # Run (saves checkpoint after each node)\n    result = app.invoke(initial_state, config)\n\n    # On failure: just re-invoke — continues from last checkpoint\n    try:\n        result = app.invoke(initial_state, config)\n    except Exception as e:\n        print(f'Failed at step N: {e}')\n        # Next invocation automatically resumes from last good checkpoint:\n        result = app.invoke(None, config)  # None = continue, not restart\n\nTime-travel debugging:\n    # List all checkpoints for a thread\n    history = list(app.get_state_history(config))\n    for h in history:\n        print(h.step, h.values.keys(), h.next)\n\n    # Jump back to specific checkpoint\n    old_checkpoint = history[3]\n    replay_config = {\n        'configurable': {\n            'thread_id': 'new-debug-thread',\n            'checkpoint_id': old_checkpoint.config['configurable']['checkpoint_id']\n        }\n    }\n    app.invoke(None, replay_config)\n\nCheckpoint structure:\n    {\n        'thread_id': 'abc-123',\n        'checkpoint_id': 'uuid-...',\n        'step': 5,\n        'values': {state dict},  # full state snapshot\n        'next': ['tool_node'],   # which nodes run next\n        'metadata': {'source': 'loop', 'writes': {...}}\n    }\n\nLong-running workflow example:\n    # Day 1: start analysis workflow\n    app.invoke(initial_state, config)  # runs 3 nodes, saves checkpoint\n    # Server crashes!\n    # Day 2: resume automatically from node 3\n    app.invoke(None, config)  # picks up where it left off", "cross": ["How do you implement checkpoint pruning to prevent database growth?", "What is the performance impact of checkpointing on fast-running graphs?", "How do you migrate checkpoints when you change the graph structure?"]}, {"q": "Build a multi-agent supervisor system in LangGraph.", "a": "Supervisor pattern: orchestrator LLM routes tasks to specialized worker agents.\n\n    from langgraph.graph import StateGraph, END\n    from langchain_openai import ChatOpenAI\n    from typing import TypedDict, Annotated, Literal\n    import operator\n\n    llm = ChatOpenAI(model='gpt-4o', temperature=0)\n\n    class SupervisorState(TypedDict):\n        messages: Annotated[list, operator.add]\n        next_agent: str\n        task: str\n        results: dict\n        iteration: int\n\n    WORKERS = ['researcher', 'analyst', 'writer']\n\n    # Supervisor: decides which worker to call next\n    def supervisor(state: SupervisorState):\n        routing_prompt = f\"\"\"\n        Task: {state['task']}\n        Results so far: {state.get('results', {})}\n        Completed iterations: {state['iteration']}\n\n        Available workers: {WORKERS}\n        Who should act next? Or reply FINISH if done.\n        Reply with exactly one of: {WORKERS + ['FINISH']}\n        \"\"\"\n        response = llm.invoke(routing_prompt)\n        next_agent = response.content.strip()\n        if next_agent not in WORKERS:\n            next_agent = 'FINISH'\n        return {'next_agent': next_agent, 'iteration': state['iteration'] + 1}\n\n    # Worker agents\n    def researcher(state: SupervisorState):\n        result = llm.invoke(f'Research: {state[\"task\"]}').content\n        return {\n            'messages': [AIMessage(f'[Researcher]: {result[:200]}')],\n            'results': {'research': result}\n        }\n\n    def analyst(state: SupervisorState):\n        research = state.get('results', {}).get('research', '')\n        result = llm.invoke(f'Analyze: {research}\\nTask: {state[\"task\"]}').content\n        return {\n            'messages': [AIMessage(f'[Analyst]: {result[:200]}')],\n            'results': {'analysis': result}\n        }\n\n    def writer(state: SupervisorState):\n        context = str(state.get('results', {}))\n        result = llm.invoke(f'Write report. Context: {context}').content\n        return {\n            'messages': [AIMessage(f'[Writer]: {result[:200]}')],\n            'results': {'report': result}\n        }\n\n    # Build graph\n    workflow = StateGraph(SupervisorState)\n    workflow.add_node('supervisor', supervisor)\n    workflow.add_node('researcher', researcher)\n    workflow.add_node('analyst', analyst)\n    workflow.add_node('writer', writer)\n    workflow.set_entry_point('supervisor')\n\n    # Route from supervisor\n    workflow.add_conditional_edges('supervisor',\n        lambda s: s['next_agent'],\n        {'researcher': 'researcher', 'analyst': 'analyst',\n         'writer': 'writer', 'FINISH': END}\n    )\n\n    # All workers report back to supervisor\n    for w in WORKERS:\n        workflow.add_edge(w, 'supervisor')\n\n    # Safety: max iterations\n    def check_iterations(state):\n        if state['iteration'] > 10:\n            return END\n        return 'supervisor'\n\n    app = workflow.compile(checkpointer=MemorySaver())\n    result = app.invoke({\n        'task': 'Analyze trends in LLM adoption for enterprise',\n        'iteration': 0, 'results': {}\n    })", "cross": ["How do you prevent the supervisor from creating infinite loops of the same worker?", "How do you implement parallel worker execution (researcher + analyst at the same time)?", "What happens when a worker agent fails — how does the supervisor handle it?"]}, {"q": "How do you implement parallel node execution in LangGraph?", "a": "LangGraph supports fan-out (parallel execution) natively using Send or RunnableParallel patterns.\n\nMethod 1: RunnableParallel (same input, multiple branches):\n    from langgraph.graph import StateGraph, END\n    from langgraph.constants import Send\n\n    # Fan-out: run same task on multiple items in parallel\n    def parallel_research(state):\n        queries = state['queries']  # ['topic1', 'topic2', 'topic3']\n        # Send to worker node N times with different inputs\n        return [Send('researcher', {'query': q}) for q in queries]\n\n    graph.add_conditional_edges('generate_queries', parallel_research)\n\n    def researcher(state):\n        result = search_tool.run(state['query'])\n        return {'results': [result]}  # each worker adds to results list\n\n    # Fan-in: aggregator collects all results\n    def aggregate(state):\n        all_results = state['results']  # list from all parallel workers\n        summary = llm.invoke(f'Summarize: {all_results}').content\n        return {'final_answer': summary}\n\n    graph.add_node('researcher', researcher)\n    graph.add_node('aggregate', aggregate)\n    graph.add_edge('researcher', 'aggregate')  # all workers merge here\n\nMethod 2: Multiple edges from one node:\n    # Branch into independent paths\n    def split_task(state):\n        return {'task_a': state['input'], 'task_b': state['input']}\n\n    # Run both branches — LangGraph executes simultaneously\n    graph.add_edge('split_task', 'path_a')\n    graph.add_edge('split_task', 'path_b')\n    # Both path_a and path_b run in parallel\n    # Next node waits for both to complete\n\nParallel map-reduce pattern:\n    class MapReduceState(TypedDict):\n        documents: list[str]        # input: list of docs\n        summaries: Annotated[list, operator.add]  # output: collected\n        final_summary: str\n\n    def map_summarize(state):\n        # Each call processes ONE document\n        summary = llm.invoke(f'Summarize: {state[\"document\"]}').content\n        return {'summaries': [summary]}\n\n    def reduce_summaries(state):\n        combined = '\\n'.join(state['summaries'])\n        final = llm.invoke(f'Combine: {combined}').content\n        return {'final_summary': final}\n\n    def fan_out(state):\n        return [Send('summarize', {'document': doc})\n                for doc in state['documents']]\n\n    graph.add_conditional_edges('start', fan_out)\n    graph.add_edge('summarize', 'reduce')\n\nPerformance:\n    # 10 parallel research calls: ~5s total vs ~50s sequential\n    # LangGraph uses asyncio for parallel execution\n    result = await app.ainvoke(state)  # use async for parallel benefits", "cross": ["How does LangGraph synchronize parallel branches — does it wait for all to complete?", "What happens if one parallel branch fails while others succeed?", "How do you limit parallelism to avoid rate limiting (e.g., max 5 concurrent API calls)?"]}, {"q": "What are LangGraph subgraphs? When do you use them?", "a": "Subgraphs = separate compiled graphs used as nodes within a parent graph. Enable modularity, reuse, and composition.\n\n    # Define reusable subgraph\n    from langgraph.graph import StateGraph, END\n\n    class ResearchState(TypedDict):\n        query: str\n        search_results: list\n        refined_answer: str\n\n    research_graph = StateGraph(ResearchState)\n    research_graph.add_node('search', search_web)\n    research_graph.add_node('refine', refine_results)\n    research_graph.set_entry_point('search')\n    research_graph.add_edge('search', 'refine')\n    research_graph.add_edge('refine', END)\n    research_subgraph = research_graph.compile()\n\n    # Use subgraph as a node in parent graph\n    class MainState(TypedDict):\n        task: str\n        research: dict\n        final_answer: str\n\n    def research_adapter(state: MainState):\n        # Transform parent state to subgraph input\n        sub_result = research_subgraph.invoke({'query': state['task']})\n        # Transform subgraph output back to parent state\n        return {'research': sub_result}\n\n    main_graph = StateGraph(MainState)\n    main_graph.add_node('research', research_adapter)\n    main_graph.add_node('synthesize', synthesize_node)\n    main_graph.set_entry_point('research')\n    main_graph.add_edge('research', 'synthesize')\n    main_app = main_graph.compile()\n\n    # Or directly add compiled subgraph as node\n    main_graph.add_node('research', research_subgraph)\n\nWhen to use subgraphs:\n    1. Reusable components (research module used in 3 different agents)\n    2. Complex node logic (replace single function with full graph)\n    3. Team separation (team A owns research subgraph)\n    4. Independent testing (test subgraph without parent)\n    5. Different state schemas (subgraph has own state)\n\nSubgraph checkpointing:\n    # Subgraph checkpoints are nested under parent thread\n    config = {\n        'configurable': {\n            'thread_id': 'main-thread',\n            # Subgraph uses: 'main-thread:research-subgraph'\n        }\n    }\n    # Parent checkpoint includes subgraph state", "cross": ["How do subgraph checkpoints interact with the parent graph checkpoint?", "What are the limitations of subgraphs compared to inline nodes?", "How do you pass shared dependencies (LLM client, vector store) to subgraphs?"]}, {"q": "How do you implement error handling and retries in LangGraph?", "a": "    from langgraph.graph import StateGraph, END\n    from typing import Optional\n    import time\n\n    class ResilientState(TypedDict):\n        messages: list\n        task: str\n        result: Optional[str]\n        error: Optional[str]\n        attempts: int\n        max_attempts: int\n\n    # Node with built-in retry logic\n    def llm_node_with_retry(state: ResilientState):\n        for attempt in range(3):\n            try:\n                response = llm.invoke(state['messages'])\n                return {'result': response.content, 'error': None}\n            except RateLimitError:\n                wait = 2 ** attempt  # exponential backoff\n                time.sleep(wait)\n            except Exception as e:\n                return {'error': str(e), 'result': None}\n        return {'error': 'Max retries exceeded', 'result': None}\n\n    # Conditional routing based on error state\n    def route_after_attempt(state: ResilientState):\n        if state.get('error') and state['attempts'] < state['max_attempts']:\n            return 'retry_node'\n        elif state.get('error'):\n            return 'error_handler'\n        else:\n            return 'success_node'\n\n    def retry_node(state: ResilientState):\n        # Modify approach for retry\n        new_messages = state['messages'] + [\n            HumanMessage(f'Previous attempt failed: {state[\"error\"]}. Try differently.')\n        ]\n        return {\n            'messages': new_messages,\n            'attempts': state['attempts'] + 1,\n            'error': None\n        }\n\n    def error_handler(state: ResilientState):\n        # Graceful degradation\n        fallback = f'Could not complete task: {state[\"error\"]}. Please try again.'\n        return {'result': fallback}\n\n    # Build graph\n    graph = StateGraph(ResilientState)\n    graph.add_node('llm', llm_node_with_retry)\n    graph.add_node('retry_node', retry_node)\n    graph.add_node('error_handler', error_handler)\n    graph.add_node('success_node', lambda s: s)  # passthrough\n\n    graph.set_entry_point('llm')\n    graph.add_conditional_edges('llm', route_after_attempt)\n    graph.add_edge('retry_node', 'llm')  # cycle: retry → llm again\n    graph.add_edge('error_handler', END)\n    graph.add_edge('success_node', END)\n\n    app = graph.compile()\n\nGlobal error handling:\n    # Wrap entire graph invocation\n    async def run_with_fallback(inputs, config):\n        try:\n            return await app.ainvoke(inputs, config)\n        except GraphRecursionError:\n            return {'error': 'Max iterations reached', 'result': None}\n        except Exception as e:\n            logger.error(f'Graph failed: {e}')\n            return {'error': str(e), 'result': None}", "cross": ["What is GraphRecursionError and what default iteration limit does LangGraph enforce?", "How do you implement circuit breaker pattern for external API calls in LangGraph nodes?", "How do you distinguish between recoverable errors (retry) and unrecoverable errors (fail fast)?"]}, {"q": "How do you stream intermediate LangGraph results to a frontend?", "a": "LangGraph supports streaming at multiple levels: node outputs, token-level from LLMs.\n\nBasic event streaming:\n    async for event in app.astream_events(\n        {'messages': [HumanMessage('Research LLM trends')]},\n        config=config,\n        version='v2'\n    ):\n        event_type = event['event']\n        name = event.get('name', '')\n\n        # Stream LLM tokens\n        if event_type == 'on_chat_model_stream':\n            chunk = event['data']['chunk'].content\n            print(chunk, end='', flush=True)\n\n        # Node started\n        elif event_type == 'on_chain_start' and event['run_type'] == 'graph':\n            pass\n\n        # Node completed\n        elif event_type == 'on_chain_end':\n            outputs = event['data'].get('output', {})\n\n        # Tool called\n        elif event_type == 'on_tool_start':\n            print(f'\\n[Calling tool: {name}]')\n\nFastAPI SSE endpoint:\n    from fastapi import FastAPI\n    from fastapi.responses import StreamingResponse\n    import json\n\n    app_http = FastAPI()\n\n    @app_http.post('/agent/stream')\n    async def stream_agent(request: AgentRequest):\n        async def event_generator():\n            config = {'configurable': {'thread_id': request.thread_id}}\n            async for event in langgraph_app.astream_events(\n                {'messages': [HumanMessage(request.message)]},\n                config=config, version='v2'\n            ):\n                if event['event'] == 'on_chat_model_stream':\n                    token = event['data']['chunk'].content\n                    if token:\n                        yield f'data: {json.dumps({\"type\": \"token\", \"content\": token})}\\n\\n'\n\n                elif event['event'] == 'on_tool_start':\n                    yield f'data: {json.dumps({\"type\": \"tool\", \"name\": event[\"name\"]})}\\n\\n'\n\n                elif event['event'] == 'on_chain_end' and event.get('run_type') == 'graph':\n                    yield f'data: {json.dumps({\"type\": \"done\"})}\\n\\n'\n\n        return StreamingResponse(event_generator(), media_type='text/event-stream')\n\nNode-level streaming (chunk outputs):\n    # Stream after each node completes\n    async for chunk in app.astream({'messages': [msg]}, config):\n        # chunk = {node_name: node_output}\n        for node_name, output in chunk.items():\n            print(f'{node_name}: {output}')", "cross": ["How do you handle streaming backpressure when the frontend is slow to consume events?", "How do you filter streaming events so users only see final output, not intermediate steps?", "What is the difference between astream and astream_events in LangGraph?"]}, {"q": "TRICKY: LangGraph agent loops forever. How do you debug and fix it?", "a": "Infinite loop diagnosis and fixes:\n\nCommon causes:\n    1. Conditional edge never returns END\n    2. Agent keeps calling same tool with same input\n    3. Tool returns error → agent retries → same error → loop\n    4. Supervisor keeps routing to same worker\n    5. State not updating so condition never changes\n\nDiagnosis:\n    # Step 1: Check LangGraph recursion limit\n    try:\n        result = app.invoke(state, config)\n    except GraphRecursionError as e:\n        print(f'Recursion limit hit: {e}')\n        # Default limit: 25 iterations\n\n    # Step 2: Add verbose logging to conditional edges\n    def route_with_logging(state):\n        last_msg = state['messages'][-1]\n        decision = original_route(state)\n        print(f'Step {len(state[\"messages\"])}: routing to {decision}')\n        print(f'Last message type: {type(last_msg).__name__}')\n        if hasattr(last_msg, 'tool_calls'):\n            print(f'Tool calls: {last_msg.tool_calls}')\n        return decision\n\n    # Step 3: Check state history\n    history = list(app.get_state_history(config))\n    for i, h in enumerate(history[-5:]):\n        print(f'Step {h.step}: next={h.next}, msgs={len(h.values[\"messages\"])}')\n\nFixes:\n    # Fix 1: Hard iteration limit\n    class State(TypedDict):\n        messages: list\n        iterations: int\n\n    def route(state):\n        if state['iterations'] >= 10:\n            return END  # force stop\n        if state['messages'][-1].tool_calls:\n            return 'tools'\n        return END\n\n    # Fix 2: Tool call deduplication\n    def route_with_dedup(state):\n        msgs = state['messages']\n        last = msgs[-1]\n        if not last.tool_calls:\n            return END\n        # Check if same tool+args was called in last 3 steps\n        recent_calls = [\n            (m.tool_calls[0]['name'], str(m.tool_calls[0]['args']))\n            for m in msgs[-4:] if hasattr(m, 'tool_calls') and m.tool_calls\n        ]\n        if len(set(recent_calls)) < len(recent_calls):  # duplicate found\n            return 'stuck_handler'\n        return 'tools'\n\n    # Fix 3: Set recursion limit higher explicitly\n    result = app.invoke(state, config, recursion_limit=50)\n\n    # Fix 4: Stuck handler node\n    def stuck_handler(state):\n        return {'messages': [\n            HumanMessage('You seem to be repeating yourself. Summarize what you know so far and give your best answer.')\n        ]}", "cross": ["What is the default recursion limit in LangGraph and how do you change it?", "How do you detect when an agent is stuck in a semantic loop (different tool calls, same behavior)?", "What monitoring would you put in place to alert on production LangGraph infinite loops?"]}, {"q": "SITUATION: Design a LangGraph agent for automated code review.", "a": "Code review agent with multiple specialized nodes:\n\n    from langgraph.graph import StateGraph, END\n    from typing import TypedDict, Annotated, List\n    import operator\n\n    class CodeReviewState(TypedDict):\n        pr_diff: str\n        pr_description: str\n        files_changed: list\n        security_issues: List[str]\n        performance_issues: List[str]\n        style_issues: List[str]\n        test_coverage_analysis: str\n        overall_verdict: str  # APPROVE/REQUEST_CHANGES/COMMENT\n        review_comments: Annotated[list, operator.add]\n        human_override: bool\n\n    # Parallel specialized reviewers\n    def security_reviewer(state):\n        prompt = f\"\"\"Review this code diff for security issues:\n        - SQL injection, XSS, CSRF vulnerabilities\n        - Hardcoded secrets, tokens, passwords\n        - Insecure deserialization\n        - Missing input validation\n\n        Diff:\\n{state['pr_diff']}\n        Return JSON: {{\\\"issues\\\": [\\\"...\\\"], \\\"severity\\\": \\\"HIGH/MED/LOW\\\"}}\"\"\"\n        result = llm.invoke(prompt)\n        data = parse_json(result.content)\n        return {\n            'security_issues': data.get('issues', []),\n            'review_comments': [f'[Security] {i}' for i in data.get('issues', [])]\n        }\n\n    def performance_reviewer(state):\n        prompt = f\"\"\"Review for performance issues:\n        - N+1 queries, missing indexes\n        - Unnecessary loops, O(n²) algorithms\n        - Missing caching opportunities\n        Diff:\\n{state['pr_diff']}\"\"\"\n        result = llm.invoke(prompt)\n        issues = extract_issues(result.content)\n        return {'performance_issues': issues}\n\n    def test_reviewer(state):\n        prompt = f'Analyze test coverage for: {state[\"pr_diff\"]}. Are edge cases covered?'\n        result = llm.invoke(prompt)\n        return {'test_coverage_analysis': result.content}\n\n    # Aggregator: make final decision\n    def verdict_node(state):\n        context = {\n            'security': state['security_issues'],\n            'performance': state['performance_issues'],\n            'tests': state['test_coverage_analysis']\n        }\n        verdict_prompt = f'Based on review: {context}. APPROVE, REQUEST_CHANGES, or COMMENT?'\n        verdict = llm.invoke(verdict_prompt).content.strip()\n        return {'overall_verdict': verdict}\n\n    # Build graph with parallel review\n    from langgraph.constants import Send\n\n    def fan_out_to_reviewers(state):\n        return [\n            Send('security_reviewer', state),\n            Send('performance_reviewer', state),\n            Send('test_reviewer', state)\n        ]\n\n    graph = StateGraph(CodeReviewState)\n    graph.add_node('security_reviewer', security_reviewer)\n    graph.add_node('performance_reviewer', performance_reviewer)\n    graph.add_node('test_reviewer', test_reviewer)\n    graph.add_node('verdict', verdict_node)\n    graph.add_node('human_review', human_review_node)  # HITL\n\n    graph.set_entry_point('__start__')\n    graph.add_conditional_edges('__start__', fan_out_to_reviewers)\n    # All 3 reviewers connect to verdict\n    for r in ['security_reviewer', 'performance_reviewer', 'test_reviewer']:\n        graph.add_edge(r, 'verdict')\n\n    app = graph.compile(\n        checkpointer=PostgresSaver.from_conn_string(DB_URL),\n        interrupt_before=['human_review']  # HITL before posting review\n    )", "cross": ["How do you handle the case where security reviewer finds critical issues — should it fast-fail?", "How do you integrate this with GitHub's API to auto-post review comments on PRs?", "What metrics would you track to evaluate the quality of this automated code reviewer?"]}, {"q": "How does LangGraph state management work? Explain reducers.", "a": "State is a TypedDict shared by all nodes. Each node returns a partial update, LangGraph merges using reducers.\n\nReducer types:\n    from typing import TypedDict, Annotated\n    import operator\n\n    class State(TypedDict):\n        # operator.add = append (lists)\n        messages: Annotated[list, operator.add]\n        # No annotation = last-write-wins (overwrite)\n        task: str\n        answer: str\n        # Custom reducer\n        scores: Annotated[dict, lambda a, b: {**a, **b}]  # dict merge\n        count: Annotated[int, lambda a, b: a + b]         # integer sum\n\n    # Node only returns what it changes\n    def node_a(state: State) -> dict:\n        return {\n            'messages': [AIMessage('hello')],  # appended, not replaced\n            'task': 'new task',                 # overwrites\n            'count': 1                          # adds to existing\n        }\n        # Don't return 'answer' or 'scores' — they stay unchanged\n\nMerge mechanics:\n    # current state: {'messages': [m1, m2], 'task': 'old', 'count': 5}\n    # node returns:  {'messages': [m3], 'task': 'new', 'count': 1}\n    # new state:     {'messages': [m1, m2, m3], 'task': 'new', 'count': 6}\n\nExternal state manipulation:\n    app = graph.compile(checkpointer=checkpointer)\n    config = {'configurable': {'thread_id': 'my-thread'}}\n\n    # Read current state\n    snapshot = app.get_state(config)\n    print(snapshot.values)  # full state dict\n    print(snapshot.next)    # which nodes run next\n\n    # Manually update state (for HITL corrections)\n    app.update_state(\n        config,\n        {'answer': 'Corrected by human'},\n        as_node='human_review'\n    )\n\nPydantic state (with validation):\n    from pydantic import BaseModel, validator\n    class ValidState(BaseModel):\n        messages: list = []\n        confidence: float = 0.0\n        retries: int = 0\n        @validator('confidence')\n        def validate_conf(cls, v):\n            assert 0 <= v <= 1\n            return v", "cross": ["What happens when two parallel nodes write to the same state key simultaneously?", "How do you implement state schema versioning for long-running workflows?", "What is the performance overhead of state serialization in checkpointing?"]}, {"q": "How do you implement human-in-the-loop (HITL) in LangGraph?", "a": "HITL = pause graph execution at defined points, let human review/modify, then resume.\n\n    from langgraph.graph import StateGraph, END\n    from langgraph.checkpoint.postgres import PostgresSaver\n\n    # 1. Set up persistent checkpointer (required for HITL)\n    checkpointer = PostgresSaver.from_conn_string(DATABASE_URL)\n    checkpointer.setup()  # creates tables if not exists\n\n    # 2. Compile with interrupt points\n    app = graph.compile(\n        checkpointer=checkpointer,\n        interrupt_before=['send_email'],   # pause BEFORE this node\n        # interrupt_after=['generate'],    # pause AFTER this node\n    )\n\n    # 3. Run until first interrupt\n    config = {'configurable': {'thread_id': 'task-123'}}\n    state = app.invoke(\n        {'messages': [HumanMessage('Email all customers about price change')]},\n        config=config\n    )\n    # Execution stops at 'send_email' node\n    # state contains the proposed email content\n\n    # 4a. Approve — resume unchanged\n    final = app.invoke(None, config)  # None = continue from checkpoint\n\n    # 4b. Modify then resume\n    app.update_state(\n        config,\n        {'draft_email': 'Only email VIP customers, not all'}\n    )\n    final = app.invoke(None, config)\n\n    # 4c. Reject — mark and end\n    app.update_state(config, {'approved': False})\n    # Route to rejection handler\n\n    # Async web API pattern\n    @app.post('/tasks')\n    async def start_task(request: TaskRequest):\n        config = {'configurable': {'thread_id': str(uuid.uuid4())}}\n        await langgraph_app.ainvoke(request.inputs, config)\n        return {'thread_id': config['configurable']['thread_id'],\n                'status': 'awaiting_approval'}\n\n    @app.post('/tasks/{thread_id}/approve')\n    async def approve(thread_id: str, modification: str = None):\n        config = {'configurable': {'thread_id': thread_id}}\n        if modification:\n            await langgraph_app.aupdate_state(config, {'modification': modification})\n        result = await langgraph_app.ainvoke(None, config)\n        return {'result': result}\n\nCommon HITL use cases:\n    - Email/notification before send\n    - Database writes before execute\n    - Code before production deploy\n    - Legal/compliance document review\n    - Financial transaction approval", "cross": ["How do you implement a timeout for HITL — what if no human responds in 24 hours?", "How do you build a dashboard showing all pending HITL approvals across all users?", "Can you have multiple interrupt points in one graph run? How do they interact?"]}, {"q": "What is LangGraph checkpointing and how does it enable fault tolerance?", "a": "Checkpointing = save complete graph state after every node execution. Enables resume-on-failure, HITL pauses, and time-travel debugging.\n\nBackend options:\n    from langgraph.checkpoint.memory import MemorySaver    # dev/tests only\n    from langgraph.checkpoint.sqlite import SqliteSaver     # single machine\n    from langgraph.checkpoint.postgres import PostgresSaver  # production\n\n    # Production setup\n    checkpointer = PostgresSaver.from_conn_string(\n        'postgresql://user:pass@localhost:5432/langgraph_db'\n    )\n    checkpointer.setup()  # creates checkpoint tables\n    app = graph.compile(checkpointer=checkpointer)\n\n    # Each run needs a unique thread_id\n    config = {'configurable': {'thread_id': 'order-abc-123'}}\n    result = app.invoke(initial_state, config)\n    # After every node: state saved to DB automatically\n\nFault tolerance pattern:\n    def run_workflow_with_recovery(inputs, config, max_retries=3):\n        for attempt in range(max_retries):\n            try:\n                # First run: pass inputs. Subsequent: pass None (resume)\n                payload = inputs if attempt == 0 else None\n                return app.invoke(payload, config)\n            except Exception as e:\n                logger.error(f'Attempt {attempt+1} failed: {e}')\n                if attempt == max_retries - 1:\n                    raise\n                time.sleep(2 ** attempt)  # exponential backoff\n                # Next iteration automatically resumes from last checkpoint!\n\nTime-travel debugging:\n    # See every state in a thread's history\n    history = list(app.get_state_history(config))\n    for snapshot in history:\n        print(f'Step {snapshot.step}: next={snapshot.next}')\n        print(f'  State: {list(snapshot.values.keys())}')\n\n    # Jump to specific checkpoint\n    target = history[3]  # go back to step 3\n    branch_config = {\n        'configurable': {\n            'thread_id': 'debug-branch',\n            'checkpoint_id': target.config['configurable']['checkpoint_id']\n        }\n    }\n    app.invoke(None, branch_config)  # replay from step 3\n\nCheckpoint structure:\n    # Each checkpoint stores:\n    # - thread_id, checkpoint_id, step number\n    # - Full state snapshot (all state keys)\n    # - next: which nodes execute next\n    # - metadata: writes, source, timestamps", "cross": ["How do you prune old checkpoints to prevent database growth?", "What is the difference between thread_id and checkpoint_id?", "How do you handle checkpoint migrations when you change the graph structure?"]}, {"q": "Build a multi-agent supervisor pattern in LangGraph.", "a": "Supervisor routes tasks to specialized worker agents, collects results, decides next step.\n\n    from langgraph.graph import StateGraph, END\n    from langchain_openai import ChatOpenAI\n    from typing import TypedDict, Annotated, Literal\n    import operator\n\n    llm = ChatOpenAI(model='gpt-4o', temperature=0)\n\n    class State(TypedDict):\n        messages: Annotated[list, operator.add]\n        task: str\n        results: Annotated[dict, lambda a, b: {**a, **b}]\n        next_worker: str\n        iterations: int\n\n    WORKERS = ['researcher', 'analyst', 'writer']\n\n    # Supervisor: routes to workers\n    def supervisor(state: State) -> dict:\n        system = f\"\"\"You coordinate {WORKERS}.\n        Based on task and results so far, who should act next?\n        Reply with exactly one: {WORKERS + ['FINISH']}\"\"\"\n        msgs = [SystemMessage(system),\n                HumanMessage(f'Task: {state[\"task\"]}\\nDone: {list(state[\"results\"].keys())}')]\n        response = llm.invoke(msgs).content.strip()\n        # Validate response\n        if response not in WORKERS + ['FINISH']:\n            response = 'FINISH'\n        return {'next_worker': response, 'iterations': 1}\n\n    # Workers\n    def researcher(state: State) -> dict:\n        result = llm.invoke(f'Research thoroughly: {state[\"task\"]}').content\n        return {'results': {'research': result},\n                'messages': [AIMessage(f'Research done: {result[:100]}...')]}\n\n    def analyst(state: State) -> dict:\n        ctx = state['results'].get('research', state['task'])\n        result = llm.invoke(f'Analyze critically: {ctx}').content\n        return {'results': {'analysis': result},\n                'messages': [AIMessage(f'Analysis done')]}\n\n    def writer(state: State) -> dict:\n        ctx = str(state['results'])\n        result = llm.invoke(f'Write professional report from: {ctx}').content\n        return {'results': {'report': result},\n                'messages': [AIMessage(f'Report written')]}\n\n    # Build graph\n    workflow = StateGraph(State)\n    workflow.add_node('supervisor', supervisor)\n    for w in WORKERS:\n        workflow.add_node(w, eval(w))\n    workflow.set_entry_point('supervisor')\n\n    # Supervisor routes based on next_worker\n    workflow.add_conditional_edges(\n        'supervisor',\n        lambda s: 'FINISH' if s['iterations'] > 8 else s['next_worker'],\n        {**{w: w for w in WORKERS}, 'FINISH': END}\n    )\n    # Every worker reports back to supervisor\n    for w in WORKERS:\n        workflow.add_edge(w, 'supervisor')\n\n    app = workflow.compile(checkpointer=MemorySaver())\n    result = app.invoke({\n        'task': 'Analyze impact of GPT-4o on enterprise software',\n        'results': {}, 'iterations': 0\n    })", "cross": ["How do you prevent the supervisor from routing to the same worker repeatedly?", "How do you run workers in parallel instead of sequentially?", "What monitoring would you add to detect supervisor loops in production?"]}, {"q": "What are LangGraph subgraphs? When to use them?", "a": "Subgraphs = compiled graphs used as nodes within a parent graph. Enable modularity, reuse, and team separation.\n\nCreating and using a subgraph:\n    from langgraph.graph import StateGraph, END\n\n    # --- Subgraph ---\n    class ResearchState(TypedDict):\n        query: str\n        search_results: list\n        refined_answer: str\n\n    sub = StateGraph(ResearchState)\n    sub.add_node('search', search_web_node)\n    sub.add_node('refine', refine_results_node)\n    sub.set_entry_point('search')\n    sub.add_edge('search', 'refine')\n    sub.add_edge('refine', END)\n    research_subgraph = sub.compile()  # compiled subgraph\n\n    # --- Parent graph ---\n    class MainState(TypedDict):\n        task: str\n        research_result: dict  # will hold subgraph output\n        final_report: str\n\n    def research_adapter(state: MainState) -> dict:\n        # Transform parent state → subgraph input\n        sub_output = research_subgraph.invoke({'query': state['task']})\n        # Transform subgraph output → parent state update\n        return {'research_result': sub_output}\n\n    parent = StateGraph(MainState)\n    parent.add_node('research', research_adapter)  # subgraph as node\n    parent.add_node('write', write_report_node)\n    parent.set_entry_point('research')\n    parent.add_edge('research', 'write')\n    main_app = parent.compile()\n\n    # Or add compiled subgraph directly (if state schemas compatible)\n    parent.add_node('research', research_subgraph)\n\nWhen to use subgraphs:\n    1. REUSE: same research logic used in 3 different agents\n    2. TEAM separation: team A owns research subgraph, team B owns writer\n    3. COMPLEXITY: node has complex branching → make it a subgraph\n    4. TESTING: test subgraph independently without parent\n    5. DIFFERENT STATE: subgraph needs its own state schema\n    6. RECURSION: subgraph calls itself (recursive agent)\n\nSubgraph checkpointing:\n    # Parent checkpoints nested as: parent_thread → subgraph_thread\n    # Each subgraph invocation creates its own checkpoint namespace\n    config = {'configurable': {'thread_id': 'main-123'}}\n    # Subgraph uses: 'main-123:research:0' internally", "cross": ["How do subgraph checkpoints interact with parent graph checkpoints?", "What are the limitations of subgraphs vs inline complex nodes?", "How do you share LLM clients and vector stores across subgraphs efficiently?"]}, {"q": "How do you handle errors and retries in LangGraph?", "a": "    from langgraph.graph import StateGraph, END\n    from typing import Optional\n    import time, logging\n\n    class ResilientState(TypedDict):\n        task: str\n        result: Optional[str]\n        error: Optional[str]\n        attempts: int\n        max_attempts: int\n\n    # Node with exponential backoff retry\n    def llm_node(state: ResilientState) -> dict:\n        for attempt in range(3):\n            try:\n                result = llm.invoke(state['task'])\n                return {'result': result.content, 'error': None}\n            except RateLimitError:\n                time.sleep(2 ** attempt)  # 1s, 2s, 4s\n            except APIError as e:\n                return {'result': None, 'error': f'API error: {e}'}\n        return {'result': None, 'error': 'Rate limit: max retries exceeded'}\n\n    # Self-correcting: use error in next attempt\n    def smart_retry(state: ResilientState) -> dict:\n        if state.get('error'):\n            task = f\"\"\"{state['task']}\n            Previous attempt failed: {state['error']}\n            Try a different approach.\"\"\"\n        else:\n            task = state['task']\n        result = llm.invoke(task)\n        return {'result': result.content, 'error': None,\n                'attempts': state['attempts'] + 1}\n\n    # Routing\n    def route(state: ResilientState) -> str:\n        if not state.get('error'):\n            return 'success'\n        if state['attempts'] >= state['max_attempts']:\n            return 'fail'\n        return 'retry'\n\n    graph = StateGraph(ResilientState)\n    graph.add_node('attempt', smart_retry)\n    graph.add_node('success', lambda s: s)\n    graph.add_node('fail', lambda s: {**s, 'result': f'Failed after {s[\"attempts\"]} attempts'})\n    graph.set_entry_point('attempt')\n    graph.add_conditional_edges('attempt', route, {\n        'success': 'success',\n        'retry': 'attempt',   # loop!\n        'fail': 'fail'\n    })\n    graph.add_edge('success', END)\n    graph.add_edge('fail', END)\n\n    app = graph.compile()\n\n    # Global error wrapper\n    def safe_invoke(inputs, config):\n        try:\n            return app.invoke(inputs, config, recursion_limit=25)\n        except GraphRecursionError:\n            return {'error': 'Max iterations hit', 'result': None}\n        except Exception as e:\n            logger.error(f'Graph crashed: {e}')\n            return {'error': str(e), 'result': None}", "cross": ["What is GraphRecursionError and what is LangGraph's default iteration limit?", "How do you implement circuit breaker pattern for external API calls in nodes?", "How do you distinguish recoverable errors (retry) from fatal errors (fail fast)?"]}, {"q": "How do you stream LangGraph outputs to a frontend in real-time?", "a": "LangGraph streaming: token-level from LLMs or node-level when nodes complete.\n\nEvent streaming:\n    # astream_events gives granular control over what to stream\n    async for event in app.astream_events(\n        {'messages': [HumanMessage(question)]},\n        config=config,\n        version='v2'\n    ):\n        kind = event['event']\n\n        # LLM tokens — stream to frontend in real-time\n        if kind == 'on_chat_model_stream':\n            token = event['data']['chunk'].content\n            if token:\n                yield f'data: {json.dumps({\"type\": \"token\", \"text\": token})}\\n\\n'\n\n        # Tool being called — show to user\n        elif kind == 'on_tool_start':\n            yield f'data: {json.dumps({\"type\": \"tool\", \"name\": event[\"name\"]})}\\n\\n'\n\n        # Node completed\n        elif kind == 'on_chain_end' and event.get('tags', []):\n            pass  # node-level completion event\n\nFastAPI SSE endpoint:\n    from fastapi import FastAPI\n    from fastapi.responses import StreamingResponse\n    import json, asyncio\n\n    api = FastAPI()\n\n    @api.post('/chat/stream')\n    async def stream_chat(req: ChatRequest):\n        async def generate():\n            config = {'configurable': {'thread_id': req.session_id}}\n            try:\n                async for event in app.astream_events(\n                    {'messages': [HumanMessage(req.message)]},\n                    config=config, version='v2'\n                ):\n                    if event['event'] == 'on_chat_model_stream':\n                        token = event['data']['chunk'].co
