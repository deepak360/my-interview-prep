tion passed to useCallback is memoized.\nDependencies Array: The array of dependencies specifies when the callback should be updated. The callback is updated only when one of the dependencies changes.","source":"","cross":[]},{"q":"How to prevent a component to re-rendeing.","a":"","source":"","cross":[]},{"q":"How to optimize the performance of our React Application.","a":"","source":"","cross":[]},{"q":"What is the difference b/w disabled and readonly","a":"If you want it to be non-editable but still submitted, use readonly-like behavior via CSS/JavaScript tricks, but disabled prevents it from being submitted in a form.","source":"","cross":[]},{"q":"diff b/w localStorage and cookies","a":"📦 Overview\nFeature                              Cookies                                                              localStorage\n🛠 Storage Type                Small key-value store (sent with requests)        Client-side key-value store (browser only)\n📏 Size Limit                      ~4 KB                                                                 ~5–10 MB (varies by browser)\n🧾 Sent to Server               ✅ Automatically with every HTTP request        ❌ Never sent automatically\n📆 Expiry                            ✅ Can set expiration date                                 ❌ Persists until manually cleared\n🔒 Secure Usage               Can be made HttpOnly and Secure                    No such protection — accessible via JS\n🌐 Access Scope                Per domain + path                                              Per domain\n🧠 Accessibility                   Accessible via document.cookie                         Accessible via window.localStorage","source":"","cross":[]},{"q":"Closures , scopes, var vs let vs const , arrow functions , custom hook , api implementation , event loop , setImmediate vs process","a":"","source":"","cross":[]},{"q":"what's event emitter?","a":"📣 What is an Event Emitter in JavaScript?\n\nAn Event Emitter is a core design pattern in JavaScript that allows one part of your application to emit (trigger) an event and other parts to listen for (subscribe to) it and react accordingly.\n\n    It's the Observer or Pub/Sub pattern — very common in Node.js, browsers, and frameworks like React, Vue, and Angular.\n\n🧠 Why Use Event Emitters?\n\n    🔄 Decouples your code — listeners and emitters don’t need to know about each other\n\n    🚀 Handles asynchronous events (e.g., I/O, user input, custom signals)\n\n    📦 Used under the hood in Node.js, DOM events, WebSockets, Kafka, etc.\n\n✅ Node.js Example: Using events module\n\nconst EventEmitter = require('events');\n\n// Create an emitter instance\nconst emitter = new EventEmitter();\n\n// Add a listener\nemitter.on('userRegistered', (username) => {\n  console.log(`${username} has registered.`);\n});\n\n// Emit the event\nemitter.emit('userRegistered', 'deepak123');","source":"","cross":[]},{"q":"Event Bubbling and Event Capturing? Lazy loading? Diff. b/w Async-await, promises , callback? Redux Flow + Architecture + Redux setup code. Screen tracking analytics in react native? Redux toolkit?","a":"","source":"","cross":[]},{"q":"promise, observable, callback, inheritance, constructor","a":"","source":"","cross":[]},{"q":"Write useMemo hook on your own from scratch.","a":"","source":"","cross":[]},{"q":"Basics of JavaScript concepts like Promises, Event Loop, destructuring etc.","a":"","source":"","cross":[]},{"q":"Basic questions related to CSS like difference between align-content vs align-items in flexbox.","a":"","source":"","cross":[]},{"q":"Implementation of Protected route and 404 page in route, accessing previous props with hooks, HoC, Some scenario based question which required implementation of WebSocket, configuring Redux Toolkit etc.","a":"","source":"","cross":[]}]},"Cloud & DevOps":{"color":"#00BCD4","icon":"☁️","questions":[{"q":"Can we setup scaling based on the memory in AWS auto scaling group?","a":"","source":"","cross":[]},{"q":"what is cloudformation template in aws.","a":"","source":"","cross":[]},{"q":"What is AWS incognito ?","a":"","source":"","cross":[]},{"q":"AWS step functions","a":"","source":"","cross":[]},{"q":"🧩 B. Data Engineering Concepts\n\nETL vs ELT (difference, pros/cons, use cases)\n\nBatch vs Streaming data pipelines\n\nWhat is Window, Watermark and Trigger.\n\nData modeling (Star, Snowflake schema)\n\nData partitioning & clustering in BigQuery\n\nData Quality checks (DQ rules, validation frameworks)\n\nError handling & retries in Dataflow pipelines\n\nSchema evolution and handling schema drift\n\nIdempotency and deduplication\n\nLate arriving data and watermark handling\n\nMonitoring & logging with Cloud Logging, Cloud Monitoring, Dataflow metrics","a":"🧱 C. Python for Dataflow / Apache Beam\n\nWrite DoFn, ParDo, Map, FlatMap, GroupByKey, Combine transforms.\n\nUnderstand windowing, triggers, and side inputs.\n\nOptimize Dataflow pipelines using:\n\nEfficient I/O (batching, compression)\n\nProper use of worker types\n\nAutoscaling\n\nAvoiding data skew","source":"","cross":[]},{"q":"🧾 D. SQL & BigQuery Optimization\n\nWrite analytical queries using CTEs, analytic/window functions, joins, UNNEST, ARRAY_AGG, STRUCTs.\n\nCost optimization:\n\nPartitioning & clustering\n\nUsing EXPLAIN and INFORMATION_SCHEMA\n\nMaterialized views\n\nHandling semi-structured data (JSON fields).","a":"🔥 3. “Interview-Ready” GCP Data Engineer Problem Topics\n\nDesign a pipeline to process streaming logs from IoT sensors into BigQuery\n        Dataflow streaming, Pub/Sub, BigQuery sink, windowing\n\nETL job that reads data from Firestore and writes to BigQuery\n        Batch Dataflow design, schema mapping, retries\n\nOptimize a BigQuery table with 1 TB of daily logs\n        Partitioning, clustering, materialized views\n\nHandle schema drift in incoming JSON data\n        Dynamic schema detection, dead-letter handling\n\nMonitor Dataflow pipelines\n        Logging, Cloud Monitoring, custom metrics\n\nSet up data quality checks\n        Validation steps in ETL, rule-based validation\n\nHandle late-arriving data\n        Triggers and watermarks in Dataflow\n\nSecure data pipelines\n        IAM, encryption, service accounts, least privilege","source":"","cross":[]},{"q":"⚡ 4. Hands-On Practice Projects (to look senior)\n\nHere are portfolio-level mini-projects to make your profile interview-ready:\n\nData ingestion pipeline\nPub/Sub → Dataflow → BigQuery\n(simulate streaming data from an API).\n\nBatch ETL pipeline\nGCS CSV → Dataflow → BigQuery\nInclude validation, transformation, and error handling.\n\nNoSQL to SQL sync\nFirestore / MongoDB → Dataflow → BigQuery\nHandle schema mapping and incremental updates.\n\nOrchestration with Composer\nSchedule ETL pipelines and add retry logic + alerting.\n\nAnalytics layer in BigQuery\nCreate analytical tables, dashboards, and optimize queries.","a":"🧩 6. Bonus — System Design for Data Engineers\n\nAt senior levels, expect data system design interviews, like:\n\nDesign a scalable data lake → warehouse architecture.\n\nCompare Dataflow vs Dataproc vs BigQuery ELT.\n\nDesign a streaming fraud detection pipeline.\n\nCost optimization in GCP pipelines.","source":"","cross":[]},{"q":"Question And Answer","a":"","source":"","cross":[]},{"q":"Batch vs Streaming data pipelines","a":"","source":"","cross":[]},{"q":"What is the recommended branch naming convention in CI/CD pipelines for handling different types of changes like hotfixes, new features, or releases?\nor \nWhat are the best practices for branch naming in a CI/CD setup?","a":"","source":"","cross":[]},{"q":"How do you manage secrets in CI/CD pipelines?\n(e.g., GitHub Secrets, HashiCorp Vault, AWS Parameter Store)","a":"","source":"","cross":[]},{"q":"How do you automate testing in a CI/CD pipeline?","a":"","source":"","cross":[]},{"q":"What are pipeline triggers? How do you use them (e.g., on push, PR, tags)?","a":"","source":"","cross":[]},{"q":"How do you handle different environments (dev, staging, prod) in your pipelines?","a":"","source":"","cross":[]},{"q":"What strategies do you use for zero-downtime deployment?","a":"","source":"","cross":[]},{"q":"Describe a typical CI/CD pipeline for a web app you’ve worked on.","a":"","source":"","cross":[]},{"q":"How do you pass environment variables in GitHub Actions?","a":"","source":"","cross":[]},{"q":"What are jobs and steps in GitHub Actions?","a":"","source":"","cross":[]},{"q":"How do you create reusable workflows in GitHub Actions?","a":"","source":"","cross":[]},{"q":"How do you perform canary or blue-green deployments using CI/CD?","a":"","source":"","cross":[]},{"q":"How would you roll back a failed deployment using your CI/CD pipeline?","a":"","source":"","cross":[]},{"q":"How do you ensure deployment safety (e.g., run tests, approval steps)?","a":"","source":"","cross":[]},{"q":"How do you monitor and alert on failed builds or deployments?","a":"","source":"","cross":[]},{"q":"A build is failing randomly in the CI pipeline. How do you debug it?","a":"","source":"","cross":[]},{"q":"Your production deploy fails due to a misconfigured environment variable. How would you fix it and prevent future issues?","a":"","source":"","cross":[]},{"q":"How do you implement CI/CD for a microservices architecture?","a":"","source":"","cross":[]},{"q":"How would you add security scanning (e.g., Snyk, Trivy) into your CI/CD pipeline?","a":"","source":"","cross":[]},{"q":"How would you deploy a Dockerized app to Kubernetes using CI/CD?","a":"","source":"","cross":[]}]},"Data & AI":{"color":"#FF9800","icon":"🤖","questions":[{"q":"What are the main data quality dimensions?","a":"The main Data Quality (DQ) dimensions are standard categories used to evaluate the health and trustworthiness of data. Understanding these is crucial for any Data Quality Developer, especially in interviews and real-world projects.\n✅ 1. Accuracy\n\n    Definition: Data correctly describes the \\\"real-world\\\" values it represents.\n\n    Example: A customer’s birthdate is actually their real birthdate.\n\n    Interview Q: How would you validate address accuracy from a supplier feed?\n\n✅ 2. Completeness\n\n    Definition: All required data is present.\n\n    Example: Every apartment listing has a rent, address, and contact number.\n\n    Interview Q: How do you measure completeness in a multi-source data pipeline?\n\n✅ 3. Consistency\n\n    Definition: Data is the same across different systems or sources.\n\n    Example: Apartment rent in CRM matches rent in property listing database.\n\n    Interview Q: How would you detect inconsistent property prices across vendors?\n\n✅ 4. Uniqueness\n\n    Definition: No data is unnecessarily duplicated.\n\n    Example: No two apartment records have the same apartment_id under the same building.\n\n    Interview Q: How can you enforce uniqueness in a relational database?\n\n✅ 5. Timeliness\n\n    Definition: Data is up to date and available when needed.\n\n    Example: Rent updates are reflected in the system within 24 hours of supplier change.\n\n    Interview Q: What would you do if a supplier's feed is delayed by 48 hours?\n\n✅ 6. Validity\n\n    Definition: Data conforms to the defined formats, rules, or constraints.\n\n    Example: Email addresses follow proper format, phone numbers have country code.\n\n    Interview Q: How do you handle values that violate expected formats?\n\n✅ 7. Integrity\n\n    Definition: Relationships between data entities are correct and maintained.\n\n    Example: Each apartment must belong to an existing building (foreign key constraint).\n\n    Interview Q: How do you detect orphan records in a relational schema?\n\n🧠 Bonus: Additional Dimensions (Sometimes asked)\n\n    Conformity – Data adheres to standards (e.g., date formats).\n\n    Relevance – Data is useful and appropriate for its intended purpose.\n\n    Traceability – Ability to trace data from source to destination.\n\n🧪 Interview Follow-ups:\n\n    How do you prioritize which dimension to fix first?\n\n    How would you build a DQ scorecard using these dimensions?\n\n    Can you give an example of a DQ rule for each dimension?","source":"","cross":[]},{"q":"🔹 Q1: How do you prioritize which dimension to fix first?","a":"I prioritize based on business impact and downstream dependencies. For example:\nIf inaccurate rent data causes customers to complain or leads to legal issues, accuracy becomes the top priority.\n\n    If missing contact information prevents lead follow-up, completeness is urgent.\n    I use data profiling metrics and collaborate with stakeholders to rank issues based on risk, frequency, and user impact.","source":"","cross":[]},{"q":"🔹 Q2: How would you build a DQ scorecard using these dimensions?","a":"A Data Quality Scorecard summarizes each dimension with measurable KPIs:\n\nExample for apartment listings:\nDimension                  Metric                                    Target        Actual        Status\nAccuracy                    % of correct rent values         100%        95%           ⚠️ Warn\nCompleteness            % of listings with all fields      100%        98%           ✅ Pass\nUniqueness                Duplicate apartment IDs         0               10              ❌ Fail\n\nThis scorecard is refreshed daily/weekly from profiling jobs. I’ve also used BigQuery + Data Studio to visualize the scorecard.","source":"","cross":[]},{"q":"🔹 Q3: Can you give an example of a DQ rule for each dimension?","a":"Dimension                     DQ Rule Example\nAccuracy                        rent must be between 500 and 20,000 for London properties\nCompleteness                apartment_id, building_id, unit_number must not be null\nConsistency                   rent must be the same in staging and production tables\nUniqueness                    No duplicate combination of supplier_id, apartment_id\nTimeliness                      Daily supplier feed should not be older than 24 hours\nValidity                            email must match regex: ^[\\w\\.-]+@[\\w\\.-]+\\.\\w+$\nIntegrity                           Every building_id in apartments must exist in buildings table\n\nI usually enforce these rules in:\n\n    ETL validation layers\n\n    Dataflow/Apache Beam jobs\n\n    BigQuery SQL checks\n\n    Orchestrate alerts using Cloud Functions + Pub/Sub when violations occur.","source":"","cross":[]},{"q":"How do you design a Data Quality framework?","a":"🏗 Sample Architecture in GCP:\n\nSupplier Feed → Cloud Storage → Dataflow → BigQuery Staging\n                                               ↓\n                                       DQ Rules Engine (SQL/Python)\n                                               ↓\n                                      DQ Scorecard + Alert System\n\nDesigning a Data Quality (DQ) Framework involves creating a structured process to measure, monitor, and improve the quality of data across systems. Below is a comprehensive guide that can help you explain this confidently in an interview:\n\n✅ 1. Define Goals & Business Rules\n\nPurpose: Understand what \\\"quality\\\" means to the business.\n\nExamples:\n\n    Rent price must be within regional limits.\n\n    Email must be valid for sending notifications.\n\n    Property listings must be updated daily.\n\n📌 Interview Tip: Interviewer may ask “How do you gather these rules?”\n\n    You should say: “I collaborate with data owners, analysts, and product managers to define quality expectations aligned with business goals.”\n\n✅ 2. Identify Data Quality Dimensions\n\nApply common dimensions:\n\n    Accuracy\n\n    Completeness\n\n    Uniqueness\n\n    Timeliness\n\n    Validity\n\n    Integrity\n\n    Consistency\n\n📌 Interview Tip: Be ready to give examples of each in your domain.\n\n✅ 3. Data Profiling\n\nTooling:\n\n    BigQuery (with SQL checks)\n\n    Pandas profiling\n\n    Great Expectations / Deequ\n\nChecks:\n\n    Null percentage\n\n    Value ranges\n\n    Duplicates\n\n    Pattern checks (regex)\n\n📌 Cross-Question: “How often do you profile data?”\n\n    \\\"During onboarding, and then on a scheduled basis (daily/weekly) for pipelines.\\\"\n\n✅ 4. Rule Implementation Layer\n\nOptions:\n\n    SQL-based checks in BigQuery or Snowflake\n\n    Python-based rules using Pandas or PySpark\n\n    Great Expectations for reusable tests\n\n✅ Example:\n\nassert df['rent'].between(500, 20000).all(), \\\"Rent out of range\\\"\n\n📌 Cross-Question: \\\"How are these checks automated?\\\"\n\n    \\\"Via orchestration tools like Airflow, Cloud Composer, or Dataform in scheduled pipelines.\\\"\n\n✅ 5. Monitoring & Alerting\n\nTools:\n\n    Cloud Monitoring + Pub/Sub (GCP)\n\n    Prometheus + Grafana\n\n    Slack/Email alerts\n\n🎯 Alert when:\n\n    Nulls cross threshold (e.g., > 2%)\n\n    Duplicates detected\n\n    Freshness delay > 1 day\n\n✅ 6. Scorecards & Dashboards\n\nBuild dashboards that track:\n\n    DQ rule pass/fail\n\n    % completeness/accuracy\n\n    Weekly/monthly trends\n\nTools: Data Studio, Looker, Power BI, Tableau\n\n📌 Cross-Question: \\\"How do stakeholders use this?\\\"\n\n    \\\"It helps non-technical users quickly understand where issues exist and prioritize fixes.\\\"\n\n✅ 7. Remediation & Feedback Loops\n\n    Automatically or manually resolve issues:\n\n    Fix data via scripts\n\n    Request source system corrections\n\n    Log exceptions for human intervention\n\nTrack issues and update rule logic based on real-world cases.\n\n✅ 8. Governance & Metadata Integration\n\n    Track which rules apply to which tables\n\n    Maintain DQ rule registry\n\n    Use Data Catalog tools for lineage\n\n📌 Cross-Question: \\\"How do you version DQ rules?\\\"\n\n    \\\"Store rule logic in version-controlled code (e.g., Git) and link rule IDs to lineage metadata.\\\"","source":"","cross":[]},{"q":"What is data profiling and how do you implement it?","a":"✅ What is Data Profiling?\n\nData profiling is the process of analyzing a dataset to understand its structure, quality, and content. It helps identify data quality issues like:\n\n    Nulls\n\n    Duplicates\n\n    Outliers\n\n    Data type mismatches\n\n    Inconsistent formats\n\nIt’s the first step in any Data Quality (DQ) or Data Governance effort.\n\n🔍 Key Goals of Data Profiling\n\nCheck Type                            Example\nCompleteness                        % of missing/null values\nUniqueness                            Are apartment_ids unique?\nValue Distribution                   Common values, outliers, frequency\nData Types                             Is price always a number?\nRange Check                         Are rent values within expected boundaries (e.g., 500–20000)?\nPattern Check                        Do emails match regex?\nReferential Integrity                Does every apartment link to a valid building ID?\n\n🛠 How to Implement Data Profiling\n✅ 1. Using SQL (e.g., BigQuery, Snowflake)\n\n-- Null check\nSELECT COUNT(*) AS total, \n       COUNTIF(rent IS NULL) AS null_rent_count \nFROM apartments;\n\n-- Value distribution\nSELECT rent, COUNT(*) AS frequency \nFROM apartments \nGROUP BY rent \nORDER BY frequency DESC;\n\n-- Duplicates\nSELECT apartment_id, COUNT(*) \nFROM apartments \nGROUP BY apartment_id \nHAVING COUNT(*) > 1;\n\n✅ 2. Using Python + Pandas\n\nimport pandas as pd\n\ndf = pd.read_csv(\\\"apartments.csv\\\")\n\n# Basic profile\nprint(df.info())\nprint(df.describe(include='all'))\n\n# Nulls\nprint(df.isnull().sum())\n\n# Uniqueness\nprint(df['apartment_id'].nunique(), \\\"/\\\", len(df))\n\n# Value range\nprint(df['rent'].min(), df['rent'].max())\n\n# Regex pattern match (e.g. email)\nimport re\ndf['valid_email'] = df['email'].apply(lambda x: bool(re.match(r\\\"[^@]+@[^@]+\\.[^@]+\\\", str(x))))\n\n✅ 3. Automated Tools\nTool                                                                      Description\nGreat Expectations                                              Python library for profiling + validation\nPandas-Profiling / YData-Profiling                       Auto generate HTML reports\nDataform (GCP)                                                  SQL-based rule checking in BigQuery\nDeequ (AWS)                                                      Scala-based profiling + rule checking\nOpenMetadata                                                     DQ with lineage, profiling, and alerts\n\npip install ydata-profiling\nfrom ydata_profiling import ProfileReport\n\nprofile = ProfileReport(df, title=\\\"Apartment Profiling Report\\\")\nprofile.to_file(\\\"report.html\\\")\n\n📈 Best Practices\n\n    Automate profiling as part of data ingestion pipelines.\n\n    Store historical profiling metrics for trend analysis.\n\n    Integrate with DQ dashboards.\n\n    Use thresholds to trigger alerts.\n\n❓ Interview Cross-Questions\n\n    What profiling checks do you run for text vs numeric data?\n\n    How do you handle profiling on streaming or large datasets?\n\n    How do you act on profiling results?\n\n    Have you built a profiling framework from scratch or used a library?\n\n    What’s the difference between profiling and validation?","source":"","cross":[]},{"q":"Full Python example using Pandas that demonstrates how to clean a dataset","a":"Dropping rows with missing values in key columns (customer_id, email)\nFilling missing values in non-critical fields (country)\nRemoving duplicate customer_id entries (keeping the most recent)\n\nimport pandas as pd\nfrom io import StringIO\n\n# Sample raw CSV data\nraw_data = StringIO(\\\"\\\"\\\"\ncustomer_id,email,country,signup_date\n101,john@example.com,USA,2024-01-10\n102,,Canada,2024-02-14\n103,sarah@example.com,,2024-03-01\n104,alex@example.com,UK,\n105,sarah@example.com,,2024-03-01\n101,john@example.com,USA,2024-01-10\n106,,,\n\\\"\\\"\\\")\n\n# Load into a DataFrame\ndf = pd.read_csv(raw_data)\n\nprint(\\\"Original Data:\\\")\nprint(df)\n\n# Step 1: Drop rows where 'customer_id' or 'email' is missing\ndf.dropna(subset=['customer_id', 'email'], inplace=True)\n\n# Step 2: Fill missing 'country' with default value\ndf['country'].fillna('Unknown', inplace=True)\n\n# Step 3: Fill missing 'signup_date' with a default date\ndf['signup_date'].fillna('1970-01-01', inplace=True)\n\n# Step 4: Drop duplicate rows based on customer_id (keep latest if we had a timestamp)\ndf.drop_duplicates(subset=['customer_id'], keep='last', inplace=True)\n\n# Final cleaned data\nprint(\\\"\nCleaned Data:\\\")\nprint(df)","source":"","cross":[]},{"q":"How do you detect schema drift or column data type mismatch?","a":"Detecting schema drift (changes in schema over time) or column data type mismatches is essential in any ETL pipeline, especially for data quality and data governance. Here's how you can approach it:\n\n✅ 1. What Is Schema Drift?\n\nSchema drift occurs when the structure of incoming data changes over time — for example:\n\n    A new column is added (e.g., phone_number)\n\n    A column is removed (e.g., customer_address)\n\n    A column's data type changes (e.g., amount from string to float)\n\n    A column's meaning or allowed values change\n\n✅ 2. How to Detect Schema Drift or Type Mismatch\n🔍 A. Using Pandas (for batch files like CSVs):\n\nimport pandas as pd\n\n# Reference schema (manually defined or loaded from source of truth)\nreference_schema = {\n    'customer_id': 'int64',\n    'email': 'object',\n    'amount': 'float64'\n}\n\n# Load new dataset\ndf = pd.read_csv(\\\"new_data.csv\\\")\n\n# Check schema drift\nfor col in df.columns:\n    expected_type = reference_schema.get(col)\n    actual_type = str(df[col].dtype)\n\n    if expected_type and expected_type != actual_type:\n        print(f\\\"Type MISMATCH in column '{col}': Expected {expected_type}, Found {actual_type}\\\")\n    elif col not in reference_schema:\n        print(f\\\"NEW column detected: {col}\\\")\n\n# Check for missing columns\nmissing_columns = set(reference_schema.keys()) - set(df.columns)\nif missing_columns:\n    print(f\\\"Missing columns: {missing_columns}\\\")\n\n📌 Cross-questions Interviewers Might Ask:\n\n    How do you alert your team when schema drift happens?\n\n        I set up automated checks using Great Expectations or dbt tests in my CI/CD pipeline, and notify via Slack/email if schema mismatch is found.\n\n    How do you prevent schema drift from breaking your ETL?\n\n        By validating schema before load, using schema registry (like Confluent for Kafka), or using strict schema enforcement in staging layers.\n\n    What if the schema drift is intentional?\n\n        Maintain a versioned schema contract. If a change is intended, update the schema definition and document the change with consumers.","source":"","cross":[]},{"q":"Tell me about a project where you improved data quality.","a":"✅ Example Answer:\n\n\\\"In my previous role, I worked on a real-estate analytics platform where data was sourced from over 200 suppliers. Each supplier had its own format, frequency, and data quality challenges. My goal was to standardize and improve the quality of incoming data for better downstream analytics and customer-facing applications.\n🔍 Problem:\n\nWe faced frequent issues such as:\n\n    Missing critical fields like property_id, rent, or availability_date\n\n    Duplicated property listings\n\n    Schema drift (e.g., new columns without documentation)\n\n    Inconsistent data formats across suppliers\n\n⚙️ My Approach:\n\nI led a Data Quality improvement initiative with the following actions:\n\n    Defined DQ Rules for key dimensions like completeness, uniqueness, validity, and timeliness (e.g., rent must be numeric and non-zero).\n\n    Implemented Data Profiling using custom Python scripts and pandas-profiling to assess baseline data quality.\n\n    Created a DQ Rule Engine using Python + SQL that flagged rows violating rules and quarantined them.\n\n    Built DQ Scorecards in Google Data Studio that reported supplier-wise and field-wise DQ metrics.\n\n    Set up Monitoring and Alerts using BigQuery scheduled queries and Cloud Functions to notify stakeholders when DQ thresholds were breached.\n\n    Held data onboarding workshops with top suppliers to align on formats and fix root issues.\n\n✅ Outcome:\n\n    Reduced invalid records by 85% within 2 months.\n\n    Increased downstream pipeline stability (fewer crashes due to bad data).\n\n    Improved confidence for analytics and operations teams.\n\n    Enabled faster onboarding of new suppliers due to documented rules and validations.\\\"**","source":"","cross":[]},{"q":"GenAI sample application","a":"next word prediction","source":"","cross":[]},{"q":"langchain with sample application","a":"","source":"","cross":[]},{"q":"python HuggingFace library with sample project implementation","a":"","source":"","cross":[]},{"q":"developing applications using Large Language Models (LLMs)","a":"","source":"","cross":[]},{"q":"RAG (Retrieval-Augmented Generation) and Prompt Engineering.","a":"","source":"","cross":[]},{"q":"vector search","a":"Document text convert into embedding - It is high dimention embedding\nUser query converting into embedding","source":"","cross":[]},{"q":"How do you apply chunking mechanism, how do you decide the best.","a":"When implementing a chunking mechanism in document processing (especially for RAG, semantic search, or vector DB storage), how you chunk the text directly impacts both retrieval quality and performance.\n\n1. Word-Based Chunking (Simple & Popular)\n    ✅ Easy to implement.\n    ✅ Language-agnostic.\n    ❌ May break sentences or paragraphs awkwardly.\n\n2. Sentence-Based Chunking (More Semantic)\n    ✅ Preserves meaning better.\n    ❌ Sentence lengths vary, which leads to uneven chunk sizes.\n\n3. Token-Based Chunking (Best for LLM + Embeddings)\n    ✅ Matches model token limits precisely.\n    ✅ Prevents chunk overflow.\n    ✅ Ideal for OpenAI or SentenceTransformer compatibility.\n\n4. Sliding Window Chunking\n✅ Prevents context cutoff.\n✅ Better for follow-up questions in RAG.\n❌ Increases storage & compute due to redundancy.","source":"","cross":[]},{"q":"What is retrival phase in RAG","a":"In RAG (Retrieval-Augmented Generation), the retrieval phase is the first step of the process where the system fetches relevant information (chunks of documents, knowledge base entries, etc.) based on the user query, before passing it to the LLM (Large Language Model) for generating a response.\n\n📌 What Happens in the Retrieval Phase?\n\nThe system tries to find the most relevant documents for a given query from a vector database or search index.\n✅ Steps:\n\n    Query Embedding\n\n        Convert the user’s text question into a vector using a sentence embedding model (e.g., SentenceTransformer, OpenAI embeddings, etc.).\n\n    Similarity Search\n\n        Compare the query vector with pre-stored document chunk vectors (retrieved during ingestion) using cosine similarity or dot product.\n\n    Top-K Selection\n\n        Select the top K most similar document chunks.\n\n    Pass to Generator\n\n        The top documents are passed to the LLM along with the question for the generation phase.","source":"","cross":[]},{"q":"What is Augmentation phase in RAG","a":"In RAG (Retrieval-Augmented Generation), the augmentation phase refers to the step where the retrieved documents (from the retrieval phase) are combined with the user query to create a context-enriched input that is then fed to the generation model (LLM).\n\n📌 What Happens in the Augmentation Phase?\n\nThe augmentation phase injects the retrieved knowledge into the model's input prompt to give it external context it may not have seen during training.\n✅ Steps:\n\n    Take the top-K retrieved documents (from vector search or hybrid retrieval).\n\n    Format them into a prompt (depends on the LLM or framework you're using).\n\n    Combine this prompt with the user query using a predefined template.","source":"","cross":[]},{"q":"What is reducing hallucination","a":"Reducing hallucination in the context of LLMs (Large Language Models) like GPT refers to the process of minimizing false, made-up, or misleading information generated by the model.\n\n🧠 What Is a Hallucination?\n\nA hallucination is when a model confidently produces output that is:\n\n    Factually incorrect\n\n    Unsupported by any real source\n\n    Fabricated names, numbers, citations, or quotes","source":"","cross":[]},{"q":"What can we optimize in RAG","a":"Advance Indexing:-\n1. Use hierarchical indexing for chunk organization.\n2. Preserve sementic relationship b/w data chunks.\n3. Enable more accurate and relevent retrieval.\n\nQuery Rewriting and Expension:-\n1. Refine user queries for better results\n2. Query rewriting resolve ambiguity in queries\n3. Query expension adds synonyms for broder retrieval\n\nFine-Tuned Embedding:-\n1. Adjusts embeddings for task or domain specificity\n2. Capture domain-specific nuances, like legal or medical data\n3. Enable more accurate and relevent retrieval\n\nRe-Ranking\n1. Re-ranker model rearranges retrieved chunks based on relevance and importance, ensuring the most pertinent information is prioritized in LLM's response.\n\nContext Compression\nSelect and compresses only the most essential parts of retrieved chunks, reducing noise and improving clarity.","source":"","cross":[]},{"q":"What is Graph RAG\nHow to made embedding when there are data changing frequently most of the data is pdf text. to making embedding of newly updated data will take time and money.\nSo what is the solution you have for this type of problem.","a":"","source":"","cross":[]},{"q":"RAG based Chat","a":"https://github.com/Azure-Samples/contoso-chat","source":"","cross":[]},{"q":"what is prompty","a":"","source":"","cross":[]},{"q":"What is Transformer Architecture?","a":"","source":"","cross":[]},{"q":"Token and Tokenization , and what is Byte pair Encoding(BPE)","a":"","source":"","cross":[]},{"q":"Modelfile in LLM - like dockerfile\nparameter - Temprature 0-1","a":"","source":"","cross":[]},{"q":"Using Modelfile we can create our own model and take any llama model as base","a":"","source":"","cross":[]},{"q":"Push your new model to ollama.com registry like docker image push to dockerhub registry","a":"","source":"","cross":[]},{"q":"What is broker","a":"","source":"","cross":[]},{"q":"What is cluster","a":"","source":"","cross":[]},{"q":"What is topic","a":"","source":"","cross":[]},{"q":"Offset Management in kafka","a":"","source":"","cross":[]},{"q":"poision pill","a":"Malformed data and unexpected content.your consumer expecting formatted json data but it gets the malformed data here consumer doesn't even know what to do with this data and it crashes.","source":"","cross":[]},{"q":"How to handle poision pill","a":"Schema enforcement stretegy, schema stored in schema registry, when consumer start processing the information first it goes to schema registry and gets the latest schema.\n\nDead Letter Queue - Now if you get the unexpected schema - then there is a \\\"dead letter queue\\\" where you push all of these events which can't be processed.Dead letter queue is connected with your topic and later we can understand why does this event not processed.\n\nRetry Mechanism - this helps in sometime when message is not processed in first time but schema was not bad and retring will solve the problem.\nThis mechanism help when actual message is not a poision pill.\n\nMessage Filtering - You sending a json as key value and further value has 7 key value and 7th key has the wrong info and which causing the poision pill scenario. So message filtering tells the consumer that you can process the 6 keys because 7th is malformed.but if consumer must need 7th key to take decision on data. So this stretegy not help everytime but sometime it can help when data is not dependent.","source":"","cross":[]},{"q":"Serialization in kafka","a":"","source":"","cross":[]},{"q":"Consumer Group","a":"","source":"","cross":[]},{"q":"Consumer Rebalancing","a":"","source":"","cross":[]},{"q":"Kafka Partition","a":"","source":"","cross":[]},{"q":"Kafka Replication","a":"","source":"","cross":[]},{"q":"Role of message keys","a":"","source":"","cross":[]},{"q":"Acknowledgement and Reliability","a":"","source":"","cross":[]},{"q":"Zookeeper role in kafka","a":"All the kafka infra runs and maintain by the zookeeper.adding broker , adding new topic deleting topic and many more.\n\n1. maintaining the dynamic registry of active broker, ensure the cluster is aware of its members.\n2. Help elect leader for kafka partition , allowing broker to manage their responsibility.\n3. Manage topic configuration, including setting and access control list and are securly stored and managed.\n4. Act as a notification system, alerting kafka to any change in the cluster, such as broker failure , restart and broker failure.","source":"","cross":[]},{"q":"Kafka KRaft (K KRaft)","a":"","source":"","cross":[]},{"q":"Kafka Security","a":"How to secure data stored in topic and topic are in some hard disk.\nHow to secure any consumer ro access any topic","source":"","cross":[]},{"q":"Kafka Authentication","a":"1. Login/password - simple but less secure\n2. Kerberos - Stonger auth using ticket and key distribution, common in enterprise.\n3. SSL/TLS - not just for encryption, also for client certificate based authentication.","source":"","cross":[]},{"q":"Kafka Authorization","a":"It Controlling Access\n\n1. User LoginEventMicroService can PRODUCE to topic LoginEvents\n2. User ClickOnPayment can PRODUCE to topic CardPaymentEvents","source":"","cross":[]},{"q":"Confluent kafka cloud","a":"","source":"","cross":[]},{"q":"kafka connect","a":"","source":"","cross":[]}]},"Introduction":{"color":"#607D8B","icon":"👋","questions":[{"q":"Introduce as a senior python developer with 11 years of experience in backend and frontend with python , next js, databases, cloud server, deployment, etc currently working  in thesquare since last 5 years . here managing multiple project, migrating technology, help fellow developers and adopt new technology.","a":"🔹 Sample Introduction\n\n“Good morning, and thank you for the opportunity.\n\nMy name is Deepak, and I have around 11 years of experience in software development, primarily focusing on Python, cloud management, project architecture, data engineering, and data quality frameworks.\n\nIn my most recent role at Thesqua.re, I am responsible for developing and maintaining data pipelines and quality validation systems that ensured high data integrity across thousands of records daily. I built custom Data Quality rules, exception handling, and reporting worked closely with other departments to improve overall data trustworthiness.\n\nOn the technical side, I’ve worked extensively with Flask, SQL, Google Cloud Platform (including App Engine and BigQuery), and implemented automated testing using PyTest. I’m also familiar with REST APIs, microservices, and asynchronous processing using multiprocessing and asyncio for performance optimization.\n\nI take pride in writing clean, efficient, and well-tested code and have a strong interest in improving data reliability, governance, and operational transparency.","source":"","cross":[]},{"q":"describe any challanging task, and what was the challanges and how do you solve it?","a":"","source":"","cross":[]}]},"Companies":{"color":"#E91E63","icon":"🏢","questions":[{"q":"Add a new column in pandas dataframe?","a":"import pandas as pd\n\ndf = pd.DataFrame({\n    'name': ['Alice', 'Bob', 'Charlie'],\n    'age': [25, 30, 35]\n})\n\ndf['country'] = 'India'\n\nprint(df)\n\n      name    age  country\n0    Alice      25    India\n1    Bob       30    India\n2    Charlie  35    India\n\n🟢 Example 2: Add a column based on existing columns\n\ndf['age_in_5_years'] = df['age'] + 5","source":"","cross":[]},{"q":"How do you ensure security in Django and FastAPI?","a":"✅ Summary\n\nConcern                       Django                                                FastAPI\nAuth System                 Built-in (django.contrib.auth)               Manual (OAuth2, JWT, custom)\nCSRF Protection          Built-in Middleware                              Must implement if using browser forms\nSQL Injection                Handled by ORM                                Use ORM / parameterized queries\nXSS                              Auto-escaped templates                     Use Jinja2 with auto-escape or avoid HTML\nSecure Headers           Middleware (SecurityMiddleware)       Use Starlette middleware\nPassword Security        Auto-hashed                                       Use bcrypt, passlib, or similar\nHTTPS                          Enforced via settings                          Handled by proxy like Nginx\n\n🚨 Additional Best Practices for Both\n\n    ✅ Use environment variables for secrets (e.g., SECRET_KEY)\n\n    ✅ Run behind HTTPS\n\n    ✅ Limit CORS domains (especially in FastAPI)\n\n    ✅ Sanitize file uploads (MIME type, file size)\n\n    ✅ Avoid leaking stack traces (DEBUG = False)\n\n    ✅ Use Helmet-like middleware to set secure headers\n\n    ✅ Log suspicious activity\n\n    ✅ Rate limit login endpoints","source":"","cross":[]},{"q":"What is data Quality check? And where do you use data quality in your current project?","a":"","source":"","cross":[]},{"q":"How do you determine the total number of rows when reading a CSV file in pandas, if column A has 15 values and column B has 25 values?\nWhich number of rows should the resulting DataFrame have, and why?","a":"✅ Answer:\n\nWhen reading a CSV file using pandas.read_csv(), pandas will create a DataFrame with the number of rows equal to the length of the longest column.\n\nSo in this case:\n\n    Column A has 15 values\n\n    Column B has 25 values\n\n➡️ Result:\n\nThe resulting DataFrame will have 25 rows.\n💡 Why?\n\n    Pandas aligns columns by row index.\n\n    Missing values in shorter columns (like column A) are filled with NaN.\n\n    This ensures all columns have the same number of rows.","source":"","cross":[]},{"q":"How do you add a new column to a pandas DataFrame?\nFor example, if you have two columns: first_name and last_name, and you want to create a third column called full_name that combines them, how would you do it?","a":"import pandas as pd\n\n# Create a sample DataFrame\ndf = pd.DataFrame({\n    'first_name': ['Alice', 'Bob', 'Charlie'],\n    'last_name': ['Smith', 'Jones', 'Brown']\n})\n\n# Add a new column 'full_name'\ndf['full_name'] = df['first_name'] + ' ' + df['last_name']\n\nprint(df)\n\n💡 Notes:\n\n    Ensure that both columns contain string values. If there's a chance of missing values (NaN) or non-strings, use .fillna('') or .astype(str) to prevent errors.\n\ndf['full_name'] = df['first_name'].fillna('').astype(str) + ' ' + df['last_name'].fillna('').astype(str)\n\nIf any value is None in first_name or last_name - so fillna('').astype(str) replaces it with an empty string.","source":"","cross":[]},{"q":"Where did you use multithreading in your project and what problem did you solve, explain with example?","a":"","source":"","cross":[]},{"q":"What is the drawback of using asyncio?","a":"asyncio is powerful for writing concurrent Python code using the async/await syntax, but it has several drawbacks you should be aware of:\n\n🔧 1. Not Suitable for CPU-Bound Tasks\n\n    Why: asyncio is designed for I/O-bound operations (like network calls or file I/O), not for CPU-intensive tasks.\n\n    Drawback: Heavy computation blocks the event loop, defeating the purpose of asynchronous programming.\n\n    Better Alternative: Use threads (concurrent.futures.ThreadPoolExecutor) or multiprocessing for CPU-bound tasks.\n\n🔁 2. Single-Threaded by Default\n\n    Why: The event loop runs on a single thread.\n\n    Drawback: No true parallelism. You can’t take advantage of multiple CPU cores unless you explicitly use processes or threads.\n\n    Implication: Blocking a single async function can freeze the entire program.\n\n🔄 3. Harder Debugging & Error Handling\n\n    Why: Async code can behave in non-linear ways.\n\n    Drawback: Stack traces can be less intuitive. Debugging and exception tracking become more complex compared to synchronous code.\n\n🔌 4. Third-Party Library Compatibility\n\n    Why: Not all Python libraries are asyncio-friendly.\n\n    Drawback: Using blocking (synchronous) libraries in async code requires extra work (e.g., wrapping with run_in_executor).\n\n📚 5. Steep Learning Curve\n\n    Why: It introduces new concepts like event loops, coroutines, awaitables, etc.\n\n    Drawback: Developers familiar with traditional multithreading may find async/await semantics unintuitive.\n\n🔄 6. Event Loop Nesting Limitations\n\n    Why: Only one event loop can run per thread.\n\n    Drawback: Nesting event loops (e.g., calling asyncio.run() inside another async function) causes errors.","source":"","cross":[]},{"q":"How to sort a column in pandas dataframe?","a":"import pandas as pd\n\n# Example DataFrame\ndf = pd.DataFrame({\n    'name': ['Alice', 'Bob', 'Charlie'],\n    'age': [25, 30, 20]\n})\n\n# Sort by 'age' in ascending order\ndf_sorted = df.sort_values(by='age')\nprint(df_sorted)\n\nSort in Descending Order\n\ndf_sorted_desc = df.sort_values(by='age', ascending=False)\nprint(df_sorted_desc)\n\nSort by Multiple Columns\n\n# Sort by 'age', then by 'name'\ndf_sorted_multi = df.sort_values(by=['age', 'name'])\nprint(df_sorted_multi)\n\nSort In-Place\n\ndf.sort_values(by='age', inplace=True)","source":"","cross":[]},{"q":"Q1. What are Python’s key data structures and when do you use each?","a":"List: Ordered, mutable — good for dynamic arrays.\n\nTuple: Ordered, immutable — for fixed collections (e.g., coordinates).\n\nSet: Unordered, unique items — fast membership tests.\n\nDict: Key-value pairs — for mappings or associative arrays.\n\nBonus: Use collections for specialized containers like defaultdict, OrderedDict.","source":"","cross":[]},{"q":"Q2. How do you handle memory management in Python?","a":"Python uses reference counting and a garbage collector for cyclic references.\n\nTools: gc module to debug memory leaks, objgraph to visualize.\n\nBest practices: Use generators, avoid large global objects, use context managers (with).","source":"","cross":[]},{"q":"Q3. How would you improve the performance of a slow Python script?","a":"Profile with cProfile to find bottlenecks\n\nOptimize logic, avoid nested loops\n\nUse NumPy/Pandas for data-heavy tasks\n\nUse multi-threading for I/O, multiprocessing for CPU\n\nConsider Cython or rewriting critical parts in C/C++","source":"","cross":[]},{"q":"ETL","a":"✅ 1. Goal of the Pipeline\n\nIngest sales transaction data from an external API and CSVs, clean/validate it, enrich with product metadata, and load it into a reporting warehouse (e.g., BigQuery/PostgreSQL).\n\n🧱 Pipeline Architecture\n\n        [External API / CSV]\n               |\n            Extract\n               |\n            Transform\n         (clean + enrich)\n               |\n            Validate\n        (nulls, schema, types)\n               |\n            Load\n         (to BigQuery/DB)\n               |\n          Logging / Alerts\n               |\n     Monitoring & Scheduling (Airflow)\n\n🧪 Sample Code Snippet\n\nimport pandas as pd\nimport requests\nfrom sqlalchemy import create_engine\n\n# --- Extract ---\ndef fetch_api_data(api_url):\n    response = requests.get(api_url)\n    data = response.json()\n    return pd.DataFrame(data)\n\n# --- Transform ---\ndef clean_and_enrich(df, product_df):\n    df = df.dropna(subset=['order_id'])\n    df['order_date'] = pd.to_datetime(df['order_date'])\n    df['total_price'] = df['unit_price'] * df['quantity']\n    enriched = df.merge(product_df, on='product_id', how='left')\n    return enriched\n\n# --- Load ---\ndef load_to_postgres(df, table, db_url):\n    engine = create_engine(db_url)\n    df.to_sql(table, con=engine, index=False, if_exists='replace')\n\n# --- Main Pipeline ---\ndef run_pipeline():\n    orders = fetch_api_data(\\\"https://api.example.com/orders\\\")\n    products = pd.read_csv(\\\"products.csv\\\")\n    final_df = clean_and_enrich(orders, products)\n    load_to_postgres(final_df, \\\"order_summary\\\", \\\"postgresql://user:pass@host/db\\\")\n\nif __name__ == \\\"__main__\\\":\n    run_pipeline()","source":"","cross":[]},{"q":"How do you read a file line-by-line and count lines?","a":"line_count = 0\nwith open('filename.txt', 'r') as file:\n    for line in file:\n        line_count += 1\n\nprint(f\\\"Total lines: {line_count}\\\")","source":"","cross":[]},{"q":"What’s the syntax for lambda and where would you use it?","a":"lambda arguments: expression\n\n# Regular function\ndef add(x, y):\n    return x + y\n\n# Lambda version\nadd = lambda x, y: x + y\nprint(add(3, 4))  # Output: 7","source":"","cross":[]},{"q":"How to organize a package? How does __init__.py work?","a":"my_package/\n│\n├── __init__.py       # Makes this folder a Python package\n├── module1.py\n├── module2.py\n└── subpackage/\n    ├── __init__.py\n    └── submodule.py","source":"","cross":[]},{"q":"What is virtualenv and why is it used?","a":"virtualenv is a tool to create isolated Python environments. Each environment has its own Python interpreter and its own set of installed packages, separate from the global Python installation.","source":"","cross":[]},{"q":"Difference between requirements.txt and Pipfile?","a":"\\\"requirements.txt is simpler and used by default with pip install -r requirements.txt.\nPipfile offers better dependency management with separate sections for dev and default packages, used via pipenv install.\n\nrequirements.txt:\nrequests==2.31.0\n\nPipfile:\n[packages]\nrequests = \\\"\\\"==2.31.0\\\"\\\"\n\n[dev-packages]\npytest = \\\"\\\"*\\\"\\\"\n\\\"","source":"","cross":[]},{"q":"How to convert string date to datetime object?","a":"from datetime import datetime\n\n# Example A: date only\ns1 = \\\"2025-06-03\\\"\ndt1 = datetime.strptime(s1, \\\"%Y-%m-%d\\\")\n# dt1 → datetime(2025, 6, 3, 0, 0)\n\n# Example B: date + 12-hour time w/ AM/PM\ns2 = \\\"June 3, 2025  2:30 PM\\\"\ndt2 = datetime.strptime(s2, \\\"%B %d, %Y  %I:%M %p\\\")\n# dt2 → datetime(2025, 6, 3, 14, 30)\n\n# Example C: ISO 8601 (with “T”)\ns3 = \\\"2025-06-03T14:30:00\\\"\ndt3 = datetime.strptime(s3, \\\"%Y-%m-%dT%H:%M:%S\\\")\n# dt3 → datetime(2025, 6, 3, 14, 30)","source":"","cross":[]},{"q":"generate finonacci using generator","a":"def fib_gen(n):\n    a,b = 0,1\n    count = 0\n    while count < n:\n        yield a\n        a,b = b, a+b\n        count+=1\n        \nfor i in fib_gen(10):\n    print(i)","source":"","cross":[]},{"q":"Interview Start","a":"","source":"","cross":[]},{"q":"Create a linked list. and write display function.","a":"class Node:\n    def __init__(self, data):\n        self.data = data\n        self.next = None\n        \n        \nclass LinkedList:\n    def __init__(self):\n        self.head = None\n        \n    def insert(self, data):\n        temp = Node(data)\n        if not self.head:\n            self.head = temp\n            return\n        \n        last = self.head\n        while last.next:\n            last = last.next\n        last.next = temp\n        \n    def display(self):\n        temp = self.head\n        while temp:\n            print(temp.data, end=\\\" \\\")\n            temp = temp.next\n            \nllist = LinkedList()\nllist.head = Node(10)\n\nllist.insert(20)\nllist.insert(30)\nllist.insert(40)\nllist.insert(50)\n\nllist.display()","source":"","cross":[]},{"q":"What is diff b/w shallow copy and deepcopy","a":"1.Shallow copy:\nwhen update copied object also update orignal too.\n\nimport copy\noriginal = [[1, 2], [3, 4]]\n# Shallow copy\nshallow = copy.copy(original)\n\nshallow[0][0] = 99\nprint(original)  # ❗ [[99, 2], [3, 4]] → affected!\n\n2. Deepcopy :\nIt create a independent clone no refrence\n\nimport copy\noriginal = [[1, 2], [3, 4]]\n# deep copy\ndeep = copy.deepcopy(original)\n\ndeep[0][0] = 99\nprint(original)  #  [[1, 2], [3, 4]] →not  affected!","source":"","cross":[]},{"q":"Design an efficient utility to spell-check and correct millions of records from a CSV file using a predefined list of misspelled and correct words. Focus on speed and performance.","a":"","source":"","cross":[]},{"q":"Difference b/w SQL and NoSQL databases.","a":"🔷 SQL Databases (Relational)\n\n    Structure: Tables with rows and columns (fixed schema).\n\n    Schema: Rigid — you must define the schema before inserting data.\n\n    Query Language: Structured Query Language (SQL).\n\n    Data Integrity: Strong ACID compliance (Atomicity, Consistency, Isolation, Durability).\n\n    Best for: Complex queries, transactions, and structured data.\n\n✅ Examples:\n\n    MySQL\n\n    PostgreSQL\n\n    SQLite\n\n    Microsoft SQL Server\n\n🔶 NoSQL Databases (Non-Relational)\n\n    Structure: Flexible — data can be stored as:\n\n        Key-value pairs\n\n        Documents (JSON, BSON)\n\n        Wide-columns\n\n        Graphs\n\n    Schema: Dynamic — can store unstructured or semi-structured data.\n\n    Query Language: Varies by database; often no standard language like SQL.\n\n    Data Integrity: Often eventual consistency; BASE model (Basically Available, Soft state, Eventual consistency).\n\n    Best for: Scalability, high-velocity unstructured data, flexible schema.\n\n✅ Examples:\n\n    MongoDB (Document)\n\n    Redis (Key-Value)\n\n    Cassandra (Wide-column)\n\n    Neo4j (Graph)","source":"","cross":[]},{"q":"Given employee records in a NoSQL DB, how would you efficiently handle adding spouse details with varying fields (e.g., some provide only name, others include DOB, email, phone, etc.)?","a":"✅ Efficient Strategy in a NoSQL DB:\n1. Embed spouse details as a subdocument\n\nSince NoSQL (like MongoDB) supports flexible schemas, you can store the spouse data directly inside the employee record as a nested object.\nExample Document:\n{\n  \\\"employee_id\\\": \\\"E123\\\",\n  \\\"name\\\": \\\"John Doe\\\",\n  \\\"department\\\": \\\"Engineering\\\",\n  \\\"spouse\\\": {\n    \\\"name\\\": \\\"Jane Doe\\\",\n    \\\"dob\\\": \\\"1988-06-14\\\",\n    \\\"email\\\": \\\"jane@example.com\\\",\n    \\\"phone\\\": \\\"+1234567890\\\"\n  }\n}\nAnother Example (Partial Spouse Info):\n{\n  \\\"employee_id\\\": \\\"E124\\\",\n  \\\"name\\\": \\\"Alice Smith\\\",\n  \\\"department\\\": \\\"Marketing\\\",\n  \\\"spouse\\\": {\n    \\\"name\\\": \\\"Tom Smith\\\"\n  }\n}\nYou don’t need to enforce every spouse record to have all fields. MongoDB and other document-based NoSQL DBs allow missing fields in subdocuments without any issue.\n\n🛠 Tips for Implementation:\n\n    Validation (optional): Use application-level validation or schema validators (e.g., MongoDB's JSON Schema or Pydantic in Python) to check required fields if needed.\n\n    Indexing: If you need to frequently query fields like spouse.email, consider adding sparse indexes on those fields.\n\n    Defaults: Handle missing values gracefully in your app logic (e.g., default to null or skip display).\n\n🚀 Why This is Efficient:\n\n    No need for rigid schemas or table joins (as in SQL).\n\n    Supports heterogenous spouse data without redesign.\n\n    One write/read operation includes both employee and spouse info.","source":"","cross":[]},{"q":"What is self in python?","a":"🐍 What is self in Python?\n\nIn Python, self is a reference to the current instance of the class — it's how an object refers to its own data and methods.","source":"","cross":[]},{"q":"Interview End","a":"","source":"","cross":[]},{"q":"Please build a simple Loan Servicing Platform that supports the following:\n\n- User sign-up/login and token-based authentication\n\n- User can view their loans, repayment schedule, and make a payment\n\n- Admin can view all users and loans\n\n1. Database Design\n\nDesign a PostgreSQL schema for: User, Loan, Payment\n\nEnsure to follow database design best practices\n \n2. Backend – Python (FastAPI or Flask)\n\nBuild modular RESTful services with shared middlewares for security, rate limiting, and logging.\n \nImplement the following endpoints:\n\nPOST /signup, POST /login (JWT Auth)\n\nGET /me/loans\n\nGET /admin/users (admin-only)\n \n3. Frontend – Ensure reusable API service module, token handling, Hooks, State Management\n\nBuild a modular React frontend to consume the above APIs for\n\n- Login / Signup\n\n- My Loans","a":"","source":"","cross":[]},{"q":"Asking for middlewares/ ratelimmitter","a":"","source":"","cross":[]},{"q":"Asking for current website / server throughput and concurrency","a":"","source":"","cross":[]},{"q":"Asking for use pydentic in flask app","a":"","source":"","cross":[]},{"q":"asking for use automatic validation instead of custom","a":"","source":"","cross":[]},{"q":"Create a database structure User, Loan and Payment","a":"","source":"","cross":[]},{"q":"Build modular RESTful services with shared middlewares for security, data validation, rate limiting, and logging.\n \nImplement the following endpoints:\n\nPOST /signup, POST /login (JWT Auth)","a":"","source":"","cross":[]},{"q":"MISTAKE I DID","a":"Solution","source":"","cross":[]},{"q":"forget __name__ inside Flask() - app = Flask()","a":"app = Flask(__name__)","source":"","cross":[]},{"q":"Forgot this package name - Flask Cors I thought this comes with flask only","a":"flask_cors or Flask-Cors","source":"","cross":[]},{"q":"Forgot this package name - Flask rate limitting/ I wrote flask-limitter, this isn't working and How to initialize and use this with code","a":"Library name: Flask-Limiter","source":"","cross":[]},{"q":"Forgot this library - jwt","a":"Flask-JWT-Extended / Flask-JWT","source":"","cross":[]},{"q":"forgot this library - sqlalchemy","a":"Flask-SQLAlchemy","source":"","cross":[]},{"q":"flask-limitter in requirements.txt\nfrom flast_limitter import RateLimit\nlimit = RateLimit(\n    \n)","a":"Flask-Limiter\nfrom flask_limiter import Limiter\nlimiter = Limiter(\n            get_remote_address, \n            app=app,         \n         storage_uri=os.environ.get(\\\"FLASK_RATELIMIT_STORAGE_URI\\\", \\\"redis://projects/staging-luxe/locations/us-east1/connectors/redis-uat-connector:6379\\\"),\n            default_limits = [\\\"1/second\\\"])\n        limiter.limit(\\\"6/second\\\")(react_api_bp)","source":"","cross":[]},{"q":"No library added in requirements.txt\nCORS([\n    'www.cognute.com'\n])","a":"Flask-Cors\nfrom flask_cors import CORS\napp = Flask(__name__)\ncors = CORS(app, resources={\n        r\\\"/*\\\": {\n            \\\"origins\\\": [\n                \\\"http://localhost:3000\\\",\n                \\\"https://thesqua.re\\\",\n                \\\"https://www.thesqua.re\\\",\n                \\\"https://thesquarelivinghub.com\\\",\n                \\\"https://www.thesquarelivinghub.com\\\",\n                \\\"https://preproduction-ratedapartments.appspot.com\\\",\n                \\\"https://nextinstance-dot-react-staging.de.r.appspot.com\\\",\n                \\\"https://chat-dot-preproduction-ratedapartments.appspot.com\\\",\n                \\\"http://localhost:8080\\\",\n                \\\"https://nextinstance-dot-staging-luxe.ue.r.appspot.com\\\",\n                \\\"https://staging.thesqua.re\\\",\n                \\\"https://react-dev-dot-react-staging.de.r.appspot.com\\\"\n            ]\n        }\n    })","source":"","cross":[]},{"q":"1. calculate estimated time for delivery\n2. calculate distance\n3. minimize order split to reduce delivery cost\n\ncompany has pan india 3 warehouse, and there are 100+ stores pan india, order mostly come from the website, for order delivery 1st preference is store, 2nd is warehouse, sometime it happens that oreder contains multiple items, but it can hapeen that nearest store not able to fullfill this so we have take rest items from the warehouse , now this order is devided into 2 part which
