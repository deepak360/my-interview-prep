<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Flashcard Deck — Deepak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #161921;
  --surface2: #1e2130;
  --border: #2a2f42;
  --text: #e8ecf4;
  --muted: #7b8299;
  --accent: #6c8efb;
  --accent2: #a78bfa;
  --green: #34d399;
  --orange: #fb923c;
  --red: #f87171;
  --yellow: #fbbf24;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 4px 32px rgba(0,0,0,0.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 800px 600px at 20% 10%, rgba(108,142,251,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 600px 500px at 80% 80%, rgba(167,139,250,0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ===== HEADER ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13,15,20,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 64px;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  background: linear-gradient(135deg, #6c8efb, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
  flex-shrink: 0;
}

.header-search {
  flex: 1;
  max-width: 400px;
  position: relative;
}

.header-search input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 12px 8px 36px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}

.header-search input:focus { border-color: var(--accent); }
.header-search input::placeholder { color: var(--muted); }

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
}

.header-stats {
  display: flex;
  gap: 16px;
  margin-left: auto;
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
}

.stat-chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-chip span { color: var(--text); font-weight: 600; }

/* ===== TABS ===== */
.tabs-wrapper {
  background: rgba(13,15,20,0.9);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 64px;
  z-index: 99;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs-wrapper::-webkit-scrollbar { display: none; }

.tabs {
  display: flex;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px;
  gap: 2px;
}

.tab-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 14px 18px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  border-bottom: 2px solid transparent;
  position: relative;
}

.tab-btn:hover { color: var(--text); }

.tab-btn.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

.tab-count {
  background: var(--surface2);
  border-radius: 100px;
  padding: 2px 7px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}

.tab-btn.active .tab-count {
  background: var(--accent);
  color: white;
}

/* ===== MAIN LAYOUT ===== */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
  position: relative;
  z-index: 1;
}

/* ===== TOOLBAR ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 20px;
  color: var(--text);
}

.section-subtitle {
  font-size: 13px;
  color: var(--muted);
}

.filter-group {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

.filter-btn {
  padding: 7px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn:hover, .filter-btn.active {
  border-color: var(--accent);
  color: var(--accent);
}

/* ===== CARDS GRID ===== */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

/* ===== FLASHCARD ===== */
.flashcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  cursor: pointer;
  position: relative;
}

.flashcard:hover {
  transform: translateY(-2px);
  border-color: rgba(108,142,251,0.4);
  box-shadow: 0 8px 32px rgba(108,142,251,0.1);
}

.flashcard.expanded {
  border-color: var(--accent);
}

.card-header {
  padding: 16px 18px 14px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.card-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface2);
  border-radius: 5px;
  padding: 2px 7px;
  flex-shrink: 0;
  margin-top: 2px;
}

.card-question {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.55;
  color: var(--text);
  flex: 1;
}

.card-tags {
  display: flex;
  gap: 6px;
  padding: 0 18px 12px;
  flex-wrap: wrap;
}

.tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}

.tag-source {
  background: rgba(108,142,251,0.12);
  color: var(--accent);
  border: 1px solid rgba(108,142,251,0.2);
}

.tag-answered {
  background: rgba(52,211,153,0.12);
  color: var(--green);
  border: 1px solid rgba(52,211,153,0.2);
}

.tag-missing {
  background: rgba(251,191,36,0.12);
  color: var(--yellow);
  border: 1px solid rgba(251,191,36,0.2);
}

.card-divider {
  height: 1px;
  background: var(--border);
  margin: 0 18px;
}

/* Answer section - collapsed by default */
.card-body {
  display: none;
  padding: 16px 18px;
}

.card-body.show { display: block; }

/* Answer/Cross question tabs */
.answer-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 14px;
}

.answer-tab {
  padding: 6px 12px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: none;
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}

.answer-tab.active {
  background: var(--surface2);
  color: var(--text);
  border-color: var(--accent);
}

.answer-content {
  display: none;
}
.answer-content.active { display: block; }

.answer-text {
  font-size: 13px;
  line-height: 1.7;
  color: #c8d0e8;
  white-space: pre-wrap;
}

/* Code blocks */
.answer-text code, .code-block {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--surface2);
  border-radius: 8px;
  padding: 12px 14px;
  display: block;
  margin: 10px 0;
  border: 1px solid var(--border);
  overflow-x: auto;
  color: #a8d8a8;
  line-height: 1.6;
  white-space: pre;
}

.cross-q {
  background: rgba(167,139,250,0.06);
  border: 1px solid rgba(167,139,250,0.2);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 13px;
  color: #c4b5f5;
  line-height: 1.6;
}

.cross-q-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent2);
  margin-bottom: 5px;
  display: block;
}

/* AI Generation button */
.gen-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: linear-gradient(135deg, rgba(108,142,251,0.15), rgba(167,139,250,0.15));
  border: 1px solid rgba(108,142,251,0.3);
  border-radius: 8px;
  color: var(--accent);
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  justify-content: center;
  margin-top: 8px;
}

.gen-btn:hover {
  background: linear-gradient(135deg, rgba(108,142,251,0.25), rgba(167,139,250,0.25));
  border-color: var(--accent);
}

.gen-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Spinner */
.spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(108,142,251,0.3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Card footer */
.card-footer {
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
}

.toggle-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  padding: 0;
}

.toggle-btn svg {
  transition: transform 0.25s;
}

.flashcard.expanded .toggle-btn svg {
  transform: rotate(180deg);
}

.bookmark-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 16px;
  transition: color 0.2s;
  padding: 0;
  display: flex;
  align-items: center;
}

.bookmark-btn.bookmarked { color: var(--yellow); }

/* ===== SEARCH RESULTS ===== */
.search-results-label {
  font-size: 13px;
  color: var(--muted);
  padding: 8px 0;
  margin-bottom: 12px;
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 80px 24px;
  color: var(--muted);
}

.empty-state h3 {
  font-size: 20px;
  margin-bottom: 8px;
  color: var(--text);
}

/* ===== PROGRESS BAR ===== */
.progress-bar-wrap {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 18px 0;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.4s ease;
}

/* ===== HIGHLIGHT ===== */
mark {
  background: rgba(251,191,36,0.25);
  color: var(--yellow);
  border-radius: 3px;
  padding: 0 2px;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .header-stats { display: none; }
  .cards-grid { grid-template-columns: 1fr; }
  .main { padding: 16px; }
  .filter-group { flex-wrap: wrap; }
}

/* loading overlay */
#loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13,15,20,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  flex-direction: column;
  gap: 16px;
}

#loading-overlay.hidden { display: none; }

.loading-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 28px;
  background: linear-gradient(135deg, #6c8efb, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.loading-bar {
  width: 240px;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.loading-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  animation: loadprogress 1.2s ease forwards;
}

@keyframes loadprogress {
  from { width: 0; }
  to { width: 100%; }
}

.loading-text {
  color: var(--muted);
  font-size: 13px;
}

/* toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text);
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="loading-logo">Interview Deck</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  <div class="loading-text">Loading 634 questions...</div>
</div>

<div class="toast" id="toast"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">📚 Interview Deck</div>
    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="globalSearch" placeholder="Search across all questions..." oninput="handleSearch(this.value)">
    </div>
    <div class="header-stats">
      <div class="stat-chip">Total <span id="stat-total">0</span></div>
      <div class="stat-chip">Answered <span id="stat-answered">0</span></div>
      <div class="stat-chip">Bookmarked <span id="stat-bookmarked">0</span></div>
    </div>
  </div>
</header>

<!-- TABS -->
<div class="tabs-wrapper">
  <div class="tabs" id="tabs"></div>
</div>

<!-- MAIN -->
<main class="main">
  <div class="toolbar">
    <div class="toolbar-left">
      <div>
        <div class="section-title" id="section-title">Python</div>
        <div class="section-subtitle" id="section-subtitle">0 questions</div>
      </div>
    </div>
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('answered', this)">Answered</button>
      <button class="filter-btn" onclick="setFilter('missing', this)">Need Answer</button>
      <button class="filter-btn" onclick="setFilter('bookmarked', this)">⭐ Saved</button>
    </div>
  </div>
  
  <div id="search-info" class="search-results-label" style="display:none;"></div>
  <div class="cards-grid" id="cardsGrid"></div>
</main>

<script>
// ===== DATA =====
const QA_DATA = {"Python":{"color":"#4CAF50","icon":"🐍","questions":[{"q":"How to Update millions or records in a table?","a":"1. Avoid One Big Update\nUPDATE huge_table SET column = 'new_value';\n\nThis can:\n    Lock the whole table\n    Fill up your transaction logs\n    Crash or freeze your DB under load\n    \n2. Use Batching\nUPDATE huge_table\nSET column = 'new_value'\nWHERE id BETWEEN 1 AND 10000;\n\nBonus: Rollback plan\nAlways have:\n    A backup\n    A test run on staging\n    A rollback script if something goes wrong","source":"","cross":[]},{"q":"Diff b/w '==' and 'is' in python?","a":"a = [1, 2, 3]\nb = [1, 2, 3]\n\na==b    TRUE #because their values are same (== when you care about values.)\na is b   FALSE #because m/m address are different and they are two separate lists in memory (is when you care about whether two variables point to the same object.)","source":"","cross":[]},{"q":"What is strict typing? How can we implement this in python, and what are the various advantage of it?","a":"1️⃣ What is Strict Typing?\n\nStrict typing means a programming language enforces data types strongly and does not automatically convert (coerce) one type to another.\n\nIf you try to use incompatible types, the program throws an error instead of converting them automatically.\n\nExample idea:\n\nIn strictly typed languages, \\\"5\\\" + 2 → ❌ Error\n\nIn loosely typed languages, \\\"5\\\" + 2 → may convert automatically\n\nPython is dynamically typed, but it is strongly typed (not strictly typed by default).\nThat means Python does not automatically convert incompatible types.\n\nExample:\nprint(\\\"5\\\" + 2) - TypeError: can only concatenate str (not \\\"int\\\") to str\n\nprint(int(\\\"5\\\") + 2) - 7\n\n2️⃣ How to Implement Strict Typing in Python\n\nPython supports type hints (PEP 484) to simulate stricter typing.\n\nMethod 1: Using Type Hints\n\ndef add(a: int, b: int) -> int:\n    return a + b\n\nprint(add(5, 3))","source":"","cross":[]},{"q":"What is Dependency Injection?","a":"📌 Dependency Injection is a design pattern where an object’s dependencies are provided to it from the outside, rather than the object creating them itself.\n\n“Don’t build what you need. Ask for it.”\n\n❌ Without DI (tight coupling):\nclass Service:\n    def __init__(self):\n        self.db = Database()  # tightly coupled to Database class\n\n✅ With DI (loose coupling):\nclass Service:\n    def __init__(self, db):\n        self.db = db  # db is injected from outside\n\nNow you can easily swap db with:\n    A real database\n    A mock database (for testing)\n    A logging wrapper, etc.\n\n🎯 Benefits of Dependency Injection:\n\n✅ Looser coupling\n✅ Easier testing (inject mock dependencies)\n✅ More reusable and modular code\n✅ Better separation of concerns","source":"","cross":[]},{"q":"Which datatype can become key in dict ? Is dict can be a key in dict?","a":"Tuples are immutable, meaning that once a tuple has been created, you can't replace any of its elements with a new value. Lists are mutable, meaning that you can always change a list's elements. Only immutable elements can be used as dictionary keys, and hence only tuples can be used as keys.","source":"","cross":[]},{"q":"🔍 Method Resolution Order (MRO)","a":"🎯 Key Rule: Left-to-right\nclass C(A, B):\nmeans:\nPython will look in C\nThen A\nThen B\nThen finally object\nUnless overridden by a more complex hierarchy, left-most wins.\n\nEX-\nclass A:\n    def greet(self):\n        print(\\\"A\\\")\n\nclass B(A):\n    def greet(self):\n        super().greet()\n        print(\\\"B\\\")\n\nclass C(A):\n    def greet(self):\n        super().greet()\n        print(\\\"C\\\")\n\nclass D(B, C):\n    def greet(self):\n        super().greet()\n        print(\\\"D\\\")\n\nd = D()\nd.greet()\n\nOutput - ACBD\n\n🤔 Why?\nBecause super() doesn't mean \\\"call my parent.\\\" It means \\\"call the next class in the MRO.\\\" So:\n\nD.greet() → B.greet()\n\nB.greet() → C.greet() (next in MRO)\n\nC.greet() → A.greet()\n\nA.greet() → done","source":"","cross":[]},{"q":"How to design a system which has getting 1M/sec request.","a":"","source":"","cross":[]},{"q":"If a token is set to expire after 1 hour, but the user signs out before the token expires, how do you prevent the user from continuing to access APIs using the same token without re-authentication?","a":"🏆 Sample Answer:\n\nWhen a user logs out before their token expiry time, the main issue is that the token is still valid unless we manually revoke it. To prevent the user from continuing to access APIs with that token, we need a token invalidation mechanism.\n\nThe most common approach is to implement a token blacklist. When the user logs out, we store their token ID (or token string) in a blacklist — usually in an in-memory store like Redis — with an expiration time matching the token's original expiry. Then, at every API request, the server checks whether the token exists in the blacklist. If it does, the request is rejected.\n\nAnother approach is to use a token versioning system. For example, we store a token_version field in the user's record in the database. Each token includes the version inside it. When a user logs out, we increment the version number. Now, any old token with the previous version automatically becomes invalid, because it no longer matches the current version.\n\nBoth approaches ensure that even if a token is technically still 'live', it won't be accepted after logout, making the system secure.","source":"","cross":[]},{"q":"1. Isn’t checking blacklist on every request a performance problem?","a":"Yes, it could be a performance overhead if not optimized. That's why we use in-memory stores like Redis which are very fast. Also, we only store token IDs or jti (JWT ID claim) instead of full tokens to keep the lookup lightweight.","source":"","cross":[]},{"q":"2. How do you expire the blacklist entries?","a":"When adding a token to the blacklist, we set a TTL (time to live) equal to the token’s remaining lifespan. This way, Redis automatically removes the entry when it expires, and we avoid memory leaks.","source":"","cross":[]},{"q":"3. What if your token is a JWT and is already 'self-contained'?\\\" (i.e., no DB lookup needed — all data inside token)","a":"That’s why blacklisting is needed even with JWTs. Because otherwise, we can't revoke JWTs easily until they expire. Blacklist allows server-side invalidation of specific tokens even though the JWT technically looks valid.","source":"","cross":[]},{"q":"4. Which method is better — blacklist or token versioning?","a":"It depends on the use case. Blacklists are fine when you need fine-grained control (token-by-token). Token versioning is lighter because you just invalidate all old tokens after logout — but it invalidates all active sessions at once, which might not always be what you want.","source":"","cross":[]},{"q":"5. If you have 10 million users, how do you scale blacklist?","a":"Use sharded Redis clusters for blacklist storage. Also, ensure only important fields (like token ID) are saved. Optionally, we can use compressed formats like Redis sets or bloom filters if memory becomes an issue.","source":"","cross":[]},{"q":"What is rate Limitter?","a":"","source":"","cross":[]},{"q":"What is Saga Pattern?","a":"The Saga Pattern is a design pattern used to manage data consistency across multiple services in a distributed system, without needing distributed transactions.\n\nInstead of locking everything like a database transaction (BEGIN...COMMIT across services — which is super risky), Saga breaks a big transaction into a sequence of smaller local transactions.\nEach local transaction updates its own database and then triggers the next step.\nIf something fails, it runs compensating transactions to undo the previous steps.\n\n🎯 Simple Real-world Example:\n\nImagine you're booking a trip:\n\n    Step 1: Book flight ✅\n\n    Step 2: Book hotel ✅\n\n    Step 3: Rent car ❌ (FAILS)\n\n→ Now you must cancel hotel and cancel flight — this \\\"rollback\\\" is done by compensating transactions.\n\n\n🛠 When to use Saga:\n\n    Microservices architecture\n\n    Need distributed transaction-like behavior\n\n    Avoid locking resources across services\n\n    Ensure eventual consistency\n\n🔥 Bonus for Interviews:\n\nSaga is critical for building resilient distributed systems. It's how companies like Netflix, Uber, and Amazon handle complex workflows across microservices without sacrificing availability.","source":"","cross":[]},{"q":"System Design and Architecture","a":"","source":"","cross":[]},{"q":"what is concurrency in Python  and how to implement it.","a":"","source":"","cross":[]},{"q":"why do you migrate you sql database of your website to postgres?And how do you migrate it?what are benifit you get from it?","a":"“Initially, the company was using a WordPress blog hosted on Google Cloud with a basic SQL database. However, we needed a highly customized blog backend to meet new content and SEO requirements. WordPress was limiting, and the SQL database wasn't optimized for the custom features we needed.”\n\n“I proposed migrating the blog backend to Django with PostgreSQL, hosted on AWS, because it gave us full flexibility, better performance, scalability, and modern DevOps capabilities. I led the migration by designing the new architecture, setting up the AWS infrastructure, rewriting the backend in Django, and migrating the data carefully from the old SQL database to PostgreSQL.”\n\n“This migration gave us several benefits: full customization of features, improved performance, better security practices, and cloud cost optimization by moving from Google Cloud to AWS. It also set the foundation for future scaling and microservices integration if needed.”\n\n📈 Why this version is better:\n\n    You show problem solving (\\\"WordPress + old SQL were limiting\\\").\n\n    You show initiative (\\\"I proposed migrating...\\\").\n\n    You show technical decision-making (choose Django + Postgres + AWS).\n\n    You show impact (better SEO, features, performance, cost).\n\n\n🔥 Bonus (if they dig deeper)\n\nIf they ask \\\"why Postgres?\\\" you can say:\n\n\\\"PostgreSQL was the natural choice because of its robustness, support for complex queries, JSONB fields for flexible data storage, better full-text search capabilities, and its mature open-source ecosystem.\\\"\n\nIf they ask \\\"why AWS?\\\", say:\n\n\\\"AWS gave us better managed services for databases (RDS), easier scaling, and more DevOps maturity compared to our earlier setup on GCP.\\\"","source":"","cross":[]},{"q":"How do you communicate b/w service?","a":"","source":"","cross":[]},{"q":"CQRS(Command Query Responsibility Segregation)","a":"","source":"","cross":[]},{"q":"What is difference b/w django/flask security level. How to enhance security?","a":"🔐 Step-by-Step Security Comparison: Django vs Flask\n\n1. Security by Default\nDjango is designed with security in mind and offers strong built-in protections right out of the box. Flask, on the other hand, provides minimal security by default, which means developers must explicitly add and configure security features.\n\n2. CSRF Protection\nDjango includes CSRF (Cross-Site Request Forgery) protection automatically through middleware and built-in form handling. Flask does not provide CSRF protection natively, but it can be implemented using extensions like Flask-WTF.\n\n3. SQL Injection Protection\nDjango’s ORM automatically escapes parameters and uses parameterized queries to prevent SQL injection attacks. Flask is safe from SQL injection if developers use SQLAlchemy or another ORM properly, ensuring parameter binding is used.\n\n4. XSS Protection\nDjango templates escape HTML output by default, making it resistant to Cross-Site Scripting (XSS). Flask uses the Jinja2 templating engine, which supports escaping, but is less strict, requiring more care from the developer.\n\n5. Session Management\nDjango manages sessions securely by default, including signing session data. Flask provides simpler cookie-based sessions which must be configured securely (e.g., using secure cookies, setting a strong secret key).\n\n6. Authentication System\nDjango comes with a robust authentication framework that includes user management, groups, permissions, and customizable login flows. Flask does not have built-in authentication and relies on third-party libraries like Flask-Login for that functionality.\n\n7. Password Hashing\nDjango securely hashes passwords using PBKDF2 by default and supports other secure algorithms like bcrypt or Argon2. Flask does not offer built-in password hashing, so developers need to use tools like werkzeug.security or passlib.\n\n8. Clickjacking Protection\nDjango includes middleware that sets headers to protect against clickjacking (like X-Frame-Options). Flask requires manual configuration to add such headers, typically through custom middleware or decorators.\n\n9. HTTPS Redirects\nDjango can enforce HTTPS through a simple settings change (SECURE_SSL_REDIRECT = True). Flask does not enforce HTTPS automatically; this must be handled via the web server or through Flask-specific middleware.\n\n10. Admin Interface\nDjango provides a powerful and secure admin interface out of the box. Flask does not include an admin UI by default, but developers can integrate third-party solutions like Flask-Admin or Flask-AppBuilder.","source":"","cross":[]},{"q":"Current project discussion? why do u use nosql instead of mysql?","a":"🔧 1. Schema Flexibility\n\n    NoSQL: Schema-less or flexible schema. You can store different fields in different documents.\n\n    MySQL: Rigid schema. Changes require migrations and downtime.\n\n    ✅ Useful if your data structures evolve frequently or are highly variable.\n\n⚡ 2. Scalability\n\n    NoSQL: Designed for horizontal scaling—easily add more nodes to handle more data or traffic.\n\n    MySQL: Primarily supports vertical scaling—adding more power to a single server.\n\n    ✅ Ideal for big data applications, IoT, or high-traffic systems.\n\n⚙️ 3. Performance with Large Datasets\n\n    NoSQL (e.g., MongoDB, Cassandra, Redis): Often faster for read/write-heavy workloads, especially with large unstructured data.\n\n    MySQL: Can be slower due to joins, normalization, and relational constraints.\n\n    ✅ Good choice when you need high write throughput (e.g., logs, caching, analytics).\n\n🌐 4. Document-Oriented Storage\n\n    NoSQL (like MongoDB): Stores data in JSON-like documents, making it a natural fit for APIs, microservices, or content-heavy applications.\n\n    ✅ Makes sense when storing nested or denormalized data (e.g., user profiles, product catalogs).\n\n🚫 When NOT to use NoSQL\n\n    If you need complex transactions, strong consistency, or relational joins, MySQL (or another RDBMS) may be better.\n\n    Reporting and analytics that rely heavily on SQL queries benefit from relational models.","source":"","cross":[]},{"q":"Design a decorator? append a name in any username.","a":"","source":"","cross":[]},{"q":"How Do We Optimize Query Performance?\nSQL query is running slow...how to debug?","a":"Optimizing query performance is essential for maintaining fast and efficient database operations. Below are some best practices to achieve this:\n1. Use Indexes Wisely\n\nThere are two main types of indexes:\n\n    Clustered Index:\n\n        The data in the table is physically ordered to match the index.\n\n        Only one clustered index is allowed per table.\n\n        It determines the actual data storage order.\n\n    Non-Clustered Index:\n\n        Creates a separate structure that maps keys to the table rows.\n\n        Allows multiple indexes on a single table.\n\n        Commonly used for improving search performance on columns not used in the clustered index.\n\nTips:\n\n    Delete unused or redundant indexes to reduce overhead.\n\n    Regularly review index usage and update based on query patterns.\n\n2. Avoid Unnecessary Joins\n\nIf you're joining two tables but not selecting any fields from the second table, consider using EXISTS instead of a JOIN.\n    This improves performance by reducing the data load and simplifies the execution plan.\n\n3. Avoid Subqueries When Possible\n\nSubqueries, especially in SELECT or WHERE clauses, can often be replaced with JOINs for better performance and optimization.\n\n4. Avoid Functions on Indexed Columns\n\n Applying functions like DATE_FORMAT(), AVG(), etc., on indexed columns can prevent the index from being used.\n\n    Instead, transform the data outside the query (e.g., in the application layer) when possible.\n\n5. Analyze the Execution Plan (Very Important)\n\n    Always review the query execution plan to identify bottlenecks or inefficient operations.\n\n    Pay attention to table scans, index usage, and query cost.\n\n6. Parameterization to Reuse Execution Plans\n\nWriting queries with hardcoded values in WHERE clauses (e.g., WHERE user_id = 123) generates a separate execution plan for each variation.\n\nInstead, use parameterized queries (e.g., WHERE user_id = @user_id) to allow the database engine to reuse the same execution plan. This reduces overhead and improves caching efficiency.","source":"","cross":[]},{"q":"🔁 PATCH vs PUT in APIs","a":"✅ PUT (Update the entire resource)\n\n    Purpose: Replace the entire resource with the new data.\n\n    Analogy: \\\"Replace the whole document.\\\"\n\n    Idempotent: Yes — sending the same PUT request multiple times doesn't change the result after the first.\n\nExample:\n\nSuppose you have a user resource:\n\n{\n  \\\"name\\\": \\\"John\\\",\n  \\\"email\\\": \\\"john@example.com\\\"\n}\n\nIf you send:\n\nPUT /users/123\n{\n  \\\"name\\\": \\\"Jane\\\"\n}\n\n➡️ The email might be lost unless you include it again.\n\n✂️ PATCH (Partial update of resource)\n\n    Purpose: Update only the fields you specify.\n\n    Analogy: \\\"Edit just a sentence in the document.\\\"\n\n    Idempotent: Technically yes, but it depends on how it's implemented.\n\nExample:\nPATCH /users/123\n{\n  \\\"name\\\": \\\"Jane\\\"\n}\n➡️ Only the name changes; email remains unchanged.","source":"","cross":[]},{"q":"💬 What is Idempotent?","a":"Idempotent means:\n\nNo matter how many times you perform an operation, the result stays the same after the first execution.\nIn simple terms, if you do the same thing multiple times, the effect doesn’t change after the first time.","source":"","cross":[]},{"q":"🎯 Why is a set so fast in Python and List is slower?","a":"Because a set in Python is built using a hash table internally.\n\n🛠 How set works inside:\n\n    When you insert an item into a set, Python computes a hash of that item.\n\n    That hash gives a unique (almost random) number.\n\n    Then Python directly stores or finds the item in a calculated memory slot.\n\nThis is why:\n\n    Checking if an item exists (x in set) → O(1) constant time.\n\n    Inserting an item → O(1) time.\n\n✅ No need to search through each item manually like in a list.\n\nPython's set is fast because it uses a hash table internally, allowing O(1) time complexity for insertions, deletions, and membership tests. Lists require O(n) time for membership because they must scan each element one by one.\n\nA Python list does not remember where a particular value is stored.\n\n    It only stores values in order (index 0, 1, 2, ...).\n\n    It doesn't build any \\\"map\\\" or \\\"index\\\" to find a value fast.\n\n👉 So, if you want to find a value (x in list), Python has to scan from the beginning — one by one — even if the list is huge.","source":"","cross":[]},{"q":"Basic of git. Docker file Basic linux cmd","a":"","source":"","cross":[]},{"q":"How to kill any api before getting response - suppose there are 2 api one is getting response in 5sec and another one is getting response in 10 sec. and I want to kill an api which taking longer to response.","a":"","source":"","cross":[]},{"q":"what is social api integration. How to do it.","a":"","source":"","cross":[]},{"q":"Diff b/w list tuple dict? And which one is ordered.","a":"🔹 1. List\n\n    Definition: An ordered, mutable collection of items.\n\n    Syntax: my_list = [1, 2, 3]\n\n    Mutable? ✅ Yes – you can change, add, or remove elements.\n\n    Ordered? ✅ Yes – insertion order is preserved.\n\n    Duplicates? ✅ Allowed.\n\n    Use Case: When you need a sequence of items that may change.\n\n🔹 2. Tuple\n\n    Definition: An ordered, immutable collection of items.\n\n    Syntax: my_tuple = (1, 2, 3)\n\n    Mutable? ❌ No – cannot modify after creation.\n\n    Ordered? ✅ Yes – insertion order is preserved.\n\n    Duplicates? ✅ Allowed.\n\n    Use Case: When you want to store a fixed sequence of values.\n\n🔹 3. Dictionary (dict)\n\n    Definition: A collection of key-value pairs.\n\n    Syntax: my_dict = {\\\"a\\\": 1, \\\"b\\\": 2}\n\n    Mutable? ✅ Yes – you can change keys and values.\n\n    Ordered? ✅ Yes – as of Python 3.7+, insertion order is preserved.\n\n    Duplicates? ❌ Keys must be unique, but values can repeat.\n\n    Use Case: When you want to map keys to values.","source":"","cross":[]},{"q":"What is data streaming API?How to create it and what is the Content-Type of streaming API?","a":"","source":"","cross":[]},{"q":"What is Authentication and autorization and how to implement?","a":"","source":"","cross":[]},{"q":"If in existing mongo db model we add some more fields - what needs to be keep in mind when we deploy this code to production.","a":"","source":"","cross":[]},{"q":"How to get rid off api timeout error - Rate limmiting, caching, query optimize, 4 code optimize","a":"1. Diagnose the Problem:\n        Timeout Settings\n        Network Issues\n        Server Load\n        Application Performance\n        Logging and Monitoring\n2. Implementing Best Practices\n        1. Asynchronous Processing\n        2. Retry Logic\n        3. Caching\n        4. Optimize API Endpoints","source":"","cross":[]},{"q":"What is asyncio - python","a":"asyncio is a library in Python that provides support for asynchronous programming. It allows you to write concurrent code using the async and await syntax, making it easier to handle I/O-bound and high-level structured network code efficiently. It is especially useful for applications that require a lot of waiting, such as web servers, network clients, and other applications involving a lot of I/O operations.","source":"","cross":[]},{"q":"generator","a":"","source":"","cross":[]},{"q":"context manager","a":"","source":"","cross":[]},{"q":"Meta class","a":"","source":"","cross":[]},{"q":"which datatype become key in dict ? is dict can be a key in dict?","a":"immutable can't be a key in dict","source":"","cross":[]},{"q":"create an abstract class.","a":"","source":"","cross":[]},{"q":"can we make an instance of anstract classs?","a":"No we can't, but we can make another class and define the method inside it and inherit abstract class then we can access.\nclass Subject(ABC):\n    def _init_(self, name):\n        self.name = name\n\n    @abstractmethod\n    def details(self):\n        pass\n\nclass SubjectDetails(Subject):\n    def _init_(self, name, number):\n        super()._init_(name)\n        self.number = number\n    \n    def details(self):\n        print(self.name, self.number)\n\n    @classmethod\n    def create_with_default_name(cls, number):\n        return cls(\\\"Default Name\\\", number)\n\n# Creating an instance of SubjectDetails using the class method\ns = SubjectDetails.create_with_default_name(10)\n\nprint(s.name)   # Output: Default Name\nprint(s.number) # Output: 10\ns.details()     # Output: Default Name 10","source":"","cross":[]},{"q":"Best Use Cases of Abstract Classes in Python","a":"1. Defining a Common Interface for Related Classes\nWhen multiple classes share the same method names and structure but have different implementations.\n\nfrom abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        pass\n\n    @abstractmethod\n    def perimeter(self):\n        pass\n\n\n5. Preventing Instantiation\n\nIf you don't want a base class to be instantiated directly, but only through subclasses, you make it abstract.\n\nIn Python, abstract classes with the abc module effectively serve the purpose of interfaces (which Python doesn’t have natively).","source":"","cross":[]},{"q":"decorator ? class inside a class is also a decorator? decorator used above the class","a":"@decorator\nclass Hello:\n        @func_deco\n        def func():\n                pass\n        \ndef add_method_decorator(cls):\n    # Adding a new method to the class\n    cls.greet = lambda self: f\\\"Hello, {self.name}!\\\"\n    return cls\n\n@add_method_decorator\nclass Person:\n    def _init_(self, name):\n        self.name = name\n\n# Usage\np = Person(\\\"Deepak\\\")\nprint(p.greet())  # Output: Hello, Deepak!","source":"","cross":[]},{"q":"What is meta class, Implement one meta class.","a":"A metaclass in Python is a class of a class. Just like classes define how instances behave, metaclasses define how classes behave.\n\nIn simple terms:\n\n    Objects are instances of classes.\n\n    Classes are instances of metaclasses.\n\nBy default, Python uses the built-in metaclass type. But you can create a custom metaclass to control or modify class creation and behavior (e.g., validation, method injection, auto-registration).\n\nclass InterfaceChecker(type):\n    def __init__(cls, name, bases, dct):\n        if 'speak' not in dct:\n            raise TypeError(f\\\"Class '{name}' must define a 'speak()' method\\\")\n        super().__init__(name, bases, dct)\n\n# Using the metaclass\nclass Animal(metaclass=InterfaceChecker):\n    def speak(self):\n        print(\\\"Animal sound\\\")\n\n# This will raise an error because `speak` is missing\nclass Dog(metaclass=InterfaceChecker):\n    pass","source":"","cross":[]},{"q":"diff b/w list dict tuple set? How to add element in list?, how to add element at particular position? what is the time complexity of adding an element? how much m/m required, after deleting an element how to make garbage collection?","a":"","source":"","cross":[]},{"q":"SOLID","a":"","source":"","cross":[]},{"q":"logging & monitoring","a":"","source":"","cross":[]},{"q":"In docker, does image exist inside a container or container come inside an image?","a":"container come inside the image.","source":"","cross":[]},{"q":"what is __new__ vs __init__ does?","a":"🧱 __new__ vs __init__ in Python\n\n__new__    : \nPurpose  ->        Creates a new instance\nWhen Called ->        Before __init__ \nReturn Value   ->     Must return a new instance (usually super().__new__(cls))\nUsed In   ->     Immutable types (e.g., int, str, tuple), metaclasses\nArguments ->       cls, followed by all constructor args \n\n__init__ :\nPurpose  ->   Initializes the instance after creation\nWhen Called ->         After __new__\nReturn Value   ->     Returns None\nUsed In   ->     Normal object setup\nArguments ->       self, followed by all constructor args\n\n\nclass MyClass:\n    def __new__(cls, *args, **kwargs):\n        print(\\\"Inside __new__\\\")\n        instance = super().__new__(cls)\n        return instance\n\n    def __init__(self, value):\n        print(\\\"Inside __init__\\\")\n        self.value = value\n\nobj = MyClass(42)","source":"","cross":[]},{"q":"inheritance, encapsulation, abstraction, staticclass, instanceclass, classmethod.","a":"Using abstract base classes (ABCs) in Python provides a powerful way to enforce structure, define contracts, and promote clean, consistent design—especially in large or complex systems.\n\n✅ Why Use Abstract Base Classes?\n\n1. Enforce a Common Interface\n\n    ABCs ensure that all subclasses implement certain methods.\n    Prevents missing or incorrect method definitions in subclasses.\n\nfrom abc import ABC, abstractmethod\n\nclass PaymentGateway(ABC):\n    @abstractmethod\n    def pay(self, amount):\n        pass\n\n➡️ Any subclass must implement pay() or it will raise a TypeError.\n\n2. Prevent Instantiating Incomplete Classes\n\n    Abstract classes cannot be instantiated if they have any abstract methods.\n\n    Forces the developer to finish the implementation.\n\npg = PaymentGateway()  # ❌ TypeError: Can't instantiate abstract class\n\n3. Promote Code Reusability + Partial Implementation\n\n    ABCs can have both abstract and concrete (shared) methods.\n\nclass BaseLogger(ABC):\n    @abstractmethod\n    def log(self, message): pass\n\n    def format_message(self, msg):\n        return f\\\"[LOG] {msg}\\\"\n\nSubclasses only need to implement the abstract part; they can reuse the rest.\n\n4. Plug-in or Strategy Patterns\n\n    Use ABCs to define interchangeable components in a modular system.\n\nclass AuthStrategy(ABC):\n    @abstractmethod\n    def authenticate(self, user, pwd): pass\n\nclass GoogleAuth(AuthStrategy):\n    def authenticate(self, user, pwd):\n        return \\\"Google token\\\"\n\nclass PasswordAuth(AuthStrategy):\n    def authenticate(self, user, pwd):\n        return \\\"Password verified\\\"","source":"","cross":[]},{"q":"How did you handle DDOS attack?","a":"","source":"","cross":[]},{"q":"What is the architecture of your current web application, why and on what basis did you decide the tech stack that you are using?","a":"","source":"","cross":[]},{"q":"Explain Circuit breakers design pattern","a":"","source":"","cross":[]},{"q":"Project where you have used redis","a":"","source":"","cross":[]},{"q":"Celery vs google cloud tasks","a":"","source":"","cross":[]},{"q":"Let say you have programming language with only 2 digit handling How to handle 3 digit numbers incoming from a streaming one by one there and can we add 3 digit numbers in this case and send back to streaming ?","a":"Yes, it is possible to handle and add 3-digit numbers in a programming language that only supports two-digit numbers by breaking them into parts (hundreds, tens, ones) and managing carries explicitly during addition.","source":"","cross":[]},{"q":"Let say a page with lots of images how to handle","a":"","source":"","cross":[]},{"q":"🌐 What is an HTTP Connection?","a":"An HTTP connection is a communication link between a client (usually a web browser) and a server using the HTTP protocol (HyperText Transfer Protocol).\n\nIt is how data (like HTML pages, images, JSON, etc.) is transferred across the web — request from client → response from server.\n\n🔁 Lifecycle of an HTTP Connection\n\n    Client opens a TCP connection to the server (port 80 for HTTP, 443 for HTTPS).\n\n    Sends an HTTP request over that connection.\n\n    Server processes the request and sends back an HTTP response.\n\n    Depending on the HTTP version:\n\n        HTTP/1.0: Closes connection after response.\n\n        HTTP/1.1: Keeps connection open (persistent).\n\n        HTTP/2: Multiplexes many requests over one connection.\n\n    Connection may be reused or closed.\n\n🧠 Summary:\n\n    An HTTP connection is the underlying communication path for sending/receiving HTTP messages.\n\n    It is typically built on a TCP connection, with optional encryption via TLS (HTTPS).\n\n    It’s essential for web apps, APIs, browsers — basically all internet traffic.","source":"","cross":[]},{"q":"Open a browser let say enter google.com what is flow like of request till response","a":"URL Entered\n     ↓\nDNS Lookup (The browser asks the OS to resolve www.google.com to an IP address)\n     ↓\nTCP (TCP Connection (3-Way Handshake)) + TLS Handshake (Verify the server’s SSL certificate)\n     ↓\nHTTPS Request Sent\n     ↓\nServer Handles Request\n     ↓\nHTTPS Response (HTML)\n     ↓\nBrowser Parses + Renders\n     ↓\nMore Requests for Resources","source":"","cross":[]},{"q":"explain time series database","a":"","source":"","cross":[]},{"q":"How do heapq, deque, Counter, and defaultdict work?","a":"","source":"","cross":[]},{"q":"Difference b/w multiprocessing and asyncio?","a":"🧠 Interview-Ready Summary\n\n    Multiprocessing uses multiple processes to achieve parallelism and is suited for CPU-heavy tasks.\n    Asyncio uses a single-threaded event loop to handle I/O-bound operations concurrently without blocking.\n\n\n🧬 Multiprocessing (CPU-bound):\n\nfrom multiprocessing import Pool\n\ndef square(n):\n    return n * n\n\nwith Pool(4) as p:\n    print(p.map(square, [1, 2, 3, 4]))\n\n🔁 Asyncio (I/O-bound) : Runs 5 coroutines concurrently on a single thread — no thread/process switching needed.\n\nimport asyncio\n\nasync def fetch_data(i):\n    await asyncio.sleep(1)\n    print(f\\\"Fetched {i}\\\")\n\nasync def main():\n    await asyncio.gather(*(fetch_data(i) for i in range(5)))\n\nasyncio.run(main())","source":"","cross":[]},{"q":"Difference b/w from concurrent.futures import ThreadPoolExecutor vs from multiprocessing import Pool vs asyncio","a":"1. concurrent.futures.ThreadPoolExecutor\n\n    What it is: A high-level interface for managing a pool of threads.\n\n    Use case: Best for I/O-bound tasks (like network calls, file I/O) where the program waits on external operations.\n\n    How it works: Runs multiple threads in the same process, sharing memory.\n\n    Limitations: Python’s GIL (Global Interpreter Lock) means CPU-bound tasks don’t get speedup; threads don’t truly run Python code in parallel but can be useful for waiting on I/O.\n\nfrom concurrent.futures import ThreadPoolExecutor\n\ndef fetch_url(url):\n    # some I/O-bound operation like requests.get(url)\n    pass\n\nwith ThreadPoolExecutor(max_workers=5) as executor:\n    results = executor.map(fetch_url, urls)\n\n\n2. multiprocessing.Pool\n\n    What it is: A pool of separate processes, each with its own Python interpreter and memory space.\n\n    Use case: Best for CPU-bound tasks that need real parallelism, like heavy computation.\n\n    How it works: Spawns separate processes bypassing the GIL, allowing true parallel execution.\n\n    Limitations: More memory and overhead since processes don’t share memory; inter-process communication is slower than threads.\n\nfrom multiprocessing import Pool\n\ndef heavy_computation(x):\n    return x * x\n\nwith Pool(processes=4) as pool:\n    results = pool.map(heavy_computation, data)\n\n3. asyncio\n\n    What it is: A single-threaded, single-process asynchronous event loop system.\n\n    Use case: Best for high-concurrency I/O-bound tasks that can benefit from non-blocking code (like many simultaneous network connections).\n\n    How it works: Uses async/await syntax to suspend and resume tasks, avoiding blocking during I/O.\n\n    Limitations: Doesn’t help with CPU-bound tasks; requires async-aware libraries.\n\nimport asyncio\nimport aiohttp\n\nasync def fetch_url(session, url):\n    async with session.get(url) as response:\n        return await response.text()\n\nasync def main(urls):\n    async with aiohttp.ClientSession() as session:\n        tasks = [fetch_url(session, url) for url in urls]\n        return await asyncio.gather(*tasks)\n\nasyncio.run(main(urls))","source":"","cross":[]},{"q":"what is Python’s event loop and how does it work","a":"","source":"","cross":[]},{"q":"Difference between deepcopy and copy.","a":"✅ copy.copy() → Shallow Copy\n\n    Creates a new object,\n\n    But does not recursively copy objects inside it.\n\n    If the original contains mutable objects (like lists or dicts), the copy shares references to them.\n\nExample:\n\nimport copy\n\noriginal = [[1, 2], [3, 4]]\nshallow = copy.copy(original)\n\nshallow[0][0] = 99\nprint(original)  # Output: [[99, 2], [3, 4]]\n\n🔴 The change in shallow affects original because the inner lists are shared.\n--------------------------------------------------------------------------------------------------------------------\n✅ copy.deepcopy() → Deep Copy\n\n    Creates a completely independent clone,\n\n    Recursively copies all objects inside, no shared references.\n\nExample:\n\nimport copy\n\noriginal = [[1, 2], [3, 4]]\ndeep = copy.deepcopy(original)\n\ndeep[0][0] = 99\nprint(original)  # Output: [[1, 2], [3, 4]]\n\n✅ The original remains unchanged — everything is fully copied.\n\n🧠 Interview Tip:\nIf asked: When would you use deepcopy over copy?\nAnswer: Use deepcopy when you want to fully isolate the new object from the original, especially when working with complex, nested mutable structures.","source":"","cross":[]},{"q":"Explain memory management in Python.","a":"Python’s memory management is automatic and developer-friendly, thanks to its built-in garbage collector, dynamic typing, and reference counting system. Here's a breakdown of how it works:\n\n✅ Key Components of Memory Management in Python\n1. Reference Counting\n\n    Every object in Python has a reference count: the number of references pointing to it.\n\n    When the reference count drops to zero, the memory is automatically deallocated.\n\na = []         # reference count = 1\nb = a          # reference count = 2\ndel a          # reference count = 1\ndel b          # reference count = 0 → object deleted\n\n2. Garbage Collection (GC)\n\n    Reference counting alone cannot detect circular references (e.g., objects referencing each other).\n    Python uses the gc module to detect and clean up cycles.\n\nimport gc\ngc.collect()  # Manually triggers garbage collection\n\n3. Memory Pools (PyMalloc)\n\n    Python uses PyMalloc, a specialized allocator optimized for small objects.\n    Instead of allocating memory directly from the OS each time, it uses pools and arenas for efficiency.\n\n4. Dynamic Typing\n\n    Python variables are pointers to objects, not fixed memory slots.\n    When you assign a new value, you're updating the reference, not the memory block.\n\nx = 10   # x points to int object 10\nx = \\\"hi\\\" # now x points to str object \\\"hi\\\"\n\n5. Memory Leaks\n\n    While Python handles most memory automatically, poorly managed references or global caches can lead to leaks.\n    Tools like objgraph, tracemalloc, or memory_profiler can help detect them.\n\n🧠 Interview Cross-Questions You Might Face:\n\nQ1: What are circular references and how does Python handle them?\n\n    Circular references occur when two or more objects reference each other, forming a cycle. Python’s garbage collector detects and breaks these cycles.\n\nQ2: How would you debug a memory leak in Python?\n\n    Use tools like tracemalloc, objgraph, or memory_profiler to track object allocations and growth over time.\n\nQ3: What is the role of __del__ in memory management?\n\n    It’s a destructor method called when an object is about to be destroyed. Be careful: improper use can prevent garbage collection.\n\n🧪 Quick Tip:\n\nTo check current memory usage:\n\nimport sys\nx = [1, 2, 3]\nprint(sys.getsizeof(x))  # Size of the list object in bytes","source":"","cross":[]},{"q":"write a simple decorator","a":"def simple_decorator(func):\n    def wrapper():\n        print(\\\"Before\\\")\n        func()\n        print(\\\"After\\\")\n    return wrapper\n\n@simple_decorator\ndef greet():\n    print(\\\"Hello!\\\")\n\ngreet()","source":"","cross":[]},{"q":"What is the difference between image and container?","a":"Image is a blueprint of an application and container is an running instance with the image.\nwe can't modify image but we can modify or connect to running container.","source":"","cross":[]},{"q":"what is pydentic in python and Fast API?","a":"Pydantic is a Python library for data parsing and validation using Python type hints. It’s heavily used in FastAPI to define and validate request/response data models.\n\n1. What Is Pydantic?\n\n    Data Models with Type Hints\n    You define “models” by subclassing pydantic.BaseModel and declaring fields with Python type annotations. Pydantic then:\n\n        Parses incoming data (e.g., JSON dicts).\n\n        Validates that each field matches its declared type (or can be coerced into it).\n\n        Converts raw inputs into proper Python types (e.g., strings to datetime, ints to float, etc.).\n\n        Raises an error if any field is missing or has the wrong type/format.\n\n    Example Model:\n\nfrom pydantic import BaseModel, EmailStr\nfrom datetime import date\n\nclass User(BaseModel):\n    id: int\n    name: str\n    email: EmailStr         # special “EmailStr” type that enforces a valid email format\n    signup_date: date       # will parse ISO strings like \\\"2025-06-03\\\" => datetime.date\n\n# Parsing and validation happen here:\ndata = {\n    \\\"id\\\": \\\"42\\\",                 # Pydantic will coerce \\\"42\\\" (str) → 42 (int)\n    \\\"name\\\": \\\"Alice\\\",\n    \\\"email\\\": \\\"alice@example.com\\\",\n    \\\"signup_date\\\": \\\"2025-06-03\\\"\n}\nuser = User(**data)\nprint(user.id)            # 42   (int)\nprint(type(user.signup_date))  # <class 'datetime.date'>\n\nAutomatic Error Reporting\n If you pass in invalid data:\n\nbad = {\\\"id\\\": \\\"not-an-int\\\", \\\"name\\\": 123, \\\"email\\\": \\\"x\\\", \\\"signup_date\\\": \\\"yesterday\\\"}\nUser(**bad)","source":"","cross":[]},{"q":"Difference b/w langchain vs LLM?","a":"","source":"","cross":[]},{"q":"lambda function fallback point","a":"","source":"","cross":[]},{"q":"what are the different stages of the lambda function","a":"","source":"","cross":[]},{"q":"convert date string to date object","a":"from datetime import datetime\n\ndate_string = \\\"2025-06-08\\\"\ndate_object = datetime.strptime(date_string, \\\"%Y-%m-%d\\\").date()\n\nprint(date_object)          # Output: 2025-06-08\nprint(type(date_object))    # Output: <class 'datetime.date'>","source":"","cross":[]},{"q":"To change the format of a date string in Python, you need to:","a":"from datetime import datetime\n\n# Step 1: Original date string\noriginal_date_str = \\\"08-06-2025\\\"\n\n# Step 2: Convert to datetime object (from current format)\ndate_obj = datetime.strptime(original_date_str, \\\"%d-%m-%Y\\\")\n\n# Step 3: Format to new string\nnew_date_str = date_obj.strftime(\\\"%Y/%m/%d\\\")\n\nprint(new_date_str)  # Output: 2025/06/08","source":"","cross":[]},{"q":"Generator Practical use","a":"","source":"","cross":[]},{"q":"what is Gil","a":"","source":"","cross":[]},{"q":"Abstract Class","a":"","source":"","cross":[]},{"q":"Many to many one to many relation in django model","a":"✅ 1. One-to-Many Relationship (ForeignKey)\n\nExample: Each Book belongs to one Author, but an Author can have many Books.\n\nfrom django.db import models\n\nclass Author(models.Model):\n    name = models.CharField(max_length=100)\n\nclass Book(models.Model):\n    title = models.CharField(max_length=100)\n    author = models.ForeignKey(Author, on_delete=models.CASCADE, related_name='books')\n\n🔍 Notes:\n\n    author is a ForeignKey — creating a one-to-many link.\n    related_name='books' lets you do: author.books.all()\n\n✅ 2. Many-to-Many Relationship (ManyToManyField)\n\nExample: A Student can enroll in multiple Courses, and a Course can have many Students.\n\nclass Course(models.Model):\n    name = models.CharField(max_length=100)\n\nclass Student(models.Model):\n    name = models.CharField(max_length=100)\n    courses = models.ManyToManyField(Course, related_name='students')\n\n🔍 Notes:\n\n    Django creates an intermediate join table automatically.\n\n    You can access:\n        student.courses.all()\n        course.students.all()","source":"","cross":[]},{"q":"what is diferrence between SQL & noSql db? in which condition you'd be gonna use those two and why?","a":"✅ When to Use SQL (Relational DB)\n\nUse SQL when:\n\n    Your data is structured and consistent.\n\n    Relationships are important (e.g., foreign keys, joins).\n\n    You need strong data integrity (ACID transactions).\n\n    Reporting or analytics relies on structured queries.\n\nExamples:\n\n    Banking systems\n    ERP systems\n    Inventory management\n    E-commerce product catalog with normalized categories/tags\n\n✅ When to Use NoSQL (Non-relational DB)\n\nUse NoSQL when:\n\n    Your data is semi-structured or unstructured.\n    You expect frequent schema changes.\n    You need high write throughput and horizontal scalability.\n    You want to store documents, graphs, or large key-value data.\n\nExamples:\n\n    Real-time analytics dashboard (Cassandra, MongoDB)\n    IoT sensor data (Time-series)\n    User profile storage (MongoDB)\n    Cache layer (Redis)\n    Product reviews/comments (flexible structure)\n\n🔄 Hybrid Approach (Polyglot Persistence)\n\nIn modern systems, you often use both SQL and NoSQL:\n\n    \\\"Use the right tool for the job\\\"\n\nExample:\n\n    Use PostgreSQL for transactional order data.\n    Use MongoDB for flexible user profiles.\n    Use Redis for fast caching.","source":"","cross":[]},{"q":"counter questions on Time complexity","a":"","source":"","cross":[]},{"q":"explain how you will design a rest api  ? ( like controller , service , repository etc )","a":"","source":"","cross":[]},{"q":"Write a REST API to create a new account. Write only controller class. Account -> AccountNumber, Name, EmailId, List phoneNumbers. ( only controller class code )","a":"","source":"","cross":[]},{"q":"redo- undo functionality desiign on a string","a":"class UndoRedoTextEditor:\n    def __init__(self):\n        self.current_text = \\\"\\\"\n        self.undo_stack = []\n        self.redo_stack = []\n\n    def type(self, new_text: str):\n        # Save current state to undo stack\n        self.undo_stack.append(self.current_text)\n        self.current_text += new_text\n        # Clear redo stack on new action\n        self.redo_stack.clear()\n\n    def undo(self):\n        if self.undo_stack:\n            self.redo_stack.append(self.current_text)\n            self.current_text = self.undo_stack.pop()\n        else:\n            print(\\\"Nothing to undo.\\\")\n\n    def redo(self):\n        if self.redo_stack:\n            self.undo_stack.append(self.current_text)\n            self.current_text = self.redo_stack.pop()\n        else:\n            print(\\\"Nothing to redo.\\\")\n\n    def get_text(self):\n        return self.current_text\n\neditor = UndoRedoTextEditor()\n\neditor.type(\\\"Hello\\\")\neditor.type(\\\" World\\\")\n\nprint(editor.get_text())  # Output: Hello World\n\neditor.undo()\nprint(editor.get_text())  # Output: Hello\n\neditor.redo()\nprint(editor.get_text())  # Output: Hello World\n\n🔄 Design Pattern Behind This\n\n    It follows the Command Pattern.\n\n    You can extend this to:\n\n        Delete operations\n        Replace text\n        Batch actions\n        Time-based undo/redo","source":"","cross":[]},{"q":"What are the different types of EC2 instances based on their costs?","a":"💰 1. On-Demand Instances\n\n    Pay-as-you-go model: no upfront cost or long-term commitment.\n\n    Ideal for short-term workloads, testing, or unpredictable usage.\n\n    Highest hourly cost, but most flexible.\n\n    Use When: You need compute capacity immediately and temporarily, e.g., development/testing or unpredictable traffic spikes.\n\n🕓 2. Reserved Instances (RIs)\n\n    Commitment: 1 or 3 years.\n\n    Lower cost (up to 75% discount) compared to On-Demand.\n\n    Three payment options:\n\n        All upfront (AURI)\n\n        Partial upfront (PURI)\n\n        No upfront (NURI)\n\n    Best for steady-state usage.\n\n    Use When: You have predictable workloads (e.g., databases, web servers).\n\n📉 3. Spot Instances\n\n    Unused EC2 capacity at massive discounts (up to 90% off).\n\n    Instances can be terminated by AWS with 2 minutes’ notice if capacity is needed.\n\n    Best for fault-tolerant and flexible applications (e.g., batch jobs, big data, CI/CD).\n\n    Use When: You can tolerate interruptions or are running parallel jobs.\n\n💳 4. Savings Plans\n\n    A newer pricing model introduced by AWS.\n\n    Commit to a consistent amount of usage (in $/hour) for 1 or 3 years.\n\n    Applies flexibly across instance types and regions.\n\n    Two types:\n\n        Compute Savings Plan (most flexible)\n\n        EC2 Instance Savings Plan (specific to instance family)\n\n    Use When: You want flexibility like Reserved Instances but without being tied to a specific instance type.\n\n🧪 5. Dedicated Hosts\n\n    Physical server fully dedicated to you.\n\n    Useful for licensing, compliance, or isolation.\n\n    Higher cost, but you avoid multi-tenancy.\n\n    Use When: You have strict compliance, regulatory, or software licensing requirements.\n\n👥 6. Dedicated Instances\n\n    Instances that run on hardware dedicated to a single customer, but not full host control.\n\n    More expensive than shared instances.\n\n    Use When: You need some isolation but not full control like Dedicated Hosts.","source":"","cross":[]},{"q":"How do you handle memory leaks?","a":"✅ What is a Memory Leak?\n\nA memory leak occurs when a program retains memory that is no longer needed but is never released, causing memory usage to grow over time.\n\nIn Python, I handle memory leaks by profiling with tools like tracemalloc or memory_profiler, using context managers to ensure resource cleanup, avoiding circular references, and managing caches with weakref. I also monitor long-running processes using tools like psutil or top to detect abnormal memory usage and proactively clear unused references or large in-memory data.\n\nIn Python, even with garbage collection, leaks can happen due to:\n\n    Circular references\n\n    Unclosed file/socket handles\n\n    Global/static caches\n\n    Large objects held unnecessarily (e.g., in lists/dicts)\n\n✅ How Do You Handle Memory Leaks in Python?\n🔹 1. Use a Memory Profiler\n\n    Tools like:\n\n        tracemalloc (built-in)\n\n        objgraph\n\n        memory_profiler\n\n        guppy (heapy)\n\nimport tracemalloc\n\ntracemalloc.start()\n# ... run your code ...\nprint(tracemalloc.get_traced_memory())\n\n🔹 2. Use Weak References for Caching\n\n    Avoid strong references for objects you don’t want to keep forever.\n\n    Use weakref.WeakValueDictionary.\nimport weakref\n\nclass Data:\n    pass\n\ncache = weakref.WeakValueDictionary()\ndata = Data()\ncache['x'] = data\n\n🔹 3. Avoid Circular References\n\nCircular references can confuse Python's garbage collector.\n\nclass A:\n    def __init__(self):\n        self.b = None\n\nclass B:\n    def __init__(self):\n        self.a = None\n\na = A()\nb = B()\na.b = b\nb.a = a\n\n✅ Use gc.collect() to explicitly trigger collection or restructure the code to avoid such references.\n\n🔹 4. Close Files, DB Connections, and Sockets\n\nUse context managers (with statements) to ensure proper release.\n\nwith open(\\\"file.txt\\\") as f:\n    data = f.read()","source":"","cross":[]},{"q":"Design message delivery system . Every message has a parent id m1,m2,m3 , same parent id message should not be processed parallel.","a":"import threading\nfrom concurrent.futures import ThreadPoolExecutor\nfrom collections import defaultdict\nimport time\n\nclass MessageProcessing:\n    def __init__(self):\n        self.parent_lock = defaultdict(threading.Lock)\n        \n    def process_message(self, msg_id, p_id):\n        lock = self.parent_lock[p_id]\n        with lock:\n            print(f\\\"{threading.current_thread().name} processing {msg_id} parent {p_id}\\\")\n            time.sleep(1)\n            \n            print(f\\\"{threading.current_thread().name} Done {msg_id}\\\")\n            \ndef main():\n    messages = [\n        (\\\"m1\\\", \\\"p1\\\"),\n        (\\\"m2\\\", \\\"p2\\\"),\n        (\\\"m3\\\", \\\"p1\\\"),  # same parent as m1 → should run after m1\n        (\\\"m4\\\", \\\"p3\\\"),\n        (\\\"m5\\\", \\\"p2\\\"),  # same parent as m2 → should run after m2\n        (\\\"m6\\\", \\\"p4\\\"),\n    ]\n    \n    processor = MessageProcessing()\n    with ThreadPoolExecutor(max_workers=4) as executor:\n        for msg_id, p_id in messages:\n            executor.submit(processor.process_message, msg_id, p_id)\n            \nif __name__ == \\\"__main__\\\":\n    main()","source":"","cross":[]},{"q":"Write Thread safe logger class","a":"import logging\nimport threading\n\nclass SimpleThreadSafeLogger:\n    def __init__(self, log_file='app.log'):\n        self.lock = threading.Lock()\n        self.logger = logging.getLogger(\\\"SimpleLogger\\\")\n        self.logger.setLevel(logging.INFO)\n\n        if not self.logger.handlers:\n            handler = logging.FileHandler(log_file)\n            formatter = logging.Formatter('%(asctime)s - %(levelname)s - %(message)s')\n            handler.setFormatter(formatter)\n            self.logger.addHandler(handler)\n\n    def log(self, message):\n        with self.lock:\n            self.logger.info(message)\n\n🧪 Example Usage:\n\nimport threading\n\nlogger = SimpleThreadSafeLogger()\n\ndef worker(thread_id):\n    for i in range(3):\n        logger.log(f\\\"Thread-{thread_id} says hello {i}\\\")\n\nthreads = []\n\nfor i in range(5):\n    t = threading.Thread(target=worker, args=(i,))\n    threads.append(t)\n    t.start()\n\nfor t in threads:\n    t.join()","source":"","cross":[]},{"q":"Implement Producer consumer mechanism using multithreading (by using wait, notify)","a":"","source":"","cross":[]},{"q":"singleton initialization in multithreading","a":"","source":"","cross":[]},{"q":"Encapsulation in Python","a":"🔹 Definition:\n\nEncapsulation is the bundling of data (variables) and methods (functions) that operate on that data into a single unit — typically a class.\nIt also restricts direct access to some of an object's components, which is known as data hiding.\n🔹 How Python supports encapsulation:\n\nPython doesn't enforce access modifiers like private, protected, or public strictly, but uses naming conventions:\n\n    _single_leading_underscore: \\\"protected\\\"\n\n    __double_leading_underscore: \\\"private\\\" (name mangling)\n\nclass BankAccount:\n    def __init__(self, owner, balance):\n        self.owner = owner              # Public\n        self._account_number = \\\"1234\\\"   # Protected (by convention)\n        self.__balance = balance        # Private\n\n    def deposit(self, amount):\n        if amount > 0:\n            self.__balance += amount\n\n    def get_balance(self):\n        return self.__balance\n\n# Usage\naccount = BankAccount(\\\"Alice\\\", 1000)\nprint(account.owner)  # Public access - OK\nprint(account._account_number)  # Technically accessible, but discouraged\nprint(account.get_balance())    # Accessing private via method - OK\n\n# Direct access to private will fail\n# print(account.__balance)  # AttributeError","source":"","cross":[]},{"q":"soap vs rest","a":"","source":"","cross":[]},{"q":"implement connection pool","a":"","source":"","cross":[]},{"q":"class level lock vs object level lock","a":"🔐 1. Class-Level Lock\n\nUsed to synchronize access across all instances of a class — typically used for:\n\n    Singleton patterns\n\n    Modifying class variables\n\n    Managing shared class resources\n\n✅ Example:\n\nimport threading\n\nclass Counter:\n    _count = 0\n    _lock = threading.Lock()  # Class-level lock\n\n    @classmethod\n    def increment(cls):\n        with cls._lock:\n            cls._count += 1\n            return cls._count\n\n\n💡 Behavior:\n\n    All threads share the same lock.\n\n    No matter how many instances you create, they all share _lock.\n\n🔐 2. Object-Level Lock\n\nUsed to synchronize access to instance-level data — different lock for each object.\n✅ Example:\n\nimport threading\n\nclass BankAccount:\n    def __init__(self):\n        self.balance = 0\n        self._lock = threading.Lock()  # Object-level lock\n\n    def deposit(self, amount):\n        with self._lock:\n            self.balance += amount\n\n💡 Behavior:\n\n    Each instance of BankAccount has its own lock.\n\n    One thread can access account1, while another accesses account2 — no contention.","source":"","cross":[]},{"q":"Write Thread safe singleton class","a":"Here’s how to write a thread-safe Singleton class in Python using threading.Lock, ensuring that only one instance is created even in multithreaded environments:\n\n✅ Thread-Safe Singleton Using __new__ and threading.Lock\n\nimport threading\n\nclass SingletonMeta(type):\n    \\\"\\\"\\\"\n    A thread-safe implementation of Singleton using metaclass.\n    \\\"\\\"\\\"\n    _instance = None\n    _lock = threading.Lock()  # Lock for thread-safe access to the instance\n\n    def __call__(cls, *args, **kwargs):\n        # First check without locking (fast path)\n        if cls._instance is None:\n            with cls._lock:\n                # Double-checked locking\n                if cls._instance is None:\n                    cls._instance = super().__call__(*args, **kwargs)\n        return cls._instance\n\n\nclass Singleton(metaclass=SingletonMeta):\n    def __init__(self):\n        print(\\\"Initializing Singleton\\\")\n\n# Usage\nif __name__ == \\\"__main__\\\":\n    def create_singleton():\n        singleton = Singleton()\n        print(f\\\"Instance ID: {id(singleton)}\\\")\n\n    threads = []\n    for _ in range(5):\n        t = threading.Thread(target=create_singleton)\n        t.start()\n        threads.append(t)\n\n    for t in threads:\n        t.join()\n\n🔒 Why This Is Thread-Safe:\n\n    Uses a metaclass to control instance creation.\n\n    Lock ensures that even if multiple threads call the constructor simultaneously, only one instance is created.\n\n    Double-checked locking avoids unnecessary locking after initialization.","source":"","cross":[]},{"q":"Polymorphism internals, dynamic casting error handling, Builder and singleton design pattern(thread safe),","a":"","source":"","cross":[]},{"q":"where do you put authentication part in docker kubernates","a":"","source":"","cross":[]},{"q":"do you use encapsulation anywhere","a":"","source":"","cross":[]},{"q":"how python3 better than 3","a":"","source":"","cross":[]},{"q":"Reverse proxy?","a":"🔁 What is a Reverse Proxy?\n\nA reverse proxy is a helper in front of your website's servers.\nIt receives the request from the user, then forwards it to the real server behind the scenes.\n\n👉 The user doesn't know which server answered.\n\n🔍 Super Simple Example\n\nImagine a restaurant:\n\n    The waiter (reverse proxy) takes your order.\n\n    The kitchen (real servers) prepares your food.\n\n    You don’t talk to the kitchen directly.\n\nIn tech:\n\n    User → talks to Nginx (proxy) → Nginx talks to Flask/FastAPI server\n\n🔁 Reverse Proxy (used by the server)\nThink of it like this:\n\n🌐 A user → sends request to a reverse proxy → it forwards the request to the real server\n\n    The user thinks they are talking to the server, but they’re actually talking to the reverse proxy.\n\n    Used to hide servers, balance load, or add security.\n\n💡 Example use: Nginx gets all user traffic, then passes it to Flask, Node.js, or FastAPI running behind it.\n\n\n✅ Why use Nginx as a Reverse Proxy?\n\n    🛡️ Security – hides your real servers\n\n    📈 Load balancing – splits traffic between servers\n\n    🚀 Speed – can cache responses\n\n    🔐 HTTPS – handles secure connections","source":"","cross":[]},{"q":"forward proxy?","a":"🧭 Forward Proxy (used by the client)\nThink of it like this:\n\n🔒 You (the client) → send request to a forward proxy → it sends request to the internet for you\n\n    The website you visit sees only the proxy, not you.\n\n    Used to hide users or control what they can access (like in offices or schools).\n\n💡 Example use: A company doesn’t want employees visiting Facebook, so it sets up a forward proxy to block it.\n\n✅ 1. Hide user identity / IP\n\n    It hides the user's real IP address.\n\n    The websites see the proxy’s IP, not yours.\n\n🧠 Example: You’re in India, but the proxy is in the US → websites think you are in the US.\n✅ 2. Bypass restrictions or blocks\n\n    Used to access websites that are blocked in your country, office, or school.\n\n🧠 Example: You use a proxy to visit YouTube even if it’s blocked in your school.\n✅ 3. Filter and block content\n\n    Companies or parents use forward proxies to block bad or time-wasting websites.\n\n🧠 Example: Office blocks Facebook, Instagram using a proxy.\n✅ 4. Improve performance (caching)\n\n    Proxy can save copies of frequently visited pages so users can load them faster.\n\n🧠 Example: 100 employees visit the same news site → proxy serves the cached copy.\n✅ 5. Monitor user activity\n\n    Organizations can track and log what websites employees or students are visiting.\n\n🧠 Example: IT admin checks if anyone visits unsafe sites.\n✅ 6. Security\n\n    Forward proxies can scan outgoing requests and block threats or data leaks.\n\n🔑 Summary:\n\n    A forward proxy helps clients (like users or apps) control, hide, or protect their internet usage.\n\nLet me know if you want a real-world analogy too!","source":"","cross":[]},{"q":"docker commands - how many images we can create at one time","a":"In Docker, there is no fixed limit to how many images you can create at one time — you can create as many as:\nYour system’s resources (CPU, memory, disk space) allow, and\nYou run commands for.\n\n🛠 Common Ways to Create Docker Images\n\n1. Single image using Dockerfile\n    docker build -t my-image .\n\n2. Multiple images (one by one):\n    You can run docker build multiple times:\n     docker build -t app1-image ./app1\n     docker build -t app2-image ./app2\n\n3. Multiple images using a script (parallel or sequential):\n    # Example script to build multiple images\n       docker build -t app1-image ./app1 &\n       docker build -t app2-image ./app2 &\n       wait  # waits for all to finish\n\n💡 You can create multiple images in parallel using &, but your system needs enough CPU/RAM/disk.\n\n📦 How Many Images You Can Create?\n\n    Technically: Unlimited\n    Practically: Limited by:\n\n        🧠 RAM and CPU (for parallel builds)\n        💽 Disk space (images can take GBs)\n        🗂 Layer caching (too many images may bloat your Docker cache)","source":"","cross":[]},{"q":"docker image and docker container diff","a":"🖼️ Docker Image = Blueprint\n\n    Like a recipe or template.\n    It contains everything needed to run the app: code, libraries, dependencies, OS files.\n    Read-only.\n    You build it once.\n    Think of it like a baking recipe.\n\n📦 Docker Container = Running Instance\n\n    A running copy of an image.\n    You create a container from an image.\n    It’s like running a program on your computer using that image.\n    You can start, stop, or delete containers.\n    Think of it like the cake made from the recipe.\n\n# Build image\ndocker build -t my-app .\n\n# Run container from that image\ndocker run -d --name my-container my-app","source":"","cross":[]},{"q":"what is horizontal and vertical scaling","a":"💡 Real-life:\n    Vertical: Upgrade your laptop’s RAM.\n    Horizontal: Add more laptops and split the work.","source":"","cross":[]},{"q":"Uvicorn and Gunicorn","a":"🟢 Uvicorn (✅ Real thing)\n\n    ✅ What it is: A lightweight, fast ASGI server used to run Python web apps (especially with FastAPI or Starlette).\n    🧠 Think of it as: The engine that runs your FastAPI or async Python app.\n    ⚡ Built for asynchronous performance (async/await).\n    🛠 Used like:\n          uvicorn main:app --reload\n\n✅ Gunicorn (📌 the real one)\n\n    Gunicorn = \\\"Green Unicorn\\\"\n    WSGI server for synchronous Python web apps (like Flask, Django).\n    ⚡ Good for production with non-async frameworks.\n    🛠 Used like:\n          gunicorn app:app","source":"","cross":[]},{"q":"wsgi vs asgi","a":"","source":"","cross":[]},{"q":"wsgi is syncronous but i have write the async code with asyncio async await in flask so whats difference b/w asgi fast api vs wsgi flask","a":"","source":"","cross":[]},{"q":"how to chhose framework when you start app","a":"✅ 1. Sync vs Async?\n\n    Use FastAPI if:\n        You're using async DB clients (asyncpg, httpx)\n        Y
