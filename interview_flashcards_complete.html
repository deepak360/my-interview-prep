   MyClass.static_var += 1\n\nprint(MyClass.static_var)  # 0\na = MyClass()\nb = MyClass()\nprint(MyClass.static_var)  # 2 — shared by all instances\n\n🔹 What is a Static Method?\n\nA static method is a method that belongs to a class but doesn’t access instance (self) or class (cls) data. It's used when the method logic is related to the class but doesn’t need access to class or instance variables.\nDeclared using @staticmethod:\n\nclass MathUtils:\n    @staticmethod\n    def add(x, y):\n        return x + y\n\nprint(MathUtils.add(3, 4))  # 7\n\n✅ No self or cls parameter\n\n✅ Can be called on the class directly (MathUtils.add(...))\n\n❌ Cannot access instance or class variables","source":"","cross":[]},{"q":"What is difference b/w overloading and overriding","a":"1. Overloading happens in the same class.\nclass Calculator:\n    def add(self, *args):\n        return sum(args)\n\ncalc = Calculator()\nprint(calc.add(1, 2))            # 3\nprint(calc.add(1, 2, 3, 4, 5))   # 15\n\n2. Overriding happens in the different classes.\nclass Animal:\n    def speak(self):\n        return \\\"Some sound\\\"\n\nclass Dog(Animal):\n    def speak(self):  # Overrides parent method\n        return \\\"Woof!\\\"\n\ndog = Dog()\nprint(dog.speak())  # Woof!","source":"","cross":[]},{"q":"how to make sure the security in REST APIs","a":"","source":"","cross":[]},{"q":"Given an array of integers nums sorted in non-decreasing order, find the starting and ending position of a given target valuefind the starting and ending position of a given target value.\nIf target is not found in the array, return [-1, -1].\nYou must write an algorithm with O(log n) runtime complexity.\n\nExample 1:\nInput: nums = [5,7,7,8,8,10], target = 8\nOutput: [3,4]\n\nExample 2:\nInput: nums = [5,7,7,8,8,10], target = 6\nOutput: [-1,-1]\n\nExample 3:\nInput: nums = [], target = 0\nOutput: [-1,-1]","a":"def searchRange(nums, target):\n    def findFirst(nums, target):\n        left, right = 0, len(nums) - 1\n        first = -1\n        while left <= right:\n            mid = (left + right) // 2\n            if nums[mid] == target:\n                first = mid\n                right = mid - 1  # keep searching on the left side\n            elif nums[mid] < target:\n                left = mid + 1\n            else:\n                right = mid - 1\n        return first\n\n    def findLast(nums, target):\n        left, right = 0, len(nums) - 1\n        last = -1\n        while left <= right:\n            mid = (left + right) // 2\n            if nums[mid] == target:\n                last = mid\n                left = mid + 1  # keep searching on the right side\n            elif nums[mid] < target:\n                left = mid + 1\n            else:\n                right = mid - 1\n        return last\n\n    return [findFirst(nums, target), findLast(nums, target)]","source":"","cross":[]},{"q":"Pands:\n\n1. How to use fillna and dropna\n2. Subset for dropna\n2. How to join 2 dataframe.\n3. How to groupby\n4. How to process large dataset using pandas\n5. pandas is in-m/m\n6. how much records pandas can handle at a time.\n7. pyspark for parellel processing\n8. how much data process and how much break using apache airflow dashboard","a":"","source":"","cross":[]},{"q":"What is pyODBC","a":"pyodbc is a Python library that allows your Python application to connect to databases using ODBC (Open Database Connectivity) drivers.\n\n✅ What Does It Do?\n\n    Allows you to connect to relational databases like:\n\n        SQL Server\n        MySQL\n        PostgreSQL\n        Oracle\n        MS Access\n        IBM DB2\n\n    Enables executing SQL queries directly from Python\n    Provides cursor-based access to results (like other DB-APIs)\n\n📦 Installation\n\npip install pyodbc\n\n🔧 Basic Usage Example: Connect to SQL Server\n\nimport pyodbc\n\n# Connect to SQL Server\nconn = pyodbc.connect(\n    'DRIVER={ODBC Driver 17 for SQL Server};'\n    'SERVER=your_server;'\n    'DATABASE=your_db;'\n    'UID=your_username;'\n    'PWD=your_password'\n)\n\ncursor = conn.cursor()\n\n# Run a query\ncursor.execute(\\\"SELECT * FROM employees\\\")\n\nfor row in cursor.fetchall():\n    print(row)\n\ncursor.close()\nconn.close()\n\n🔐 Connection String Format\n\nDRIVER={ODBC Driver};SERVER=host;DATABASE=name;UID=user;PWD=password","source":"","cross":[]},{"q":"Select employee with 2nd largest salary without limit and Top.","a":"I explain answer with CTE where I write 2 queries.\nQuestion asked:  When run Query using CTE ? how do we run 2 queries, where do you hold output of 1st query.Does it run at runtime? \n\nSELECT *\nFROM employees\nWHERE salary = (\n    SELECT MAX(salary)\n    FROM employees\n    WHERE salary < (\n        SELECT MAX(salary)\n        FROM employees\n    )\n);\n\n🧠 Bonus: If You Need N-th Highest Later\n\nYou can use DENSE_RANK() if your SQL supports window functions.","source":"","cross":[]},{"q":"How to optimize qury which has multiple joins","a":"I answer use caching - He asked what did you cache if queries are dynamic with multiple joins , I forgot the exact word like what we cache, and discussion goes wrong.\n=================================\nOptimizing query performance is essential for maintaining fast and efficient database operations. Below are some best practices to achieve this:\n1. Use Indexes Wisely\n\nThere are two main types of indexes:\n\n    Clustered Index:\n\n        The data in the table is physically ordered to match the index.\n\n        Only one clustered index is allowed per table.\n\n        It determines the actual data storage order.\n\n    Non-Clustered Index:\n\n        Creates a separate structure that maps keys to the table rows.\n\n        Allows multiple indexes on a single table.\n\n        Commonly used for improving search performance on columns not used in the clustered index.\n\nTips:\n\n    Delete unused or redundant indexes to reduce overhead.\n\n    Regularly review index usage and update based on query patterns.\n\n2. Avoid Unnecessary Joins\n\nIf you're joining two tables but not selecting any fields from the second table, consider using EXISTS instead of a JOIN.\n    This improves performance by reducing the data load and simplifies the execution plan.\n\n3. Avoid Subqueries When Possible\n\nSubqueries, especially in SELECT or WHERE clauses, can often be replaced with JOINs for better performance and optimization.\n\n4. Avoid Functions on Indexed Columns\n\n Applying functions like DATE_FORMAT(), AVG(), etc., on indexed columns can prevent the index from being used.\n\n    Instead, transform the data outside the query (e.g., in the application layer) when possible.\n\n5. Analyze the Execution Plan (Very Important)\n\n    Always review the query execution plan to identify bottlenecks or inefficient operations.\n\n    Pay attention to table scans, index usage, and query cost.\n\n6. Parameterization to Reuse Execution Plans\n\nWriting queries with hardcoded values in WHERE clauses (e.g., WHERE user_id = 123) generates a separate execution plan for each variation.\n\nInstead, use parameterized queries (e.g., WHERE user_id = @user_id) to allow the database engine to reuse the same execution plan. This reduces overhead and improves caching efficiency.\\\"","source":"","cross":[]},{"q":"What is SQlAlchemy used for?","a":"","source":"","cross":[]},{"q":"What is the advantage of ORM vs raw query.","a":"","source":"","cross":[]},{"q":"How does mutable immutable object or variable processed inside m/m","a":"🧠 How Are Mutable vs Immutable Objects Processed in Memory in Python?\n\nIn Python, everything is an object, and variables are just references (pointers) to objects stored in memory (heap). The way Python handles these objects depends on whether they're mutable or immutable.\n\n✅ Definitions\n\nType\t           Examples\t                    Can Be Changed In-Place?\nImmutable\t   int, float, str, tuple\t            ❌ No\nMutable\t           list, dict, set, bytearray\t     ✅ Yes\n\n🔬 What Happens in Memory?\n\n🎯 1. Immutable Object Example (int, str):\n\nx = 10\ny = x\nx = x + 1\n\n🔍 Memory View:\n\n    x and y initially point to the same object: 10\n\n    When x = x + 1 happens:\n\n        A new int object (11) is created\n\n        x now points to 11\n\n        y still points to 10\n\n📌 Immutables don’t change in-place — they’re reassigned in memory.\n\n🎯 2. Mutable Object Example (list):\n\na = [1, 2, 3]\nb = a\na.append(4)\n\n🔍 Memory View:\n\n    Both a and b point to the same list object in memory\n\n    When a.append(4) is called, the original object is modified in-place\n\n    Now both a and b reflect the updated list: [1, 2, 3, 4]\n\n📌 Mutables can be changed in-place — the reference stays the same.\n\n🧪 Visual Summary:\n\nImmutable (int):\n\nx ─┬─> 10\n    │\ny ─┘\n\nx = x + 1\n\nx ──> 11   (new object)\ny ──> 10\n\nMutable (list):\n\na ─┬─> [1, 2, 3]\n    │\nb ─┘\n\na.append(4)\n\na ─┬─> [1, 2, 3, 4]\n    │\nb ─┘\n\n🔍 Check with id():\n\nx = 10\nprint(id(x))\nx += 1\nprint(id(x))  # Different ID (new object)\n\nlst = [1, 2]\nprint(id(lst))\nlst.append(3)\nprint(id(lst))  # Same ID (modified in-place)","source":"","cross":[]},{"q":"what is GIL , what is the use of it?","a":"🧵 What is GIL (Global Interpreter Lock) in Python?\n\nThe GIL (Global Interpreter Lock) is a mutex (mutual exclusion lock) used in the CPython interpreter (the default and most widely used Python implementation).\n\n✅ Purpose of GIL\n\n    It ensures that only one thread executes Python bytecode at a time, even on multi-core CPUs.\n\n    It protects access to Python objects in memory, keeping Python’s memory management thread-safe.\n\n🧠 Why Was GIL Introduced?\n\n    CPython uses reference counting for garbage collection.\n\n    Without GIL, multiple threads modifying reference counts simultaneously could cause race conditions and corruption.\n\n    GIL simplifies memory management by serializing access to Python objects.\n\n🪢 GIL in Action (Multithreading Example)\n\nimport threading\n\ndef count():\n    x = 0\n    for _ in range(10**7):\n        x += 1\n\nt1 = threading.Thread(target=count)\nt2 = threading.Thread(target=count)\n\nt1.start()\nt2.start()\nt1.join()\nt2.join()\n\n✅ This runs correctly — no crash, no memory corruption\n❌ But not truly parallel on multi-core CPUs — only one thread runs Python bytecode at a time\n\n✅ When GIL is Not a Problem\n\n    I/O-bound tasks (e.g., network calls, disk access):\n\n        Threads release the GIL during I/O waits\n\n        You can get real concurrency here\n\n    Multiprocessing:\n\n        Each process has its own Python interpreter + GIL\n\n        True parallelism with multiprocessing module","source":"","cross":[]},{"q":"How does python manage m/m","a":"🧠 How Does Python Manage Memory (m/m)?\n\nPython manages memory automatically using a combination of:\n\n    Reference Counting\n\n    Garbage Collection\n\n    Memory Pools (via PyMalloc)\n\nAll of this happens mostly behind the scenes, abstracting the complexity from developers.\n🧮 1. Reference Counting\n\nEvery object in Python has a reference count:\n➡️ how many variables or objects are currently referring to it.\n🔁 Example:\na = [1, 2, 3]  # ref count = 1\nb = a          # ref count = 2\ndel a          # ref count = 1\n\nWhen the reference count becomes 0, the object is immediately deleted from memory.\nThis is the primary memory management mechanism in CPython.\n\n🧹 2. Garbage Collector (GC)\n\nReference counting can fail when there are circular references:\na = []\nb = [a]\na.append(b)  # Circular reference\n\nIn such cases, Python uses a cyclic garbage collector (gc module) to detect and clean unreachable cycles.\n✅ Python’s GC:\n\n    Periodically scans for objects with circular references.\n    Uses generational GC — objects are grouped by age:\n    Gen 0 (young), Gen 1 (mid), Gen 2 (old).\n\n🏗️ 3. Memory Allocation via PyMalloc\n\n    Python uses a private heap for storing objects.\n    It has a specialized allocator called PyMalloc, optimized for small objects (<= 512 bytes).\n    Large objects go directly to the system allocator (like malloc() in C).\n\n🧩 Internally:\n\n    Memory is allocated in blocks and arenas to reduce fragmentation.\n    Objects are reused from memory pools to avoid costly allocations.\n\n🧵 Thread Safety via GIL\n\nBecause of the Global Interpreter Lock (GIL):\n\n    Only one thread can manage objects at a time\n    This makes memory management thread-safe in CPython","source":"","cross":[]},{"q":"If python is single threaded then why does multithreading works and what is the role of GIL?","a":"This is one of the most commonly misunderstood topics in Python — let's break it down clearly:\n🤔 If Python is Single-Threaded, Why Does Multithreading Work?\n\nPython does support multithreading, but CPython’s Global Interpreter Lock (GIL) is what restricts true parallel execution of Python code.\n\n🔑 Key Clarification:\n\nQuestion\t                                                         Answer\n🧵 Is Python multithreaded?\t                        ✅ Yes — you can spawn multiple threads using threading\n⚙️ Can Python run threads in parallel?\t        ⚠️ Not for CPU-bound tasks in CPython (due to GIL)\n🔄 So what works with threads in Python?\t✅ I/O-bound tasks (network, file I/O, etc.)\n\n🧠 What Is GIL (Global Interpreter Lock)?\n\n    The GIL is a mutex lock in CPython that ensures only one thread executes Python bytecode at a time.\n\nIt is not a limitation of Python as a language, but of CPython, the standard Python interpreter.\n\n🔁 How Python Threads Work with GIL:\n\n1. Thread is created (e.g. via threading.Thread)\n2. Only one thread can run Python code at a time\n3. Other threads wait their turn, even if CPU has multiple cores\n4. I/O operations release the GIL, allowing other threads to run\n\n✅ Example: Multithreading with I/O (Works well)\nimport threading\nimport time\n\ndef download():\n    print(\\\"Start downloading...\\\")\n    time.sleep(2)  # I/O-bound: releases GIL\n    print(\\\"Download complete!\\\")\n\nt1 = threading.Thread(target=download)\nt2 = threading.Thread(target=download)\n\nt1.start()\nt2.start()\nt1.join()\nt2.join()\n\n✅ This runs concurrently — because sleep() is I/O-bound and releases the GIL.\n\n❌ Example: Multithreading with CPU-bound (GIL blocks parallelism)\n\nimport threading\n\ndef calc():\n    x = 0\n    for _ in range(10**8):\n        x += 1\n\nt1 = threading.Thread(target=calc)\nt2 = threading.Thread(target=calc)\n\nt1.start()\nt2.start()\nt1.join()\nt2.join()\n\n⚠️ This doesn’t give speedup — threads run one at a time due to GIL.\n\n🎯 Summary\n\nQuestion\t                                                        Answer\nIs Python single-threaded?\t                        No — you can create threads\nWhy does only one thread run at a time?\tBecause of the GIL in CPython\nWhen does multithreading help?\t                I/O-bound tasks (networking, disk, sleep)\nWhen does it not help?\t                                CPU-bound tasks (math, loops) — use multiprocessing","source":"","cross":[]},{"q":"When run Query using CTE ? how do we run such queries with joins using ORM?","a":"","source":"","cross":[]},{"q":"What is the difference b/w generator vs iterator where do we use the generator?","a":"","source":"","cross":[]},{"q":"How does sqlalchemy session works in executing transaction queries?","a":"✅ Ensuring that your SQLAlchemy transaction queries are successfully completed is essential for data consistency and rollback safety — especially in production apps.\n\nHere’s how to properly manage transactions with SQLAlchemy.\n\n✅ 1. Use session.begin() as a context manager\n\nThis is the recommended and cleanest way:\n\nfrom sqlalchemy.orm import Session\n\nwith Session(engine) as session:\n    with session.begin():  # starts a transaction\n        user = User(name=\\\"Alice\\\")\n        session.add(user)\n\n        order = Order(user_id=user.id, total=100)\n        session.add(order)\n# COMMIT happens automatically if no exceptions are raised\n\n✅ Auto-commits if everything succeeds\n❌ Auto-rollbacks if any exception is raised\n\n✅ 2. Use manual commit() and handle rollback() explicitly\n\nThis gives you fine control, but you must handle exceptions carefully:\n\nsession = Session(engine)\n\ntry:\n    user = User(name=\\\"Bob\\\")\n    session.add(user)\n\n    order = Order(user_id=user.id, total=150)\n    session.add(order)\n\n    session.commit()  # commit only if all succeeded\nexcept Exception as e:\n    session.rollback()  # roll back the whole transaction\n    raise\nfinally:\n    session.close()\n\n✅ Good when you want to catch and log specific errors\n❌ More boilerplate\n\n✅ 3. With Async SQLAlchemy (e.g. in FastAPI)\n\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nasync with AsyncSession(engine) as session:\n    async with session.begin():\n        user = User(name=\\\"Async Alice\\\")\n        session.add(user)","source":"","cross":[]},{"q":"what is lookml. Build project with lookML","a":"","source":"","cross":[]},{"q":"what is n+1 query","a":"🔍 What is the N+1 Query Problem?\n\nThe N+1 query problem is a common performance anti-pattern that happens when your application makes 1 query to fetch a list of items, and then makes N additional queries to fetch related data for each item.\n\n🚨 Example Scenario (In SQL / ORM context):\n\nYou want to fetch all blog posts with their authors.\n❌ Bad (N+1 problem):\n\n# 1 query to get all blog posts\nposts = db.query(BlogPost).all()\n\n# Then N queries to get the author of each post\nfor post in posts:\n    print(post.author.name)  # triggers a query each time\n\nTotal queries: 1 (for posts) + N (for authors) → N+1 queries\n\n# Fetch all posts along with their authors in one go\nposts = db.query(BlogPost).options(joinedload(BlogPost.author)).all()\n\nTotal queries: 1\nResult: Much faster and scalable\n\n🧠 Why it happens?\n\nBecause ORMs (like SQLAlchemy, Django ORM, Sequelize, etc.) lazy-load relationships by default. That means:\n\n    It doesn't fetch related data until it's accessed\n\n    If you're looping over items, you trigger a new query every time\n\n📉 Impact of N+1:\n\n    Serious performance hit for large datasets\n\n    More database load\n\n    Slower page loads\n\n🛠️ How to fix N+1?\n\nDepends on your ORM or database tool:\nORM/Tool                                      Solution\nSQLAlchemy                                 joinedload, selectinload\nDjango ORM                                 select_related(), prefetch_related()\nSequelize (Node.js)                      Use include in the query\nPrisma                                          Use include or select properly\nRaw SQL                                      Use JOIN instead of separate queries","source":"","cross":[]},{"q":"How does postman able to access you application if CORS block","a":"Because **CORS is a browser-only security mechanism.\nPostman is not a browser, so CORS rules do not apply to it at all.","source":"","cross":[]},{"q":"what is CORS","a":"CORS stands for Cross-Origin Resource Sharing. It is a security feature built into web browsers that controls how resources are shared between different origins (domains).","source":"","cross":[]},{"q":"If there is jwt authenication then why do we need cors","a":"🔒 JWT handles who can access\nJWT (JSON Web Token) is about authentication – it tells the server \\\"this user is allowed to make this request.\\\"\n\n🚧 CORS handles where the request is coming from\nCORS (Cross-Origin Resource Sharing) is about security at the browser level – it tells the browser \\\"is this frontend allowed to talk to this backend?\\\"\n\n🔍 Example:\n\nYou have:\n\n    Backend: https://api.yourapp.com\n\n    Frontend: https://yourapp.com\n\n    JWT issued after login\n\nNow imagine a malicious site:\n\n// evil.com tries to do this\nfetch(\\\"https://api.yourapp.com/protected\\\", {\n  method: \\\"GET\\\",\n  credentials: \\\"include\\\", // or adds Authorization header\n  headers: { Authorization: \\\"Bearer stolen_token\\\" }\n});\n\n🔐 Even if token is valid, CORS blocks it in the browser:\n\nBecause Origin: https://evil.com is not allowed.","source":"","cross":[]},{"q":"what is Preflight Requests?","a":"A Preflight request is an automatic HTTP OPTIONS request sent by the browser before making the actual API request, only in certain situations. It’s like the browser asking the server:\n\n“Hey, is it okay if I send this kind of request from this origin?”\n\n📦 When does the browser send a Preflight request?\n\nA preflight is triggered when your request is not simple.\nA “simple request” means:\n\n    Method is GET, POST, or HEAD\n\n    Content-Type is one of:\n\n        application/x-www-form-urlencoded\n\n        multipart/form-data\n\n        text/plain\n\n    No custom headers (like Authorization, X-Custom-Header, etc.)\n\n❗ Examples that trigger preflight:\n\n    Sending a request with Authorization or X-Auth-Token\n\n    Using methods like PUT, PATCH, DELETE\n\n    Content-Type like application/json (yes, JSON triggers preflight!)\n\n🧠 Why does preflight exist?\n\nTo protect the user and the server:\n\n    Ensures a frontend can’t send dangerous requests to a backend without permission\n\n    Gives server a chance to say “No, I don’t allow that origin or method”","source":"","cross":[]},{"q":"why did you migrate GAE app to AWS what was the reason?","a":"","source":"","cross":[]},{"q":"design whole infra here for your current GAE and after shifting to AWS what is infra using whiteboard?","a":"","source":"","cross":[]},{"q":"if you project working on GCP why you move to AWS who took this decision and on what basis.","a":"","source":"","cross":[]},{"q":"Tell me any challanging task you do in your current organization.","a":"","source":"","cross":[]},{"q":"Are you leading a team what is your daily responsibility?","a":"","source":"","cross":[]},{"q":"why do you choose redis on aws just to run a blog?","a":"","source":"","cross":[]},{"q":"How do you manage your team and how do you assign task to them.","a":"","source":"","cross":[]},{"q":"What is the difference between asyncio and async/await?","a":"","source":"","cross":[]},{"q":"Why do we use await if async is supposed to be non-blocking?","a":"","source":"","cross":[]},{"q":"Running async code in WSGI vs ASGI — what's the difference?","a":"","source":"","cross":[]},{"q":"Write 2 same API links (one in Flask, one in FastAPI) and tell the difference.","a":"","source":"","cross":[]},{"q":"Fetch all properties from database using FastAPI vs Flask — does it make any performance difference?","a":"","source":"","cross":[]},{"q":"why do i need to shift my api from flask to fast if everything i can do with flask which can be done from the fast api like eventloop , asyncio async await","a":"","source":"","cross":[]},{"q":"in Fast Api async await code there is no eventloop visible. Then how it is handle the asynchronous?","a":"","source":"","cross":[]},{"q":"a = ([1,2,3],{'name':'deepak'},{1,2,3},(1,1))\n\nd = [[1,2,3],{'name':'deepak'},{1,2,3},(1,1)]\n\ncan we update a?\na[0].append(4) #what is the output ? I sait a is immutable so we cant modify.","a":"✅ Let's break it down:\na = ([1,2,3], {'name':'deepak'}, {1,2,3}, (1,1))\nThis is a tuple with 4 elements:\n\nIndex                  Type                                Mutable?\na[0]                     List [1,2,3]                        ✅ Yes\na[1]                     Dict {'name': 'deepak'}      ✅ Yes\na[2]                     Set {1,2,3}                        ✅ Yes\na[3]                     Tuple (1,1)                        ❌ No\n\nSo even though the tuple a is immutable, it can contain mutable elements, like lists, dicts, sets.\n\n🧪 Now:\na[0].append(4)\n\nYou are not changing the tuple itself — you're modifying the list inside the tuple.\n✅ This is allowed!\n\n🖨️ Output:\n      print(a)\n      ([1, 2, 3, 4], {'name': 'deepak'}, {1, 2, 3}, (1, 1))\n\n⚠️ Key Interview Clarification:\n\n    ✅ Tuples are immutable → You cannot do a[0] = 5\n\n    ❌ But tuples can contain mutable objects, which can be changed\n\n    ✅ So a[0].append(4) is valid because you're not changing the tuple's structure — you're modifying the object inside it\n\n🔥 Summary:\n    Tuples are immutable in structure, not in content.\n\na[1]['age'] = 30\na[2].add(3)\na[3] += (5,) #this line gives error","source":"","cross":[]},{"q":"def extend_list(val, list=[]):\nlist.append(val)\nreturn list\n\nprint(extend_list(10)) #What is the output?\nprint(extend_list(20)) #What is the output?","a":"🔍 What's happening?\n\n    The default value list=[] is mutable.\n\n    Default mutable arguments are evaluated only once, at function definition time, not each time the function is called.\n\n    So every call to extend_list() without a list argument reuses the same list object.\n\n🧠 Execution Flow:\n\nFirst call:\nextend_list(10)\n\n    list is [] (default)\n    10 is appended → list becomes [10]\n    Returns [10]\n\nSecond call:\nextend_list(20)\n\n    list is still [10] (from previous call)\n    20 is appended → list becomes [10, 20]\n    Returns [10, 20]","source":"","cross":[]},{"q":"def extend_list(val, list=None):\n    if list is None:\n        list = []\n    list.append(val)\n    return list\n\nprint(extend_list(10))\nprint(extend_list(20))","a":"🔍 What's happening now?\n\n    list=None is immutable, so it is safe to use as a default.\n\n    Each time the function is called without a list argument:\n\n        A new list is created inside the function, ensuring there's no shared state.\n\n✅ Output:\n[10]\n[20]","source":"","cross":[]},{"q":"a = [1, 2]\nb = [1, 2]\nprint(a == b, a is b) #What is output?","a":"","source":"","cross":[]},{"q":"What is the output?\n\nprint({True: 'yes', 1: 'no', 1.0: 'maybe'}[1])","a":"🔍 What's happening here?\nIn Python, dictionary keys must be unique, and when you define a dictionary like this:\n\n{True: 'yes', 1: 'no', 1.0: 'maybe'}\n\n    Python treats:\n        True, 1, and 1.0 as equal keys.\n\nWhy?\n    True == 1 → True\n    1 == 1.0 → True\n\n    So all 3 are equal as dictionary keys, and Python will only keep the last one.\n\nOrder of insertion:\n{True: 'yes'}         # inserts True\n{True: 'yes', 1: 'no'} # 1 is equal to True, so value is updated to 'no'\n{True: 'yes', 1: 'no', 1.0: 'maybe'} # 1.0 is also equal, value becomes 'maybe'\n\nSo the dictionary effectively becomes:\n{True: 'maybe'}  # Only one key survives\n\n✅ Final Answer:\nprint({True: 'yes', 1: 'no', 1.0: 'maybe'}[1])  # ➜ 'maybe'\n\n🧠 Python Dict Key Rules (Simplified)\n>>> hash(True)\n1\n>>> hash(1)\n1\n>>> hash(1.0)\n1\n>>> True == 1\nTrue\n>>> 1 == 1.0\nTrue\n>>> True == 1.0\nTrue","source":"","cross":[]},{"q":"@app.route('/test/<int:num>')\n      def test(num):\n            return str(type(num))\n\n1. test/24 - what is output?\n\n2. test/24.5 - What is output?","a":"","source":"","cross":[]},{"q":"Can we use multithreading in python?","a":"Yes, you can use multithreading in Python, but with important limitations due to the Global Interpreter Lock (GIL).\n\n✅ When to Use Python Multithreading\n\nMultithreading is useful in Python when your program is I/O-bound, such as:\n\n    Network requests (APIs, web scraping)\n\n    File read/write\n\n    Database queries\n\n    Waiting on user input\n\n❌ Not Ideal for CPU-bound Tasks\n\nFor CPU-bound tasks (like heavy computation, image processing, data crunching), Python threads don’t run in parallel because of the GIL, which ensures that only one thread executes Python bytecode at a time.\n\n👉 For CPU-bound tasks, use multiprocessing instead.\n🔧 Example of Multithreading (I/O-bound):\n\nimport threading\nimport time\n\ndef download_file(name):\n    print(f\\\"Starting {name}\\\")\n    time.sleep(2)  # Simulate I/O delay\n    print(f\\\"Finished {name}\\\")\n\nt1 = threading.Thread(target=download_file, args=(\\\"file1\\\",))\nt2 = threading.Thread(target=download_file, args=(\\\"file2\\\",))\n\nt1.start()\nt2.start()\n\nt1.join()\nt2.join()\n\nprint(\\\"All downloads complete.\\\")\n\n✅ Output will show that both downloads started almost simultaneously and ended after about 2 seconds total.\n\nSummary:\nTask Type\tUse\nI/O-bound\tthreading module\nCPU-bound\tmultiprocessing module\nAsync I/O\tasyncio (better for high-concurrency I/O)","source":"","cross":[]},{"q":"What is django signal","a":"","source":"","cross":[]},{"q":"what is deployment pipeline","a":"","source":"","cross":[]},{"q":"how does flask req res lifecycle works","a":"","source":"","cross":[]},{"q":"what is websocket how it work under the hood","a":"","source":"","cross":[]},{"q":"how do you deploy microsrvices","a":"","source":"","cross":[]},{"q":"what is wsgi","a":"","source":"","cross":[]},{"q":"what are middleware in flask","a":"","source":"","cross":[]},{"q":"how session work in flask","a":"","source":"","cross":[]},{"q":"How does Next Js login feature implemented","a":"","source":"","cross":[]},{"q":"web server vs application server","a":"","source":"","cross":[]},{"q":"what is queryset in dajango","a":"","source":"","cross":[]},{"q":"hw do you migrate from gcp to aws what was the challenges","a":"","source":"","cross":[]},{"q":"how do you review the developer code","a":"","source":"","cross":[]},{"q":"what feature you have implemented in the current project","a":"","source":"","cross":[]},{"q":"folder structure of flask","a":"","source":"","cross":[]},{"q":"what is jinja 2 templating work","a":"","source":"","cross":[]},{"q":"which LLD you have knowledge","a":"","source":"","cross":[]},{"q":"factory design pattern","a":"","source":"","cross":[]},{"q":"how many type of inheritence","a":"","source":"","cross":[]},{"q":"How does garbage collection work & how does it take m/m to process this","a":"","source":"","cross":[]},{"q":"what is file based routing in react","a":"","source":"","cross":[]},{"q":"Read json file with pandas","a":"","source":"","cross":[]},{"q":"what s fixture and how do we create db test connection script with pyodbc an what is @mark\nHow do you make sure the db test case fixture will ru before all other test cases","a":"","source":"","cross":[]},{"q":"diff b/w rank vs dense rank","a":"","source":"","cross":[]},{"q":"copy vs deepcopy","a":"","source":"","cross":[]},{"q":"we have order table contains 4 order of customer and another payment table which contains only 2 record means 2 customer order but do not payment.How to select those customer.","a":"practice_db=# select * from payments;\n payment_id | order_id | customer_id | amount \n------------+----------+-------------+--------\n          1 |        1 |         101 |    500\n          2 |        3 |         103 |    800\n(2 rows)\n\npractice_db=# select * from orders;\n order_id | customer_id | order_date \n----------+-------------+------------\n        1 |         101 | 2025-09-11\n        2 |         102 | 2025-09-11\n        3 |         103 | 2025-09-11\n        4 |         101 | 2025-09-11\n(4 rows)\n\npractice_db=# select o.customer_id from orders o left join payments p on o.order_id = p.order_id where p.order_id is null;\n customer_id \n-------------\n         102\n         101\n(2 rows)\n\n\npractice_db=# select o.customer_id from orders o left join payments p on o.order_id = p.order_id group by o.customer_id having count(p.payment_id) = 0;\n customer_id \n-------------\n         102\n(1 row)","source":"","cross":[]},{"q":"what is async await","a":"","source":"","cross":[]},{"q":"what are the sql function","a":"","source":"","cross":[]},{"q":"diff b/w sql vs no sql","a":"","source":"","cross":[]},{"q":"what are the diff python libraries have you work with","a":"","source":"","cross":[]},{"q":"why does nosql able to handle huge data compare to nosql","a":"","source":"","cross":[]},{"q":"have  you work on poetry","a":"","source":"","cross":[]}]}};

// ===== STATE =====
let activeTab = 'Python';
let activeFilter = 'all';
let searchQuery = '';
let bookmarks = JSON.parse(localStorage.getItem('deckBookmarks') || '{}');
let generatedAnswers = JSON.parse(localStorage.getItem('generatedAnswers') || '{}');
let generatedCross = JSON.parse(localStorage.getItem('generatedCross') || '{}');
let expandedCards = new Set();

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.getElementById('loading-overlay').classList.add('hidden');
    initTabs();
    renderCurrentTab();
    updateStats();
  }, 1400);
});

function initTabs() {
  const container = document.getElementById('tabs');
  container.innerHTML = '';
  Object.entries(QA_DATA).forEach(([name, data]) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (name === activeTab ? ' active' : '');
    btn.innerHTML = `${data.icon} ${name} <span class="tab-count">${data.questions.length}</span>`;
    btn.onclick = () => switchTab(name);
    container.appendChild(btn);
  });
}

function switchTab(name) {
  activeTab = name;
  activeFilter = 'all';
  searchQuery = '';
  document.getElementById('globalSearch').value = '';
  document.getElementById('search-info').style.display = 'none';
  expandedCards.clear();
  
  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', Object.keys(QA_DATA)[i] === name);
  });
  
  // Reset filter buttons
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.filter-btn')[0].classList.add('active');
  
  renderCurrentTab();
}

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCurrentTab();
}

function handleSearch(val) {
  searchQuery = val.trim().toLowerCase();
  renderCurrentTab();
}

function getFilteredQuestions() {
  let questions = [];
  
  if (searchQuery) {
    // Search all tabs
    Object.entries(QA_DATA).forEach(([tab, data]) => {
      data.questions.forEach((q, idx) => {
        if (q.q.toLowerCase().includes(searchQuery) || q.a.toLowerCase().includes(searchQuery)) {
          questions.push({...q, _tab: tab, _idx: idx, _id: `${tab}-${idx}`});
        }
      });
    });
    
    const info = document.getElementById('search-info');
    info.style.display = 'block';
    info.textContent = `Found ${questions.length} results for "${searchQuery}"`;
    
    // Update section title
    document.getElementById('section-title').textContent = 'Search Results';
    document.getElementById('section-subtitle').textContent = `${questions.length} matches`;
  } else {
    const data = QA_DATA[activeTab];
    document.getElementById('search-info').style.display = 'none';
    document.getElementById('section-title').textContent = `${data.icon} ${activeTab}`;
    
    questions = data.questions.map((q, idx) => ({...q, _tab: activeTab, _idx: idx, _id: `${activeTab}-${idx}`}));
    
    if (activeFilter === 'answered') {
      questions = questions.filter(q => q.a || generatedAnswers[q._id]);
    } else if (activeFilter === 'missing') {
      questions = questions.filter(q => !q.a && !generatedAnswers[q._id]);
    } else if (activeFilter === 'bookmarked') {
      questions = questions.filter(q => bookmarks[q._id]);
    }
    
    document.getElementById('section-subtitle').textContent = `${questions.length} questions`;
  }
  
  return questions;
}

function renderCurrentTab() {
  const questions = getFilteredQuestions();
  const grid = document.getElementById('cardsGrid');
  
  if (questions.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <h3>No questions found</h3>
      <p>Try a different filter or search term.</p>
    </div>`;
    return;
  }
  
  grid.innerHTML = questions.map((q, i) => renderCard(q, i)).join('');
  
  // Restore expanded state
  expandedCards.forEach(id => {
    const el = document.getElementById(`card-${id}`);
    if (el) {
      el.classList.add('expanded');
      el.querySelector('.card-body').classList.add('show');
    }
  });
}

function renderCard(q, i) {
  const cardId = q._id;
  const answer = q.a || generatedAnswers[cardId] || '';
  const crossList = generatedCross[cardId] || [];
  const isBookmarked = bookmarks[cardId];
  const hasAnswer = !!answer;
  
  // Highlight search query
  let questionText = escHtml(q.q);
  if (searchQuery) {
    const re = new RegExp(`(${escRegex(searchQuery)})`, 'gi');
    questionText = questionText.replace(re, '<mark>$1</mark>');
  }
  
  // Format answer with code blocks
  const formattedAnswer = formatAnswer(answer);
  
  const crossHtml = crossList.length > 0 ? crossList.map(cq => `
    <div class="cross-q">
      <span class="cross-q-label">↩ Cross Question</span>
      ${escHtml(cq)}
    </div>`).join('') : '';

  const sourceBadge = q.source ? `<span class="tag tag-source">${q.source}</span>` : '';
  const statusBadge = hasAnswer 
    ? `<span class="tag tag-answered">✓ Answered</span>`
    : `<span class="tag tag-missing">⚡ AI Ready</span>`;

  const answerPanel = hasAnswer ? `
    <div class="answer-tabs">
      <button class="answer-tab active" onclick="switchAnswerTab(this, 'answer-${cardId}', '${cardId}')">Answer</button>
      <button class="answer-tab" onclick="switchAnswerTab(this, 'cross-${cardId}', '${cardId}')">Cross Questions ${crossList.length > 0 ? `(${crossList.length})` : ''}</button>
    </div>
    <div class="answer-content active" id="answer-${cardId}">
      <div class="answer-text">${formattedAnswer}</div>
    </div>
    <div class="answer-content" id="cross-${cardId}">
      ${crossHtml
        ? crossHtml + `<button class="gen-btn" style="margin-top:8px" onclick="generateCrossQuestions('${cardId}', event)" id="genCross-${cardId}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
            Regenerate
          </button>`
        : `<div id="cross-loading-${cardId}" style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:8px 0;">
             <div class="spinner"></div> Generating cross questions...
           </div>`
      }
    </div>
  ` : `
    <div style="color:var(--muted);font-size:13px;padding:8px 0;">
      Click <strong style="color:var(--accent)">Generate Answer</strong> below to get an AI-generated answer.
    </div>
  `;

  const answeredPct = hasAnswer ? 100 : 0;

  return `<div class="flashcard" id="card-${cardId}">
    <div class="card-header" onclick="toggleCard('${cardId}')">
      <span class="card-num">#${i + 1}</span>
      <div class="card-question">${questionText}</div>
    </div>
    <div class="card-tags">
      ${sourceBadge}
      ${statusBadge}
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${answeredPct}%"></div>
    </div>
    <div class="card-footer">
      <button class="toggle-btn" id="toggle-${cardId}" onclick="${hasAnswer ? `toggleCard('${cardId}')` : `triggerGenerate('${cardId}')`}">
        ${hasAnswer ? 'View Answer' : 'Generate Answer'}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>
      </button>
      <button class="bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" onclick="toggleBookmark('${cardId}', event)" title="Bookmark">
        ${isBookmarked ? '⭐' : '☆'}
      </button>
    </div>
    <div class="card-body" id="body-${cardId}">
      ${answerPanel}
    </div>
  </div>`;
}

function formatAnswer(text) {
  if (!text) return '';
  
  // Escape HTML first
  let t = escHtml(text);
  
  // Detect code blocks - lines starting with spaces/tabs followed by code-like content
  // or blocks that look like Python/SQL
  const lines = t.split('\n');
  const result = [];
  let inCode = false;
  let codeLines = [];
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const isCodeLine = /^(    |\t)/.test(line) || 
                       /^(def |class |import |from |SELECT |WITH |CREATE |INSERT |UPDATE |DELETE |ALTER |DROP |@)/i.test(line.trim()) ||
                       /[{};()]/.test(line) && line.trim().length > 3;
    
    if (isCodeLine && !inCode) {
      inCode = true;
      codeLines = [line];
    } else if (inCode) {
      if (line.trim() === '' && i + 1 < lines.length && !/^(    |\t)/.test(lines[i+1]) && 
          !/^(def |class |import |from |SELECT |WITH |CREATE |INSERT |UPDATE |DELETE |ALTER |DROP |@)/i.test(lines[i+1]?.trim())) {
        result.push(`<div class="code-block">${codeLines.join('\n')}</div>`);
        inCode = false;
        codeLines = [];
        result.push(line);
      } else {
        codeLines.push(line);
      }
    } else {
      result.push(line);
    }
  }
  
  if (inCode && codeLines.length > 0) {
    result.push(`<div class="code-block">${codeLines.join('\n')}</div>`);
  }
  
  return `<div class="answer-text">${result.join('\n')}</div>`;
}

function triggerGenerate(cardId) {
  // Expand the card first
  const card = document.getElementById(`card-${cardId}`);
  const body = document.getElementById(`body-${cardId}`);
  if (card && !card.classList.contains('expanded')) {
    card.classList.add('expanded');
    body.classList.add('show');
    expandedCards.add(cardId);
  }
  // Then fire generation
  generateAnswer(cardId, { stopPropagation: () => {} });
}

function toggleCard(cardId) {
  const card = document.getElementById(`card-${cardId}`);
  const body = document.getElementById(`body-${cardId}`);
  const isExpanded = card.classList.contains('expanded');
  
  if (isExpanded) {
    card.classList.remove('expanded');
    body.classList.remove('show');
    expandedCards.delete(cardId);
  } else {
    card.classList.add('expanded');
    body.classList.add('show');
    expandedCards.add(cardId);
  }
}

function switchAnswerTab(btn, contentId, cardId) {
  const body = btn.closest('.card-body');
  body.querySelectorAll('.answer-tab').forEach(t => t.classList.remove('active'));
  body.querySelectorAll('.answer-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(contentId).classList.add('active');

  // Auto-generate cross questions when the Cross Questions tab is clicked
  if (cardId && contentId.startsWith('cross-') && !generatedCross[cardId]?.length) {
    autoGenerateCrossOnTabClick(cardId);
  }
}

async function autoGenerateCrossOnTabClick(cardId) {
  const [tab, idx] = parseCardId(cardId);
  const q = QA_DATA[tab]?.questions[idx];
  if (!q) return;

  const answer = q.a || generatedAnswers[cardId] || '';

  try {
    const crossStr = await callClaude(`You are an expert technical interviewer.
Based on this Q&A, generate 3 follow-up/cross questions an interviewer might ask.
Make them challenging and progressively deeper.
Return ONLY the 3 questions, one per line, numbered 1. 2. 3.
No extra text.

Original Question: ${q.q}
Answer: ${answer.substring(0, 500)}`);

    const crossList = crossStr.split('\n')
      .map(l => l.replace(/^\d+\.?\s*/, '').trim())
      .filter(l => l.length > 10)
      .slice(0, 3);

    if (crossList.length > 0) {
      generatedCross[cardId] = crossList;
      localStorage.setItem('generatedCross', JSON.stringify(generatedCross));

      const crossContainer = document.getElementById(`cross-${cardId}`);
      if (crossContainer) {
        const crossHtml = crossList.map(cq => `
          <div class="cross-q">
            <span class="cross-q-label">↩ Cross Question</span>
            ${escHtml(cq)}
          </div>`).join('');

        crossContainer.innerHTML = crossHtml + `
          <button class="gen-btn" style="margin-top:8px" onclick="generateCrossQuestions('${cardId}', event)" id="genCross-${cardId}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
            Regenerate
          </button>`;

        // Update tab label count
        const tabs = crossContainer.closest('.card-body').querySelectorAll('.answer-tab');
        if (tabs[1]) tabs[1].textContent = `Cross Questions (${crossList.length})`;
      }
    }
  } catch(e) {
    const crossContainer = document.getElementById(`cross-${cardId}`);
    if (crossContainer) {
      crossContainer.innerHTML = `
        <div style="color:var(--muted);font-size:13px;margin-bottom:10px;">Could not generate. Try again.</div>
        <button class="gen-btn" onclick="generateCrossQuestions('${cardId}', event)" id="genCross-${cardId}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
          Retry
        </button>`;
    }
  }
}

function toggleBookmark(cardId, e) {
  e.stopPropagation();
  if (bookmarks[cardId]) {
    delete bookmarks[cardId];
  } else {
    bookmarks[cardId] = true;
  }
  localStorage.setItem('deckBookmarks', JSON.stringify(bookmarks));
  
  const btn = document.querySelector(`#card-${cardId} .bookmark-btn`);
  if (btn) {
    btn.classList.toggle('bookmarked', !!bookmarks[cardId]);
    btn.textContent = bookmarks[cardId] ? '⭐' : '☆';
  }
  updateStats();
  showToast(bookmarks[cardId] ? '⭐ Bookmarked!' : 'Removed bookmark');
}

function updateStats() {
  let total = 0, answered = 0;
  Object.values(QA_DATA).forEach(data => {
    data.questions.forEach((q, idx) => {
      total++;
      const id = `${Object.keys(QA_DATA).find(k => QA_DATA[k] === data)}-${idx}`;
      if (q.a || generatedAnswers[id]) answered++;
    });
  });
  
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-bookmarked').textContent = Object.keys(bookmarks).length;
}

// ===== AI GENERATION =====
async function generateAnswer(cardId, e) {
  e.stopPropagation();
  
  const [tab, idx] = parseCardId(cardId);
  const q = QA_DATA[tab]?.questions[idx];
  if (!q) return;

  // If already generated, just show it
  if (generatedAnswers[cardId]) {
    patchCardWithAnswer(cardId, generatedAnswers[cardId]);
    return;
  }

  // Show spinner in the card body
  const body = document.getElementById(`body-${cardId}`);
  const toggleBtn = document.getElementById(`toggle-${cardId}`);
  if (body) {
    body.innerHTML = `<div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:8px 0;">
      <div class="spinner"></div> Generating answer...
    </div>`;
  }
  if (toggleBtn) {
    toggleBtn.disabled = true;
    toggleBtn.style.opacity = '0.5';
  }
  
  try {
    const answer = await callClaude(`You are an expert software engineer and interviewer. 
Answer this technical interview question concisely but completely. 
Include code examples where relevant. Format clearly.

Question: ${q.q}

Provide a clear, accurate technical answer that would impress in a senior developer interview.`);
    
    generatedAnswers[cardId] = answer;
    localStorage.setItem('generatedAnswers', JSON.stringify(generatedAnswers));

    patchCardWithAnswer(cardId, answer);
    updateStats();
    showToast('✅ Answer generated!');
    
    setTimeout(() => generateCrossQuestionsQuiet(cardId, q.q, answer), 800);
    
  } catch(err) {
    console.error(err);
    if (body) {
      body.innerHTML = `<div style="color:var(--red);font-size:13px;margin-bottom:10px;">Generation failed. Check connection.</div>
        <button class="gen-btn" onclick="triggerGenerate('${cardId}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>
          Retry
        </button>`;
    }
    if (toggleBtn) { toggleBtn.disabled = false; toggleBtn.style.opacity = ''; }
    showToast('❌ Failed. Check connection.');
  }
}

function patchCardWithAnswer(cardId, answer) {
  const [tab, idx] = parseCardId(cardId);
  const q = QA_DATA[tab]?.questions[idx];
  if (!q) return;

  const crossList = generatedCross[cardId] || [];
  const formattedAnswer = formatAnswer(answer);
  const crossHtml = crossList.map(cq => `
    <div class="cross-q">
      <span class="cross-q-label">↩ Cross Question</span>
      ${escHtml(cq)}
    </div>`).join('');

  const body = document.getElementById(`body-${cardId}`);
  if (body) {
    body.innerHTML = `
      <div class="answer-tabs">
        <button class="answer-tab active" onclick="switchAnswerTab(this, 'answer-${cardId}', '${cardId}')">Answer</button>
        <button class="answer-tab" onclick="switchAnswerTab(this, 'cross-${cardId}', '${cardId}')">Cross Questions ${crossList.length > 0 ? `(${crossList.length})` : ''}</button>
      </div>
      <div class="answer-content active" id="answer-${cardId}">
        ${formattedAnswer}
      </div>
      <div class="answer-content" id="cross-${cardId}">
        ${crossHtml
          ? crossHtml + `<button class="gen-btn" style="margin-top:8px" onclick="generateCrossQuestions('${cardId}', event)" id="genCross-${cardId}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
              Regenerate
            </button>`
          : `<div id="cross-loading-${cardId}" style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:8px 0;">
               <div class="spinner"></div> Generating cross questions...
             </div>`
        }
      </div>`;
    body.classList.add('show');
  }

  // Update footer button to "View Answer" + chevron toggle
  const toggleBtn = document.getElementById(`toggle-${cardId}`);
  if (toggleBtn) {
    toggleBtn.disabled = false;
    toggleBtn.style.opacity = '';
    toggleBtn.onclick = () => toggleCard(cardId);
    toggleBtn.innerHTML = `View Answer <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>`;
  }

  // Update status badge
  const card = document.getElementById(`card-${cardId}`);
  if (card) {
    card.classList.add('expanded');
    const missingTag = card.querySelector('.tag-missing');
    if (missingTag) {
      missingTag.className = 'tag tag-answered';
      missingTag.textContent = '✓ Answered';
    }
    const bar = card.querySelector('.progress-bar-fill');
    if (bar) bar.style.width = '100%';
  }
}

async function generateCrossQuestions(cardId, e) {
  e.stopPropagation();
  
  const [tab, idx] = parseCardId(cardId);
  const q = QA_DATA[tab]?.questions[idx];
  if (!q) return;
  
  const answer = q.a || generatedAnswers[cardId] || '';
  const btn = document.getElementById(`genCross-${cardId}`);
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner"></div> Generating...`;
  
  try {
    const crossStr = await callClaude(`You are an expert technical interviewer.
Based on this Q&A, generate 3 follow-up/cross questions an interviewer might ask.
Make them challenging and progressively deeper.
Return ONLY the 3 questions, one per line, numbered 1. 2. 3.
No extra text.

Original Question: ${q.q}
Answer: ${answer.substring(0, 500)}`);
    
    const crossList = crossStr.split('\n')
      .map(l => l.replace(/^\d+\.?\s*/, '').trim())
      .filter(l => l.length > 10)
      .slice(0, 3);
    
    generatedCross[cardId] = crossList;
    localStorage.setItem('generatedCross', JSON.stringify(generatedCross));
    
    // Update the cross section
    const crossContainer = document.getElementById(`cross-${cardId}`);
    if (crossContainer) {
      const crossHtml = crossList.map(cq => `
        <div class="cross-q">
          <span class="cross-q-label">↩ Cross Question</span>
          ${escHtml(cq)}
        </div>`).join('');
      
      crossContainer.innerHTML = crossHtml + `
        <button class="gen-btn" style="margin-top:8px" onclick="generateCrossQuestions('${cardId}', event)" id="genCross-${cardId}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
          Regenerate
        </button>`;
        
      // Update tab label
      const tabs = crossContainer.closest('.card-body').querySelectorAll('.answer-tab');
      if (tabs[1]) tabs[1].textContent = `Cross Questions (${crossList.length})`;
    }
    
    showToast(`✅ ${crossList.length} cross questions added!`);
  } catch(err) {
    console.error(err);
    btn.disabled = false;
    btn.innerHTML = `Retry`;
    showToast('❌ Failed. Check connection.');
  }
}

async function generateCrossQuestionsQuiet(cardId, question, answer) {
  if (generatedCross[cardId]?.length > 0) return;
  
  try {
    const crossStr = await callClaude(`Generate 3 follow-up interview cross-questions based on:
Q: ${question}
A: ${answer.substring(0, 400)}
Return only 3 questions, one per line, numbered 1. 2. 3.`);
    
    const crossList = crossStr.split('\n')
      .map(l => l.replace(/^\d+\.?\s*/, '').trim())
      .filter(l => l.length > 10)
      .slice(0, 3);
    
    if (crossList.length > 0) {
      generatedCross[cardId] = crossList;
      localStorage.setItem('generatedCross', JSON.stringify(generatedCross));
    }
  } catch(e) {}
}

async function callClaude(prompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  
  if (!response.ok) throw new Error(`API Error: ${response.status}`);
  
  const data = await response.json();
  return data.content?.map(b => b.text || '').join('') || '';
}

function parseCardId(cardId) {
  // Format: "TabName-idx"
  const tabs = Object.keys(QA_DATA);
  for (const tab of tabs) {
    if (cardId.startsWith(tab + '-')) {
      const idx = parseInt(cardId.slice(tab.length + 1));
      return [tab, idx];
    }
  }
  return [null, null];
}

// ===== UTILS =====
function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
