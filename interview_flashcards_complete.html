ou're building microservices or high-concurrency apps\n\n    Use Flask/Django if:\n        You're using traditional sync DBs (psycopg2, requests)\n        Simpler app with basic form handling, admin panel, etc.\n\n🧠 Final Suggestion\n\n    If you're building a high-performance chat app, and speed/scalability is critical → Node.js is ideal.\n    If you're already in the Python ecosystem, want async + readable code + ML/AI integration → use FastAPI with WebSockets.","source":"","cross":[]},{"q":"overloading & overriding","a":"","source":"","cross":[]},{"q":"polymorphism","a":"","source":"","cross":[]},{"q":"inheritence","a":"","source":"","cross":[]},{"q":"mysql vs mondo , when to use what which is faster","a":"✅ When to Use MySQL:\n\n    You have structured, relational data (e.g. users → orders → products).\n    You need strong data integrity (e.g. banking, invoicing).\n    You want to run complex SQL queries (JOIN, GROUP BY, etc.).\n    Your app is transaction-heavy (e.g. eCommerce, inventory).\n\n👉 Examples:\n\n        E-commerce\n        CRM/ERP\n        Financial apps\n\n✅ When to Use MongoDB:\n\n    You have flexible or nested data (e.g. comments inside posts).\n    You don’t need complex joins or foreign keys.\n    You want fast scaling, especially with large data or logs.\n    Your app changes data structure often (e.g. event logs, IoT, chat).\n\n👉 Examples:\n\n    Real-time chat apps\n    CMS/blogs\n    IoT logs or analytics\n    Social media feeds","source":"","cross":[]},{"q":"CROSS JOIN","a":"A CROSS JOIN is a type of SQL join that returns the Cartesian product of two tables — i.e., every row of the first table is combined with every row of the second table.\n\nSELECT *\nFROM table1\nCROSS JOIN table2;\n\n💡 Use Cases:\n\n    Generating all possible combinations (e.g., sizes × colors, dates × time slots).\n    Creating test datasets or permutations.\n    Running combinatorial logic like matrix multiplication or schedules.\n\n⚠️ Be Careful:\n\n    Cross joins can create very large result sets — especially if both tables have lots of rows.\n    Always ensure you actually need all combinations before using a cross join.","source":"","cross":[]},{"q":"what is casting in python","a":"","source":"","cross":[]},{"q":"diff b/w py and pyc files","a":"","source":"","cross":[]},{"q":"Is it really necessary to write a main method __name__==\\\"main\\\"","a":"","source":"","cross":[]},{"q":"define a fruit class with variable price and quantity. calculate the total cost of the fruit for a given quantity?","a":"","source":"","cross":[]},{"q":"diff b/w slicing and indexing","a":"","source":"","cross":[]},{"q":"list with values 1 to 5 if i write [-3:] the what would print?","a":">>> l = [1,2,3,4,5]\n>>> l[-3:]\n[3, 4, 5]","source":"","cross":[]},{"q":"If I have one string and a special character and want to check if string end with that special character","a":"\\\">>> a = \\\"\\\"asdfre@\\\"\\\"\n>>> a.endswith(\\\"\\\"@\\\"\\\")\nTrue\n>>> a = \\\"\\\"asdfre#\\\"\\\"\n>>> a.endswith(\\\"\\\"@\\\"\\\")\nFalse\\\"","source":"","cross":[]},{"q":"difference b/w list and array in python","a":"","source":"","cross":[]},{"q":"why we use pass keyword in python","a":"","source":"","cross":[]},{"q":"How do we write python programming ? what should we taken care of?","a":"1. It's case sensitive\n2. we don't use curly braces , use proper indentation to run code logically","source":"","cross":[]},{"q":"what is suit in python","a":"In Python, a suite simply means a group of statements that are executed together as a block — usually under the control of something like an if, for, while, def, class, try, etc.\n\nHow it works\nWhen you write an if statement, for example:\n\nif True:\n    print(\\\"Line 1\\\")\n    print(\\\"Line 2\\\")\n\nThe two print statements together form a suite.\nPython identifies a suite by indentation, not { } like in C/Java.","source":"","cross":[]},{"q":"What are the different type of datatypes in python?","a":"1️⃣ Basic Built-in Data Types\nint, float, complex, bool, str\n\n2️⃣ Sequence Types\nlist, tupe, range\n\n3️⃣ Text Sequence Type\nstr\n\n4️⃣ Set Types\nset, frozenset\n\n5️⃣ Mapping Type\ndict\n\n6️⃣ None Type\nNone\n\n7️⃣ Binary Types\nbyte, bytearray, memoryview","source":"","cross":[]},{"q":"what are the different ways to concatenate 2 tuple","a":"1️⃣ Using + Operator\n\nThe most common way:\n\nt1 = (1, 2, 3)\nt2 = (4, 5)\nresult = t1 + t2\nprint(result)  # (1, 2, 3, 4, 5)\n\n2️⃣ Using * Operator with Unpacking\n\nt1 = (1, 2, 3)\nt2 = (4, 5)\nresult = (*t1, *t2)\nprint(result)  # (1, 2, 3, 4, 5)\n\n3️⃣ Using tuple() with itertools.chain()\nimport itertools\n\nt1 = (1, 2, 3)\nt2 = (4, 5)\nresult = tuple(itertools.chain(t1, t2))\nprint(result)  # (1, 2, 3, 4, 5)\n\n4️⃣ Using sum() with a Start Tuple\nt1 = (1, 2, 3)\nt2 = (4, 5)\nresult = sum((t1, t2), ())\nprint(result)  # (1, 2, 3, 4, 5)\n\n5️⃣ Using += (Rebinding)\nt1 = (1, 2, 3)\nt2 = (4, 5)\nt1 += t2\nprint(t1)  # (1, 2, 3, 4, 5)","source":"","cross":[]},{"q":"What are diff type of arguments in python","a":"1️⃣ Positional Arguments\nPassed in the same order as parameters are defined.\nMost common and simplest form.\n\ndef greet(name, age):\n    print(f\\\"Hello {name}, you are {age} years old.\\\")\n\ngreet(\\\"Alice\\\", 25)  # Order matters\n\n2️⃣ Keyword Arguments\nPassed with parameter names — order doesn’t matter.\n\ndef greet(name, age):\n    print(f\\\"Hello {name}, you are {age} years old.\\\")\n\ngreet(age=25, name=\\\"Alice\\\")  # Order ignored\n\n3️⃣ Default Arguments\n    You assign a default value in the function definition.\n    If not provided, the default is used.\n\ndef greet(name=\\\"Guest\\\"):\n    print(f\\\"Hello {name}\\\")\n\ngreet()         # Hello Guest\ngreet(\\\"Alice\\\")  # Hello Alice\n\n4️⃣ Variable-Length Arguments\n\nTwo special types here:\na) *args → Variable Positional Arguments\n\n    Accepts any number of positional arguments as a tuple.\n\ndef add(*args):\n    return sum(args)\n\nprint(add(1, 2, 3, 4))  # 10\n\nb) **kwargs → Variable Keyword Arguments\n\n    Accepts any number of keyword arguments as a dictionary.\n\ndef display_info(**kwargs):\n    for key, value in kwargs.items():\n        print(f\\\"{key}: {value}\\\")\n\ndisplay_info(name=\\\"Alice\\\", age=25)\n\n5️⃣ Positional-Only Arguments (Python 3.8+)\n\n    Defined with / in the parameter list — must be passed by position.\n\ndef greet(name, /):\n    print(f\\\"Hello {name}\\\")\n\ngreet(\\\"Alice\\\")  # ✅ Works\n# greet(name=\\\"Alice\\\") ❌ Error\n\n6️⃣ Keyword-Only Arguments\n\n    Defined after * in the parameter list — must be passed by keyword.\n\ndef greet(*, name):\n    print(f\\\"Hello {name}\\\")\n\ngreet(name=\\\"Alice\\\")  # ✅ Works\n# greet(\\\"Alice\\\") ❌ Error","source":"","cross":[]},{"q":"define a class employee it has parameter like employee_id, name, write a method to print these 2 values.","a":"class Employee:\n    def __init__(self, employee_id, name):\n        self.employee_id = employee_id\n        self.name = name\n\n    def display_info(self):\n        print(f\\\"Employee ID: {self.employee_id}\\\")\n        print(f\\\"Name: {self.name}\\\")\n\n\n# Example usage\nemp1 = Employee(101, \\\"Alice\\\")\nemp1.display_info()","source":"","cross":[]},{"q":"how to check if string starts with digit or not","a":"Method 1 – Using str.isdigit()\n\ns = \\\"9abc\\\"\n\nif s and s[0].isdigit():\n    print(\\\"String starts with a digit\\\")\nelse:\n    print(\\\"String does not start with a digit\\\")\n\nMethod 2 – Using Regular Expressions (re.match)\nimport re\n\ns = \\\"9abc\\\"\n\nif re.match(r\\\"^\\d\\\", s):\n    print(\\\"String starts with a digit\\\")\nelse:\n    print(\\\"String does not start with a digit\\\")","source":"","cross":[]},{"q":"pickle.dump vs json .dump and why do we use pickle.dump when we have json.dump","a":"🔹 pickle.dump\n\nPurpose: Serializes (converts) a Python object into a binary format and writes it to a file.\n\nSupports: Almost any Python object (lists, dicts, classes, functions, custom objects, etc.).\n\nFile Format: Binary (not human-readable).\n\nUsage Example:\n\nimport pickle\n\ndata = {\\\"x\\\": 10, \\\"y\\\": [1, 2, 3]}\nwith open(\\\"data.pkl\\\", \\\"wb\\\") as f:\n    pickle.dump(data, f)   # Save\nwith open(\\\"data.pkl\\\", \\\"rb\\\") as f:\n    obj = pickle.load(f)   # Load\n\n🔹 json.dump\n\nPurpose: Serializes Python objects into a JSON (string) format and writes it to a file.\n\nSupports: Only JSON-compatible objects (dict, list, str, int, float, bool, None).\n\nFile Format: Text (human-readable).\n\nUsage Example:\n\nimport json\n\ndata = {\\\"x\\\": 10, \\\"y\\\": [1, 2, 3]}\nwith open(\\\"data.json\\\", \\\"w\\\") as f:\n    json.dump(data, f)   # Save\nwith open(\\\"data.json\\\", \\\"r\\\") as f:\n    obj = json.load(f)   # Load\n\n🔹 Why use pickle.dump instead of json.dump?\n\nSupports more data types\n\npickle can handle custom Python classes, functions, and complex objects that JSON cannot.\n\nExample: If you try to json.dump() a Python object like a set or a custom class, it fails unless you manually convert it.\n\nConvenient for Python-only projects\n\nIf both saving and loading happen inside Python, pickle is faster and easier since you don’t need to think about converting types.\n\nEfficiency\n\npickle is binary and often smaller/faster for large or complex data compared to JSON.\n\n🔹 When NOT to use pickle\n\nSecurity: pickle.load() can execute arbitrary code if the file is malicious. Never unpickle untrusted data.\n\nPortability: pickle is Python-specific. JSON is language-agnostic (works with Java, JS, Go, etc.).\n\n✅ Rule of thumb:\n\nUse json.dump if you need human-readable, portable, safe storage (e.g., configs, APIs).\n\nUse pickle.dump if you need to store/load complex Python objects quickly in a Python-only environment (e.g., ML models, cached objects).","source":"","cross":[]},{"q":"Diff b/w django ORM join method VS sqlalchemy ORM Join method","a":"| Concept           | Django ORM                   | SQLAlchemy ORM                 |\n| ----------------- | ---------------------------- | ------------------------------ |\n| Lazy loading      | Default (no prefetch/select) | Default (no load options)      |\n| Join in one query | `select_related`             | `joinedload`                   |\n| Two queries, bulk | `prefetch_related`           | `subqueryload`, `selectinload` |","source":"","cross":[]},{"q":"3 levels of object creation - __new__/__init__/__call__","a":"","source":"","cross":[]},{"q":"conversational buffer m/m","a":"","source":"","cross":[]},{"q":"django channel","a":"","source":"","cross":[]},{"q":"What is @pytest.fixture","a":"A fixture in Pytest is a way to define reusable setup code that your tests can use. You use @pytest.fixture to mark a function as a fixture.\n\nInstead of repeating setup steps like creating test clients, opening files, or initializing data, you define them once in a fixture and inject them into your tests.","source":"","cross":[]},{"q":"✅ What is assert?","a":"The assert statement is used to check if a condition is True.\nIf it’s not, it raises an AssertionError and stops the program or test.\n\nx = 5\nassert x > 0  # This passes\nassert x == 10, \\\"x is not 10\\\"  # This fails with AssertionError\n\n🔍 Syntax:\nassert condition, \\\"Optional error message\\\"\n\ndef test_fail():\n    assert \\\"hello\\\" in \\\"world\\\", \\\"Expected 'hello' to be in string\\\"","source":"","cross":[]},{"q":"Write a sample test cases.\n1. Home page\n2. Test case for adding two numbers.\n3. Test case for the missing number.\n\n4. How to run test cases.\n\n5. Test cases output.","a":"import pytest\nfrom app import app as flask_app\n\n@pytest.fixture\ndef client():\n    flask_app.config['TESTING'] = True\n    with flask_app.test_client() as client:\n        yield client\n\n\ndef test_home(client):\n    \\\"\\\"\\\"Home route returns welcome message\\\"\\\"\\\"\n    response = client.get('/')\n    assert response.status_code == 200\n    assert response.get_json() == {'message': 'Welcome to the Flask app!'}\n\ndef test_add_valid(client):\n    \\\"\\\"\\\"Adding two valid numbers\\\"\\\"\\\"\n    response = client.post('/add', json={'a':3, 'b':4})\n    assert response.status_code == 200\n    assert response.get_json()['result'] == 7\n\ndef test_add_missing_field(client):\n    \\\"\\\"\\\"Missing one field should return 400\\\"\\\"\\\"\n    response = client.post('/add', json={'a':4})\n    assert response.status_code == 400\n    assert 'error' in response.get_json()\n\n4. Run Test case command - \nPYTHONPATH=. pytest -v\n\n5. Test cases output - \ntests/test_app.py::test_home PASSED                                                              [ 33%]\ntests/test_app.py::test_add_valid PASSED                                                         [ 66%]\ntests/test_app.py::test_add_missing_field PASSED                                                 [100%]","source":"","cross":[]},{"q":"diff b/w parameter vs arguments","a":"","source":"","cross":[]},{"q":"*args vs **kwargs","a":"","source":"","cross":[]},{"q":"Idea on Generative AI for testing","a":"","source":"","cross":[]},{"q":"diff b/w select_related(), prefetch_related()","a":"select_related(): You’re following a ForeignKey/OneToOne\n1. ForeignKey, OneToOne (single object)\n2. Uses SQL JOIN to fetch related objects\n3. More efficient for single-related objects\n4. 1 query with JOIN\n5. When each object has only one related item\n\nprefetch_related(): You’re following a ManyToMany or reverse FK\n1. ManyToMany, reverse ForeignKey (sets)\n2. Uses separate queries, then combines in Python\n3. Better for large or many related objects\n4. 2+ queries, but avoids N+1\n5. When each object has many related items","source":"","cross":[]},{"q":"why does django migration error comes - why django produce such error what is the reason?","a":"🧠 What Are Django Migrations?\n\nMigrations are Django's way of applying changes to your database schema (like adding a model, renaming a field, etc.) based on your Python model code.\n\npython manage.py makemigrations\npython manage.py migrate\n\nmakemigrations detects changes to models.py and creates migration files.\nmigrate applies those migrations to the database.\n\n⚠️ Why Django Migration Errors Occur\nHere are the most common causes:\n\n❌ 1. Model Changed Without Migration\nReason:\n    You added a new field to your model but forgot to run makemigrations and migrate.\n    Django code expects the new field, but the DB schema doesn’t have it yet.\n\n❌ 2. Conflict Between Migration Files\nReason:\n    Two developers created migrations independently (e.g., 0002_auto_a.py and 0002_auto_b.py), and they both depend on 0001_initial.py.\n    Django doesn't know which path to follow.\nFix:\npython manage.py makemigrations --merge\n\n❌ 3. Missing Dependencies\nReason:\n    You’re referencing another app or model before its migrations were created or applied.\n    Circular or missing dependencies between apps.\n\n❌ 4. Renamed or Deleted Fields Without Telling Django\nReason:\n    You renamed or deleted a field in models.py, but Django doesn't know whether to delete or rename the corresponding column.\n    It tries to do the wrong thing or assumes a drop.\n\n❌ 5. Manually Modified Database\nReason:\n    You manually added/removed tables or columns directly in the DB (e.g., via pgAdmin, MySQL CLI).\n    Now Django's migration history is out of sync with reality.\n\n❌ 6. Changing null, blank, or default Without a Plan\nReason:\n     Django can't apply the migration because it doesn't know what value to insert for existing rows.\n\n✅ Best Practices to Avoid Migration Errors\n\n    1. Never edit migration files manually, unless you know what you're doing.\n    2. Always run makemigrations and migrate immediately after model changes.\n    3. Avoid manual DB schema changes; always use Django migrations.\n    4. Keep migrations small and frequent, not huge all-in-one updates.\n    5. Use Showmigrations and sqlmigrate to inspect before running: \n         python manage.py showmigrations\n         python manage.py sqlmigrate myapp 0002","source":"","cross":[]},{"q":"In Django settings.py file what is the use of secret_key? how does apis sent req to server authentication CSRF","a":"✅ 1. What is SECRET_KEY in Django settings.py?\n\nSECRET_KEY = 'your-very-secret-random-string'\n\n🔐 Purpose of SECRET_KEY:\nIt’s used for cryptographic signing in Django:\n\nFeature                                               Use of SECRET_KEY\nSession signing                               Keeps session data secure\nPassword reset tokens                       Secure link generation\nCSRF tokens                                       Signs and verifies CSRF tokens\nMessage framework                       Prevents tampering\n\n🔴 If someone gets access to your SECRET_KEY, they can forge session cookies, CSRF tokens, etc.\n✅ So never commit it to Git, and change it if compromised.\n\n✅ 2. How does API request authentication and CSRF protection work?\n\nIt depends on whether you're using:\n    Session-based auth (with cookies): CSRF protection is enforced\n    Token-based auth (e.g., JWT): CSRF protection is not needed\n\nLet’s focus on session + CSRF scenario.\n\n🔁 CSRF Protection Flow (React + Django example)\n\n🟦 React frontend\n🟥 Django backend\n\nStep-by-Step:\n\n🔹 1. Frontend makes request to get CSRF token\n\nDjango view sets the CSRF cookie (csrftoken):\n\n# views.py\nfrom django.views.decorators.csrf import ensure_csrf_cookie\nfrom django.http import JsonResponse\n\n@ensure_csrf_cookie\ndef get_csrf_token(request):\n    return JsonResponse({\\\"message\\\": \\\"CSRF cookie set\\\"})\n\nFrontend:\n\nfetch(\\\"https://yourdomain.com/api/csrf/\\\", {\n  credentials: 'include'  // send and receive cookies\n});\n\n🔹 2. Frontend sends POST with CSRF token\n\nReact reads the CSRF token from cookie:\n\nfunction getCookie(name) {\n  return document.cookie.split('; ')\n    .find(row => row.startsWith(name + '='))\n    ?.split('=')[1];\n}\n\nfetch(\\\"https://yourdomain.com/api/data/\\\", {\n  method: \\\"POST\\\",\n  headers: {\n    'X-CSRFToken': getCookie('csrftoken'),\n    'Content-Type': 'application/json'\n  },\n  credentials: 'include',\n  body: JSON.stringify({ msg: 'hello' })\n});\n\n🔹 3. Django verifies the token\n\n    Django verifies the X-CSRFToken header matches the signed CSRF cookie.\n    This cryptographic check uses SECRET_KEY internally.\n\n🧪 If You Don’t Include CSRF Token:\n\nDjango will return:\n      \n       403 Forbidden – CSRF token missing or incorrect","source":"","cross":[]},{"q":"# models.py\nclass Book(models.Model):\ntitle = models.CharField(max_length=100)\ncreated_at = models.DateTimeField(auto_now_add=True)\n\n# shell\nbook = Book.objects.create(title='Django Book')\nbook.created_at = timezone.now() + timedelta(days=1)\nbook.save()\nprint(Book.objects.get(id=book.id).created_at)\n\n1. what is auto_now_add\n2. what is the value of created_at finally\\\"","a":"⚠️ Common Interview Trap:\n\nMany people (even experienced devs) assume:\n\n    \\\"auto_now_add=True means the field can't be changed later.\\\"\n\n✅ That's wrong. It only prevents Django from auto-updating it — but doesn't stop you from assigning a new value and saving.\n\n⏱️ Final value of created_at will be tomorrow’s date (i.e., timezone.now() + timedelta(days=1)).\n\n==>>> if you want a DateTimeField to auto-update every time the object is saved, you use:\n\n✅ auto_now=True\n\nfrom django.db import models\n\nclass Book(models.Model):\n    title = models.CharField(max_length=100)\n    updated_at = models.DateTimeField(auto_now=True)  # Auto-updates on every save","source":"","cross":[]},{"q":"Inheritance","a":"Inheritance allows a class (child) to inherit attributes and methods from another class (parent).\n\nclass Animal:\n    def speak(self):\n        return \\\"Some sound\\\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \\\"Bark\\\"\n\ndog = Dog()\nprint(dog.speak())  # Output: Bark","source":"","cross":[]},{"q":"What happens if the Dog class does not override speak()?","a":"If the Dog class does not override the speak() method, it will inherit the method from its parent class (Animal) and execute that version instead.\n\nclass Animal:\n    def speak(self):\n        return \\\"Some sound\\\"\n\nclass Dog(Animal):\n    pass  # No override\n\ndog = Dog()\nprint(dog.speak())  # Output: \\\"Some sound\\\"\n\n🔍 Explanation:\n\n    Python uses the Method Resolution Order (MRO).\n\n    When you call dog.speak(), Python looks for speak() in the Dog class.\n\n    If not found, it goes up to the parent class (Animal) and uses that implementation.","source":"","cross":[]},{"q":"Can a child class override a method and still call the parent’s version?","a":"Yes, a child class can override a method and still call the parent’s version — and this is a very common pattern in Python. It means:\n\nThe child class can redefine a method, but within that new definition, it can also invoke the original method from the parent class using super().\n\nIf you override a method in a child class, you are replacing the parent version. However, you can still use the parent’s logic by explicitly calling it with super().\n\nclass Animal:\n    def speak(self):\n        print(\\\"Animal speaks\\\")\n\nclass Dog(Animal):\n    def speak(self):\n        super().speak()  # calling parent method\n        print(\\\"Dog barks\\\")\n\nd = Dog()\nd.speak()\n\nOutput:\nAnimal speaks\nDog barks","source":"","cross":[]},{"q":"If multiple parent classes define speak(), which one is called in case of multiple inheritance?","a":"Python follows C3 linearization for MRO.","source":"","cross":[]},{"q":"What happens if the parent method uses raise NotImplementedError() and the child doesn't override it?","a":"A runtime error occurs if the child tries to call it without overriding.","source":"","cross":[]},{"q":"Can a class inherit from multiple classes in Python?","a":"Yes, Python supports multiple inheritance, which means a class can inherit from more than one parent class.\n\nclass A:\n    def greet(self):\n        return \\\"Hello from A\\\"\n\nclass B:\n    def greet(self):\n        return \\\"Hello from B\\\"\n\nclass C(A, B):\n    pass\n\nobj = C()\nprint(obj.greet())  # Output: \\\"Hello from A\\\"\n\n🔍 Explanation:\n\n    Class C inherits from both A and B.\n\n    Since A comes first in the inheritance list, C uses the greet() method from A.\n\n    This is decided by the Method Resolution Order (MRO).","source":"","cross":[]},{"q":"What is the Method Resolution Order (MRO)?","a":"It defines the order in which base classes are searched when executing a method. Python uses the C3 linearization algorithm to determine this order.","source":"","cross":[]},{"q":"What happens if both parent classes have the same method?","a":"Python follows MRO to determine which method to use — the method from the first base class in the inheritance list is used.","source":"","cross":[]},{"q":"Can MRO be checked in code?","a":"Yes, using ClassName.__mro__ or ClassName.mro().\n\nprint(C.__mro__)  # (<class '__main__.C'>, <class '__main__.A'>, <class '__main__.B'>, <class 'object'>)","source":"","cross":[]},{"q":"Can multiple inheritance lead to ambiguity?","a":"Yes, especially when multiple parent classes define the same method. This is known as the diamond problem, but Python handles it via C3 MRO.","source":"","cross":[]},{"q":"What is super() used for?","a":"✅ Purpose of super():\n\n    Access a method in the base class without explicitly naming it.\n\n    Useful in multiple inheritance to ensure the correct method resolution order (MRO).\n\n    Helps avoid directly referencing the parent class, making code more maintainable.\n\nclass Animal:\n    def speak(self):\n        return \\\"Animal speaks\\\"\n\nclass Dog(Animal):\n    def speak(self):\n        base_speech = super().speak()\n        return base_speech + \\\" and Dog barks\\\"\n\nd = Dog()\nprint(d.speak())\n\n🔍 Explanation:\n\n    super().speak() calls the speak() method from the parent class Animal.\n\n    You can extend or enhance the behavior instead of completely overriding it.","source":"","cross":[]},{"q":"What is the difference between super() and ParentClass.method(self)?","a":"super() is dynamic and respects MRO in multiple inheritance.\n\nParentClass.method(self) is static and can break if the class hierarchy changes.","source":"","cross":[]},{"q":"Can you use super() in __init__?","a":"Yes! It’s common in constructors when initializing base class attributes.\n\nclass Animal:\n    def __init__(self, name):\n        self.name = name\n\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        super().__init__(name)\n        self.breed = breed","source":"","cross":[]},{"q":"What will happen if we don’t use super()?","a":"The base class method won’t be called automatically.\n\nIf required logic is in the base method (like initialization), it may break the class behavior.","source":"","cross":[]},{"q":"Polymorphism ? How does Python achieve polymorphism without interfaces?","a":"Polymorphism means \\\"many forms\\\" — in OOP, it allows different classes to have methods with the same name, and we can call those methods without knowing the class.\n\n👉 Example: Dog.speak() and Cat.speak() do different things, but both can be called with .speak().\n\nclass Dog:\n    def speak(self):\n        return \\\"Woof!\\\"\n\nclass Cat:\n    def speak(self):\n        return \\\"Meow!\\\"\n\ndef animal_talk(animal):\n    return animal.speak()\n\nprint(animal_talk(Dog()))  # Woof!\nprint(animal_talk(Cat()))  # Meow!\n\n✔ Dog and Cat are not related — no inheritance, no common interface\n✔ They both just happen to have a .speak() method\n✔ The function animal_talk() doesn’t care what kind of object it receives — just that it can .speak()\n\n🔶 Key Term: Duck Typing\n\nPython’s philosophy:\n“Don't check the type of the object, check for behavior.”\nSo, no need for explicit interface declarations like in Java/C++.\n\n🧠 Summary for Your Interview\n\n    Python does not need interfaces to support polymorphism.\n\n    It uses dynamic typing and duck typing.\n\n    Objects must just have the method you're calling.\n\n    You can use abc to enforce interface-like behavior if needed.","source":"","cross":[]},{"q":"Q1: What if the method doesn’t exist?","a":"It raises AttributeError at runtime","source":"","cross":[]},{"q":"Q2: How can you check if it exists before calling?","a":"Use hasattr(obj, 'method')","source":"","cross":[]},{"q":"Q3: Can Python enforce a common interface?","a":"Yes, using the abc module\n\nfrom abc import ABC, abstractmethod\n\nclass Animal(ABC):\n    @abstractmethod\n    def speak(self):\n        pass\n\nclass Dog(Animal):\n    def speak(self):\n        return \\\"Woof!\\\"\n\n    If a subclass doesn’t implement .speak(), it raises a TypeError.\n    This helps enforce method definitions, like interfaces in Java.","source":"","cross":[]},{"q":"What's the difference between overloading and overriding?","a":"🧪 1. Method Overriding (✅ Python supports this)\n\nThis happens in inheritance, when the child class redefines a method from the parent.\n\nclass Animal:\n    def speak(self):\n        return \\\"Animal speaks\\\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \\\"Woof!\\\"  # Overrides parent method\n\nprint(Animal().speak())  # Animal speaks\nprint(Dog().speak())     # Woof!\n\n🚫 2. Method Overloading (❌ Python does not truly support this)\n\nPython doesn’t allow multiple methods with the same name but different arguments like Java/C++.\n\nSo we simulate overloading using default parameters or *args, **kwargs.\n\nclass Calculator:\n    def add(self, a, b=0, c=0):  # Simulated overloading\n        return a + b + c\n\ncalc = Calculator()\nprint(calc.add(5))        # 5\nprint(calc.add(5, 3))     # 8\nprint(calc.add(5, 3, 2))  # 10","source":"","cross":[]},{"q":"Q: Does Python support function overloading?","a":"Not directly. Python keeps only the last defined method with the same name.\n\n🔄 Quick Code to Show Python Can't Do True Overloading\n\nclass Demo:\n    def greet(self, name):\n        print(\\\"Hello\\\", name)\n\n    def greet(self):  # This will override the above\n        print(\\\"Hello!\\\")\n\nd = Demo()\nd.greet(\\\"Alice\\\")  # ❌ TypeError: greet() takes 1 positional argument but 2 were given\n\n✅ Only the last definition is kept — so the earlier one is overwritten.","source":"","cross":[]},{"q":"Q: Then how do you achieve overloading in Python?","a":"Use default values, *args, or **kwargs to handle variable arguments.","source":"","cross":[]},{"q":"Q: Why override a method in child class?","a":"To customize or extend behavior for the child class while keeping the same interface.","source":"","cross":[]},{"q":"Q: Can you call the parent’s method after overriding it?","a":"Yes, using super().method_name() inside the child class.","source":"","cross":[]},{"q":"Can you give an example of polymorphism using inheritance?","a":"Polymorphism allows objects of different classes to be treated as objects of a common superclass, typically by calling the same method that behaves differently based on the object's actual class.\n\n🔧 Example: Polymorphism with Inheritance\n\nclass Animal:\n    def speak(self):\n        return \\\"Animal speaks\\\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \\\"Woof!\\\"\n\nclass Cat(Animal):\n    def speak(self):\n        return \\\"Meow!\\\"\n\n# Function that takes any Animal and calls speak\ndef animal_sound(animal):\n    print(animal.speak())\n\n# Polymorphism in action\nanimals = [Dog(), Cat(), Animal()]\n\nfor a in animals:\n    animal_sound(a)\n\n🔍 Explanation:\n\n    All classes (Dog, Cat, Animal) have a speak() method.\n\n    The function animal_sound treats them all as Animal types.\n\n    At runtime, Python uses dynamic dispatch to call the correct speak() method depending on the actual object — this is polymorphism.","source":"","cross":[]},{"q":"Q: What enables polymorphism in this example?","a":"Inheritance + method overriding.","source":"","cross":[]},{"q":"Q: Can Python do polymorphism without inheritance?","a":"Yes — duck typing supports it.","source":"","cross":[]},{"q":"Q: What is duck typing?","a":"“If it looks like a duck and quacks like a duck, it’s a duck” — Python doesn’t require inheritance, only method presence.","source":"","cross":[]},{"q":"Q: Can you give a duck typing polymorphism example?","a":"class Duck:\n    def speak(self):\n        return \\\"Quack!\\\"\n\nclass Human:\n    def speak(self):\n        return \\\"Hello!\\\"\n\ndef make_it_speak(obj):\n    print(obj.speak())\n\nmake_it_speak(Duck())   # Quack!\nmake_it_speak(Human())  # Hello!","source":"","cross":[]},{"q":"Encapsulation","a":"","source":"","cross":[]},{"q":"What is the difference between public, private, and protected attributes in Python?","a":"✅ 1. Public Attributes\n\n    Definition: Accessible from anywhere (inside or outside the class).\n    Convention: No leading underscores.\n\nclass Person:\n    def __init__(self):\n        self.name = \\\"John\\\"  # public attribute\n\np = Person()\nprint(p.name)  # ✅ accessible\n\n\n🔐 2. Protected Attributes\n\n    Definition: Meant to be accessed only within the class or subclasses.\n    Convention: Prefix with one underscore _.\n    Not enforced – just a hint to developers.\n\nclass Person:\n    def __init__(self):\n        self._age = 30  # protected attribute\n\nclass Employee(Person):\n    def get_age(self):\n        return self._age  # ✅ allowed in subclass\n\np = Person()\nprint(p._age)  # ⚠️ Technically allowed, but discouraged\n\n🔒 3. Private Attributes\n\n    Definition: Intended to be used only within the defining class.\n    Convention: Prefix with two underscores __.\n    Python does name mangling to avoid accidental access.\n\nclass Person:\n    def __init__(self):\n        self.__salary = 50000  # private attribute\n\n    def get_salary(self):\n        return self.__salary\n\np = Person()\nprint(p.get_salary())     # ✅ allowed\nprint(p.__salary)         # ❌ AttributeError\nprint(p._Person__salary)  # ✅ possible due to name mangling (not recommended)","source":"","cross":[]},{"q":"How does name mangling work (_ClassName__attribute)?","a":"🧠 What is Name Mangling in Python?\n\nName mangling is a mechanism Python uses to prevent accidental access or modification of private attributes (those starting with double underscores __).\n\nIt does this by renaming the variable internally using the pattern:\n\n_ClassName__attribute\n\n🔍 Why is it used?\n\n    To avoid name collisions in subclasses.\n    It makes attributes \\\"pseudo-private\\\" (not truly private, but harder to access externally).\n\n✅ Example: Name Mangling in Action\n\nclass Car:\n    def __init__(self):\n        self.__engine = \\\"V8\\\"     # private attribute\n\n    def get_engine(self):\n        return self.__engine\n\ncar = Car()\nprint(car.get_engine())         # ✅ V8\nprint(car.__engine)             # ❌ AttributeError\nprint(car._Car__engine)         # ✅ V8 — name mangling\n\n⚙️ What Actually Happens?\n\nInternally, Python changes __engine to _Car__engine:\n\n>>> dir(car)\n['_Car__engine', '__class__', '__delattr__', ...]\n\nSo if you access car._Car__engine, it works — but it’s not recommended for regular use.","source":"","cross":[]},{"q":"Can private attributes be accessed outside the class?","a":"Yes — but not directly. In Python, private attributes (those prefixed with __) are not truly private — they are name-mangled to discourage access, but you can still access them from outside the class using a specific syntax.\n\n🔐 By Default: No Direct Access\n\nclass Person:\n    def __init__(self):\n        self.__salary = 50000\n\np = Person()\nprint(p.__salary)  # ❌ AttributeError: 'Person' object has no attribute '__salary'\n\n✅ But: Accessible via Name Mangling\n\nprint(p._Person__salary)  # ✅ 50000\n\nPython internally changes __salary → _Person__salary\nSo it’s technically accessible, but discouraged\n\n✅ When Is This Useful?\n\n    Avoiding accidental variable collisions in subclasses\n    Debugging or testing (carefully)\n    Frameworks or decorators that inspect class internals\n\n🚫 Why Not Use It Regularly?\n\n    Breaks encapsulation\n    Your code becomes harder to maintain\n    It's against Python's design philosophy: \\\"We are all consenting adults here.\\\"","source":"","cross":[]},{"q":"Abstraction","a":"","source":"","cross":[]},{"q":"What happens if you instantiate an abstract class?","a":"If you try to instantiate an abstract class in Python (i.e., a class that contains abstract methods and is defined using the abc module), you will get a TypeError.\n\n🧠 What is an Abstract Class?\n\n    An abstract class cannot be instantiated.\n    It is used as a blueprint for other classes.\n    It contains abstract methods — methods with no implementation — that must be implemented in subclasses.\n\n✅ How to Define One\n\nfrom abc import ABC, abstractmethod\n\nclass Animal(ABC):\n    @abstractmethod\n    def make_sound(self):\n        pass\n\n❌ What Happens If You Instantiate It?\n\na = Animal()\n\n❗Error:\n\nTypeError: Can't instantiate abstract class Animal with abstract method make_sound\n\n✅ Correct Usage: Inherit and Implement\n\nclass Dog(Animal):\n    def make_sound(self):\n        return \\\"Woof!\\\"\n\nd = Dog()  # ✅ Works\nprint(d.make_sound())  # Output: Woof!","source":"","cross":[]},{"q":"What’s the difference between abstraction and encapsulation?","a":"🔍 1. What is Abstraction?\n\nAbstraction means hiding implementation details and showing only the essential features to the user.\n\n    Think: “What the object does, not how it does it.”\n\n✅ Real-life example:\n\nYou drive a car by turning the steering wheel and pressing pedals — you don’t need to know how the engine works.\n\n✅ Code example:\n\nfrom abc import ABC, abstractmethod\n\nclass PaymentGateway(ABC):\n    @abstractmethod\n    def pay(self, amount):\n        pass\n\nclass StripePayment(PaymentGateway):\n    def pay(self, amount):\n        print(f\\\"Paid ₹{amount} using Stripe\\\")\n\n🔹 You interact with pay() — not the implementation inside.\n\n🔐 2. What is Encapsulation?\n\nEncapsulation means binding data (attributes) and methods into a single unit (class) and restricting direct access to some of the object's components.\n\n    Think: “Protect the data; control access to it.”\n\n✅ Real-life example:\n\nATM machine encapsulates your PIN — you can't just open the ATM and change it.\n✅ Code example:\n\nclass BankAccount:\n    def __init__(self):\n        self.__balance = 0  # private variable\n\n    def deposit(self, amount):\n        if amount > 0:\n            self.__balance += amount\n\n    def get_balance(self):\n        return self.__balance\n\n🔒 __balance is encapsulated — protected from direct external access.\n\n🧠 Key Differences\nFeature\t                          Abstraction\t                                                     Encapsulation\nDefinition\t                          Hides implementation details\t                     Hides internal state/data from external access\nGoal\t                          Focus on what an object does\t                     Focus on how data is protected\nAchieved by\t                  Abstract classes, interfaces\t                             Private variables, getters/setters\nUsed for\t                          Simplifying design\t                                             Securing object internals\nExample\t                          @abstractmethod, interface with pay()\t             self.__balance with getter/setter\n\n🧾 Combined in Practice\n\nThey usually work together in well-designed OOP:\n\nclass PaymentGateway(ABC):      # Abstraction\n    @abstractmethod\n    def pay(self, amount):\n        pass\n\nclass WalletPayment(PaymentGateway):\n    def __init__(self):\n        self.__balance = 1000   # Encapsulation\n\n    def pay(self, amount):\n        if amount <= self.__balance:\n            self.__balance -= amount\n            print(f\\\"Paid {amount}\\\")\n\n✅ Summary\n\n    🔹 Abstraction = \\\"Expose what to use, hide how it works\\\"\n    🔒 Encapsulation = \\\"Hide data, control access, bundle behavior\\\"","source":"","cross":[]},{"q":"Why use abstract base classes in Python?","a":"Using abstract base classes (ABCs) in Python provides a powerful way to enforce structure, define contracts, and promote clean, consistent design—especially in large or complex systems.\n\n✅ Why Use Abstract Base Classes?\n\n1. Enforce a Common Interface\n\n    ABCs ensure that all subclasses implement certain methods.\n    Prevents missing or incorrect method definitions in subclasses.\n\nfrom abc import ABC, abstractmethod\n\nclass PaymentGateway(ABC):\n    @abstractmethod\n    def pay(self, amount):\n        pass\n\n➡️ Any subclass must implement pay() or it will raise a TypeError.\n\n2. Prevent Instantiating Incomplete Classes\n\n    Abstract classes cannot be instantiated if they have any abstract methods.\n\n    Forces the developer to finish the implementation.\n\npg = PaymentGateway()  # ❌ TypeError: Can't instantiate abstract class\n\n3. Promote Code Reusability + Partial Implementation\n\n    ABCs can have both abstract and concrete (shared) methods.\n\nclass BaseLogger(ABC):\n    @abstractmethod\n    def log(self, message): pass\n\n    def format_message(self, msg):\n        return f\\\"[LOG] {msg}\\\"\n\nSubclasses only need to implement the abstract part; they can reuse the rest.\n\n4. Plug-in or Strategy Patterns\n\n    Use ABCs to define interchangeable components in a modular system.\n\nclass AuthStrategy(ABC):\n    @abstractmethod\n    def authenticate(self, user, pwd): pass\n\nclass GoogleAuth(AuthStrategy):\n    def authenticate(self, user, pwd):\n        return \\\"Google token\\\"\n\nclass PasswordAuth(AuthStrategy):\n    def authenticate(self, user, pwd):\n        return \\\"Password verified\\\"","source":"","cross":[]},{"q":"How do you implement an interface in Python?","a":"In Python, interfaces are not enforced as strictly as in some languages like Java or C#. However, Python achieves the same goals (enforcing method signatures or contracts) using:\n\n✅ 1. Abstract Base Classes (ABCs) — the most common way to define interfaces\n\nPython’s abc module allows you to create abstract classes that require derived classes to implement specific methods.\n\n🔧 Example:\n\nfrom abc import ABC, abstractmethod\n\nclass Animal(ABC):\n    @abstractmethod\n    def speak(self):\n        pass\n\nclass Dog(Animal):\n    def speak(self):\n        return \\\"Woof\\\"\n\n✅ 2. Duck Typing (Pythonic way)\n\nPython embraces duck typing — \\\"If it quacks like a duck...\\\"\nYou don’t need to explicitly define an interface — you just implement the required methods.\n\nclass Duck:\n    def quack(self):\n        print(\\\"Quack!\\\")\n\nclass Person:\n    def quack(self):\n        print(\\\"I can imitate a duck!\\\")\n\ndef make_it_quack(thing):\n    thing.quack()\n\nmake_it_quack(Duck())    # Quack!\nmake_it_quack(Person())  # I can imitate a duck!\n\n✅ 3. Protocols (from typing module, Python 3.8+)\n\nUseful for type hints, static checking (with mypy) — similar to interfaces.\n\nfrom typing import Protocol\n\nclass Flyer(Protocol):\n    def fly(self) -> None:\n        ...\n\nclass Bird:\n    def fly(self) -> None:\n        print(\\\"Bird is flying!\\\")\n\ndef make_fly(f: Flyer):\n    f.fly()\n\nmake_fly(Bird())  # ✅ OK\n\n💬 Common Interview Cross-Questions\n\n    Q: What happens if a child class doesn't implement all abstract methods?\n\n        A: It remains abstract and cannot be instantiated.\n\n    Q: Why use ABCs instead of duck typing?\n\n        A: ABCs help enforce method existence and reduce bugs in large teams or codebases.\n\n    Q: Can interfaces have implemented methods in Python?\n\n        A: Yes, abstract base classes can have both abstract and concrete methods.","source":"","cross":[]},{"q":"difference between abstract class vs interface","a":"","source":"","cross":[]},{"q":"given a class how to make it immutable","a":"","source":"","cross":[]}]},"DSA & SQL":{"color":"#2196F3","icon":"💡","questions":[{"q":"find the 3rd largest number in an unsorted array","a":"def findThirdLargest(arr):\n    first = second = third = float('-inf')\n    for num in arr:\n        if num > first:\n            third = second\n            second = first\n            first = num\n        elif num > second and num!= first:\n            third = second\n            second = num\n        elif num > third and num!=second and num!=first:\n            third = num\n    \n    return third\n\n\narr = [5,2,8,7,10,12,9]\n    \nres = findThirdLargest(arr)\nprint(res)","source":"","cross":[]},{"q":"Length of the longest substring without repeating characters.\n\n🎯 Python Optimal Solution (Sliding Window + Set)","a":"def findLongSubstring(S):\n    char_set = set()\n    left = 0\n    max_length = 0\n    \n    for right in range(len(S)):\n        while S[right] in char_set:\n            char_set.remove(S[right])\n            left+=1\n        char_set.add(S[right])\n        # right - left + 1 - this indicate curr window size\n        # for 1st elem a , right = 0 left = 0\n        # right - left + 1 = 1 (curr win len at a is 1)\n        max_length = max(max_length, right - left + 1)\n    return max_length\n\nS = \\\"abcabcbb\\\"\n    \nres = findLongSubstring(S)","source":"","cross":[]},{"q":"Fetch the string with latest timestamp from the list of strings?\n\ninput = [\\\"log_20240314.logs\\\",\\\"log_20230314.logs\\\",0,\\\"log_20240313.logs\\\"]","a":"def fetch_latest_log(logs):\n    latest_date = None\n    latest_log = None\n\n    for log in logs:\n        if isinstance(log, str):\n            # Split by underscore to separate out the components like \\\"log\\\" and \\\"20240314.logs\\\"\n            parts = log.split('_')\n            for part in parts:\n                # Check if the part is an 8-digit number followed by a possible file extension\n                date = part.split('.')[0]  # This will remove the \\\".logs\\\" extension if present\n                if len(date) == 8 and date.isdigit():\n                    if latest_date is None or date > latest_date:\n                        latest_date = date\n                        latest_log = log\n\n    return latest_log\n\n# Example\ninput_logs = [\\\"log_20240314.logs\\\", \\\"log_20230314.logs\\\", 0, \\\"log_20240313.logs\\\"]\nprint(fetch_latest_log(input_logs))","source":"","cross":[]},{"q":"239. Sliding Window Maximum\nhttps://leetcode.com/problems/sliding-window-maximum/description/","a":"","source":"","cross":[]},{"q":"225. Implement Stack using Queues","a":"class MyStack:\n\n    def __init__(self):\n        self.stack = []\n        \n    def push(self, x: int) -> None:\n        self.stack.append(x)\n        \n    def pop(self) -> int:\n        return self.stack.pop()\n        \n    def top(self) -> int:\n        self.stack[len(self.stack)-1]\n\n    def empty(self) -> bool:\n        return self.stack == []\n\n#Input: [\\\"MyStack\\\",\\\"push\\\",\\\"push\\\",\\\"top\\\",\\\"pop\\\",\\\"empty\\\"] = [[],[1],[2],[],[],[]]\n# Your MyStack object will be instantiated and called as such:\n\nobj = MyStack()\nobj.push(10)\nobj.push(11)\nparam_2 = obj.pop()\nparam_3 = obj.top()\nparam_4 = obj.empty()","source":"","cross":[]},{"q":"394. Decode String","a":"def decodeString(S):\n    stack = []\n    current_str = ''\n    num = 0\n\n    for ch in S:\n        if ch.isdigit():\n            num = num * 10 + int(ch) #for multi digit like 12,32\n        elif ch == '[':\n            stack.append((current_str, num))\n            current_str = ''\n            num = 0\n        elif ch == ']':\n            prev_str, repeat = stack.pop()\n            print(f'data: prev_str:{prev_str} current_str: {current_str} repeat:{repeat} ')\n            current_str = prev_str + current_str * repeat\n        else:\n            current_str += ch\n\n    return current_str\n\nstr_ = \\\"3[a]2[bc]\\\"\n# str_ = \\\"3[a2[c]]\\\" #accaccacc\nres = decodeString(str_)\nprint(f\\\"final output is: {res}\\\")","source":"","cross":[]},{"q":"prime no 1 to 100 with optimization.","a":"for num in range(2, 101):  # start from 2 (1 is not prime)\n    is_prime = True\n    for i in range(2, int(num**0.5) + 1):  # check till sqrt(num)\n        if num % i == 0:\n            is_prime = False\n            break\n    if is_prime:\n        print(num, end=\\\" \\\")\n\nn**0.5 - If we are checking for 37 the lopp starts from 2-6 (these are factor of 37 byond 6 , 7*7 > 36)","source":"","cross":[]},{"q":"20. Valid Parentheses","a":"def isValid(s):\n        stack = []\n        for ch in s:\n            if ch == '[' or ch == '(' or ch == '{':\n                stack.append(ch)\n            else:\n                if stack and ch == ']' and stack[-1] == '[':\n                    stack.pop()\n                elif stack and ch == ')' and stack[-1] == '(':\n                    stack.pop()\n                elif stack and ch == '}' and stack[-1] == '{':\n                    stack.pop()\n                else:\n                    return False\n\n        if len(stack) > 0:\n            return False\n        return True","source":"","cross":[]},{"q":"Find duplicate in string.","a":"def find_duplicates(s):\n    char_count = {}\n    duplicates = set()\n\n    for char in s:\n        if char in char_count:\n            char_count[char] += 1\n        else:\n            char_count[char] = 1\n\n    for char, count in char_count.items():\n        if count > 1:\n            duplicates.add(char)\n\n    return duplicates\n\n# Example usage\ninput_str = \\\"programming\\\"\nprint(find_duplicates(input_str))\n\noutput: {'r', 'g', 'm'}\n\nInput: \\\"programming\\\"","source":"","cross":[]},{"q":"Palindrome","a":"def is_palindrome(s):\n    # Remove spaces and convert to lowercase for case-insensitive check\n    s = s.replace(\\\" \\\", \\\"\\\").lower()\n    return s == s[::-1]\n\n# Example usage\nprint(is_palindrome(\\\"madam\\\"))        # True\nprint(is_palindrome(\\\"racecar\\\"))      # True\nprint(is_palindrome(\\\"hello\\\"))        # False\nprint(is_palindrome(\\\"A man a plan a canal Panama\\\"))  # True\n\n----------------------\n\ndef is_palindrome_no_slice(s):\n    s = s.replace(\\\" \\\", \\\"\\\").lower()  # normalize input\n    left, right = 0, len(s) - 1\n    \n    while left < right:\n        if s[left] != s[right]:\n            return False\n        left += 1\n        right -= 1\n    return True\n\n# Example usage\nprint(is_palindrome_no_slice(\\\"madam\\\"))        # True\nprint(is_palindrome_no_slice(\\\"nurses run\\\"))   # True\nprint(is_palindrome_no_slice(\\\"hello\\\"))        # False","source":"","cross":[]},{"q":"Reverse the string","a":"def reverse_string(s):\n    reversed_str = \\\"\\\"\n    for char in s:\n        reversed_str = char + reversed_str  # prepend current char\n    return reversed_str\n\n# Example\nprint(reverse_string(\\\"hello\\\"))  # output: \\\"olleh\\\"\n\n--------------\n\ndef reverse_string(s):\n    return ''.join(reversed(s))\n\nprint(reverse_string(\\\"world\\\"))  # output: \\\"dlrow\\\"\n\n--------\n\ndef reverse_string(s):\n    reversed_str = \\\"\\\"\n    i = len(s) - 1\n    while i >= 0:\n        reversed_str += s[i]\n        i -= 1\n    return reversed_str\n\nprint(reverse_string(\\\"python\\\"))  # output: \\\"nohtyp\\\"","source":"","cross":[]},{"q":"Anagram","a":"def are_anagrams(s1, s2):\n    return sorted(s1) == sorted(s2)\n\nprint(are_anagrams(\\\"listen\\\", \\\"silent\\\"))  # True\nprint(are_anagrams(\\\"hello\\\", \\\"world\\\"))    # False","source":"","cross":[]},{"q":"Find the Group of Anagrams","a":"from collections import defaultdict\n\ndef group_anagrams(words):\n    anagram_map = defaultdict(list)\n    \n    for word in words:\n        # Sort each word into a key (e.g., 'eilnst' for 'listen')\n        key = ''.join(sorted(word))\n        anagram_map[key].append(word)\n    \n    return list(anagram_map.values())\n\nwords = [\\\"listen\\\", \\\"silent\\\", \\\"enlist\\\", \\\"rat\\\", \\\"tar\\\", \\\"art\\\", \\\"evil\\\", \\\"vile\\\", \\\"live\\\"]\nprint(group_anagrams(words))\n\nOutput-:\n[\n  [\\\"listen\\\", \\\"silent\\\", \\\"enlist\\\"],\n  [\\\"rat\\\", \\\"tar\\\", \\\"art\\\"],\n  [\\\"evil\\\", \\\"vile\\\", \\\"live\\\"]\n]","source":"","cross":[]},{"q":"Reverse the Array","a":"arr = [1, 2, 3, 4, 5]\n\nleft = 0\nright = len(arr) - 1\n\nwhile left < right:\n    # swap elements\n    arr[left], arr[right] = arr[right], arr[left]\n    left += 1\n    right -= 1\n\nprint(arr)  # Output: [5, 4, 3, 2, 1]","source":"","cross":[]},{"q":"Two sum","a":"def two_sum(arr, target):\n    seen = {}\n    for i, num in enumerate(arr):\n        complement = target - num\n        if complement in seen:\n            return seen[complement], i\n        seen[num] = i\n        \n    return []\n\narr = [2, 7, 11, 15]\ntarget = 9\n    \nres = two_sum(arr, target)\nprint(res)","source":"","cross":[]},{"q":"Three Sum","a":"def three_sum(nums):\n    nums.sort()\n    res = []\n    \n    for i in range(len(nums)):\n        left, right = i+1 , len(nums)-1\n        while left < right:\n            total = nums[i] + nums[left] + nums[right]\n            \n            if total == 0:\n                res.append([nums[i], nums[left] , nums[right]])\n                \n                # Skip duplicates\n                while left < right and nums[left] == nums[left + 1]:\n                    left += 1\n                while left < right and nums[right] == nums[right - 1]:\n                    right -= 1\n                    \n                left+=1\n                right-=1\n            elif total < 0:\n                left+=1\n            else:\n                right-=1\n    return res\n                \n        \n        \nnums = [-1, 0, 1, 2, -1, -4]\nprint(three_sum(nums))","source":"","cross":[]},{"q":"Water trapping","a":"","source":"","cross":[]},{"q":"Sorting","a":"","source":"","cross":[]},{"q":"Binary Search","a":"","source":"","cross":[]},{"q":"convert one,two,twenty three. eleven to numeric.","a":"","source":"","cross":[]},{"q":"Return index of first non duplicate element of array.","a":"from collections import defaultdict\n\ndef first_non_duplicate_index(nums):\n    count = defaultdict(int)\n    \n    for num in nums:\n        count[num]+=1\n        \n        \n    for i,num in enumerate(nums):\n        if count[num] == 1:\n            return i\n    return -1\n\n\ndata = [1, 2, 2, 3, 1, 4]\nres = first_non_duplicate_index(data)\nprint(res)","source":"","cross":[]},{"q":"Find the peak element in the given array","a":"⚡ Optimal Approach: Binary Search (O(log n))\n\ndef find_peak(nums):\n    left, right = 0, len(nums) - 1\n    while left < right:\n        mid = (left + right)//2\n        \n        if nums[mid] < nums[mid + 1]:\n            left += 1\n        else:\n            right-=1\n    return left\n\n\ndata = [1, 2, 2, 3, 1, 4]\nres = find_peak(data)\nprint(res)","source":"","cross":[]},{"q":"Design a Circular Linked List","a":"","source":"","cross":[]},{"q":"given a string convert all vowels to '_' in the string.","a":"def replace_vowels_with_underscore(s):\n    vowels = 'aeiouAEIOU'\n    return ''.join('_' if ch in vowels else ch for ch in s)\n\ninput_str = \\\"Hello World\\\"\noutput = replace_vowels_with_underscore(input_str)\nprint(output)   # H_ll_ W_rl_","source":"","cross":[]},{"q":"Rotate the array by 3 positions","a":"","source":"","cross":[]},{"q":"Deep Copy and Shallow Copy program output.","a":"","source":"","cross":[]},{"q":"Merge 2 sorted arrays.","a":"","source":"","cross":[]},{"q":"given a string find out char with highest frequency","a":"","source":"","cross":[]},{"q":"Find the second largest number in the array","a":"def second_largest(nums):\n    if len(nums) < 2:\n        return None  # No second largest if fewer than 2 elements\n\n    first = second = float('-inf')\n\n    for num in nums:\n        if num > first:\n            second = first\n            first = num\n        elif first > num > second:\n            second = num\n\n    return second if second != float('-inf') else None\n\nprint(second_largest([3, 5, 1, 2, 4]))      # Output: 4","source":"","cross":[]},{"q":"sort the array of zeroes, ones and twos, Time complexity : O(n), space complexity : O(1)","a":"def sortArray(arr):\n    n = len(arr)\n    low = 0\n    high = n-1\n    mid = 0\n\n    while mid <= high:\n        if arr[mid] == 0:\n            arr[low], arr[mid] = arr[mid], arr[low]\n            low = low + 1\n            mid = mid + 1\n        elif arr[mid] == 1:\n            mid = mid + 1\n        else:\n            arr[mid], arr[high] = arr[high], arr[mid]\n            high = high - 1\n    return arr\n\n\narr = [0, 1, 2, 0, 1, 2]\nres = sortArray(arr)\nprint(res)","source":"","cross":[]},{"q":"count the frequency of array elements, range of array element can be 0 to n - 1, Time complexity : O(n), space complexity : O(1)","a":"def count_frequency(arr):\n    n = len(arr)\n\n    # Step 1: Increase counts using modulo arithmetic\n    for i in range(n):\n        index = arr[i] % n\n        arr[index] += n\n        print(arr)\n    # Step 2: Extract frequencies\n    for i in range(n):\n        print(f\\\"Element {i} occurs {arr[i] // n} times\\\")\n        \narr = [2, 3, 3, 2, 1]\ncount_frequency(arr)\n\n🚨 Important Notes\n\n    This works only if all values are in range [0, n-1].\n    You can reset the array back by doing: arr[i] = arr[i] % n.","source":"","cross":[]},{"q":"Check String Palindrome, finding all the palindrome strings using DP.","a":"","source":"","cross":[]},{"q":"Parenthesis check using stack","a":"","source":"","cross":[]},{"q":"find an element in roatated sorted array.","a":"","source":"","cross":[]},{"q":"remove duplicates and print remaining text in order","a":"","source":"","cross":[]},{"q":"sort binary array efficiently","a":"","source":"","cross":[]},{"q":"How many minimum flips required to make alternate entry in binary array","a":"","source":"","cross":[]},{"q":"Make custom Implementation of Linked Hashmap","a":"","source":"","cross":[]},{"q":"Binary Search Tree","a":"","source":"","cross":[]},{"q":"Maximum sum of sub-array.","a":"","source":"","cross":[]},{"q":"Implement Blocking Queue","a":"","source":"","cross":[]},{"q":"Implement LRU Cache","a":"","source":"","cross":[]},{"q":"Design URL shortner application","a":"","source":"","cross":[]},{"q":"Check if string anagrams have one as palindrome string.","a":"","source":"","cross":[]},{"q":"Array sort 1 to 100 elements in O(n) time","a":"","source":"","cross":[]},{"q":"Write own implementation of Linked Hash Map","a":"","source":"","cross":[]},{"q":"morris inorder travesal","a":"","source":"","cross":[]},{"q":"print numbers using even and odd thread","a":"","source":"","cross":[]},{"q":"pattern search (asked for KMP algo)","a":"","source":"","cross":[]},{"q":"hash map internal","a":"","source":"","cross":[]},{"q":"how to find where there is loop in linked list?\nA → B → C → D → E\n          ↑     ↓\n          G ← F\n\nAbove diagram not showing correct - \nNodes: A → B → C → D → E → F → G → C (loop starts at C)","a":"✅ Floyd's Cycle Detection Algorithm\n🔍 Idea:\n\nUse two pointers:\n\n    slow (moves 1 step at a time)\n\n    fast (moves 2 steps at a time)\n\nIf there's a loop, fast will eventually meet slow inside the loop.\n\nclass Node:\n    def __init__(self, value):\n        self.value = value\n        self.next = None\n\ndef has_loop(head):\n    slow = head\n    fast = head\n\n    while fast and fast.next:\n        slow = slow.next          # Move 1 step\n        fast = fast.next.next     # Move 2 steps\n\n        if slow == fast:\n            return True  # Loop detected\n\n    return False  # No loop\n\n# Create linked list: 1 -> 2 -> 3 -> 4 -> 5\nhead = Node(1)\nhead.next = Node(2)\nhead.next.next = Node(3)\nhead.next.next.next = Node(4)\nhead.next.next.next.next = Node(5)\n\n# Create loop: 5 -> 2\nhead.next.next.next.next.next = head.next\n\nprint(has_loop(head))  # Output: True","source":"","cross":[]},{"q":"How to find the starting point of the loop?\nA → B → C → D → E\n          ↑     ↓\n          G ← F\n\nAbove diagram not showing correct - \nNodes: A → B → C → D → E → F → G → C (loop starts at C)","a":"🔁 If You Want to Find the Starting Node of the Loop\n\nAfter detecting the loop:\n    1. Keep one pointer at the meeting point\n    2. Move the other to the head\n    3. Move both one step at a time — they will meet at the start of the loop\n\n🧠 Code:\n\ndef find_loop_start(head):\n    slow = head\n    fast = head\n\n    # Step 1: Detect loop\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow == fast:\n            break\n    else:\n        return None  # No loop\n\n    # Step 2: Find entry point\n    slow = head\n    while slow != fast:\n        slow = slow.next\n        fast = fast.next\n\n    return slow  # Loop start node","source":"","cross":[]},{"q":"Detect loop in a Linked List.\ncond added.\n1->2->3->4->5->3\nhere 5 is not connected to 4 it is connected to 3.\n\nso does slow and fast pointer approach will work here\\\"","a":"","source":"","cross":[]},{"q":"Coding exercise: They took my resume and asked to read the first line from my resume. Next they asked to reverse the words in the line with a restriction that all special characters or no. of spaces between individual words shall maintain same order in the reversed string as well) E.g. : My Name is \\ XYZ $ and I @ am being Interviewed2 Result: Interviewed being am \\ I $ and XYZ @ is Name My2 First problem to be solved with no space or memory constrains, then with each solution memory and space constrains are introduced.","a":"","source":"","cross":[]},{"q":"Given In-order and Pre-order of a tree, construct a BST.","a":"class TreeNode:\n    def __init__(self, val):\n        self.val = val\n        self.left = None\n        self.right = None\n\ndef buildTree(preorder, inorder):\n    if not preorder or not inorder:\n        return None\n\n    # First element in preorder is the root\n    root_val = preorder[0]\n    root = TreeNode(root_val)\n\n    # Find the index of root in inorder\n    idx = inorder.index(root_val)\n\n    # Recursively build left and right subtree\n    root.left = buildTree(preorder[1:idx+1], inorder[:idx])\n    root.right = buildTree(preorder[idx+1:], inorder[idx+1:])\n\n    return root\n\ninorder = ['D', 'B', 'E', 'A', 'F', 'C']\npreorder = ['A', 'B', 'D', 'E', 'C', 'F']\n\nroot = buildTree(preorder, inorder)\n\n# Helper to print inorder of the constructed tree\ndef print_inorder(node):\n    if node:\n        print_inorder(node.left)\n        print(node.val, end=' ')\n        print_inorder(node.right)\n\nprint_inorder(root)","source":"","cross":[]},{"q":"When to use unordered_map and when to use map.","a":"","source":"","cross":[]},{"q":"Difference Between list and Vectors in terms of performance(memory and seek time)","a":"","source":"","cross":[]},{"q":"Find the missing in an array filled with numbers 1 to n and the size of array is one less than the total numbers. For ex, 1,2,4,5. array is given, find the missing number from first n(here n=5) numbers","a":"def find_missing_number(arr, n):\n    total = n * (n + 1) // 2\n    actual_sum = sum(arr)\n    return total - actual_sum\n\n# Example:\narr = [1, 2, 4, 5]\nn = 5  # We expect numbers from 1 to 5\nprint(\\\"Missing number:\\\", find_missing_number(arr, n))","source":"","cross":[]},{"q":"shortest path sum of a binary tree","a":"class TreeNode:\n    def __init__(self, val):\n        self.val = val\n        self.left = None\n        self.right = None\n\ndef min_path_sum(root):\n    if root is None:\n        return float('inf')\n    \n    # If it's a leaf node\n    if not root.left and not root.right:\n        return root.val\n    \n    # Recursive call for left and right child\n    return root.val + min(min_path_sum(root.left), min_path_sum(root.right))","source":"","cross":[]},{"q":"In an n*n matrix, filled with integers, we have to find the minimum number in the shortest time. The matrix is sorted on both column wise and row wise.","a":"✅ Key Observation:\n\nIn a matrix sorted row-wise and column-wise, the smallest element is always at the top-left corner.\n\n💡 Why?\n\nLet’s say matrix[i][j] is the top-left element.\n\n    Since the matrix is row-sorted:\n    matrix[i][j] <= matrix[i][j+1]\n\n    Since the matrix is column-sorted:\n    matrix[i][j] <= matrix[i+1][j]\n\nSo matrix[0][0] is the minimum of the entire matrix.\n\ndef find_min(matrix):\n    return matrix[0][0] if matrix else None\n\nmatrix = [\n    [1, 5, 9],\n    [2, 6, 10],\n    [3, 7, 11]\n]\n\nprint(find_min(matrix))  # Output: 1","source":"","cross":[]},{"q":"finding the lucky number in the matrix","a":"","source":"","cross":[]},{"q":"Inorder, preOrder,postOrder, levelorder of BST","a":"class Tree:\n    def __init__(self, data):\n        self.left = None\n        self.right = None\n        self.data = data\n        \n    def insert(self, data):\n        if self.data:\n            if data < self.data:\n                if self.left is None:\n                    self.left = Tree(data)\n                else:\n                    self.left.insert(data)\n            elif data > self.data:\n                if self.right is None:\n                    self.right = Tree(data)\n                else:\n                    self.right.insert(data)\n            else:\n                self.data = data\n                \n    def inorder(self, root):#LNR\n        res = []\n        if root:\n            res = res + self.inorder(root.left)\n            res.append(root.data)\n            res = res + self.inorder(root.right)\n        return res\n        \n    def preorder(self, root):#NLR\n        res = []\n        if root:\n            res.append(root.data)\n            res = res + self.preorder(root.left)\n            res = res + self.preorder(root.right)\n        return res\n        \n    def postorder(self, root):#LRN\n        res = []\n        if root:\n            res = res + self.postorder(root.left)\n            res = res + self.postorder(root.right)\n            res.append(root.data)\n        return res\n        \n    def levelorder(self, root):\n        from queue import Queue\n        Q = Queue()\n        Q.put(root)\n        while not Q.empty():\n            node = Q.get()\n            if node == None:\n                continue\n            print(node.data)\n            Q.put(node.left)\n            Q.put(node.right)\n        \nroot = Tree(27)\nroot.insert(7)\nroot.insert(11)\nroot.insert(19)\nroot.insert(20)\n# print(root.inorder(root))\n# print(root.preorder(root))\n# print(root.postorder(root))\nprint(root.levelorder(root))","source":"","cross":[]},{"q":"Print the left view of a tree.\n#         1\n#        / \\\n#       2   3\n#      / \\   \\\n#     4   5   6\n#        /\n#       7","a":"class TreeNode:\n    def __init__(self, val=0):\n        self.val = val\n        self.left = None\n        self.right = None\n    \n \ndef left_view(root):\n    #code here - LNR\n \nif __name__ == \\\"__main__\\\":\n    root = TreeNode(1)\n    node2 = TreeNode(2)\n    node3 = TreeNode(3)\n    node4 = TreeNode(4)\n    node5 = TreeNode(5)\n    node6 = TreeNode(6)\n    node7 = TreeNode(7)\n \n    root.left = node2\n    root.right = node3\n    node2.left = node4\n    node2.right = node5\n    node3.right = node6\n    node5.left = node7\n \n    result = left_view(root)\n    print(\\\"Left view of the tree:\\\", result)","source":"","cross":[]},{"q":"76. Minimum Window Substring","a":"","source":"","cross":[]},{"q":"1. Identity vs Equality\n\na = 256\nb = 256\nprint(a is b)\n\na = int(\\\"257\\\")\nb = int(\\\"257\\\")\nprint(a is b)\n\na = 257\nb = 257\nprint(a is b)\n\n\na = 25623\nb = 25623\nprint(a is b)","a":"a = 256 and b=256 return true because compiler know it is int litral and make a single m/m block as both are same value and we call it litral integer\n\na= int(\\\"257\\\") and b = int(\\\"257\\\") when do a is b return false because compile don't know about the int casting what will be the result after casting so it is known at the runtime that's why it is false.","source":"","cross":[]},{"q":"Mutable Default Argument\n\ndef f(x=[]):\n    x.append(1)\n    return x\n\nprint(f())\nprint(f())\nprint(f())","a":"[1]\n[1, 1]\n[1, 1, 1]\n\nDefault args are created once at function definition.","source":"","cross":[]},{"q":"2. += vs +\n\na = [1,2]\nb = a\nb += [3]\nprint(a)\n\na = [1,2]\nb = a\nb = b + [3]\nprint(a)","a":"1. [1, 2, 3]\n2. [1,2]\n\nThis is a core Python concept: the difference between in-place mutation and creating a new object.\n\nFirst case: b += [3]\na = [1,2]\nb = a\nb += [3]\nprint(a)\n\nWhat happens internally?\n\n+= for lists means:\n\nmodify the existing list in place\n\nSo Python calls:\n\na.extend([3])\n\n\nMemory:\n\na ─┐\n   └──> [1,2,3]\nb ─┘\n\n\nBoth point to the same object, so a changes.\n\nOutput:\n\n[1,2,3]\n\nSecond case: b = b + [3]\na = [1,2]\nb = a\nb = b + [3]\nprint(a)\n\nWhat happens internally?\n\n+ means:\n\ncreate a new list\n\nSo Python does:\n\nnew_list = a + [3]\nb = new_list\n\n\nMemory:\n\na ──> [1,2]\nb ──> [1,2,3]\n\n\na still points to old list.\n\nOutput:\n\n[1,2]\n\nThe Core Difference (One Line)\nOperator        Behavior\n+=        Mutates existing object\n+        Creates new object","source":"","cross":[]},{"q":"Tuple with One Element\n\na = (1)\nb = (1,)\nprint(type(a), type(b))","a":"output: <class 'int'> <class 'tuple'>\n\nCase1:\na = (1) this is just a = 1\nParentheses only group expressions. - type(a) → int\n\nCase 2:\nb = (1,)\nThe comma tells Python: This is a tuple with one element. - type(b) → tuple\n\nMore examples:\nx = 1,2,3\ntype(x)   # tuple\nParentheses are optional.\n\nInterview One-Liner - “In Python, tuples are defined by commas, not parentheses.”","source":"","cross":[]},{"q":"nth max salary of an employee? Do not use subquery, Use CTE.","a":"WITH SalaryRanked AS (\n    SELECT \n        salary, \n        DENSE_RANK() OVER (ORDER BY salary DESC) AS salary_rank\n    FROM \n        employee\n)\nSELECT \n    salary\nFROM \n    SalaryRanked\nWHERE \n    salary_rank = N;\n\n🧠 Here, replace N with whichever Nth highest salary you want.\n\n📚 Explanation:\n\n    DENSE_RANK() gives rank without skipping for duplicates.\n\n    CTE (WITH clause) prepares a ranked salary list.\n\n    Then simply select where salary_rank = N.\n\nIf you want not just the salary but the employee details (name, id), you can extend CTE:\n\nWITH SalaryRanked AS (\n    SELECT \n        id,\n        name,\n        salary, \n        DENSE_RANK() OVER (ORDER BY salary DESC) AS salary_rank\n    FROM \n        employee\n)\nSELECT \n    id,\n    name,\n    salary\nFROM \n    SalaryRanked\nWHERE \n    salary_rank = 3;","source":"","cross":[]},{"q":"Delete duplicate rows with duplicate post_title in api_posts but keep the old record with CTE.","a":"WITH cte AS (\n    SELECT \n        id,\n        post_title,\n        ROW_NUMBER() OVER (PARTITION BY post_title ORDER BY id ASC) AS row_num\n    FROM api_posts\n)\nDELETE FROM api_posts\nWHERE id IN (\n    SELECT id\n    FROM cte\n    WHERE row_num > 1\n);\n\nExplanation:\n\nCTE (Common Table Expression):\n\nThe CTE groups the rows by post_title using PARTITION BY post_title.\n\nThe ROW_NUMBER() function assigns a row number to each record in the partition, ordered by id ASC (ascending order). This ensures that the row with the smallest id (the oldest post) gets row_num = 1.\n\nDELETE:\n\nIn the DELETE query, we remove the rows where the row_num is greater than 1, which indicates the duplicate rows. The row with row_num = 1 (the oldest row) will not be deleted.","source":"","cross":[]},{"q":"Mysql Query - LEFT JOIN, RIGHT JOIN, OUTER JOIN, INNER JOIN, GROUPBY, HAVING","a":"","source":"","cross":[]},{"q":"Select top 10 employees which make maximum reservations between a date.","a":"SELECT \n    employee_id,\n    COUNT(*) AS total_reservations\nFROM \n    reservations\nWHERE \n    reservation_date BETWEEN '2024-01-01' AND '2024-12-31'\nGROUP BY \n    employee_id\nORDER BY \n    total_reservations DESC\nLIMIT 10;","source":"","cross":[]},{"q":"Difference between delete and truncate in SQL","a":"","source":"","cross":[]},{"q":"Partitioning in database usecase","a":"","source":"","cross":[]},{"q":"We have table1 & table2 with id column \n1. table1 has 2 rows with id 1\n2. table 2 has 3 rows with id 1\nwhat will be the output after join boyh table.","a":"SELECT * FROM table1 JOIN table2 ON table1.id = table2.id)\n\nGET 6 ROWS","source":"","cross":[]},{"q":"Top 10 winner of cricket tournament, If a person is winner in 1st match but he is not winner in 2nd match but he is again winner in third match.","a":"","source":"","cross":[]},{"q":"Write a SQL to detect nulls, duplicates, or anomalies in a dataset.","a":"✅ 1. Detect NULLs in Key Columns\n\nSELECT *\nFROM customers\nWHERE customer_id IS NULL\n   OR email IS NULL\n   OR first_name IS NULL;\n\n✅ 2. Detect Duplicate Records (Based on Email)\n\nSELECT email, COUNT(*) AS count\nFROM customers\nGROUP BY email\nHAVING COUNT(*) > 1;\n\n✅ 3. Detect Anomalies in Numeric Columns (e.g., Age)\n\n-- Find extreme or negative values in age\nSELECT *\nFROM customers\nWHERE age < 0 OR age > 120;\n\n✅ 4. Detect Outliers Using Standard Deviation (Example: Income)\n\nSELECT *\nFROM (\n    SELECT *, \n           AVG(income) OVER() AS avg_income,\n           STDDEV(income) OVER() AS stddev_income\n    FROM customers\n) sub\nWHERE income > avg_income + 3 * stddev_income\n   OR income < avg_income - 3 * stddev_income;\n\n✅ 5. Detect Unexpected Categorical Values (e.g., Gender)\n\nSELECT DISTINCT gender\nFROM customers\nWHERE gender NOT IN ('Male', 'Female', 'Other');\n\n✅ Bonus: Combine Common DQ Checks\n\nSELECT *,\n       CASE \n           WHEN customer_id IS NULL THEN 'Missing customer_id'\n           WHEN email IS NULL THEN 'Missing email'\n           WHEN age < 0 THEN 'Invalid age'\n           WHEN gender NOT IN ('Male', 'Female', 'Other') THEN 'Invalid gender'\n           ELSE NULL\n       END AS dq_issue\nFROM customers\nWHERE customer_id IS NULL \n   OR email IS NULL \n   OR age < 0 \n   OR gender NOT IN ('Male', 'Female', 'Other');","source":"","cross":[]},{"q":"Write a query to find duplicate rows in a table.","a":"✅ Find Duplicates Based on All Columns\n\nSELECT *, COUNT(*) AS duplicate_count\nFROM orders\nGROUP BY customer_id, order_date, product_id, amount  -- list all relevant columns\nHAVING COUNT(*) > 1;\n\n✅ If You Want to Find and List Only Duplicated Keys\n(e.g., based on customer_id and order_date only)\n\nSELECT customer_id, order_date, COUNT(*) AS count\nFROM orders\nGROUP BY customer_id, order_date\nHAVING COUNT(*) > 1;\n\n✅ Optional: Get Full Duplicate Rows Using a CTE\n\nWITH duplicates AS (\n  SELECT customer_id, order_date\n  FROM orders\n  GROUP BY customer_id, order_date\n  HAVING COUNT(*) > 1\n)\nSELECT o.*\nFROM orders o\nJOIN duplicates d\n  ON o.customer_id = d.customer_id\n AND o.order_date = d.order_date;","source":"","cross":[]},{"q":"Find the Manager name who has maximum employees reported to him/her. table given Emp( empID, EmpName , ManagerID )","a":"","source":"","cross":[]},{"q":"SQL COURSE","a":"","source":"","cross":[]},{"q":"Terminal Login to Postgres","a":"sudo --login --user=postgres\npostgres@lapdeepak-VivoBook-ASUSLaptop-X415JAB-X415JA:~$ psql\npostgres=# \n\nIF Error-:Is the server running locally and accepting connections on that socket?\nexit and type below command\nadmin123@admin123-Latitude-7420:~$ sudo systemctl start postgresql","source":"","cross":[]},{"q":"Postgres Basic commands","a":"1. List all database\nMeta command - \\l\nQuery - select datname from pg_database;\n\n2. create database;\ncreate database my_practice_db;\ncreate database my_practice_db owner newuser;\n\n3. Apply ownership to created db\nalter database my_practice_db owner to newuser;\n\n4. use database\n\\c my_practice_db\nno query exist\n\n5. show tables\n\\dt","source":"","cross":[]},{"q":"Postgres Basic Queries","a":"6. rename database;\nalter database my_practice_db rename to practice_db\n\n7. create table\na. create table tblPerson(id serial primary key, name varchar(30) not null, email varchar(30) not null, GenderID int null);\n        MySQL int(11) auto_increment -> serial - auto_increment integer\n        MySQL int(11) ->  int or integer\nb. create table tblGender (id serial primary key, Gender varchar(30) not null);\n\n8. Insert record\ninsert into tblGender(Gender)values('Male'),('Female');\npractice_db=# insert into tblGender(Gender)values('Unknown');\n\ninsert into tblPerson(name,email,GenderID)values('Deepak', 'deepak@gmail.com', 1),('siyu', 'siyu@gmail.com', NULL);\n\n9.make GenderID foreign key add constraint to the table\npractice_db=# alter table tblPerson add constraint tblPerson_GenderID_FK foreign key (GenderID) references tblGender(id);\n\n10. add default constraint to existing column - default constraint not allowed we can use \n alter table tblPerson alter column GenderID SET default 3;\n\n11. Add new column to exosting table.\nalter table tblPerson add column age int;\n\n12. Update record\nupdate tblperson set age=20 where id=1;\n\n13. Modify Column DataType\nalter table tblEmployee alter column  gender type char(6);\n\n14. TRUNCATE table in POSTGRES And start id from 1 in next insert\npractice_db=# truncate table tblUKCustomer RESTART IDENTITY;\nNOTE: (If not use RESTART IDENTITY it will not start id from in next insert)","source":"","cross":[]},{"q":"Stored procedure","a":"set of commands execute at once.\na. system stored procedure b. user defined stored procedure","source":"","cross":[]},{"q":"what is foreign key constraint and why do we add foreign key constraint.","a":"Used to enforce DB integrity, A foreign key constraint prevent inserting invalid data to foreign key column.","source":"","cross":[]},{"q":"Cascading refrential Integrity","a":"In PostgreSQL, cascading referential integrity constraints are implemented using foreign keys with actions like ON DELETE CASCADE, ON UPDATE CASCADE, etc.\n\nEX:-\ncreate table users(id serial primary key, name varchar(100));\ncreate table posts(id serial primary key, user_id integer, content text, foreign key (user_id) references users(id) on delete cascade on update cascade);\n\ninsert into users(name)values('deepak'),('dinesh'),('ravi');\ninsert into posts(user_id, content)values(1, 'hello text'),(2, 'hello text'),(3, 'hello text'),(3, 'hello wow text');\n\ndelete from users where id=3;\nAbove delete query delete the user with id=3 and all post which has user_id as 3\n\n🔄 Explanation of Options\n\nConstraint                                                  What it does in PostgreSQL\nON DELETE CASCADE                             Deletes all posts when a user is deleted.\nON UPDATE CASCADE                             Updates posts.user_id when users.id changes.\nON DELETE SET NULL                              Sets posts.user_id = NULL when the user is deleted.\nON DELETE SET DEFAULT                       Sets posts.user_id to its default when user is deleted.\nON DELETE RESTRICT                             Prevents delete if posts exist for that user.\nON DELETE NO ACTION                           Same as RESTRICT, enforced after statement completes.","source":"","cross":[]},{"q":"Update Foreign Key Constraint on existing table","a":"Take posts table for this operation - \nCheck foreign key name in posts table - \\d posts\n\n1. DROP key - alter table posts drop constraint posts_user_id_fkey;\n2 Recreate Key - alter table posts add constraint posts_user_id_fkey foreign key (user_id) references users(id) on delete set null on update set null;","source":"","cross":[]},{"q":"CHECK Constraint","a":"A CHECK constraint allows you to enforce custom conditions on column values in a table. It rin on a boolean expression either true or false or UNKNOWN in case of the NULL.\nBoolean expression  - CHECK(age > 0 and age < 150)\n\nalter table tblperson add constraint CK_tblperson_age CHECK(age > 0 and age < 150);\n\nTesting:-\ninsert into tblperson(name,email,genderid,age)values('sara','s@r.com',2,343);\nERROR:  new row for relation \\\"tblperson\\\" violates check constraint \\\"ck_tblperson_age\\\"\nDETAIL:  Failing row contains (4, sara, s@r.com, 2, 343).\n\ninsert into tblperson(name,email,genderid,age)values('sara','s@r.com',2,0);\nERROR:  new row for relation \\\"tblperson\\\" violates check constraint \\\"ck_tblperson_age\\\"\nDETAIL:  Failing row contains (7, sara, s@r.com, 2, 0).\n\ninsert into tblperson(name,email,genderid,age)values('sara','s@r.com',2,NULL); NULL accepted as it is nullable column","source":"","cross":[]},{"q":"IDENTITY COLUMN, And What is SEED and INCREMENT?","a":"","source":"","cross":[]},{"q":"How to get the last generated identity column value","a":"To get the last generated identity column value in PostgreSQL, you have a few options depending on the context of your query:\n\n✅ 1. RETURNING clause (Recommended)\n\nUse this in an INSERT statement to immediately return the generated value:\n\nINSERT INTO users(name) VALUES ('Alice') RETURNING id;\n\n✅ 2. currval() function (for current session)\n\nIf you've just inserted a row in the same session, you can get the last sequence value like this:\n\nSELECT currval(pg_get_serial_sequence('users', 'id'));\n\nIf you're using an identity column backed by a named sequence, you can also do:\n\nSELECT currval('users_id_seq');\n\n✅ 3. For identity columns using GENERATED ... AS IDENTITY\n\nPostgreSQL 10+ uses sequences under the hood for identity columns as well,
