 so currval() still applies.\n\nYou can also find the backing sequence for identity like this:\n\nSELECT column_name, column_default\nFROM information_schema.columns\nWHERE table_name = 'users';\n\nExample\n\n-- Table with identity column\nCREATE TABLE users (\n  id INT GENERATED ALWAYS AS IDENTITY,\n  name TEXT\n);\n\n-- Insert and return id\nINSERT INTO users(name) VALUES ('Bob') RETURNING id;\n\n-- Or if already inserted, get it\nSELECT currval(pg_get_serial_sequence('users', 'id'));\n\n✅ PostgreSQL Example\n\n-- Insert and return identity\nINSERT INTO users(name) VALUES ('Deepak') RETURNING id;\n\n-- OR after insert\nSELECT currval(pg_get_serial_sequence('users', 'id')); -- equivalent to SCOPE_IDENTITY()\n\n-- Global last identity (any table, any session)\nSELECT lastval(); -- Like @@IDENTITY (but session-wide)\n\n-- For a specific table (like IDENT_CURRENT)\nSELECT last_value FROM users_id_seq;","source":"","cross":[]},{"q":"Unique key constraint","a":"A UNIQUE constraint ensures that no two rows have the same value(s) in the specified column(s).\n\nBoth primary key and unique key are used to enforce the uniqueness of a column. So when do you choose one over the another?\nA Table can have only one primary key, If you want to enforce uniqueness on 2 or more columns, then we use unique key constraints.\n\nWhat is the difference b/w Primary key vs Unique key?\n1. A table can have only one primary key and more than one unique key.\n2. Primary key does not allow null whereas unique key allow one null.\n\nAdd UNIQUE Constraint - \nalter table tblperson add constraint UQ_tblPerson_email unique(email);","source":"","cross":[]},{"q":"Select statement","a":"1. Unique name\nselect distinct name from tblperson;\n\n2. Unique name,city combination\nselect distinct name,city from tblperson;\n\n3. select peron not living in london (<> not equals to)\nselect * from tblperson where city <> 'london';\n\n4. select rows where city starts from 'L'\nselect * from tblperson where city like 'l%';\n\n5. email column which contains @ in between\nselect * from tblperson where email like '%@%';\n\n6. email column which not contains @ in between\nselect * from tblperson where email not like '%@%';\n\n7. select rows where email contains one character before @ and one character after the @.\nselect * from tblperson where email like '_@_.com';\n\n8. select rows where person name starts with m,s,t\nselect * from tblperson where name like '[vm]%'; - NOT work in postgres\nselect * from tblperson where name like 'v%' or name like 's%'; -","source":"","cross":[]},{"q":"GROUP BY","a":"Group by clause is used to group a selected set of rows into a set of summary rows by the values of one or more columns or expression. It is always used in conjuction with one or more aggregate function.\n\nNOTE-\n1. Having clause can only be use with SELECT But WHERE clause can be used with SELECT,INSERT,UPDATE,DELETE\n2. WHERE filter the rows before aggregation , where as HAVING filters the groups after the aggregation performed.\n3. In general, WHERE clause can't be used with aggregate function but HAVING clause can be used aggregate function\nselect * from tblEmployee where sum(salary) > 4000 \nselect city , gender, sum(salary), count(id) from tblemployee group by city, gender having gender='male' and sum(salary)> 4000;","source":"","cross":[]},{"q":"Diff b/w below query\n\nselect city , gender, sum(salary), count(id) from tblemployee group by city, gender having gender='male';\n\nselect city , gender, sum(salary), count(id) from tblemployee where gender='male' group by city, gender;","a":"1. first group the result by city and gender and then filter result with Having.\n2. first filter the results by where clause and then group.","source":"","cross":[]},{"q":"BASIC JOINS","a":"","source":"","cross":[]},{"q":"JOINS","a":"practice_db=# select * from tblemployee;\n id |    name    | gender |  salary  |   city    | department_id \n----+------------+--------+----------+-----------+---------------\n  1 | deepak     | male   |   200000 | new delhi |             1\n  2 | shreyanshi | female |  2000000 | gurugram  |             1\n  3 | john       | male   |   110000 | london    |             1\n  4 | tom        | male   |  1200000 | london    |             1\n  5 | tanya      | female | 11200000 | new york  |             1\n  6 | keerti     | female |    20000 | delhi     |             2\n  7 | eam        | male   |    10000 | pune      |             2\n  8 | raj        | male   |    15000 | usa       |             2\n  9 | rani       | female |    12000 | delhi     |             2\n 10 | ram        | male   |    10000 | khatima   |             2\n 11 | kuldeep    | male   |     5000 | canada    |             3\n 12 | babli      | female |     1000 | nepal     |             3\n 13 | indar      | male   |     1500 | tanakpur  |             3\n 14 | umesh      | male   |     5500 | haldwani  |             3\n 15 | bhabhi     | female |     3000 | nepal     |             3\n 16 | naresh     | male   |     4500 | bhutan    |             4\n 17 | umesh      | female |    15500 | haldwani  |             4\n 18 | bhabhi     | male   |    13000 | nepal     |        NULL      \n 19 | naresh     | female |    14500 | bhutan    |     NULL\n\npractice_db=# select * from tblDepartment;\n id | department_name  | location | department_head \n----+------------------+----------+-----------------\n  1 | IT               | london   | rick\n  2 | Payroll          | delhi    | ron\n  3 | HR               | new york | christie\n  4 | Other Department | sydney   | cindrella\n  5 | TECH             | khatima  | deepak","source":"","cross":[]},{"q":"INNER JOIN","a":"All the maching rows from the table.\nselect name,gender,salary,department_name from tblemployee inner join tblDepartment on tblemployee.department_id=tbldepartment.id;\n\nOut of 19 rows only 17 matching department_id rows will return in output, because 2 rows having NULL department_id","source":"","cross":[]},{"q":"LEFT JOIN","a":"All the maching row from both table + Non-Matching rows from the left table.\nselect name,gender,salary,department_name from tblemployee left join tblDepartment on tblemployee.department_id=tbldepartment.id;\n\nOut of 19 rows only 19 matching department_id rows and non matching department_id from left table will return in output.","source":"","cross":[]},{"q":"RIGHT JOIN","a":"All the maching row from both table + Non-Matching rows from the right table.\nIn tblDepartment Table row with id 5 not exist in tblEmployee\n\nselect name,gender,salary,department_name from tblemployee right join tblDepartment on tblemployee.department_id=tbldepartment.id;","source":"","cross":[]},{"q":"FULL JOIN","a":"All the maching row from both table + Non-Matching rows from the left table + Non-Matching rows from the right table.\nIn tblEmployee 2 rows does not have any department_id + In tblDepartment Table row with id 5 not exist in tblEmployee\n\nselect name,gender,salary,department_name from tblemployee full join tblDepartment on tblemployee.department_id=tbldepartment.id;","source":"","cross":[]},{"q":"Advanced or intelligent joins","a":"","source":"","cross":[]},{"q":"The Basic Joins Gives us matching + non matching rows, what if when we want to get following\n1. Only the non matching rows from the left table.\n2. Only the non matching rows from the right table.\n3. Only the non matching rows from both the table.","a":"","source":"","cross":[]},{"q":"Non matching rows from the left table","a":"We can use where clause with left join to achieve non-matching rows from left table, and we can write query in two ways - \n\n1. select name, gender, salary, department_name from tblEmployee left join tblDepartment on tblEmployee.department_id=tblDepartment.id where tblEmployee.department_id is null;\n\n2. select name, gender, salary, department_name from tblEmployee left join tblDepartment on tblEmployee.department_id=tblDepartment.id where tblDepartment.id is null;","source":"","cross":[]},{"q":"Non matching rows from the Right Table","a":"We can use where clause with right join to achieve non-matching rows from right table \n\n1. select name, gender, salary, department_name from tblEmployee right join tblDepartment on tblEmployee.department_id=tblDepartment.id where tblEmployee.department_id is null;","source":"","cross":[]},{"q":"Non Matching rows from both table (Left & Right) - Full JOIN","a":"We can use where clause with Full Join to achieve non-matching rows from Left and Right table\n\nselect name, gender, salary, department_name from tblEmployee full join tblDepartment on tblEmployee.department_id=tblDepartment.id where tblEmployee.department_id is null or tblDepartment.id is null;","source":"","cross":[]},{"q":"SELF JOIN","a":"","source":"","cross":[]},{"q":"Joining a table with itself called self join\nIt can be classified under any type of Join\n1. INNER JOIN - Inner Self Join\n2. OUTER(Left, Right, Full) - Left Outer Self Join\n3. CROSS JOINS - Cross Self Join","a":"","source":"","cross":[]},{"q":"Left Outer Self Join\n\nSelect Manager and their employee\n\n employee_id | name | manager_id \n-------------+------+------------\n           1 | Mike |          3\n           2 | Rob  |          1\n           3 | Ben  |          1\n           4 | Sam  |          1\n           5 | Todd |           NULL","a":"select e.name as Employee,m.name as Manager from tblemployeesmall e left join tblemployeesmall m on e.manager_id=m.employee_id;\n\n employee | manager \n----------+---------\n Mike     | Ben\n Rob      | Mike\n Ben      | Mike\n Sam      | Mike\n Todd     | NULL","source":"","cross":[]},{"q":"INNER Self JOIN\n\nSelect Manager and their employee\n\n employee_id | name | manager_id \n-------------+------+------------\n           1 | Mike |          3\n           2 | Rob  |          1\n           3 | Ben  |          1\n           4 | Sam  |          1\n           5 | Todd |           NULL","a":"Here I got only 4 row because we are using Inner self Join , so it will fetch only matching rows , Todd does not have any manager_id.\n\nselect e.name as Employee,m.name as Manager from tblemployeesmall e inner join tblemployeesmall m on e.manager_id=m.employee_id;\n\n employee | manager \n----------+---------\n Mike     | Ben\n Rob      | Mike\n Ben      | Mike\n Sam      | Mike","source":"","cross":[]},{"q":"CROSS Self JOIN\n\nWe can not ass ON clause in Cross Join","a":"select e.name as Employee,m.name as Manager from tblemployeesmall e cross join tblemployeesmall m;","source":"","cross":[]},{"q":"Different ways to replace NULL","a":"","source":"","cross":[]},{"q":"Three ways to replace NULL values - ISNULL() Function, CASE Statement, COALESCE() Function","a":"","source":"","cross":[]},{"q":"ISNULL() - to replcae NUll value\n\nemployee_id | name | manager_id \n-------------+------+------------\n           1 | Mike |          3\n           2 | Rob  |          1\n           3 | Ben  |          1\n           4 | Sam  |          1\n           5 | Todd |           NULL","a":"When I run ISNULL it does not work with postgres.","source":"","cross":[]},{"q":"COALESCE() - to replcae NUll value\n\nemployee_id | name | manager_id \n-------------+------+------------\n           1 | Mike |          3\n           2 | Rob  |          1\n           3 | Ben  |          1\n           4 | Sam  |          1\n           5 | Todd |           NULL","a":"Syntex: SELECT COALESCE(NULL, \\\"No Manager\\\"); It return No Manager if first value Is NULL.\n\nselect e.name as empName,COALESCE(m.name, 'No Manager') Mname from tblemployeeSmall as e left join tblemployeeSmall m on e.manager_id=m.employee_id;\n\n empname |   mname    \n---------+------------\n Mike    | Ben\n Rob     | Mike\n Ben     | Mike\n Sam     | Mike\n Todd    | No Manager","source":"","cross":[]},{"q":"CASE - to replcae NUll value\n\nemployee_id | name | manager_id \n-------------+------+------------\n           1 | Mike |          3\n           2 | Rob  |          1\n           3 | Ben  |          1\n           4 | Sam  |          1\n           5 | Todd |           NULL","a":"Syntex:- CASE WHEN Expression THEN \\\"<any value>\\\" ELSE \\\"<any value>\\\"  END;\n\nselect e.name as empName, CASE WHEN m.name IS NULL THEN 'No Manager' ELSE m.name END as Mname from tblemployeeSmall as e left join tblemployeeSmall m on e.manager_id=m.employee_id;\n\n empname |   mname    \n---------+------------\n Mike    | Ben\n Rob     | Mike\n Ben     | Mike\n Sam     | Mike\n Todd    | No Manager","source":"","cross":[]},{"q":"COALESCE","a":"","source":"","cross":[]},{"q":"It returns the first NON NULL value","a":"","source":"","cross":[]},{"q":"User COALESCE - to fetch full name\n\n id |  name  | middle_name | last_name \n----+--------+-------------+-----------\n  1 | deepak |  NULL      | NULL\n  2 | dinesh |   NULL      | NULL\n  5 | NULL  | Chandra    | NULL\n  6 | NULL | NULL          | pandey\n  7 | keerti | pandey      | NULL","a":"Whatever the first NOT NULL value it see in column pass inside the coalesce() it return that value.IN 7th ROW it only return Keerti when middle_name is also present.\n\nselect COALESCE(name,middle_name,last_name) as UserName from users;\n\n username \n----------\n deepak\n dinesh\n Chandra\n pandey\n Keerti\n(5 rows)","source":"","cross":[]},{"q":"UNION & UNION ALL","a":"","source":"","cross":[]},{"q":"DIff B/w UNION & UNION ALL\n\n1. UNION removes duplicate rows whereas UNIONALL does not\n2. UNION has to perform distinct sort, to remove duplicates, which make it less faster than UNION ALL\n3. ORDER BY Clause should be used only on the last select statement in the UNION Query.","a":"","source":"","cross":[]},{"q":"Diff B/w UNION & JOIN \n\nUNION combine the result set of two or more select queries into a single result set which includes all the rows from all the queries in the union, where as JOINS, retrieve data from two or more tables based on logical relationship b/w the tables.\n\nIn sort, UNION combine rows from 2 or more tables, where JOINS combine columns from 2 or more table.","a":"","source":"","cross":[]},{"q":"Are rows duplicate in tblIndiaCustomer vs tblUKCustomer?\n\npractice_db=# select * from tblIndiaCustomer;\n id | name |  email  \n----+------+---------\n  1 | ben  | b@b.com\n  2 | raj  | r@r.com\n  3 | sam  | s@s.com\n(3 rows)\n\npractice_db=# select * from tblUKCustomer;\n id | name |  email  \n----+------+---------\n  1 | raj  | r@r.com\n  2 | sam  | s@s.com\n(2 rows)","a":"1. Are the rows really duplicates?\n\nLook at these two rows:\n\nFrom India:\n id | name |  email  \n----+------+---------\n 2  | raj  | r@r.com\n\nFrom UK:\n id | name |  email  \n----+------+---------\n 1  | raj  | r@r.com\n\nThese are not duplicates — the id is different (2 vs 1), even though name and email are the same.","source":"","cross":[]},{"q":"Example to understand UNION vs UNION ALL","a":"practice_db=# select * from tblIndiaCustomer;\n id | name |  email  \n----+------+---------\n  1 | raj  | r@r.com\n  2 | sam  | s@s.com\n(2 rows)\n\npractice_db=# select * from tblUKCustomer;\n id | name |  email  \n----+------+---------\n  1 | raj  | r@r.com\n  2 | sam  | s@s.com\n  3 | ben  | b@b.com\n(3 rows)\n\npractice_db=# select * from tblIndiaCustomer UNION ALL select * from tblUKCustomer;\n id | name |  email  \n----+------+---------\n  1 | raj  | r@r.com\n  2 | sam  | s@s.com\n  1 | raj  | r@r.com\n  2 | sam  | s@s.com\n  3 | ben  | b@b.com\n(5 rows)\n\npractice_db=# select * from tblIndiaCustomer UNION select * from tblUKCustomer;\n id | name |  email  \n----+------+---------\n  1 | raj  | r@r.com\n  3 | ben  | b@b.com\n  2 | sam  | s@s.com\n(3 rows)\n\n------ALso we can select the column by name but column name and dataype must be same for both the table-------\n\npractice_db=# select name,email from tblIndiaCustomer UNION select name,email from tblUKCustomer;\n name |  email  \n------+---------\n raj  | r@r.com\n ben  | b@b.com\n sam  | s@s.com\n(3 rows)","source":"","cross":[]},{"q":"ORDER BY with UNION and UNION ALL","a":"ORDER BY clause must come after both select query in case of UNION and UNION ALL.\n\npractice_db=# select * from tblIndiaCustomer UNION select * from tblUKCustomer order by name;\n id | name |  email  \n----+------+---------\n  3 | ben  | b@b.com\n  1 | raj  | r@r.com\n  2 | sam  | s@s.com\n(3 rows)","source":"","cross":[]},{"q":"\\df+ -- list all functions/procedures in psql\n\nA stored procedure is group of T-SQL (Transact SQL) statements. If you have a situation, where you write the same query over and over again, you can save that specific query as a stored procedure and call it just by it's name.\n\nThere are several advantages of using stored procedures, which we will discuss in a later video session. In this session, we will learn how to create, execute, change and delete stored procedures.","a":"","source":"","cross":[]},{"q":"CREATE  Procedure","a":"practice_db=# create procedure spGetEmployee() LANGUAGE plpgsql AS $$ BEGIN select name, email from tblEmployee; END; $$;\n\n📌 Key Points:\n\n    LANGUAGE plpgsql is mandatory to specify the language.\n    AS $$ ... $$ defines the body of the procedure.\n    Procedure parameters must be declared in parentheses, even if empty ().","source":"","cross":[]},{"q":"CALL stored procedure\nCALL spGetEmployee();","a":"practice_db=# CALL spGetEmployee();\nERROR:  query has no destination for result data\nHINT:  If you want to discard the results of a SELECT, use PERFORM instead.\nCONTEXT:  PL/pgSQL function spgetemployee() line 1 at SQL statement\n\nTo print the result we have to use function instead of SP.","source":"","cross":[]},{"q":"❓ If Stored Procedures can't return data in PostgreSQL, what's the point?","a":"You're absolutely right to question it — because functions are often better when you want to return values or query data. But stored procedures (CREATE PROCEDURE) are designed for control, not data retrieval.\n\n✅ Stored Procedures: What They’re Really For\n\nStored procedures in PostgreSQL are mainly used when you need to:\n🔹 1. Perform complex operations with transaction control\n\n    Procedures allow you to control transactions manually, unlike functions.\n\nCREATE PROCEDURE update_multiple_tables()\nLANGUAGE plpgsql\nAS $$\nBEGIN\n  -- Start transaction\n  INSERT INTO logs (message) VALUES ('Updating...');\n  \n  SAVEPOINT before_update;\n\n  BEGIN\n    UPDATE table1 SET ...;\n    UPDATE table2 SET ...;\n  EXCEPTION\n    WHEN OTHERS THEN\n      ROLLBACK TO SAVEPOINT before_update;\n      RAISE NOTICE 'Update failed, rollback done.';\n  END;\n\n  -- Still inside same transaction\nEND;\n$$;","source":"","cross":[]},{"q":"DROP Procedure","a":"DROP PROCEDURE spGetEmployee();","source":"","cross":[]},{"q":"Parameterized Function","a":"practice_db=# CREATE OR REPLACE FUNCTION get_employee_by_id(emp_id INT)\nRETURNS TABLE(id INT, name VARCHAR, department_id INT)\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    RETURN QUERY\n    SELECT t.id, t.name, t.department_id\n    FROM tblemployee t\n    WHERE t.id = emp_id;\nEND;\n$$;\n\npractice_db=# select * from get_employee_by_id(1);\n id |  name  | department_id \n----+--------+---------------\n  1 | deepak |             1\n(1 row)","source":"","cross":[]},{"q":"STRING FUNCTION","a":"","source":"","cross":[]},{"q":"practice_db=# select ASCII('a');\n ascii \n-------\n    97\n(1 row)\n\npractice_db=# select CHR(65);\n chr \n-----\n A\n(1 row)\n\npractice_db=# select LTRIM('    HATI');\n ltrim \n-------\n HATI\n(1 row)\n\npractice_db=# select LTRIM('    HATI              ');\n       ltrim        \n--------------------\n HATI              \n(1 row)\n\npractice_db=# select RTRIM('    HATI              ');\n  rtrim   \n----------\n     HATI\n(1 row)\n\npractice_db=# select LOWER('    HATI              ');\n         lower          \n------------------------\n     hati              \n(1 row)\n\npractice_db=# select UPPER('pappu');\n upper \n-------\n PAPPU\n(1 row)\n\npractice_db=# select REVERSE('pappu');\n reverse \n---------\n uppap\n(1 row)\n\npractice_db=# select LENGTH('pappu');\n length \n--------\n      5\n(1 row)","a":"practice_db=# select left('ABCDEF',3);\n left \n------\n ABC\n(1 row)\n\npractice_db=# select right('ABCDEF',3);\n right \n-------\n DEF\n(1 row)\n\n------------------------------------------POSITION Function (CHARINDEX in SQL)--------------------------------\npractice_db=# select position('@' IN 'deepak@gmail.com');\n position \n----------\n        7\n(1 row)\n\n------------------------------------------------------SUBSTRING Function-----------------------------------------------\npractice_db=# select substring('ABCDEF',3, 2);\n substring \n-----------\n CD\n(1 row)\n\nUse Position and substring at same query\npractice_db=# select substring('deepak@gmail.com',POSITION('@' in 'deepak@gmail.com'), 2);\n substring \n-----------\n @g\n(1 row)\n\n-----------------------------------------REPLACE Function(REPLICATE in SQL)-------------------------------------\nNOTE-: We use  || to concatenate in postgres inplace of + (in sql)\npractice_db=# SELECT                                       \n  substring(email, 1, 1) ||\n  repeat('*', 5) ||\n  substring(email, position('@' in email)) AS masked_email\nFROM tblperson;\n   masked_email   \n------------------\n s*****@r.com\n s*****@r.com\n d*****@gmail.com\n s*****@gmail.com\n v*****@gmail.com\n d*****@r.com\n m*****marry.com\n(7 rows)\n\n--------------------------------------------REPEAT Function(SPACE in sql)------------------------------------\nIN SQL\npractice_db=# select name || space(3) || 'from'|| space(3) || city from tblperson;\n\nIN POSTGRES\npractice_db=# select name || repeat(' ',3) || 'from'|| repeat(' ', 3) || city AS address from tblperson;\n         address         \n-------------------------\n sara   from   london\n sara   from   london\n Deepak   from   delhi\n siyu   from   delhi\n veer   from   noida\n maria   from   gurugram\n \n(7 rows)\n\n--------------------------------------------strpos Function(PATINDEX in sql)------------------------------------\nSQL\npractice_db=# select email, patindex('%@r.com', email) as first_occurance from tblperson;\n\nPOSTGRES\npractice_db=# SELECT email , strpos(email, '@r.com') AS first_occurrence\nFROM tblperson where strpos(email, '@r.com')>0;\n  email   | first_occurrence \n----------+------------------\n s@r.com  |                2\n s2@r.com |                3\n d@r.com  |                2\n(3 rows)\n\n-------------------------------------------------------------REPLACE Function----------------------------------------------------\npractice_db=# select email, replace(email, '.com', '.net') as modified_email from tblperson;\n      email       |  modified_email  \n------------------+------------------\n s@r.com          | s@r.net\n s2@r.com         | s2@r.net\n deepak@gmail.com | deepak@gmail.net\n siyu@gmail.com   | siyu@gmail.net\n veer@gmail.com   | veer@gmail.net\n d@r.com          | d@r.net\n marry.com        | marry.net\n(7 rows)\n\n--------------------------------------------------overlay Function(STUFF in SQL)--------------------------------------------\nSQL\npractice_db=# select name, email, stuff(email, 2,3,'*****') as modified_email from tblperson;\n\nPOSTGRES\npractice_db=# select name, email, overlay(email placing '*****' from 2 for 3) as modified_email from tblperson;\n  name  |      email       |   modified_email   \n--------+------------------+--------------------\n sara   | s@r.com          | s*****com\n sara   | s2@r.com         | s*****.com\n Deepak | deepak@gmail.com | d*****ak@gmail.com\n siyu   | siyu@gmail.com   | s*****@gmail.com\n veer   | veer@gmail.com   | v*****@gmail.com\n maria  | d@r.com          | d*****com\n marry  | marry.com        | m*****y.com\n(7 rows)","source":"","cross":[]},{"q":"DateTime","a":"","source":"","cross":[]},{"q":"| Task                             | MySQL                                                         | PostgreSQL Equivalent                          |\n| ----------------------------- | --------------------------------------------------------- | ---------------------------------------------------- |\n| Format date                | `DATE_FORMAT(date, '%Y-%m-%d')`         | `TO_CHAR(date, 'YYYY-MM-DD')`        |\n| Convert string to date | `STR_TO_DATE(str, '%Y-%m-%d')`             | `TO_DATE(str, 'YYYY-MM-DD')`            |\n| Filter between dates   | Same (`BETWEEN`)                                    | Same (`BETWEEN`)                               |","a":"","source":"","cross":[]},{"q":"create table with all date time datatype","a":"practice_db=# CREATE TABLE datetime_examples (\n    id SERIAL PRIMARY KEY,\n    event_date DATE,\n    event_time TIME,\n    event_time_tz TIME WITH TIME ZONE,\n    event_timestamp TIMESTAMP,\n    event_timestamptz TIMESTAMP WITH TIME ZONE,\n    event_duration INTERVAL\n);","source":"","cross":[]},{"q":"Insert data to table","a":"practice_db=# INSERT INTO datetime_examples (\n    event_date, \n    event_time, \n    event_time_tz, \n    event_timestamp, \n    event_timestamptz, \n    event_duration\n) VALUES (\n    '2025-10-27',              -- DATE\n    '14:30:00',                -- TIME\n    '14:30:00+05:30',          -- TIME WITH TIME ZONE\n    '2025-10-27 14:30:00',     -- TIMESTAMP\n    '2025-10-27 14:30:00+05:30', -- TIMESTAMP WITH TIME ZONE\n    INTERVAL '3 days 4 hours'  -- INTERVAL\n);","source":"","cross":[]},{"q":"Add 5 days to a timestamp","a":"practice_db=# SELECT * FROM datetime_examples;\n id | event_date | event_time | event_time_tz  |   event_timestamp   |     event_timestamptz     | event_duration  \n----+------------+------------+----------------+---------------------+---------------------------+-----------------\n  1 | 2025-10-27 | 14:30:00   | 14:30:00+05:30 | 2025-10-27 14:30:00 | 2025-10-27 14:30:00+05:30 | 3 days 04:00:00\n  2 | 2025-10-28 | 11:30:00   | 11:30:00+05:30 | 2025-10-28 14:30:00 | 2025-10-28 14:30:00+05:30 | 2 days 04:00:00\n  3 | 2025-10-25 | 11:30:00   | 11:30:00+05:30 | 2025-10-25 14:30:00 | 2025-10-25 14:30:00+05:30 | 1 day 04:00:00\n(3 rows)\n\npractice_db=# SELECT event_timestamp + INTERVAL '5 days' AS new_date\nFROM datetime_examples;\n      new_date       \n---------------------\n 2025-11-01 14:30:00\n 2025-11-02 14:30:00\n 2025-10-30 14:30:00\n(3 rows)","source":"","cross":[]},{"q":"Find difference between two timestamps","a":"practice_db=# SELECT * FROM datetime_examples;\n id | event_date | event_time | event_time_tz  |   event_timestamp   |     event_timestamptz     | event_duration  \n----+------------+------------+----------------+---------------------+---------------------------+-----------------\n  1 | 2025-10-27 | 14:30:00   | 14:30:00+05:30 | 2025-10-27 14:30:00 | 2025-10-27 14:30:00+05:30 | 3 days 04:00:00\n  2 | 2025-10-28 | 11:30:00   | 11:30:00+05:30 | 2025-10-28 14:30:00 | 2025-10-28 14:30:00+05:30 | 2 days 04:00:00\n  3 | 2025-10-25 | 11:30:00   | 11:30:00+05:30 | 2025-10-25 14:30:00 | 2025-10-25 14:30:00+05:30 | 1 day 04:00:00\n  4 | 2025-10-25 | 11:30:00   | 11:30:00+05:30 | 2025-10-25 14:30:00 | 2025-10-29 14:30:00+05:30 | 1 day 04:00:00\n(4 rows)\n\npractice_db=# SELECT AGE(event_timestamptz, event_timestamp) AS difference\nFROM datetime_examples;\n difference \n------------\n 00:00:00\n 00:00:00\n 00:00:00\n 4 days\n(4 rows)","source":"","cross":[]},{"q":"Extract parts (year, month, hour, etc.)","a":"practice_db=# SELECT \n  EXTRACT(YEAR FROM event_timestamp) AS year,\n  EXTRACT(MONTH FROM event_timestamp) AS month,\n  EXTRACT(DAY FROM event_timestamp) AS day,\n  EXTRACT(HOUR FROM event_time_tz) AS hour\nFROM datetime_examples;\n year | month | day | hour \n------+-------+-----+------\n 2025 |    10 |  27 |   14\n 2025 |    10 |  28 |   11\n 2025 |    10 |  25 |   11\n 2025 |    10 |  25 |   11\n(4 rows)","source":"","cross":[]},{"q":"Format datetime for display","a":"SELECT \n  TO_CHAR(event_timestamptz, 'Mon DD, YYYY HH24:MI:SS AM TZ') AS formatted_time\nFROM datetime_examples;\n        formatted_time        \n------------------------------\n Oct 27, 2025 14:30:00 PM IST\n Oct 28, 2025 14:30:00 PM IST\n Oct 25, 2025 14:30:00 PM IST\n Oct 29, 2025 14:30:00 PM IST\n(4 rows)\n\n------12 HR------\nSELECT \n  TO_CHAR(event_timestamptz, 'Mon DD, YYYY HH12:MI:SS PM TZ') AS formatted_time\nFROM datetime_examples;\n        formatted_time        \n------------------------------\n Oct 27, 2025 02:30:00 PM IST\n Oct 28, 2025 02:30:00 PM IST\n Oct 25, 2025 02:30:00 PM IST\n Oct 29, 2025 02:30:00 PM IST\n(4 rows)","source":"","cross":[]},{"q":"Compare with current date/time","a":"practice_db=# SELECT \n  CURRENT_DATE AS today,\n  CURRENT_TIMESTAMP AS now,\n  event_timestamp > CURRENT_TIMESTAMP AS is_future_event\nFROM datetime_examples;\n   today    |               now                | is_future_event \n------------+----------------------------------+-----------------\n 2025-10-29 | 2025-10-29 12:19:49.092353+05:30 | f\n 2025-10-29 | 2025-10-29 12:19:49.092353+05:30 | f\n 2025-10-29 | 2025-10-29 12:19:49.092353+05:30 | f\n 2025-10-29 | 2025-10-29 12:19:49.092353+05:30 | f\n(4 rows)","source":"","cross":[]},{"q":"Use interval for scheduling","a":"practice_db=# SELECT \n  event_timestamp + INTERVAL '7 days' AS next_week_event,\n  event_timestamptz + INTERVAL '2 hours' AS delayed_event\nFROM datetime_examples;\n   next_week_event   |       delayed_event       \n---------------------+---------------------------\n 2025-11-03 14:30:00 | 2025-10-27 16:30:00+05:30\n 2025-11-04 14:30:00 | 2025-10-28 16:30:00+05:30\n 2025-11-01 14:30:00 | 2025-10-25 16:30:00+05:30\n 2025-11-01 14:30:00 | 2025-10-29 16:30:00+05:30\n(4 rows)","source":"","cross":[]},{"q":"Storing intervals in a table","a":"INSERT INTO datetime_examples (event_date, event_duration)\nVALUES ('2025-10-27', INTERVAL '3 days 4 hours');","source":"","cross":[]},{"q":"Current Date","a":"SELECT CURRENT_DATE;","source":"","cross":[]},{"q":"Current Timestamp (with time zone)","a":"SELECT CURRENT_TIMESTAMP;","source":"","cross":[]},{"q":"Get current time only","a":"SELECT CURRENT_TIME;","source":"","cross":[]},{"q":"Get bookings from last 7 days","a":"-- Get bookings from last 7 days\nSELECT *\nFROM bookings\nWHERE created_at >= CURRENT_DATE - INTERVAL '7 days';","source":"","cross":[]},{"q":"Check if string is valid date format","a":"practice_db=# SELECT CASE WHEN to_date(event_date::text, 'YYYY-MM-DD') IS NOT NULL THEN TRUE ELSE FALSE END AS is_valid_date FROM datetime_examples;\n is_valid_date \n---------------\n t\n t\n t\n t\n(4 rows)\n\n\nWe typecaset event_date column to text because to_date function expect the string event_date::text\n\nAnother way is to create a function to check string is valid date.\nAnother way to use TRY_CAST Function in postgres >= 16.","source":"","cross":[]},{"q":"SQL - DATENAME() is not available in PostgreSQL\n✅ Equivalent in PostgreSQL: use TO_CHAR()","a":"practice_db=# SELECT TO_CHAR(DATE '2025-10-27', 'Month') AS month_name;\n month_name \n------------\n October  \n(1 row)\n\n\npractice_db=# SELECT TO_CHAR(DATE '2025-10-27', 'Day') AS day_name;\n day_name  \n-----------\n Monday   \n(1 row)","source":"","cross":[]},{"q":"EXTRACT() — Equivalent to DATEPART() in SQL","a":"practice_db=# SELECT\n  EXTRACT(YEAR FROM TIMESTAMP '2025-10-27 15:45:00') AS year,\n  EXTRACT(MONTH FROM TIMESTAMP '2025-10-27 15:45:00') AS month,\n  EXTRACT(DAY FROM TIMESTAMP '2025-10-27 15:45:00') AS day,\n  EXTRACT(HOUR FROM TIMESTAMP '2025-10-27 15:45:00') AS hour,\n  EXTRACT(MINUTE FROM TIMESTAMP '2025-10-27 15:45:00') AS minute,\n  EXTRACT(DOW FROM TIMESTAMP '2025-10-27 15:45:00') AS day_of_week,\n  EXTRACT(WEEK FROM TIMESTAMP '2025-10-27 15:45:00') AS week_number;\n year | month | day | hour | minute | day_of_week | week_number \n------+-------+-----+------+--------+-------------+-------------\n 2025 |    10 |  27 |   15 |     45 |           1 |          44\n(1 row)","source":"","cross":[]},{"q":"Edifference between EXTRACT() and TO_CHAR()","a":"EXTRACT()\nGet a numeric part of a date/time (for math, filtering, grouping)\n\nTO_CHAR()\nFormat a string version of a date/time (for display)","source":"","cross":[]},{"q":"DATEADD in SQL but INTERVAL in Postgres","a":"practice_db=# SELECT \n    CURRENT_DATE AS today,\n    CURRENT_DATE + INTERVAL '5 days' AS after_5_days;\n   today    |    after_5_days     \n------------+---------------------\n 2025-10-29 | 2025-11-03 00:00:00\n(1 row)\n\n\npractice_db=# SELECT \n    CURRENT_DATE - INTERVAL '10 days' AS before_10_days;\n   before_10_days    \n---------------------\n 2025-10-19 00:00:00\n(1 row)","source":"","cross":[]},{"q":"DATEDIFF() function like SQL but AGE() in postgres","a":"Example 1 — Difference in days (simple)\n\npractice_db=# SELECT \n    DATE '2025-11-05' - DATE '2025-10-27' AS diff_days;\n diff_days \n-----------\n         9\n(1 row)\n\n🔹 Example 2 — Difference in months or years using AGE()\n\npractice_db=# SELECT \n    AGE(DATE '2025-11-05', DATE '2023-05-10') AS diff;\n          diff          \n------------------------\n 2 years 5 mons 26 days\n(1 row)\n\nExample 3 - \n\npractice_db=# SELECT \n    EXTRACT(YEAR FROM AGE('2025-11-05', '2023-05-10')) AS years,\n    EXTRACT(MONTH FROM AGE('2025-11-05', '2023-05-10')) AS months,\n    EXTRACT(DAY FROM AGE('2025-11-05', '2023-05-10')) AS days;\n years | months | days \n-------+--------+------\n     2 |      5 |   26\n(1 row)","source":"","cross":[]},{"q":"CAST, :: , CONVERT(in sql), TO_CHAR(in posgres)","a":"","source":"","cross":[]},{"q":"CAST -- String to date","a":"practice_db=# SELECT CAST('2025-10-27' AS DATE);\n    date    \n------------\n 2025-10-27\n(1 row)","source":"","cross":[]},{"q":"TO_CHAR -- Date to string with format","a":"practice_db=# SELECT TO_CHAR(NOW(), 'YYYY-MM-DD HH24:MI:SS');\n       to_char       \n---------------------\n 2025-10-29 15:09:47\n(1 row)","source":"","cross":[]},{"q":":: -- Numeric to string","a":"practice_db=# SELECT 12345::TEXT;\n text  \n-------\n 12345\n(1 row)","source":"","cross":[]},{"q":":: -- String to numeric","a":"practice_db=# SELECT '45.6'::NUMERIC;\n numeric \n---------\n    45.6\n(1 row)","source":"","cross":[]},{"q":":: - -- Timestamp to date","a":"practice_db=# SELECT NOW()::DATE;\n    now     \n------------\n 2025-10-29\n(1 row)","source":"","cross":[]},{"q":":: -- Integer to boolean (non-zero = true)","a":"practice_db=# SELECT 1::BOOLEAN;\n bool \n------\n t\n(1 row)","source":"","cross":[]},{"q":"Mathematical functions","a":"","source":"","cross":[]},{"q":"ABS","a":"practice_db=# select ABS(-20);\n abs \n-----\n  20\n(1 row)","source":"","cross":[]},{"q":"CEILING","a":"practice_db=# select CEILING(20.20);\n ceiling \n---------\n      21\n(1 row)\n\npractice_db=# select CEILING(-20.20);\n ceiling \n---------\n     -20\n(1 row)","source":"","cross":[]},{"q":"FLOOR","a":"practice_db=# select FLOOR(20.20);\n floor \n-------\n    20\n(1 row)\n\npractice_db=# select FLOOR(-20.20);\n floor \n-------\n   -21\n(1 row)","source":"","cross":[]},{"q":"POWER","a":"practice_db=# select POWER(2,3);\n power \n-------\n     8\n(1 row)","source":"","cross":[]},{"q":"SQUARE","a":"NOT AVAILABLE IN POSTGRES - USE POWER","source":"","cross":[]},{"q":"SQRT","a":"practice_db=# select SQRT(81);\n sqrt \n------\n    9\n(1 row)","source":"","cross":[]},{"q":"RANDOM() - return value b/w 0-1\n\n1. parameter is not allowd in postgres RANDOM(1) but SQL aloows it and gives the same value every time for the same parameter.","a":"practice_db=# select random();\n       random       \n--------------------\n 0.1242390931514632\n(1 row)","source":"","cross":[]},{"q":"Print random number between 0 and 100 - FLOOR and CEILING used to print only integer.","a":"practice_db=# select floor(random() * 100);\n floor \n-------\n    60\n(1 row)\n\npractice_db=# select floor(random() * 100);\n floor \n-------\n    72\n(1 row)","source":"","cross":[]},{"q":"ROUND() - it accept only 2 param value and decimal places to round\n\n1. if negative in 2nd param - round value left to decimal point","a":"practice_db=# select round(550.776, 2);\n round  \n--------\n 550.78\n(1 row)\n\n\n1. practice_db=# select round(550.776, -1);\n round \n-------\n   550\n(1 row)\n\npractice_db=# select round(556.776, -1);\n round \n-------\n   560\n(1 row)","source":"","cross":[]},{"q":"Scalar user defined functions","a":"","source":"","cross":[]},{"q":"In PostgreSQL, the term “scalar function” refers to a user-defined function (UDF) that:\n➡️ Takes one or more input values (scalars)\n➡️ Returns a single value (scalar) — not a table or set.\n\nIt’s not a special keyword like CREATE SCALER FUNCTION —\nyou just use CREATE FUNCTION, but the function’s return type is scalar (e.g., integer, text, date, numeric).","a":"","source":"","cross":[]},{"q":"Create a calculate_age function","a":"practice_db=# CREATE OR REPLACE FUNCTION calculate_age(dob date)\nRETURNS int AS $$\nDECLARE\n    age_years int;\nBEGIN\n    -- assign query output to variable\n    SELECT EXTRACT(YEAR FROM AGE(CURRENT_DATE, dob))::int\n    INTO age_years;\n\n    -- return the variable\n    RETURN age_years;\nEND;\n$$ LANGUAGE plpgsql;\nCREATE FUNCTION","source":"","cross":[]},{"q":"Invoke the function","a":"practice_db=# select calculate_age('1991-03-27');\n calculate_age \n---------------\n            34\n(1 row)","source":"","cross":[]},{"q":"Use function with table column select clause","a":"practice_db=# select name, calculate_age(dob) from tblperson;\n  name  | calculate_age \n--------+---------------\n sara   |            10\n sara   |            14\n Deepak |            35\n siyu   |            31\n veer   |             0\n maria  |             4\n marry  |            25\n(7 rows)","source":"","cross":[]},{"q":"Use function with table column where clause","a":"practice_db=# select name, calculate_age(dob) from tblperson where calculate_age(dob) > 10;\n  name  | calculate_age \n--------+---------------\n sara   |            14\n Deepak |            35\n siyu   |            31\n marry  |            25\n(4 rows)","source":"","cross":[]},{"q":"see (print) the text/body of a stored function","a":"practice_db=# \\sf calculate_age\n\nCREATE OR REPLACE FUNCTION public.calculate_age(dob date)\n RETURNS integer\n LANGUAGE plpgsql\nAS $function$\nDECLARE\n    age_years int;\nBEGIN\n    -- assign query output to variable\n    SELECT EXTRACT(YEAR FROM AGE(CURRENT_DATE, dob))::int\n    INTO age_years;\n\n    -- return the variable\n    RETURN age_years;\nEND;\n$function$","source":"","cross":[]},{"q":"diff b/w scalar fun vs stored procedure","a":"🧩 1️⃣ What is a Scalar Function\n\nA scalar function:\n\nReturns a single value (scalar = one value, not a table)\n\nCan be used inside SQL queries\n\nHas a return type (RETURNS <type>)\n\nUsually used for calculations, formatting, transformations\n\n✅ Example — Calculate Age Function:\nCREATE OR REPLACE FUNCTION calculate_age(dob DATE)\nRETURNS INTEGER\nLANGUAGE plpgsql\nAS $$\nDECLARE\n    years INTEGER;\nBEGIN\n    years := EXTRACT(YEAR FROM AGE(CURRENT_DATE, dob));\n    RETURN years;\nEND;\n$$;\n\n\nYou can call it inside a query: SELECT name, calculate_age(date_of_birth) AS age FROM users;\n\n🧩 2️⃣ What is a Stored Procedure\n\nA stored procedure:\n\nDoes not return a value (but can use OUT parameters)\n\nUsed for performing actions (insert, update, delete, complex logic)\n\nInvoked using CALL\n\nCannot be used directly inside SELECT queries\n\n✅ Example — Insert a new user:\n\nCREATE OR REPLACE PROCEDURE insert_user(p_name TEXT, p_dob DATE)\nLANGUAGE plpgsql\nAS $$\nBEGIN\n    INSERT INTO users (name, date_of_birth)\n    VALUES (p_name, p_dob);\n    RAISE NOTICE 'User % inserted successfully!', p_name;\nEND;\n$$;\n\n\nInvoke it like this: CALL insert_user('Ravi', '1990-05-12');","source":"","cross":[]},{"q":"Inline table valued functions","a":"","source":"","cross":[]},{"q":"🧩 What Is an Inline Table-Valued Function?\n\nIn PostgreSQL, there’s no explicit keyword called “Inline Table-Valued Function,”\nbut the same concept exists — it’s simply a SQL-language function that returns a table (or set of rows) and is defined with a single SELECT statement (no procedural body).\n\n✅ Think of it as a parameterized view — a query that returns a table, but accepts parameters.","a":"","source":"","cross":[]},{"q":"create a function to get employee by department Id","a":"practice_db=# CREATE OR REPLACE FUNCTION get_employees_by_department(dept INT)\nRETURNS TABLE(id INT, name TEXT, salary NUMERIC)\nLANGUAGE sql\nAS $$\n    SELECT id, name, salary\n    FROM tblemployee\n    WHERE department_id = dept;\n$$;\nCREATE FUNCTION","source":"","cross":[]},{"q":"How to call this function","a":"practice_db=# SELECT * FROM get_employees_by_department(1);\n id |    name    |  salary  \n----+------------+----------\n  1 | deepak     |   200000\n  2 | shreyanshi |  2000000\n  3 | john       |   110000\n  4 | tom        |  1200000\n  5 | tanya      | 11200000\n(5 rows)","source":"","cross":[]},{"q":"We can also use where clause","a":"practice_db=# SELECT * FROM get_employees_by_department(1) where salary > 110000;\n id |    name    |  salary  \n----+------------+----------\n  1 | deepak     |   200000\n  2 | shreyanshi |  2000000\n  4 | tom        |  1200000\n  5 | tanya      | 11200000\n(4 rows)","source":"","cross":[]},{"q":"where do we use ITV Function as we can do same with the query","a":"🧩 The Key Idea\n\nAn Inline Table-Valued Function (iTVF) is not meant to replace a single query —\nit’s meant to encapsulate a query so it becomes reusable, maintainable, parameterized, and optimizable by the database.\n\n🎯 1. Reusability (Parameterization)\n\nWithout an iTVF, you’d repeat similar queries across your app:\n\nSELECT * FROM employees WHERE department = 'HR';\nSELECT * FROM employees WHERE department = 'Finance';\nSELECT * FROM employees WHERE department = 'Engineering';\n\nWith an iTVF:\n\nSELECT * FROM get_employees_by_department('Finance');\n\n✅ Benefit:\n\nOne reusable function instead of 10+ repeated SQL blocks.\nIf your filtering logic changes, you update it in one place.\n\n⚙️ 2. Parameterizable View\n\nA PostgreSQL view cannot accept parameters.\nAn iTVF is like a view + parameters.\n\n🧠 3. Optimizer Inlining (Performance)\n\nPostgreSQL can inline iTVFs directly into the query plan — just like a view.\n\nThat means:\n\nNo procedural overhead\n\nThe query optimizer sees the full plan\n(so it can reorder joins, filter earlier, etc.)\n\n✅ Performance ~ same as a raw SQL query.\n\n🧰 4. Interoperability with Other Queries\n\nYou can use iTVFs inside joins, CTEs, or views, like a table:\n\nSELECT e.emp_name, d.department_name\nFROM get_employees_by_department('HR') e\nJOIN departments d ON e.department_id = d.id;","source":"","cross":[]},{"q":"Multi statement table valued functions","a":"","source":"","cross":[]},{"q":"Works just like the SQL Server version — you can:\n\nRun multiple SQL statements\nInsert intermediate logic\nReturn multiple queries as part of the same function\n---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\nWhile PostgreSQL doesn’t use the same name as SQL Server, you can achieve the same behavior using a function that:\n\nuses LANGUAGE plpgsql,\nhas a RETURNS TABLE(...) clause,\nand includes multiple SQL statements before returning a result.\n\n🧠 Concept\n\nIn PostgreSQL, a Multi-Statement Table-Valued Function is simply a PL/pgSQL function that:\nReturns a table (via RETURNS TABLE(...))\nExecutes multiple statements (SELECT, UPDATE, IF, etc.)\nUses RETURN QUERY or RETURN NEXT to populate the return table","a":"","source":"","cross":[]},{"q":"Multi-statement TVF","a":"","source":"","cross":[]},{"q":"Temporary tables","a":"","source":"","cross":[]},{"q":"✔️ Characteristics (PostgreSQL TEMP tables):\n\nVisible only in your current session\n\nAutomatically dropped when:\n\nSession ends (default)\n\nOr when transaction ends (depending on ON COMMIT)\n\nOther sessions cannot see or use your temp table\n\nStored in a dedicated schema like pg_temp_3","a":"🔥 Why Postgres does not need \\\"global temp tables\\\"\n\nIn PostgreSQL:\n\nYou can create permanent tables in a special schema for shared use\n\nOr use UNLOGGED tables for high-performance temporary data\n\nBut temp tables are always session-local\n\nThis design avoids global namespace conflicts","source":"","cross":[]},{"q":"Create a Temporary Employee Table","a":"CREATE TEMP TABLE temp_employees (\n    id SERIAL PRIMARY KEY,\n    name TEXT NOT NULL,\n    department TEXT,\n    salary NUMERIC(10,2)\n);","source":"","cross":[]},{"q":"⚙️ 3. Lifetime Control\n\nYou can decide when the temp table disappears.","a":"Example 1 — Default (Deletes rows on COMMIT)\n\nCREATE TEMP TABLE temp_orders (\n    id INT,\n    amount NUMERIC\n);\n-- Default: ON COMMIT DELETE ROWS\n\nAfter your transaction commits, the table structure stays, but the rows are deleted.\n\nExample 2 — Preserve rows\n\nCREATE TEMP TABLE temp_sales (\n    order_id INT,\n    total NUMERIC\n) ON COMMIT PRESERVE ROWS;\n\n✅ Keeps data until your session disconnects.\n\nExample 3 — Drop table automatically after commit\n\nCREATE TEMP TABLE temp_products (\n    id INT,\n    name TEXT\n) ON COMMIT DROP;\n\n✅ Drops the entire table after COMMIT.","source":"","cross":[]},{"q":"You can create a temp table directly from a SELECT:","a":"CREATE TEMP TABLE temp_high_salary AS\nSELECT * FROM employees WHERE salary > 7000;","source":"","cross":[]},{"q":"Indexes","a":"","source":"","cross":[]},{"q":"indexes are used by queries to find data from tables quickly.Indexes are created on tables and views, Index on a table and view are very similer to index that we find in a book.\n\nAn index in PostgreSQL is a data structure (usually a B-tree) that helps PostgreSQL find rows faster — just like an index in a book lets you jump to the right page instead of reading every line.\n\nWithout an index, PostgreSQL scans every row in the table (called a sequential scan).\nWith an index, it performs an efficient index scan or bitmap scan.","a":"","source":"","cross":[]},{"q":"CREATE INDEX","a":"create index IX_tblemployee_salary ON tblemployee (salary ASC);","source":"","cross":[]},{"q":"Clustered and nonclustered indexes","a":"","source":"","cross":[]},{"q":"The following are the different types of indexes in SQL Server\n1. Clustered\n2. Nonclustered\n3. Unique\n4. Filtered\n5. XML\n6. Full Text\n7. Spatial\n8. Columnstore\n9. Index with included columns\n10. Index on computed columns","a":"Clustered Index:\nA clustered index determines the physical order of data in a table. For this reason, a table can have only one clustered index.\n\nA clustered index (in PostgreSQL) means:\n\nThe table’s rows are physically reordered on disk according to the order defined by a specific index.\nYou can build that index on one column or multiple columns (composite index).\nSo a clustered index with multiple columns simply means PostgreSQL will reorder rows based on those columns in sequence — for example, first by department, then by salary.","source":"","cross":[]},{"q":"Create tblEmployees table using the script below.\nCREATE TABLE [tblEmployee]\n(\n [Id] int Primary Key,\n [Name] nvarchar(50),\n [Salary] int,\n [Gender] nvarchar(10),\n [City] nvarchar(50)\n)\n\nNote that Id column is marked as primary key. Primary key, constraint create clustered indexes automatically if no clustered index already exists on the table and a nonclustered index is not specified when you create the PRIMARY KEY constraint.","a":"Now execute the following insert queries. Note that, the values for Id column are not in a sequential order.\nInsert into tblEmployee Values(3,'John',4500,'Male','New York')\nInsert into tblEmployee Values(1,'Sam',2500,'Male','London')\nInsert into tblEmployee Values(4,'Sara',5500,'Female','Tokyo')\nInsert into tblEmployee Values(5,'Todd',3100,'Male','Toronto')\nInsert into tblEmployee Values(2,'Pam',6500,'Female','Sydney')\n\n\nExecute the following SELECT query\nSelect * from tblEmployee\n\nInspite, of inserting the rows in a random order, when we execute the select query we can see that all the rows in the table are arranged in an ascending order based on the Id column. This is because a clustered index determines the physical order of data in a table, and we have got a clustered index on the Id column.\n\nBecause of the fact that, a clustered index dictates the physical storage order of the data in a table, a table can contain only one clustered index. If you take the example of tblEmployee table, the data is already arranged by the Id column, and if we try to create another clustered index on the Name column, the data needs to be rearranged based on the NAME column, which will affect the ordering of rows that's already done based on the ID column.","source":"","cross":[]},{"q":"How to apply multi column Cluster Index","a":"We have t run 2 queries to make index cluster.I do check with data after applying 2 query and when I run select the data order have been changed.\n\npractice_db=# CREATE INDEX idx_employee_dept_salary\nON tblemployee (name,city);\n\npractice_db=# CLUSTER tblemployee USING idx_employee_dept_salary;","source":"","cross":[]},{"q":"Non Clustered Index:","a":"","source":"","cross":[]},{"q":"A nonclustered index is analogous to an index in a textbook. The data is stored in one place, the index in another place. The index will have pointers to the storage location of the data. Since, the nonclustered index is stored separately from the actual data, a table can have more than one non clustered index, just like how a book can have an index by Chapters at the beginning and another index by common terms at the end.\n\nIn the index itself, the data is stored in an ascending or descending order of the index key, which doesn't in any way influence the storage of data in the table.","a":"","source":"","cross":[]},{"q":"Create Non-Cluster Index","a":"CREATE INDEX idx_employee_department\nON employee (department);\n\n✅ This does not change the physical storage order of employee.","source":"","cross":[]},{"q":"⚙️ Multiple Non-Clustered Indexes","a":"CREATE INDEX idx_employee_salary\nON employee (salary);\n\nCREATE INDEX idx_employee_dept_salary\nON employee (department, salary);\n\nPostgreSQL’s optimizer automatically decides which index (if any) is most efficient for a given query.","source":"","cross":[]},{"q":"🔍 Non-Clustered Composite Index","a":"CREATE INDEX idx_employee_dept_salary\nON employee (department, salary);\n\nThis index helps for queries like:\nSELECT * FROM employee\nWHERE department = 'IT' AND salary > 50000;","source":"","cross":[]},{"q":"Check Index Usage","a":"EXPLAIN ANALYZE\nSELECT * FROM employee WHERE department = 'IT';","source":"","cross":[]},{"q":"Difference between Clustered and NonClustered Index:","a":"1. Only one clustered index per table, where as you can have more than one non clustered index\n2. Clustered index is faster than a non clustered index, because, the non-clustered index has to refer back to the table, if the selected column is not present in the index.\n3. Clustered index determines the storage order of rows in the table, and hence doesn't require additional disk space, but where as a Non Clustered index is stored seperately from the table, additional storage space is required.","source":"","cross":[]},{"q":"Unique and Non Unique Indexes","a":"","source":"","cross":[]},{"q":"1. Both use B-trees by default.\n2. Unique index adds an additional check during INSERT/UPDATE.\n3. Unique indexes automatically exist for:\n     PRIMARY KEY\n     UNIQUE constraints","a":"","source":"","cross":[]},{"q":"Unique Index\n\nA unique index enforces that no two rows can have the same value(s) in the indexed column(s).\nIt ensures data integrity and improves query performance.\n\nCREATE UNIQUE INDEX idx_users_email ON users (email);\n✅ This means:\nINSERT INTO users (email) VALUES ('deepak@example.com');\n\nworks once.\nIf you try inserting the same email again:\n\nERROR: duplicate key value violates unique constraint \\\"idx_users_email\\\"\n\n⚡ When to Use\n\nColumns that must be unique (like email, username, id, SSN).\nTo enforce business rules without writing triggers.","a":"Non-Unique Index\n\nA non-unique index (default) allows duplicate values in the indexed column(s).\nIt’s purely for performance optimization, not data integrity.\n\nCREATE INDEX idx_users_city ON users (city);\n\n✅ Now queries like:\nSELECT * FROM users WHERE city = 'Mumbai';\nrun much faster because PostgreSQL uses the index to locate rows.\n\nBut:\n\nMany users can live in \\\"Mumbai\\\" — duplicates are fine.\nIt doesn’t prevent duplicate values.\n\n⚡ When to Use\n\nColumns used frequently in WHERE, JOIN, or ORDER BY.\nWhen duplicate values are expected (e.g., city, department_id, status).","source":"","cross":[]},{"q":"difference b/w UNIQUE Index vs UNIQUE Constraint","a":"UNIQUE CONSTRAINT:\n\nYou define it at the schema / DDL level:\n\nCREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    email TEXT UNIQUE\n);\n\nPostgreSQL creates a unique index internally to enforce it.\n\nIt is owned by the constraint, meaning:\nIf you drop the constraint → index is automatically dropped.\nYou can’t drop the index separately (it’s “managed”).\n\n✅ Purpose: Schema rule — prevents invalid (duplicate) data.\n\nUNIQUE INDEX:\n\nYou explicitly create it using:\nCREATE UNIQUE INDEX idx_users_email ON users(email);\n\nIt also enforces uniqueness — but it’s seen as an index, not a schema constraint.\n\nYou can drop it anytime:\nDROP INDEX idx_users_email;\n\nNo constraint object exists in the schema — only the index.\n\n✅ Purpose: Performance optimization (with uniqueness as a side-effect).\n🧠 Think: “Optimization rule — speed up queries, also keep values unique if needed.”","source":"","cross":[]},{"q":"When should you be creating a UNIQUE Index over UNIQUE Constraint","a":"Use UNIQUE CONSTRAINT when:\n\nYou want to guarantee data integrity — it’s a business rule.\nCREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    email TEXT UNIQUE\n);\n✅ Enforces: “Each user must have a unique email.”\n✅ Automatically visible in schema introspection (ORMs, pg_constraint)\n✅ Dropped automatically if table/constraint dropped\n\nUse this when:\n\nYou’re defining a business rule (“email must be unique”, “SSN must be unique”)\nYou want DB schema clarity\nYou use ORMs or migrations — they recognize constraints, not raw indexes\n\n🧠 Think: Constraints define correctness.\n\nUse UNIQUE INDEX when:\n\nYou want flexibility or fine-grained control — not just schema-level validation.\n\n✅ Case 1: Expression-based uniqueness\n\nCREATE UNIQUE INDEX idx_users_lower_email\nON users (LOWER(email));\n\n➡️ Prevents two emails that differ only by case (\\\"John@example.com\\\" vs \\\"john@example.com\\\")\n⛔ Can’t be done with a UNIQUE CONSTRAINT.\n\n✅ Case 2: Partial (conditional) uniqueness\n\nCREATE UNIQUE INDEX idx_active_email\nON users(email)\nWHERE is_active = TRUE;\n\n➡️ Only active users must have unique emails — inactive ones can duplicate.\n🎯 Great for soft-delete or multi-tenant systems.\n\n✅ Case 3: Multi-column unique rule on subset of data\n\nCREATE UNIQUE INDEX idx_unique_city_phone\nON customers(city, phone)\nWHERE city IS NOT NULL;\n\n➡️ Uniqueness enforced only for customers with city defined.","source":"","cross":[]},{"q":"Views","a":"","source":"","cross":[]},{"q":"✅ What is a VIEW?","a":"IMP:- A view does not store any data. So, when this query is executed, the database engine actually retrieves data, from the underlying tblEmployee base table.\n\nA saved SELECT query that behaves like a table.\nYou can SELECT from it as if it were a real table.\nData is always up-to-date, because it pulls from the underlying tables.\n\nCREATE VIEW view_name AS\nSELECT column1, column2\nFROM table_name\nWHERE condition;","source":"","cross":[]},{"q":"First create join on department and employee table to show department name of every employee","a":"practice_db=# select e.id,e.name,e.salary,e.gender,d.department_name from tblemployee e join tbldepartment d on e.department_id=d.id;\n id |    name    |  salary  | gender | department_name  \n----+------------+----------+--------+------------------\n 12 | babli      |     1000 | female | HR\n 15 | bhabhi     |     3000 | female | HR\n  1 | deepak     |   200000 | male   | IT\n  7 | eam        |    10000 | male   | Payroll\n 13 | indar      |     1500 | male   | HR\n  3 | john       |   110000 | male   | IT\n  6 | keerti     |    20000 | female | Payroll\n 11 | kuldeep    |     5000 | male   | HR\n 16 | naresh     |     4500 | male   | Other Department\n  8 | raj        |    15000 | male   | Payroll\n 10 | ram        |    10000 | male   | Payroll\n  9 | rani       |    12000 | female | Payroll\n  2 | shreyanshi |  2000000 | female | IT\n  5 | tanya      | 11200000 | female | IT\n  4 | tom        |  1200000 | male   | IT\n 17 | umesh      |    15500 | female | Other Department\n 14 | umesh      |     5500 | male   | HR\n(17 rows)","source":"","cross":[]},{"q":"Create View based on above query","a":"practice_db=# create view vWEmployeesByDepartment as select e.id,e.name,e.salary,e.gender,d.department_name from tblemployee e join tbldepartment d on e.department_id=d.id;\nCREATE VIEW","source":"","cross":[]},{"q":"Advantages of using views:","a":"1. Views can be used to reduce the complexity of the database schema, for non IT users.\nThe sample view, vWEmployeesByDepartment, hides the complexity of joins. Non-IT users, finds it easy to query the view, rather than writing complex joins.\n\n2. Views can be used as a mechanism to implement row and column level security.\nRow Level Security:\nFor example, I want an end user, to have access only to IT Department employees. If I grant him access to the underlying tblEmployees and tblDepartments tables, he will be able to see, every department employees. To achieve this, I can create a view, which returns only IT Department employees, and grant the user access to the view and not to the underlying table.\n\nColumn Level Security:\nSalary is confidential information and I want to prevent access to that column. To achieve this, we can create a view, which excludes the Salary column, and then grant the end user access to this views, rather than the base tables.\n\n3. Views can be used to present only aggregated data and hide detailed data. - We use GroupBY Clause to summarize data\nView that returns summarized data, Total number of employees by Department.\nCreate View vWEmployeesCountByDepartment\nas\nSelect DeptName, COUNT(Id) as TotalEmployees\nfrom tblEmployee\njoin tblDepartment\non tblEmployee.DepartmentId = tblDepartment.DeptId\nGroup By DeptName","source":"","cross":[]},{"q":"To modify a view","a":"ALTER VIEW statement","source":"","cross":[]},{"q":"To Drop a view","a":"DROP VIEW vWName","source":"","cross":[]},{"q":"Updatable views","a":"","source":"","cross":[]},{"q":"Is it possible to Insert, Update and delete rows, from the underlying tblEmployees table, using view vWEmployeesDataExceptSalary?","a":"practice_db=# Update vWEmployeesDataExceptSalary Set name = 'bhabhi-2' Where id = 15;\n\npractice_db=#  Select * from vWEmployeesDataExceptSalary where id=15;\n id |   name   | gender | department_id \n----+----------+--------+---------------\n 15 | bhabhi-2 | female |             3\n(1 row)\n\npractice_db=# select * from tblemployee where id=15;\n id |   name   | gender | salary | city  | department_id \n----+----------+--------+--------+-------+---------------\n 15 | bhabhi-2 | female |   3000 | nepal |             3\n(1 row)","source":"","cross":[]},{"q":"what happens if our view is based on multiple base tables.","a":"When I try updating view which I created with join 2 table it shows me error - \n\npractice_db=# update vWEmployeesByDepartment set name='bhabhi-2' where id=15;\nERROR:  cannot update view \\\"vwemployeesbydepartment\\\"\nDETAIL:  Views that do not select from a single table or view are not automatically updatable.\nHINT:  To enable updating the view, provide an INSTEAD OF UPDATE trigger or an unconditional ON UPDATE DO INSTEAD rule.","source":"","cross":[]}]},"System Design":{"color":"#9C27B0","icon":"🏗️","questions":[{"q":"Parking Lot","a":"","source":"","cross":[]},{"q":"Tic Tac Toe","a":"","source":"","cross":[]},{"q":"spelling Checker","a":"","source":"","cross":[]},{"q":"Difference b/w concurrency vs parallelism & what is context switching?","a":"🔹 Concurrency\n\nDefinition: The ability of a system to handle multiple tasks at the same time (logically overlapping), even if not literally executed simultaneously.\n\nKey idea: It’s about dealing with many things at once.\n\nExample:\n\nA single-core CPU running two tasks via time-slicing.\n\nCloud Run with concurrency=80: 80 HTTP requests are accepted by one container, but they might share the CPU (only one instruction runs at a time per core, but requests overlap in progress).\n\n👉 Concurrency = task scheduling + switching.\n\n🔹 Parallelism\n\nDefinition: The ability to execute multiple tasks literally at the same time.\n\nKey idea: It’s about doing many things at once.\n\nExample:\n\nA 6 vCPU Cloud Run container can run 6 Python threads in true parallel if they’re CPU-bound (assuming GIL not blocking, or in multi-process).\n\n🔹======= Analogy=======\n\nConcurrency = a single chef cooking 3 dishes by switching between them quickly (all 3 dishes “progress” together).\n\nParallelism = 3 chefs cooking 3 dishes at the same time in 3 kitchens.\nA GPU running thousands of matrix multiplications simultaneously.\n\n👉 Parallelism = actual simultaneous execution.\n\n🔹 In Your Context (Cloud Run & Tasks)\n\nCloud Run’s concurrency setting = concurrency (accepts multiple requests per container).\n\nCloud Run’s CPU allocation (6 vCPUs) = parallelism (up to 6 requests can truly compute simultaneously, others will be time-sliced).\n\nApp Engine “felt” smoother because it enforced stricter concurrency limits per instance → less race conditions, but less resource efficiency.\n\n✅ Concurrency = structure (many tasks in flight).\n✅ Parallelism = execution (many tasks truly running at once).\n\nDo you want me to draw a visual diagram (timeline) showing how 10 Cloud Tasks would run under:\n\nconcurrency=1 (sequential),\n\nconcurrency=60 (concurrent),\n\nconcurrency=60 with 6 CPUs (parallelism)?","source":"","cross":[]},{"q":"What happens if you set Cloud Run concurrency = 80 but CPU = 1?","a":"1. Concurrency (80)\n\nCloud Run allows up to 80 simultaneous HTTP requests to be handled by a single container instance.\n\nThis means if your containerized app is written in a way that can handle many concurrent requests (e.g., async I/O in Node.js, Python asyncio, Go, etc.), a single instance will be reused more efficiently.\n\nIf your app is CPU-bound (e.g., heavy computation per request), those 80 requests will compete for the single CPU.\n\n2. CPU (1 vCPU)\n\nRegardless of concurrency, each instance only has 1 vCPU available.\n\nThis CPU is shared among all 80 requests if they’re running at the same time.\n\n3. What this means in practice\n\nI/O-bound workloads (good case):\n\nExample: API proxy, database queries, calling external APIs, serving static files.\n\nMany requests are waiting on the network most of the time, so the single CPU isn’t maxed out.\n\nConcurrency 80 improves efficiency by reducing cold starts and scaling overhead.\n\nCPU-bound workloads (bad case):\n\nExample: Image processing, ML inference, PDF rendering.\n\nOnly one request can meaningfully use the CPU at a time; the others will be queued internally within the container.\n\nThis can actually increase latency per request instead of helping.\n\n4. Autoscaling interaction\n\nIf each instance can handle up to 80 requests, Cloud Run will scale out less aggressively than if concurrency = 1.\n\nE.g., with 800 simultaneous requests:\n\nConcurrency = 1 → 800 instances.\n\nConcurrency = 80 → 10 instances.\n\n✅ Rule of thumb:\n\nUse high concurrency (e.g., 80) for I/O-bound, lightweight APIs.\n\nUse low concurrency (e.g., 1–10) for CPU-heavy workloads to avoid requests competing for the single CPU.","source":"","cross":[]},{"q":"what happen when I have only 20 max_instance E.g., with 800 simultaneous requests: Concurrency = 1 → 800 instances. Concurrency = 80 → 10 instances.","a":"Case 1: Concurrency = 1\n\nEach instance handles only 1 request at a time.\n\nFor 800 simultaneous requests:\n\nNeeded = 800 instances.\n\nAllowed = 20 instances (due to your max_instances limit).\n\nSo only 20 requests get served immediately, the other 780 requests are queued inside Cloud Run’s request queue.\n\nIf those queued requests wait longer than the HTTP timeout (default 15 minutes, but often clients timeout much earlier, e.g., 30s), they may fail.\n\nCase 2: Concurrency = 80\n\nEach instance can handle 80 requests in parallel.\n\nWith 20 max instances:\n\nTotal capacity = 20 × 80 = 1600 concurrent requests.\n\nFor 800 requests, Cloud Run only needs 10 instances (well within the 20 cap).\n\nNo requests are dropped or queued at the platform level, as long as your code can actually handle concurrency.","source":"","cross":[]},{"q":"How does the OS schedule threads to achieve concurrency on a single core?","a":"1. Single core limitation\n\nA single core can only execute one instruction at a time.\nSo when you have multiple threads, the OS cannot literally run them at the same instant on that core.\nInstead, the OS time-slices execution among threads.\n\n2. Preemptive scheduling\n\nThe OS kernel maintains a ready queue of runnable threads.\nThe CPU scheduler decides which thread runs next based on a scheduling algorithm (e.g., round-robin, priority scheduling, multilevel feedback queues).\nEach thread is given a time slice (quantum), often a few milliseconds.\nAfter the time slice expires, or if the thread blocks (e.g., waiting for I/O), the OS context switches to another thread.\n\n3. Context switching\n\nWhen switching threads, the OS:\nSaves the current thread’s CPU state (registers, program counter, stack pointer).\nLoads the next thread’s saved state.\nResumes execution of the new thread.\nThis switch is fast (µs–ms), but not free — too many context switches can degrade performance.\n\n4. Concurrency illusion\n\nSince context switches happen so quickly (every few ms), it looks like multiple threads are progressing at once, even though only one thread is running at a time.\nThis is concurrency without parallelism:\n\nConcurrency: multiple tasks are in progress (time-shared).\nParallelism: multiple tasks truly run simultaneously (requires multiple cores).\n\n5. Blocking vs. non-blocking\n\nIf one thread blocks on I/O, the OS immediately schedules another thread — so CPU isn’t wasted.\nThis is why concurrency works so well for I/O-bound workloads even on a single core.","source":"","cross":[]},{"q":"Difference between blocking, non-blocking, and asynchronous I/O?","a":"1. Blocking I/O\n\nThe calling thread waits until the operation finishes.\nWhile waiting, it cannot do any useful work.\n\nExample:\n\ndata = socket.recv(1024)  # Thread is stuck here until data arrives\nprint(data)               # Executes only after recv() completes\n\nGood for simple, sequential code, but wastes CPU time if I/O is slow.\n\n2. Non-blocking I/O\n\nThe call returns immediately, even if the operation isn’t finished.\nIf data isn’t ready, the function returns something like “try again later” (EWOULDBLOCK in POSIX).\n\n3. Asynchronous I/O\n\nYou start an operation and continue doing other work.\nThe OS (or runtime) notifies you later when the operation completes (via callback, future/promise, or event loop).\n\nExample (Python asyncio):\n\nasync def fetch_data(reader):\n    data = await reader.read(1024)  # Task yields control, not blocking the thread\n    print(data)\n\nEfficient because you don’t waste CPU polling — the OS/runtime wakes you up only when I/O is ready.\n\n⚖️ Analogy\n\nImagine ordering food at a restaurant:\n\nBlocking: You stand at the counter and wait until your food is ready.\nNon-blocking: You ask, \\\"Is it ready?\\\" every few seconds (polling).\nAsynchronous: You order, sit down, and they bring it to your table when it’s ready.","source":"","cross":[]},{"q":"What’s the difference between a process and a thread?","a":"🔹 1. Process\n\nA process is an independent program in execution.\n\nHas its own memory space (virtual address space).\n\nHas its own system resources (file descriptors, sockets, etc.).\n\nSwitching between processes = heavy (full context switch: memory mapping, TLB flush, etc.).\n\n👉 Example: Opening Chrome and VS Code starts two processes. Each has its own memory heap and doesn’t directly share variables.\n\n🔹 2. Thread\n\nA thread is a lightweight unit of execution inside a process.\n\nThreads in the same process share memory and resources (code, heap, file handles).\n\nEach thread still has its own stack, registers, program counter.\n\nSwitching between threads is cheaper (OS only swaps registers/stack, not the whole memory space).\n\n👉 Example: Chrome uses multiple threads in one process — one thread handles the UI, another renders pages, another runs JS.","source":"","cross":[]},{"q":"Give an example of a complex project with multiple people working, multiple microservices, and explain end to end.","a":"💼 Project Name: SmartStay – A Scalable Hotel Booking Platform (Like Booking.com or Airbnb)\n\n🧩 Overview\n\nSmartStay is an online hotel/apartment booking platform that allows:\n\n    1. Guests to search and book stays\n    2. Hosts to list properties\n    3. Admins to manage users and content\n    4. Payments to be processed\n    5. Messaging between guest and host\n\nIt’s built using a microservices architecture, handled by a team of engineers across Frontend, Backend, DevOps, and QA.\n\n🏗️ Architecture: Microservices:\n\nAuth Service   - Login, Signup, JWT, Role-based access -        FastAPI + PostgreSQL + Redis\n\nUser Service        Profile info, preferences, KYC        Node.js + MongoDB\n\nProperty Service        Listings, availability, amenities        Python FastAPI + PostgreSQL\n\nBooking Service        Check availability, create/cancel bookings        Go + PostgreSQL\n\nPayment Service        Stripe integration, invoices, refunds        Node.js + Stripe API + Kafka\n\nMessaging Service        Chat between guest and host        WebSocket (Node.js) + Redis Pub/Sub\n\nReview Service        Ratings, comments        Django REST + PostgreSQL\n\nNotification Service        Emails, push, SMS        Python + Celery + RabbitMQ\n\nAdmin Service        Admin dashboard, reports, user management        FastAPI + React Admin UI\n\nAnalytics Service        Real-time metrics, trends        Apache Kafka + Spark + BigQuery\n\n🧬 How They Talk (Communication)\n\n    API Gateway: All external traffic goes through Kong/Nginx Gateway\n\n    Service-to-Service: gRPC or REST APIs\n\n    Events: Kafka for asynchronous communication (e.g., BookingConfirmed, PaymentCompleted)\n\n    Shared Auth: JWT with access token for each service\n\n🔄 End-to-End Flow Example: Booking a Property\n🎯 Goal: A guest searches and books a property.\n👣 Steps:\n\n    Guest Logs In\n\n        Hits /auth/login\n\n        Auth service validates and returns JWT\n\n        JWT used in subsequent requests\n\n    Search Properties\n\n        Guest hits /property/search?location=Goa&checkin=...\n\n        Property Service queries listings + availability\n\n    Book Property\n\n        Guest selects dates and confirms booking\n\n        Frontend sends POST /booking/create\n\n        Booking Service checks availability\n\n            Calls Property Service to lock the inventory\n\n            Emits event BookingInitiated\n\n    Make Payment\n\n        Booking Service waits for PaymentService\n\n        Frontend redirects to /payment/pay\n\n        Stripe processes and sends webhook\n\n        Payment Service emits PaymentCompleted\n\n    Confirm Booking\n\n        Booking Service receives PaymentCompleted\n\n        Updates booking status\n\n        Emits BookingConfirmed event\n\n    Send Notifications\n\n        Notification Service listens to BookingConfirmed\n\n        Sends emails to guest and host\n\n    Chat Available\n\n        Messaging service allows guest/host to chat\n\n        Enabled only for confirmed bookings\n\n🧪 Testing Strategy\n\n    Unit Tests: Each microservice (Pytest, Jest)\n\n    Integration Tests: Booking + Payment + Notification\n\n    E2E Tests: Cypress for user journeys\n\n    Load Testing: Locust for Property & Booking APIs\n\n🚀 Deployment Pipeline\n\n    CI: GitHub Actions or GitLab CI\n\n    Dockerized Services deployed to:\n\n        Staging via Git push\n\n        Prod via approval + GitOps (ArgoCD or Terraform Cloud)\n\n    Kubernetes (GKE/EKS) for orchestration\n\n    Secrets & Env: Vault or AWS Secrets Manager\n\n🛡️ Observability\n\n    Logs: Fluentd → Elasticsearch\n\n    Metrics: Prometheus + Grafana\n\n    Tracing: OpenTelemetry + Jaeger\n\n    Alerts: PagerDuty + Slack\n\n📊 Reporting\n\n    Kafka streams Booking/Payment/Review events\n\n    Data Engineer ingests to BigQuery\n\n    Dashboards in Looker for PMs","source":"","cross":[]},{"q":"Can you explain your approach to implementing authentication and authorization at the API Gateway in a microservices-based system?\n\n🔵 Authentication = Who you are → (via token at API Gateway)\n🟠 Authorization = What you can access → (roles/scopes enforced at Gateway or service)","a":"✅ Authentication at the API Gateway\n\nAuthentication = \\\"Who are you?\\\"\n🔐 Typically implemented using JWT (JSON Web Tokens) or OAuth2 tokens, and verified at the API Gateway before forwarding the request to internal services.\n\n🔷 How It Works:\n\n    Client sends request with Bearer Token (e.g., Authorization: Bearer <token>).\n\n    API Gateway validates token using:\n\n        Public key (for signed JWTs)\n        Introspection endpoint (for opaque tokens via OAuth2 provider)\n\n    If token is valid:\n\n        The Gateway attaches user info (decoded token or claims) to headers (X-User-Id, X-Roles, etc.).\n\n🔒 Authorization at the API Gateway (or service level)\n\n    Authorization = \\\"What can you access?\\\"\n\nTwo approaches:\n🟠 Option 1: Gateway-level Authorization (Centralized)\n\n    Based on JWT claims or roles/scopes.\n\n    Gateway evaluates access before routing.\n\n        The request is forwarded to the appropriate microservice.\n\n✅ Tools:\n\n    Kong, NGINX, Traefik, Istio can integrate with:\n\n        Keycloak, Auth0, Firebase Auth, Okta\n\n    Use OAuth2 Proxy or OPA (Open Policy Agent) for advanced control\n\nJWT payload:\n{\n  \\\"sub\\\": \\\"user123\\\",\n  \\\"roles\\\": [\\\"user\\\"],\n  \\\"scopes\\\": [\\\"booking:read\\\", \\\"payment:create\\\"]\n}\n\n🔁 API Gateway has policy:\n\nAllow: /booking/** if scope contains booking:*\nDeny: /admin/** if role != admin\n\n✅ Benefits:\n\n    Services are protected consistently.\n    No duplicate logic across services.\n\n🔁 Recommended Flow (Hybrid):\n\nsequenceDiagram\nClient ->> API Gateway: Request with Bearer Token\nAPI Gateway ->> Auth Server: Validate Token (optional if JWT)\nAPI Gateway -->> Client: 401 Unauthorized (if invalid)\nAPI Gateway ->> Internal Service: Forward with user info headers\nInternal Service ->> Auth Module: Check roles/scopes\nInternal Service -->> Client: Response based on access","source":"","cross":[]},{"q":"In a microservices architecture, how is token expiration handled, and how long are authentication tokens typically persisted in client-side cookies?","a":"🔐 Token Expiration Handling in Microservices Architecture\n\nMicroservices usually use JWTs (JSON Web Tokens) or opaque access tokens (OAuth2), and they must expire to prevent long-lived sessions from being abused.\n\n✅ Common Token Strategy\n\nAccess Token         : Short-lived, used for authenticating API calls (typically 5–30 minutes)\nRefresh Token        : Long-lived, used to get a new access token without re-authenticating\n\n⏳ 1. Token Expiration Rules\n🔹 Access Token\n\n    Expiration Time: 5 to 15 minutes is ideal.\n    Reason: Limits damage if token is leaked.\n    Used in: Authorization header (Bearer <token>)\n\n🔹 Refresh Token\n\n    Expiration Time: 7 to 30 days (or until logout)\n    Stored: Securely in HTTP-only cookies (not localStorage).\n    Usage: When access token expires, client uses it to obtain a new token via /auth/refresh.\n\n🍪 2. Client-Side Cookie Persistence\n\nWhen tokens are stored in cookies (e.g., for browser-based apps):\n\nCookie                   Value                                                        Reason\naccess_token        Often not stored in cookie                         Prefer in-memory for extra security\nrefresh_token        Stored as HTTP-only Secure cookie         Prevents JS access (XSS protection)\n\n✅ Cookie Attributes:\n\n    HttpOnly: Not accessible from JavaScript\n    Secure: Sent only over HTTPS\n    SameSite=Strict/Lax: Controls cross-site requests\n    Max-Age: Should match refresh token expiry (7–30 days)\n\n🔁 3. Token Rotation Flow\n\n    User logs in → receives access & refresh tokens.\n    Access token expires after ~15 mins.\n\n    On next request:\n        Access token invalid → 401\n        Frontend detects and sends refresh request.\n        Refresh token verified → new access token issued.\n        If refresh token is also expired → full login required.","source":"","cross":[]},{"q":"How microservices interact with each other ? Write a code for producer and consumer in case of Kafka.","a":"","source":"","cross":[]},{"q":"Open draw.io -> Create a payment microservice design.","a":"","source":"","cross":[]}]},"Frontend":{"color":"#FF5722","icon":"⚛️","questions":[{"q":"What is virtual Dom tree?","a":"The Virtual DOM tree is an in-memory representation of the real DOM structure of a web page. It is used as an intermediary between the actual DOM and the rendering process.\n\nBatching Changes: \nRather than updating the real DOM directly with each change (which can be slow due to the cost of DOM manipulation), the Virtual DOM allows changes to be accumulated and applied in a more efficient manner.\n\nDiffing Algorithm:\nWhen the state of the application changes, a new Virtual DOM tree is created. The framework then uses a diffing algorithm to compare the new Virtual DOM tree with the previous one to determine the minimal set of changes required. Only these changes are then applied to the actual DOM.","source":"","cross":[]},{"q":"Diff b/w UseMemo and useCallback?","a":"In React, useMemo and useCallback are hooks used to optimize performance by memoizing values and functions, respectively. \n\nuseMemo\n\nPurpose: useMemo is used to memoize a computed value so that it is only recalculated when its dependencies change. This helps avoid unnecessary recalculations and improves performance, especially when dealing with expensive computations.\nconst memoizedValue = useMemo(() => computeExpensiveValue(a, b), [a, b]);\n\nCallback Function: The function passed to useMemo is called to compute the value.\nDependencies Array: The array of dependencies specifies when the memoized value should be recalculated. The value is recalculated only when one of the dependencies changes.\n\nuseCallback\n\nPurpose: useCallback is used to memoize a callback function so that it remains the same between renders unless its dependencies change. This is particularly useful to prevent unnecessary re-renders of child components that rely on reference equality for preventing re-renders.\n\nSyntax:\n\njsx\n\nconst memoizedCallback = useCallback(() => {\n  // callback logic\n}, [dependencies]);\n\nCallback Function: The func
